<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0910">
<title>Decision Lab · ProfGermandario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0B0910; --plate:#14111C; --plate2:#1A1624; --plate3:#221D2E;
  --line:#2C2639; --soft:#201B2B;
  --text:#EDEAF2; --text2:#C3BCD2; --muted:#958CA8; --faint:#6B6380;
  --purple:#8C6DFF; --purple2:#A48DFF; --purpleDim:rgba(140,109,255,.14);
  --brass:#C8A45C; --brassDim:rgba(200,164,92,.13);
  --pos:#3FCB82; --posDim:rgba(63,203,130,.13);
  --neg:#F0625F; --negDim:rgba(240,98,95,.13);
  --amber:#FFA23A; --amberDim:rgba(255,162,58,.13);
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple2)}
:focus-visible{outline:2px solid var(--purple2);outline-offset:2px;border-radius:4px}
.num,.n{font-family:var(--m);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--amber)} .mute{color:var(--muted)}

/* ---------- layout ---------- */
.top{
  position:sticky;top:0;z-index:30;background:rgba(11,9,16,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-family:var(--m);font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.wrap{padding:14px;max-width:1180px;margin:0 auto}
.view{display:none} .view.on{display:block}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-auto-flow:column;
  background:rgba(20,17,28,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));
}
.nav button{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;font-size:9.5px;color:var(--faint);letter-spacing:.02em;
}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--purple2);font-weight:600}

/* ---------- atoms ---------- */
.card{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h3{font-size:14px}
.eyebrow{font-family:var(--m);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ro{display:flex;flex-direction:column;gap:1px;min-width:0}
.ro .k{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:-.02em}
.ro.lg .v{font-size:24px} .ro.sm .v{font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--plate2);font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--purple)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.p:hover{background:var(--purple2)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.g{background:transparent}
.btn.dngr{color:var(--neg);border-color:var(--neg);background:var(--negDim)}
.btn.blk{width:100%}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.buy{color:var(--pos);border-color:var(--pos);background:var(--posDim)}
.tag.hold{color:var(--purple2);border-color:var(--purple);background:var(--purpleDim)}
.tag.wait{color:var(--amber);border-color:var(--amber);background:var(--amberDim)}
.tag.sell{color:var(--neg);border-color:var(--neg);background:var(--negDim)}
.tag.watch{color:var(--brass);border-color:var(--brass);background:var(--brassDim)}
.tag.avoid{color:var(--faint)}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--plate2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;
  font-family:var(--m);font-size:14px}
textarea{font-family:var(--f);resize:vertical;min-height:70px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-family:var(--m);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--purpleDim);color:var(--purple2)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:5px}

.bar{height:6px;background:var(--plate3);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--purple);display:block}
.bar i.pos{background:var(--pos)} .bar i.neg{background:var(--neg)} .bar i.amber{background:var(--amber)}

/* ---------- watchlist rows ---------- */
.wrow{display:grid;grid-template-columns:88px 1fr 76px 64px;gap:8px;align-items:center;
  padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--plate);margin-bottom:6px;
  cursor:pointer;transition:border-color .15s}
.wrow:hover{border-color:var(--purple)}
.wrow .sy{font-family:var(--m);font-size:14px;font-weight:600;letter-spacing:.01em}
.wrow .nm{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow canvas{width:100%;height:34px;display:block}
.wrow .px{font-family:var(--m);font-size:14px;text-align:right}
.wrow .ch{font-family:var(--m);font-size:11.5px;text-align:right}
.wrow .st{display:flex;justify-content:flex-end}

/* ---------- conditions ---------- */
.cond{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px}
.cond:last-child{border-bottom:0}
.cond .ic{font-size:13px;line-height:1.2}
.cond .lb{color:var(--text2)}
.cond .vl{font-family:var(--m);font-size:12px;color:var(--muted);white-space:nowrap}
.cond.ok .lb{color:var(--text)}

.score{display:flex;align-items:baseline;gap:7px}
.score b{font-family:var(--m);font-size:42px;letter-spacing:-.045em;line-height:1;font-weight:500}
.score span{font-family:var(--m);font-size:13px;color:var(--faint)}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:62px 12px 1fr;gap:9px;padding-bottom:13px;position:relative}
.tl .w{font-family:var(--m);font-size:10px;color:var(--faint);text-align:right;padding-top:2px}
.tl .m{position:relative}
.tl .m i{position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--purple)}
.tl .m::before{content:"";position:absolute;left:6px;top:12px;bottom:-8px;width:1px;background:var(--line)}
.tl:last-child .m::before{display:none}
.tl .b{font-size:12.5px}
.tl .b small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* ---------- chart ---------- */
.chartbox{position:relative}
.chartbox canvas{width:100%;display:block;border-radius:6px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--m);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:400;padding:0 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--plate2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- sheet / modal ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(5,4,9,.72);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet{background:var(--plate);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;
  max-width:720px;padding:16px 14px calc(22px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet .hd h3{font-size:18px;letter-spacing:-.01em}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--plate);border:1px solid var(--purple);padding:10px 16px;border-radius:999px;
  font-size:12.5px;z-index:90;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}

.note{border:1px solid var(--brass);background:var(--brassDim);border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--text2);line-height:1.5}
.note b{color:var(--brass)}
.note.bad{border-color:var(--neg);background:var(--negDim)} .note.bad b{color:var(--neg)}

/* ---------- selector de modo ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{
  border:1px solid var(--line);background:var(--plate2);border-radius:9px;padding:9px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.modes button b{font-size:12.5px;font-weight:600}
.modes button span{font-family:var(--m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.modes button[aria-pressed=true]{border-color:var(--purple);background:var(--purpleDim)}
.modes button[aria-pressed=true] span{color:var(--purple2)}

/* ---------- término del glosario ---------- */
.term{
  border-bottom:1px dotted var(--brass);color:var(--brass);cursor:help;
  font-style:italic;white-space:nowrap}
.terms{display:flex;flex-direction:column;gap:9px}
.terms div{font-size:12.5px;line-height:1.45;color:var(--text2)}
.terms b{color:var(--brass);font-style:italic;font-weight:500}

/* ---------- zonas de compra/venta ---------- */
.zone{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px}
.zone.buy{border-color:var(--pos);background:var(--posDim)}
.zone.sell{border-color:var(--neg);background:var(--negDim)}
.zone .lab{font-size:11.5px;color:var(--muted)}
.zone .val{font-family:var(--m);font-size:13.5px}

/* ---------- backtest ---------- */
.window{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--plate2)}
.window + .window{margin-top:8px}
.window .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.window .wh b{font-size:13px}
.warn{display:flex;gap:9px;padding:10px 11px;border-radius:8px;margin-bottom:7px;font-size:12.5px;line-height:1.45}
.warn.bad{border:1px solid var(--neg);background:var(--negDim)}
.warn.rev{border:1px solid var(--amber);background:var(--amberDim)}
.warn.ok{border:1px solid var(--pos);background:var(--posDim)}
.warn b{display:block;margin-bottom:3px}

.legal{font-size:11px;color:var(--faint);line-height:1.5;text-align:center;padding:16px 4px 4px}
.legal button{background:none;border:0;color:var(--brass);text-decoration:underline;font-size:11px;padding:0}

.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--text2)}
.chk input{width:auto;margin-top:2px;flex:none}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--purple);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

@media (min-width:760px){
  .wrap{padding:20px}
  .wrow{grid-template-columns:130px 1fr 110px 92px}
  .g2s{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  .g4{grid-template-columns:1fr 1fr}
  .wrow{grid-template-columns:76px 1fr 68px 56px;padding:10px;gap:6px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Decision Lab</b><span id="brandsub">Simulacro · capital simulado</span></div>
  <div class="row" style="gap:6px">
    <button class="btn sm g" id="btnRefresh" title="Actualizar precios" aria-label="Actualizar precios">⟳</button>
    <button class="btn sm g" id="btnSettings" title="Ajustes" aria-label="Ajustes">⚙</button>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-home" aria-label="Hoy"></section>
  <section class="view" id="v-watch" aria-label="Watchlist"></section>
  <section class="view" id="v-trade" aria-label="Operar"></section>
  <section class="view" id="v-port" aria-label="Portafolio"></section>
  <section class="view" id="v-diary" aria-label="Diario"></section>
  <section class="view" id="v-asset" aria-label="Activo"></section>
  <section class="view" id="v-backtest" aria-label="Backtest Lab"></section>
</main>

<nav class="nav" id="nav" aria-label="Navegación principal">
  <button data-go="home" aria-current="true">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Hoy</span>
  </button>
  <button data-go="watch">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>Watchlist</span>
  </button>
  <button data-go="trade" id="navTrade">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/></svg><span>Operar</span>
  </button>
  <button data-go="port">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span>Portafolio</span>
  </button>
  <button data-go="diary">
    <svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2z"/><path d="M9 8h7M9 12h7M9 16h4"/></svg><span>Diario</span>
  </button>
</nav>

<script>
/* ============================================================
   DECISION LAB — simulacro de decisiones con mercado real
   ProfGermandario · archivo único, local-first
   Módulo 1/6 — estado, almacenamiento y utilidades
   ============================================================ */
"use strict";

var DL = {};

/* ---------- estado ---------- */
DL.KEY = "dlab.v1";
DL.S = {
  profile: {
    name: "", capital: 3000, maxDailyPct: 20, maxRiskPct: 2, proxy: "", setup: false,
    accepted: false,            // aviso legal aceptado
    mode: "swing",              // scalp | swing | backtest
    minVolume: 5000000,         // scalping: liquidez mínima del día
    intradayMin: 0.2,           // scalping: rango de variación buscado
    intradayMax: 0.5,
    maxHoldHours: 2             // scalping: cuánto puede durar una posición
  },
  watch: [],      // {sym,name,note,addedAt,goalBuy,goalSell}
  pos: [],        // posiciones simuladas (abiertas y cerradas)
  diary: [],      // {id,sym,t,kind,text,pxAt}
  lastSync: 0
};

DL.load = function () {
  try {
    var raw = localStorage.getItem(DL.KEY);
    if (raw) {
      var d = JSON.parse(raw);
      DL.S.profile = Object.assign(DL.S.profile, d.profile || {});
      DL.S.watch = d.watch || [];
      DL.S.pos = d.pos || [];
      DL.S.diary = d.diary || [];
      DL.S.lastSync = d.lastSync || 0;
    }
  } catch (e) { console.warn("load", e); }
};
DL.save = function () {
  try { localStorage.setItem(DL.KEY, JSON.stringify(DL.S)); }
  catch (e) { console.warn("save", e); }
};
DL.uid = function (p) {
  return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
};

/* ---------- formato ---------- */
DL.money = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  dp = dp == null ? 2 : dp;
  var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return (n < 0 ? "-$" : "$") + s;
};
DL.sgn = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  return (n > 0 ? "+" : "") + DL.money(n, dp);
};
DL.pct = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  dp = dp == null ? 2 : dp;
  return (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(n).toFixed(dp) + "%";
};
DL.pctp = function (n, dp) { // porcentaje sin signo forzado
  if (n == null || isNaN(n)) return "—";
  return n.toFixed(dp == null ? 1 : dp) + "%";
};
DL.qty = function (n) {
  if (n == null || isNaN(n)) return "—";
  return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
};
DL.tone = function (n) {
  if (n == null || isNaN(n) || Math.abs(n) < 1e-9) return "";
  return n > 0 ? "pos" : "neg";
};
DL.esc = function (s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
};
DL.day = function (ts) {
  return new Date(ts).toLocaleDateString("es", { day: "2-digit", month: "short" });
};
DL.ago = function (ts) {
  if (!ts) return "—";
  var d = Math.floor((Date.now() - ts) / 86400000);
  return d <= 0 ? "hoy" : d === 1 ? "ayer" : "hace " + d + "d";
};

/* ---------- DOM ---------- */
DL.el = function (html) {
  var d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
};
DL.$ = function (s, r) { return (r || document).querySelector(s); };
DL.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var toastT = null;
DL.toast = function (msg) {
  var old = DL.$(".toast"); if (old) old.remove();
  var n = DL.el('<div class="toast" role="status">' + DL.esc(msg) + "</div>");
  document.body.appendChild(n);
  clearTimeout(toastT);
  toastT = setTimeout(function () { n.remove(); }, 3000);
};

/* hoja inferior (bottom sheet) — el patrón de diálogo en móvil */
DL.sheet = function (title, bodyNode, footNode) {
  var bg = DL.el('<div class="sheetbg"></div>');
  var sh = DL.el('<div class="sheet" role="dialog" aria-modal="true"></div>');
  sh.appendChild(DL.el('<div class="grab"></div>'));
  var hd = DL.el('<div class="hd"><h3></h3></div>');
  hd.querySelector("h3").textContent = title;
  var x = DL.el('<button class="btn sm g" type="button">Cerrar</button>');
  x.onclick = close; hd.appendChild(x);
  sh.appendChild(hd);
  sh.appendChild(bodyNode);
  if (footNode) sh.appendChild(footNode);
  bg.appendChild(sh);
  bg.addEventListener("mousedown", function (e) { if (e.target === bg) close(); });
  document.addEventListener("keydown", onKey);
  function onKey(e) { if (e.key === "Escape") close(); }

/* ============================================================
   Módulo 2/6 — capa de datos de mercado
   Fuente: Yahoo Finance (pública, sin API key). El navegador del
   estudiante hace la petición; si la red bloquea a Yahoo se intenta
   con proxies CORS en cadena, incluido el que el usuario configure
   en Ajustes con {url} como marcador.
   Toda la capa está detrás de DL.MKT: cambiar de proveedor es
   reescribir este módulo y nada más.
   ============================================================ */

DL.MKT = (function () {
  var CKEY = "dlab.cache.v1";
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem(CKEY) || "{}"); } catch (e) { cache = {}; }

  function putCache(k, d) {
    cache[k] = { t: Date.now(), d: d };
    var keys = Object.keys(cache);
    if (keys.length > 60) {  // poda: conserva lo más reciente
      keys.sort(function (a, b) { return cache[a].t - cache[b].t; });
      keys.slice(0, keys.length - 60).forEach(function (k2) { delete cache[k2]; });
    }
    try { localStorage.setItem(CKEY, JSON.stringify(cache)); } catch (e) {}
  }
  function getCache(k, ttl) {
    var c = cache[k];
    if (c && Date.now() - c.t < ttl) return c.d;
    return null;
  }
  function staleCache(k) { return cache[k] ? cache[k].d : null; }

  /* ---------- transporte ---------- */
  function routes(url) {
    var out = [];
    var custom = (DL.S.profile.proxy || "").trim();
    if (custom) {
      out.push(custom.indexOf("{url}") >= 0
        ? custom.replace("{url}", encodeURIComponent(url))
        : custom + encodeURIComponent(url));
    }
    out.push(url);                                                   // directo
    out.push("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    out.push("https://corsproxy.io/?url=" + encodeURIComponent(url));
    out.push("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url));
    return out;
  }

  var lastError = null;
  function getJSON(url, timeoutMs) {
    var list = routes(url), i = 0;
    function attempt() {
      if (i >= list.length) return Promise.reject(lastError || new Error("sin_ruta"));
      var target = list[i++];
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, timeoutMs || 12000);
      return fetch(target, { signal: ctl.signal, cache: "no-store", credentials: "omit" })
        .then(function (r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error("http_" + r.status);
          return r.text();
        })
        .then(function (txt) {
          var j = JSON.parse(txt);
          if (j && j.chart && j.chart.error) throw new Error("yahoo_" + (j.chart.error.code || "error"));
          return j;
        })
        .catch(function (e) { clearTimeout(timer); lastError = e; return attempt(); });
    }
    return attempt();
  }
  function lastFailure() { return lastError ? String(lastError.message || lastError) : null; }

  /* ---------- parseo ---------- */
  function parseChart(j) {
    var r = j && j.chart && j.chart.result && j.chart.result[0];
    if (!r || !r.timestamp || !r.indicators || !r.indicators.quote) return null;
    var q = r.indicators.quote[0] || {};
    var adj = r.indicators.adjclose && r.indicators.adjclose[0] ? r.indicators.adjclose[0].adjclose : null;
    var bars = [];
    for (var i = 0; i < r.timestamp.length; i++) {
      var c = q.close ? q.close[i] : null;
      if (c == null && adj) c = adj[i];
      if (c == null) continue;                      // Yahoo deja huecos: se omiten
      bars.push({
        t: r.timestamp[i] * 1000,
        o: q.open && q.open[i] != null ? q.open[i] : c,
        h: q.high && q.high[i] != null ? q.high[i] : c,
        l: q.low && q.low[i] != null ? q.low[i] : c,
        c: c,
        v: q.volume && q.volume[i] != null ? q.volume[i] : 0
      });
    }
    if (!bars.length) return null;
    var m = r.meta || {};
    return {
      symbol: (m.symbol || "").toUpperCase(),
      name: m.longName || m.shortName || m.symbol || "",
      currency: m.currency || "USD",
      exchange: m.fullExchangeName || m.exchangeName || "",
      price: m.regularMarketPrice != null ? m.regularMarketPrice : bars[bars.length - 1].c,
      prevClose: m.chartPreviousClose != null ? m.chartPreviousClose
        : (bars.length > 1 ? bars[bars.length - 2].c : bars[bars.length - 1].c),
      marketState: m.marketState || "",
      asOf: Date.now(),
      bars: bars
    };
  }

  /* ---------- API pública ---------- */
  var TTL_DAILY = 10 * 60 * 1000;   // velas diarias: 10 min
  var TTL_INTRA = 4 * 60 * 1000;    // intradía: 4 min

  function daily(sym, force) {
    sym = String(sym || "").trim().toUpperCase();
    var k = "d:" + sym;
    if (!force) { var hit = getCache(k, TTL_DAILY); if (hit) return Promise.resolve(hit); }
    var url = "https://query1.finance.yahoo.com/v8/finance/chart/" +
      encodeURIComponent(sym) + "?range=1y&interval=1d&includePrePost=false";
    return getJSON(url).then(function (j) {
      var d = parseChart(j);
      if (!d) throw new Error("sin_datos");
      putCache(k, d);
      return d;
    }).catch(function (e) {
      var s = staleCache(k);
      if (s) { s.stale = true; return s; }
      throw e;
    });
  }

  function intraday(sym, force) {
    sym = String(sym || "").trim().toUpperCase();
    var k = "i:" + sym;
    if (!force) { var hit = getCache(k, TTL_INTRA); if (hit) return Promise.resolve(hit); }
    var url = "https://query1.finance.yahoo.com/v8/finance/chart/" +
      encodeURIComponent(sym) + "?range=5d&interval=30m&includePrePost=false";
    return getJSON(url).then(function (j) {
      var d = parseChart(j);
      if (!d) throw new Error("sin_datos");
      putCache(k, d);
      return d;
    }).catch(function (e) {
      var s = staleCache(k);
      if (s) { s.stale = true; return s; }
      throw e;
    });
  }

  /* histórico largo para el Backtest Lab — se cachea una hora */
  function history(sym, range) {
    sym = String(sym || "").trim().toUpperCase();
    range = range || "5y";
    var k = "h:" + sym + ":" + range;
    var hit = getCache(k, 60 * 60 * 1000);
    if (hit) return Promise.resolve(hit);
    var url = "https://query1.finance.yahoo.com/v8/finance/chart/" +
      encodeURIComponent(sym) + "?range=" + range + "&interval=1d&includePrePost=false";
    return getJSON(url, 20000).then(function (j) {
      var d = parseChart(j);
      if (!d) throw new Error("sin_datos");
      putCache(k, d);
      return d;
    }).catch(function (e) {
      var s = staleCache(k);
      if (s) { s.stale = true; return s; }
      throw e;
    });
  }

  function search(q) {
    var url = "https://query1.finance.yahoo.com/v1/finance/search?q=" +
      encodeURIComponent(q) + "&quotesCount=8&newsCount=0&listsCount=0";
    return getJSON(url, 9000).then(function (j) {
      var rows = (j && j.quotes) || [];
      return rows.filter(function (r) { return r.symbol; }).map(function (r) {
        return {
          symbol: r.symbol,
          name: r.shortname || r.longname || r.symbol,
          type: r.quoteType || "",
          exchange: r.exchDisp || r.exchange || ""
        };
      });
    });
  }

  /* refresca una lista de símbolos con concurrencia acotada */
  function refresh(symbols, onEach) {
    var list = symbols.slice(), running = 0, done = 0, out = {};
    return new Promise(function (resolve) {
      if (!list.length) return resolve(out);
      function next() {
        if (!list.length && running === 0) return resolve(out);
        while (running < 3 && list.length) {
          var sym = list.shift();
          running++;
          daily(sym, true).then(function (d) { out[d.symbol || sym] = d; })
            .catch(function () { out[sym] = null; })
            .then(function () {
              running--; done++;
              if (onEach) onEach(done, symbols.length);
              next();
            });
        }
      }
      next();
    });
  }

  return {
    daily: daily, intraday: intraday, history: history, search: search, refresh: refresh,
    lastFailure: lastFailure,
    clearCache: function () { cache = {}; try { localStorage.removeItem(CKEY); } catch (e) {} }
  };
})();

/* ============================================================
   Indicadores — calculados aquí, nunca traídos de fuera
   ============================================================ */
DL.IND = (function () {
  function sma(bars, n) {
    var out = [], sum = 0;
    for (var i = 0; i < bars.length; i++) {
      sum += bars[i].c;
      if (i >= n) sum -= bars[i - n].c;
      out.push(i >= n - 1 ? sum / n : null);
    }
    return out;
  }
  function emaArr(vals, n) {
    var k = 2 / (n + 1), prev = null, out = [];
    for (var i = 0; i < vals.length; i++) {
      var v = vals[i];
      if (v == null) { out.push(null); continue; }
      prev = prev == null ? v : v * k + prev * (1 - k);
      out.push(prev);
    }
    return out;
  }
  function rsi(bars, n) {
    n = n || 14;
    var out = [null], g = 0, l = 0;
    for (var i = 1; i < bars.length; i++) {
      var d = bars[i].c - bars[i - 1].c;
      var up = Math.max(d, 0), dn = Math.max(-d, 0);
      if (i <= n) {
        g += up; l += dn;
        if (i === n) { g /= n; l /= n; out.push(100 - 100 / (1 + g / (l || 1e-9))); }
        else out.push(null);
      } else {
        g = (g * (n - 1) + up) / n;
        l = (l * (n - 1) + dn) / n;
        out.push(100 - 100 / (1 + g / (l || 1e-9)));
      }
    }
    return out;
  }
  function macd(bars) {
    var c = bars.map(function (b) { return b.c; });
    var e12 = emaArr(c, 12), e26 = emaArr(c, 26);
    var line = c.map(function (_, i) { return e12[i] - e26[i]; });
    var sig = emaArr(line, 9);
    return { line: line, signal: sig, hist: line.map(function (v, i) { return v - sig[i]; }) };
  }
  function atr(bars, n) {
    n = n || 14;
    var out = [], trs = [];
    for (var i = 0; i < bars.length; i++) {
      var p = bars[i - 1] || bars[i];
      trs.push(Math.max(bars[i].h - bars[i].l, Math.abs(bars[i].h - p.c), Math.abs(bars[i].l - p.c)));
      if (i < n - 1) { out.push(null); continue; }
      if (i === n - 1) {
        var s = 0; for (var j = 0; j < n; j++) s += trs[j];
        out.push(s / n);
      } else out.push((out[i - 1] * (n - 1) + trs[i]) / n);
    }
    return out;
  }
  function last(a) { for (var i = a.length - 1; i >= 0; i--) if (a[i] != null && isFinite(a[i])) return a[i]; return null; }
  function avgVol(bars, n) {
    var s = bars.slice(-n), t = 0;
    s.forEach(function (b) { t += b.v; });
    return s.length ? t / s.length : 0;
  }
  return { sma: sma, ema: emaArr, rsi: rsi, macd: macd, atr: atr, last: last, avgVol: avgVol };
})();

DL.ENG = (function () {

  /* ---------- soportes y resistencias por pivotes ---------- */
  function levels(bars, price) {
    var n = bars.length, look = 4;
    var highs = [], lows = [];
    for (var i = look; i < n - look; i++) {
      var isH = true, isL = true;
      for (var j = i - look; j <= i + look; j++) {
        if (bars[j].h > bars[i].h) isH = false;
        if (bars[j].l < bars[i].l) isL = false;
      }
      if (isH) highs.push(bars[i].h);
      if (isL) lows.push(bars[i].l);
    }
    var below = lows.concat(highs).filter(function (v) { return v < price * 0.995; });
    var above = highs.concat(lows).filter(function (v) { return v > price * 1.005; });
    return {
      support: below.length ? Math.max.apply(null, below) : null,
      resistance: above.length ? Math.min.apply(null, above) : null
    };
  }

  /* ---------- análisis de un activo ---------- */
  function analyze(d, bench, modeId) {
    if (!d || !d.bars || d.bars.length < 30) return null;
    var b = d.bars, I = DL.IND;
    var mode = DL.MODES[modeId] || DL.MODES[DL.S.profile.mode] || DL.MODES.swing;
    var px = d.price || b[b.length - 1].c;
    var s20 = I.last(I.sma(b, 20)), s50 = I.last(I.sma(b, 50)), s200 = I.last(I.sma(b, 200));
    var smaArr20 = I.sma(b, 20), smaArr50 = I.sma(b, 50);
    var r = I.last(I.rsi(b, 14));
    var m = I.macd(b);
    var mLine = I.last(m.line), mSig = I.last(m.signal);
    var a = I.last(I.atr(b, 14)) || px * 0.02;
    var vol = b[b.length - 1].v, av = I.avgVol(b, 20);
    var win = b.slice(-252);
    var hi52 = Math.max.apply(null, win.map(function (x) { return x.h; }));
    var lo52 = Math.min.apply(null, win.map(function (x) { return x.l; }));
    var chgPct = d.prevClose ? ((px - d.prevClose) / d.prevClose) * 100 : 0;
    var lv = levels(b, px);

    var back = Math.min(63, b.length - 1);
    var ret3 = ((px / b[b.length - 1 - back].c) - 1) * 100;
    var bRet3 = null, bChg = null;
    if (bench && bench.bars && bench.bars.length > back) {
      var bb = bench.bars;
      bRet3 = ((bb[bb.length - 1].c / bb[bb.length - 1 - back].c) - 1) * 100;
      bChg = bench.prevClose ? ((bench.price - bench.prevClose) / bench.prevClose) * 100 : 0;
    }
    var rel = bRet3 == null ? null : ret3 - bRet3;

    // ¿cruzó la SMA20 por encima de la SMA50 en las últimas 10 sesiones?
    var crossed = false, crossAgo = null;
    for (var k = b.length - 1; k > b.length - 11 && k > 1; k--) {
      if (smaArr20[k] != null && smaArr50[k] != null && smaArr20[k - 1] != null && smaArr50[k - 1] != null) {
        if (smaArr20[k] > smaArr50[k] && smaArr20[k - 1] <= smaArr50[k - 1]) {
          crossed = true; crossAgo = b.length - 1 - k; break;
        }
      }
    }

    var C = [];
    function add(label, ok, value) { C.push({ label: label, ok: !!ok, value: value }); }
    var P = DL.S.profile;

    if (mode.id === "scalp") {
      var minVol = P.minVolume || 5000000;
      var absChg = Math.abs(chgPct);

      add("Liquidez suficiente para entrar y salir rápido",
        vol >= minVol,
        (vol / 1e6).toFixed(1) + "M vs " + (minVol / 1e6).toFixed(0) + "M mínimo");

      add("Volumen del día sobre el promedio de 20 sesiones",
        av > 0 && vol > av,

DL.BT = (function () {

  /* señales de compra y venta según la regla elegida */
  function signals(bars, rule) {
    var I = DL.IND, buy = [], sell = [];
    if (rule.type === "rsi") {
      var r = I.rsi(bars, rule.period || 14);
      for (var i = 1; i < bars.length; i++) {
        buy.push(r[i] != null && r[i - 1] != null && r[i - 1] >= rule.buy && r[i] < rule.buy);
        sell.push(r[i] != null && r[i - 1] != null && r[i - 1] <= rule.sell && r[i] > rule.sell);

      buy.unshift(false); sell.unshift(false);

      var f = I.sma(bars, rule.fast || 20), s = I.sma(bars, rule.slow || 50);
      for (var j = 0; j < bars.length; j++) {
        var prevOk = j > 0 && f[j - 1] != null && s[j - 1] != null;
        buy.push(prevOk && f[j] > s[j] && f[j - 1] <= s[j - 1]);
        sell.push(prevOk && f[j] < s[j] && f[j - 1] >= s[j - 1]);
      }

  }

  function simulate(bars, sig, from, to) {
    var trades = [], inPos = false, entry = 0, entryAt = null;
    for (var i = from; i < to; i++) {
      if (!inPos && sig.buy[i]) {
        // se entra en la apertura de la sesión siguiente: nada de mirar el futuro
        if (i + 1 < to) { inPos = true; entry = bars[i + 1].o; entryAt = bars[i + 1].t; }
      } else if (inPos && sig.sell[i]) {
        if (i + 1 < to) {
          var exit = bars[i + 1].o;
          trades.push({ entry: entry, exit: exit, pct: ((exit - entry) / entry) * 100, t: entryAt, tOut: bars[i + 1].t });
          inPos = false;
        }
      }
    }
    if (inPos && to > from) {
      var last = bars[to - 1].c;
      trades.push({ entry: entry, exit: last, pct: ((last - entry) / entry) * 100, t: entryAt, tOut: bars[to - 1].t, open: true });
    }
    return stats(trades, bars, from, to);

  function stats(trades, bars, from, to) {
    var wins = trades.filter(function (t) { return t.pct > 0; });
    var losses = trades.filter(function (t) { return t.pct <= 0; });
    var gw = wins.reduce(function (s, t) { return s + t.pct; }, 0);
    var gl = Math.abs(losses.reduce(function (s, t) { return s + t.pct; }, 0));

    // retorno compuesto y drawdown de la curva de la estrategia
    var eq = 100, peak = 100, maxDD = 0, curve = [100];
    trades.forEach(function (t) {

      maxDD = Math.max(maxDD, ((peak - eq) / peak) * 100);
    });

    var bh = (to - from) > 1 ? ((bars[to - 1].c / bars[from].c) - 1) * 100 : 0;

    return {
      trades: trades,
      count: trades.length,
      winRate: trades.length ? (wins.length / trades.length) * 100 : null,
      avgWin: wins.length ? gw / wins.length : null,
      avgLoss: losses.length ? -gl / losses.length : null,
      profitFactor: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null),
      totalReturn: eq - 100,
      maxDD: maxDD,
      buyHold: bh,
      curve: curve,
      from: bars[from] ? bars[from].t : null,
      to: bars[to - 1] ? bars[to - 1].t : null

  }

    var sig = signals(bars, rule);
    var splitPct = rule.splitPct || 60;
    var split = Math.floor(bars.length * (splitPct / 100));

    var inS = simulate(bars, sig, 0, split);
    var outS = simulate(bars, sig, split, bars.length);

    /* Alertas de sobreajuste — la parte educativa del laboratorio */
    var warn = [];
    if (inS.count < 10) {
      warn.push({ lvl: "bad", t: "Muy pocas operaciones para concluir nada",
        d: "Solo " + inS.count + " operaciones en el periodo de ajuste. Con menos de 10, cualquier resultado es casualidad." });
    }
    if (outS.count < 5) {
      warn.push({ lvl: "bad", t: "El periodo de prueba casi no generó señales",
        d: "Solo " + outS.count + " operaciones fuera de muestra. No alcanza para validar la regla." });
    }
    if (inS.winRate != null && inS.winRate >= 70 && outS.winRate != null && (inS.winRate - outS.winRate) >= 20) {
      warn.push({ lvl: "bad", t: "Posible overfitting",
        d: "La regla acertó " + DL.pctp(inS.winRate, 0) + " en ajuste y solo " + DL.pctp(outS.winRate, 0) +
           " en prueba. Esa caída es la firma del sobreajuste: la regla aprendió el pasado, no el mercado." });
    }
    if (inS.totalReturn > 0 && outS.totalReturn < 0) {
      warn.push({ lvl: "bad", t: "Ganó en el pasado, perdió con datos nuevos",
        d: "Ganó " + DL.pct(inS.totalReturn, 1) + " en ajuste y perdió " + DL.pct(outS.totalReturn, 1) +
           " en prueba. Si operaras esta regla hoy, estarías perdiendo dinero." });
    }
    if (outS.totalReturn != null && outS.buyHold != null && outS.totalReturn < outS.buyHold) {
      warn.push({ lvl: "rev", t: "No le gana a comprar y mantener",
        d: "En el periodo de prueba la regla dio " + DL.pct(outS.totalReturn, 1) +
           " y simplemente comprar y esperar habría dado " + DL.pct(outS.buyHold, 1) + "." });
    }
    if (!warn.length) {
      warn.push({ lvl: "ok", t: "La regla se sostuvo fuera de muestra",
        d: "El resultado en prueba es consistente con el de ajuste. Eso no la hace rentable a futuro — solo significa que no está obviamente sobreajustada." });
    }

    c.globalAlpha = 0.13; c.fillStyle = col; c.fill(); c.globalAlpha = 1;

    c.beginPath();
    pts.forEach(function (b, i) { i ? c.lineTo(X(i), Y(b.c)) : c.moveTo(X(i), Y(b.c)); });
    c.strokeStyle = col; c.lineWidth = 1.5; c.lineJoin = "round"; c.stroke();

    // punto final enfatizado
    c.beginPath();
    c.arc(X(pts.length - 1), Y(pts[pts.length - 1].c), 2.2, 0, Math.PI * 2);
    c.fillStyle = col; c.fill();
  }

  /* gráfico principal: velas + SMA + volumen + niveles de la operación */
  function candles(cv, opt) {
    var bars = opt.bars || [];
    if (bars.length < 2) return;
    var h = opt.height || 260;
    var s = setup(cv, h), c = s.ctx, C = pal();
    c.font = '10px "IBM Plex Mono", monospace';

    var show = Math.min(bars.length, opt.count || 90);
    var vis = bars.slice(-show);
    var padL = 6, padR = 52, padB = 18, padT = 8;
    var volH = opt.volume === false ? 0 : 34;
    var W = s.w - padL - padR;
    var H = h - padT - padB - volH - (volH ? 6 : 0);

    var lo = Infinity, hi = -Infinity;
    vis.forEach(function (b) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); });
    var lv = opt.levels || null;
    if (lv) [lv.entry, lv.stop, lv.target].forEach(function (v) {
      if (v && isFinite(v) && v > 0) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    });
    var smas = {};
    (opt.sma || []).forEach(function (n) {
      var arr = DL.IND.sma(bars, n).slice(-show);
      smas[n] = arr;
      arr.forEach(function (v) { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    });
    var pad = (hi - lo) * 0.06 || 1;
    lo -= pad; hi += pad;

    var Y = function (v) { return padT + H - ((v - lo) / (hi - lo)) * H; };
    var slot = W / vis.length;
    var X = function (i) { return padL + i * slot + slot / 2; };

    // rejilla y eje derecho
    var step = niceStep(hi - lo, 4);
    c.strokeStyle = C.soft; c.lineWidth = 1;
    c.fillStyle = C.faint; c.textAlign = "left"; c.textBaseline = "middle";
    for (var g = Math.ceil(lo / step) * step; g <= hi; g += step) {
      var y = Math.round(Y(g)) + 0.5;
      c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
      c.fillText(g >= 1000 ? g.toFixed(0) : g.toFixed(2), padL + W + 6, y);
    }

    // zonas de riesgo y recompensa
    if (lv && lv.entry) {
      if (lv.stop) {
        c.fillStyle = C.down; c.globalAlpha = 0.10;
        c.fillRect(padL, Math.min(Y(lv.entry), Y(lv.stop)), W, Math.abs(Y(lv.entry) - Y(lv.stop)));
        c.globalAlpha = 1;
      }
      if (lv.target) {
        c.fillStyle = C.up; c.globalAlpha = 0.08;
        c.fillRect(padL, Math.min(Y(lv.entry), Y(lv.target)), W, Math.abs(Y(lv.entry) - Y(lv.target)));
        c.globalAlpha = 1;
      }
    }

    // medias móviles
    var colors = { 20: C.amber, 50: C.purple, 200: C.brass };
    Object.keys(smas).forEach(function (n) {
      c.strokeStyle = colors[n] || C.muted; c.lineWidth = 1.3;
      c.beginPath();
      var started = false;
      smas[n].forEach(function (v, i) {
        if (v == null) return;
        started ? c.lineTo(X(i), Y(v)) : (c.moveTo(X(i), Y(v)), started = true);
      });
      c.stroke();
    });

    // velas
    var bw = Math.max(1.2, Math.min(8, slot * 0.6));
    vis.forEach(function (b, i) {
      var up = b.c >= b.o, col = up ? C.up : C.down, x = X(i);
      c.strokeStyle = col; c.lineWidth = 1;
      c.beginPath();
      c.moveTo(Math.round(x) + 0.5, Y(b.h));
      c.lineTo(Math.round(x) + 0.5, Y(b.l));
      c.stroke();
      var y0 = Y(Math.max(b.o, b.c)), y1 = Y(Math.min(b.o, b.c));
      c.fillStyle = col;
      c.fillRect(x - bw / 2, y0, bw, Math.max(1, y1 - y0));
    });

    // soporte y resistencia (modo swing)
    if (opt.sr) {
      [[opt.sr.support, C.up, "SOPORTE"], [opt.sr.resistance, C.down, "RESISTENCIA"]]
        .forEach(function (m) {
          if (!m[0] || !isFinite(m[0]) || m[0] <= 0) return;
          var y = Math.round(Y(m[0])) + 0.5;
          c.strokeStyle = m[1]; c.lineWidth = 1; c.globalAlpha = 0.6;
          c.setLineDash([2, 4]);
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
          c.setLineDash([]); c.globalAlpha = 1;
          c.fillStyle = m[1]; c.textAlign = "right"; c.textBaseline = "bottom";
          c.fillText(m[2], padL + W - 2, y - 2);
        });
    }

    // niveles
    if (lv) {
      [[lv.entry, C.text, "ENTRADA"], [lv.stop, C.down, "STOP"], [lv.target, C.up, "TARGET"]]
        .forEach(function (m) {
          if (!m[0] || !isFinite(m[0]) || m[0] <= 0) return;
          var y = Math.round(Y(m[0])) + 0.5;
          c.strokeStyle = m[1]; c.lineWidth = 1; c.setLineDash([4, 3]);
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
          c.setLineDash([]);
          c.fillStyle = m[1]; c.textAlign = "left"; c.textBaseline = "bottom";
          c.fillText(m[2], padL + 3, y - 2);
        });
    }

    // volumen
    if (volH) {
      var vy = padT + H + 6;
      var mv = Math.max.apply(null, vis.map(function (b) { return b.v; })) || 1;
      vis.forEach(function (b, i) {
        var bh = (b.v / mv) * (volH - 4);
        c.fillStyle = b.c >= b.o ? C.up : C.down;
        c.globalAlpha = 0.4;
        c.fillRect(X(i) - bw / 2, vy + volH - bh, bw, bh);
        c.globalAlpha = 1;
      });
    }

    // eje temporal
    c.fillStyle = C.faint; c.textBaseline = "top";
    var every = Math.max(1, Math.floor(vis.length / 5));
    vis.forEach(function (b, i) {
      if (i % every !== 0) return;
      var isFirst = i === 0, isLast = i > vis.length - every;
      c.textAlign = isFirst ? "left" : isLast ? "right" : "center";
      var x = isFirst ? padL : isLast ? padL + W : X(i);
      c.fillText(new Date(b.t).toLocaleDateString("es", { day: "numeric", month: "short" }), x, h - padB + 4);
    });

    // leyenda de medias
    c.textAlign = "left"; c.textBaseline = "top";
    var lx = padL + 2;
    Object.keys(smas).forEach(function (n) {
      c.fillStyle = colors[n] || C.muted;
      var lab = "SMA" + n;
      c.fillText(lab, lx, padT);
      lx += c.measureText(lab).width + 9;
    });
  }

  /* curva de capital del portafolio */
  function equityCurve(cv, points, h) {
    if (!points || points.length < 2) return;
    var s = setup(cv, h || 90), c = s.ctx, C = pal();
    var lo = Math.min.apply(null, points), hi = Math.max.apply(null, points);
    var pad = (hi - lo) * 0.12 || 1;
    lo -= pad; hi += pad;
    var X = function (i) { return (i / (points.length - 1)) * (s.w - 2) + 1; };
    var Y = function (v) { return s.h - 4 - ((v - lo) / (hi - lo)) * (s.h - 8); };
    var col = points[points.length - 1] >= points[0] ? C.up : C.down;
    c.beginPath();
    c.moveTo(X(0), Y(points[0]));
    points.forEach(function (v, i) { c.lineTo(X(i), Y(v)); });
    c.lineTo(X(points.length - 1), s.h); c.lineTo(X(0), s.h); c.closePath();
    c.globalAlpha = 0.12; c.fillStyle = col; c.fill(); c.globalAlpha = 1;
    c.beginPath();
    points.forEach(function (v, i) { i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)); });
    c.strokeStyle = col; c.lineWidth = 1.6; c.stroke();
    c.beginPath(); c.arc(X(points.length - 1), Y(points[points.length - 1]), 2.5, 0, Math.PI * 2);
    c.fillStyle = col; c.fill();
  }

  return { spark: spark, candles: candles, equityCurve: equityCurve };
})();
/* ============================================================
   Módulo 5/6 — vistas: Hoy, Watchlist y ficha del activo
   ============================================================ */

DL.data = { bySym: {}, an: {}, bench: null, loading: false, error: null };
DL.BENCH = "SPY";

DL.symbolsInUse = function () {
  var set = {};
  DL.S.watch.forEach(function (w) { set[w.sym] = 1; });
  DL.S.pos.forEach(function (p) { if (p.status === "open") set[p.sym] = 1; });
  return Object.keys(set);
};

DL.recompute = function () {
  DL.data.an = {};
  Object.keys(DL.data.bySym).forEach(function (s) {
    var a = DL.ENG.analyze(DL.data.bySym[s], DL.data.bench);
    if (a) DL.data.an[s] = a;
  });
};

DL.prices = function () {
  var out = {};
  Object.keys(DL.data.bySym).forEach(function (s) {
    if (DL.data.bySym[s]) out[s] = DL.data.bySym[s].price;
  });
  return out;
};

DL.sync = function (force, done) {
  var syms = DL.symbolsInUse();
  DL.data.loading = true; DL.data.error = null;
  DL.render();
  var jobs = [DL.MKT.daily(DL.BENCH, force).then(function (d) { DL.data.bench = d; }).catch(function () { DL.data.bench = null; })];
  if (syms.length) {
    jobs.push(DL.MKT.refresh(syms).then(function (map) {
      Object.keys(map).forEach(function (s) { if (map[s]) DL.data.bySym[s] = map[s]; });
    }));
  }
  Promise.all(jobs).then(function () {
    DL.data.loading = false;
    if (syms.length && !Object.keys(DL.data.bySym).length) {
      DL.data.error = DL.MKT.lastFailure() || "sin_conexion";
    }
    DL.recompute();
    DL.S.lastSync = Date.now(); DL.save();
    DL.render();
    if (done) done();
  });
};

/* ============================================================
   HOY
   ============================================================ */
DL.VIEW_home = function (root) {
  var P = DL.ENG.portfolio(DL.prices());
  var pr = DL.S.profile;

  // el número del día: P/L de hoy sobre las posiciones abiertas
  var dayPL = 0, dayBase = 0, haveDay = false;
  P.open.forEach(function (p) {
    var d = DL.data.bySym[p.sym];
    if (!d) return;
    haveDay = true;
    dayPL += (d.price - d.prevClose) * p.qty;
    dayBase += d.prevClose * p.qty;
  });
  var dayPct = dayBase > 0 ? (dayPL / dayBase) * 100 : 0;

  var M = DL.mode();
  var html = "";

  /* --- selector global de modo --- */
  html += '<section class="card"><div class="head"><h3>Modo de estrategia</h3>' +
    DL.tag(M.sub, "watch") + "</div>" +
    '<div class="modes" id="modeSel">' +
    ["scalp", "swing", "backtest"].map(function (k) {
      var m = DL.MODES[k];
      return '<button type="button" data-mode="' + k + '" aria-pressed="' +
        (M.id === k) + '"><b>' + DL.esc(m.label) + "</b><span>" + DL.esc(m.sub) + "</span></button>";
    }).join("") + "</div>" +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' + DL.esc(M.desc) + "</p>" +
    "</section>";

  /* --- tarjeta principal: el número del día --- */
  html += '<section class="card">' +
    '<div class="head"><h3>Hoy</h3>' +
    '<span class="eyebrow">' + (DL.S.lastSync ? "actualizado " + new Date(DL.S.lastSync).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" }) : "sin sincronizar") + "</span></div>" +
    '<div class="row" style="justify-content:space-between;align-items:flex-end;gap:14px">' +
    '<div class="ro lg"><span class="k">Ganancia o pérdida del día</span><span class="v ' +
    (haveDay ? DL.tone(dayPL) : "") + '">' + (haveDay ? DL.sgn(dayPL) : "$0.00") + "</span></div>" +
    '<div class="ro" style="text-align:right"><span class="k">&nbsp;</span><span class="v ' +
    (haveDay ? DL.tone(dayPct) : "") + '">' + (haveDay ? DL.pct(dayPct) : "—") + "</span></div>" +
    "</div>" +
    '<hr><div class="grid g3">' +
    DL.ro("Equity", DL.money(P.equity), DL.tone(P.totalPL), "sm") +
    DL.ro("Efectivo", DL.money(P.cash, 0), "", "sm") +
    DL.ro("Retorno total", DL.pct(P.returnPct), DL.tone(P.returnPct), "sm") +
    "</div>";

  /* scalping: el hábito que se mide es cerrar, no abrir */
  if (M.id === "scalp") {
    html += '<hr><div class="grid g3">' +
      DL.ro("Trades cerrados hoy", String(P.closedToday), P.closedToday > 0 ? "" : "warn", "sm") +
      DL.ro("Resultado del día", DL.sgn(P.plToday), DL.tone(P.plToday), "sm") +
      DL.ro("Abiertas ahora", String(P.open.length), "", "sm") +
      "</div>" +
      '<p style="margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.45">' +
      "En scalping el número que importa no es cuánto abriste, es cuánto cerraste. " +
      "Una posición que se queda abierta deja de ser scalping.</p>";
  }

  // efectivo vs invertido
  var invPct = P.equity > 0 ? (P.mktValue / P.equity) * 100 : 0;
  html += '<div style="margin-top:14px">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:5px">' +
    '<span class="eyebrow">Dinero usado vs disponible</span>' +
    '<span class="n" style="font-size:11px;color:var(--muted)">' + DL.money(P.mktValue, 0) + " de " + DL.money(P.equity, 0) + "</span></div>" +
    '<div class="bar"><i class="' + (invPct > 80 ? "amber" : "") + '" style="width:' + Math.min(100, invPct).toFixed(1) + '%"></i></div>' +
    '<div class="row" style="justify-content:space-between;margin-top:5px">' +
    '<span class="n" style="font-size:10.5px;color:var(--faint)">' + DL.pctp(invPct, 1) + " invertido</span>" +
    '<span class="n" style="font-size:10.5px;color:var(--faint)">P/L abierto ' + DL.pct(P.openPLPct) + "</span></div></div>";
  html += "</section>";

  /* --- qué hago hoy --- */
  var actions = [];
  P.open.forEach(function (p) {
    var an = DL.data.an[p.sym];
    var st = DL.ENG.positionState(p, an);
    actions.push({ sym: p.sym, state: st.s, why: st.why, pos: p });
  });
  DL.S.watch.forEach(function (w) {
    var an = DL.data.an[w.sym];
    if (!an) return;
    var held = P.open.some(function (p) { return p.sym === w.sym; });
    if (held) return;
    actions.push({
      sym: w.sym, state: an.state,
      why: an.confirmed + " de " + an.total + " condiciones confirmadas · score " + an.score + "/100"
    });
  });
  var order = { SELL: 0, BUY: 1, HOLD: 2, WAIT: 3, WATCH: 4, AVOID: 5 };
  actions.sort(function (a, b) { return (order[a.state] || 9) - (order[b.state] || 9); });

  html += '<section class="card"><div class="head"><h3>¿Qué hago hoy?</h3>' +
    '<span class="eyebrow">' + actions.length + " activos</span></div>";
  if (!actions.length) {
    html += DL.empty("Todavía no sigues ningún activo",
      "Agrega símbolos reales a tu watchlist y aquí verás qué hacer con cada uno.");
  } else {
    html += '<div id="todayList"></div>';
  }
  html += "</section>";

  /* --- pulso del mercado --- */
  var ba = DL.data.bench ? DL.ENG.analyze(DL.data.bench, DL.data.bench) : null;
  if (ba) {
    html += '<section class="card"><div class="head"><h3>Mercado · ' + DL.esc(DL.BENCH) + "</h3>" +
      DL.tag(ba.chgPct >= 0 ? "en verde" : "en rojo", ba.chgPct >= 0 ? "buy" : "sell") + "</div>" +
      '<div class="grid g3">' +
      DL.ro("Último", DL.money(ba.price), "", "sm") +
      DL.ro("Cambio hoy", DL.pct(ba.chgPct), DL.tone(ba.chgPct), "sm") +
      DL.ro("3 meses", DL.pct(ba.ret3m, 1), DL.tone(ba.ret3m), "sm") +
      "</div>" +
      '<div class="chartbox" style="margin-top:12px"><canvas id="benchChart"></canvas></div>' +
      "</section>";
  }

  /* --- capital y límite del día --- */
  html += '<section class="card"><div class="head"><h3>Capital y límite del día</h3>' +
    DL.tag("tope " + pr.maxDailyPct + "%", "watch") + "</div>" +
    '<div class="grid g3" style="margin-bottom:12px">' +
    DL.ro("Capital inicial", DL.money(pr.capital, 0), "", "sm") +
    DL.ro("Desplegado hoy", DL.money(P.deployedToday, 0), "", "sm") +
    DL.ro("Cupo restante", DL.money(P.roomToday, 0), "", "sm") +
    "</div>" +
    '<div class="bar"><i class="' + (P.deployedToday > P.dailyCeiling ? "neg" : "pos") + '" style="width:' +
    Math.min(100, P.dailyCeiling > 0 ? (P.deployedToday / P.dailyCeiling) * 100 : 0).toFixed(1) + '%"></i></div>' +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' +
    "Puedes <b>desplegar</b> hasta " + DL.money(P.dailyCeiling, 0) + " hoy (" + pr.maxDailyPct + "% del equity). " +
    "Eso no es lo que <b>arriesgas</b>: con el stop puesto, tu pérdida máxima planeada es " +
    DL.money(P.openRisk) + " (" + DL.pctp(P.openRiskPct, 2) + " del equity).</p>" +
    "</section>";

  /* --- glosario del modo: solo lo pertinente --- */
  var gl = DL.GLOSS[M.id] || [];
  if (gl.length) {
    html += '<section class="card"><div class="head"><h3>Términos de este modo</h3>' +
      DL.tag("EN → ES", "gold") + "</div><div class=\"terms\">" +
      gl.map(function (p) {
        return "<div><b>" + DL.esc(p[0]) + "</b> — " + DL.esc(p[1]) + "</div>";
      }).join("") + "</div></section>";
  }

  html += '<div class="legal">' + DL.esc(DL.LEGAL_SHORT) +
    ' <button type="button" id="legalLink">Leer el aviso legal completo</button></div>';

  root.innerHTML = html;

  DL.$$("#modeSel button", root).forEach(function (b) {
    b.onclick = function () {
      DL.S.profile.mode = b.dataset.mode;
      DL.save(); DL.recompute();
      if (b.dataset.mode === "backtest") DL.go("backtest"); else DL.render();
    };
  });
  var lk = DL.$("#legalLink", root);
  if (lk) lk.onclick = DL.legalSheet;

  // lista de acciones (con manejadores)
  var list = DL.$("#todayList", root);
  if (list) {
    actions.forEach(function (a) {
      var an = DL.data.an[a.sym];
      var row = DL.el('<button type="button" style="display:block;width:100%;text-align:left;background:var(--plate2);' +
        'border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:7px"></button>');
      row.innerHTML =
        '<div class="row" style="justify-content:space-between;margin-bottom:4px">' +
        '<span class="n" style="font-size:13.5px;font-weight:600">' + DL.esc(a.sym) + "</span>" +
        DL.tag(a.state, a.state.toLowerCase()) + "</div>" +
        '<div style="font-size:12px;color:var(--muted);line-height:1.45">' + DL.esc(a.why) + "</div>" +
        (an ? '<div class="row" style="margin-top:6px;gap:12px">' +
          '<span class="n" style="font-size:12px">' + DL.money(an.price) + "</span>" +
          '<span class="n ' + DL.tone(an.chgPct) + '" style="font-size:12px">' + DL.pct(an.chgPct) + "</span></div>" : "");
      row.onclick = function () { DL.openAsset(a.sym); };
      list.appendChild(row);
    });
  }

  if (ba) {
    var cv = DL.$("#benchChart", root);
    if (cv) DL.CH.candles(cv, { bars: DL.data.bench.bars, sma: [50], count: 70, height: 140, volume: false });
  }
};
