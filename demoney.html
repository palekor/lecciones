  var so = DL.$("#scalpOnly", root);
  if (so) so.onchange = function () { DL.current.scalpOnly = so.checked; DL.render(); };

  var listEl = DL.$("#wlist", root);
  if (!DL.S.watch.length) {
    listEl.innerHTML = DL.empty("Tu watchlist está vacía",
      "Escribe un símbolo real arriba. El precio, el gráfico y las condiciones se cargan solos.");
  } else {
    var shown = 0;
    DL.S.watch.forEach(function (w) {
      var an = DL.data.an[w.sym];
      var d = DL.data.bySym[w.sym];
      var held = P.open.filter(function (p) { return p.sym === w.sym; })[0];
      var state = held ? DL.ENG.positionState(held, an).s : (an ? an.state : "WATCH");

      // candidato de scalping: liquidez y variación dentro del rango buscado
      var pr = DL.S.profile, eligible = true;
      if (M.id === "scalp") {
        var abs = an ? Math.abs(an.chgPct) : 0;
        eligible = !!an && an.vol >= pr.minVolume && abs >= pr.intradayMin && abs <= pr.intradayMax;
        if (DL.current.scalpOnly && !eligible) return;
      }
      shown++;

      var row = DL.el('<div class="wrow" role="button" tabindex="0"></div>');
      if (M.id === "scalp") {
        row.style.opacity = eligible ? "1" : "0.45";
        if (eligible) row.style.borderColor = "var(--pos)";
      }
      row.innerHTML =
        '<div><div class="sy">' + DL.esc(w.sym) + '</div><div class="nm">' +
        DL.esc((d && d.name) || w.name || "—") + "</div></div>" +
        '<div><canvas></canvas></div>' +
        '<div><div class="px">' + (an ? DL.money(an.price) : "—") + '</div>' +
        '<div class="ch ' + (an ? DL.tone(an.chgPct) : "") + '">' + (an ? DL.pct(an.chgPct) : "") + "</div></div>" +
        '<div class="st">' + DL.tag(state, state.toLowerCase()) + "</div>";
      row.onclick = function () { DL.openAsset(w.sym); };
      row.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); DL.openAsset(w.sym); } };
      listEl.appendChild(row);
      if (d && d.bars) {
        DL.CH.spark(row.querySelector("canvas"), d.bars.slice(-5).length >= 5 ? d.bars.slice(-30) : d.bars,
          an ? an.sma20 : null, 34);
      }
    });
    if (!shown) {
      listEl.innerHTML = DL.empty("Ningún activo pasa el filtro de scalping hoy",
        "Eso también es información: hoy no hay setup. Desactiva el filtro para ver toda la lista.");
    }
  }

  var input = DL.$("#symIn", root);
  var out = DL.$("#searchOut", root);
  function addNow() {
    var q = (input.value || "").trim().toUpperCase();
    if (!q) return;
    DL.addSymbol(q);
  }
  DL.$("#addSym", root).onclick = addNow;
  input.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); addNow(); } };

  var searchT = null;
  input.oninput = function () {
    clearTimeout(searchT);
    var q = input.value.trim();
    if (q.length < 2) { out.innerHTML = ""; return; }
    searchT = setTimeout(function () {
      out.innerHTML = '<span class="spin"></span> <span class="eyebrow">buscando…</span>';
      DL.MKT.search(q).then(function (rows) {
        if (!rows.length) { out.innerHTML = '<div class="eyebrow">Sin resultados</div>'; return; }
        out.innerHTML = "";
        rows.slice(0, 6).forEach(function (r) {
          var b = DL.el('<button type="button" class="btn sm" style="display:block;width:100%;text-align:left;margin-bottom:5px"></button>');
          b.innerHTML = '<span class="n" style="font-weight:600">' + DL.esc(r.symbol) + "</span> " +
            '<span style="color:var(--muted);font-size:12px">' + DL.esc(r.name) + "</span> " +
            '<span class="eyebrow">' + DL.esc(r.exchange) + "</span>";
          b.onclick = function () { input.value = r.symbol; out.innerHTML = ""; DL.addSymbol(r.symbol, r.name); };
          out.appendChild(b);
        });
      }).catch(function () { out.innerHTML = '<div class="eyebrow">Búsqueda no disponible — escribe el símbolo exacto</div>'; });
    }, 420);
  };
};

DL.addSymbol = function (sym, name) {
  sym = String(sym).trim().toUpperCase();
  if (!sym) return;
  if (DL.S.watch.some(function (w) { return w.sym === sym; })) { DL.toast(sym + " ya está en tu watchlist"); return; }
  DL.toast("Cargando " + sym + "…");
  DL.MKT.daily(sym, true).then(function (d) {
    DL.data.bySym[d.symbol || sym] = d;
    DL.S.watch.push({
      sym: d.symbol || sym, name: name || d.name || sym, note: "",
      addedAt: Date.now(), goalBuy: null, goalSell: null
    });
    DL.addDiary(d.symbol || sym, "watch", "Agregado a la watchlist", d.price);
    DL.save(); DL.recompute(); DL.render();
    DL.toast(sym + " agregado");
  }).catch(function (e) {
    DL.toast("No se encontró " + sym + " (" + (e.message || "error") + ")");
  });
};
/* ============================================================
   Módulo 5b/6 — ficha del activo, trade builder, portafolio, diario
   ============================================================ */

DL.current = { sym: null, range: 90 };

DL.openAsset = function (sym) {
  DL.current.sym = sym;
  DL.go("asset");
  if (!DL.data.bySym[sym]) {
    DL.MKT.daily(sym).then(function (d) {
      DL.data.bySym[d.symbol || sym] = d; DL.recompute(); DL.render();
    }).catch(function () { DL.render(); });
  }
};

DL.addDiary = function (sym, kind, text, px) {
  DL.S.diary.unshift({ id: DL.uid("j"), sym: sym, kind: kind, text: text, pxAt: px || null, t: Date.now() });
  if (DL.S.diary.length > 400) DL.S.diary.length = 400;   // el historial no se sobrescribe, solo se acota
  DL.save();
};

/* ============================================================
   FICHA DEL ACTIVO
   ============================================================ */
DL.VIEW_asset = function (root) {
  var sym = DL.current.sym;
  if (!sym) { root.innerHTML = DL.empty("Ningún activo seleccionado", "Elige uno desde la watchlist."); return; }
  var d = DL.data.bySym[sym], an = DL.data.an[sym];
  var P = DL.ENG.portfolio(DL.prices());
  var pos = P.open.filter(function (p) { return p.sym === sym; })[0];
  var inWatch = DL.S.watch.some(function (w) { return w.sym === sym; });

  if (!d) {
    root.innerHTML = '<section class="card"><div class="head"><h3>' + DL.esc(sym) + "</h3></div>" +
      '<p class="mute" style="font-size:13px"><span class="spin"></span> Cargando datos de mercado…</p></section>';
    return;
  }

  var state = pos ? DL.ENG.positionState(pos, an) : null;
  var html = "";

  /* cabecera */
  html += '<section class="card">' +
    '<div class="head" style="margin-bottom:8px"><div>' +
    '<h3 style="font-size:20px;font-family:var(--m);letter-spacing:-.01em">' + DL.esc(sym) + "</h3>" +
    '<div class="eyebrow" style="margin-top:2px">' + DL.esc(d.name || "") + (d.exchange ? " · " + DL.esc(d.exchange) : "") + "</div></div>" +
    (state ? DL.tag(state.s, state.s.toLowerCase()) : (an ? DL.tag(an.state, an.state.toLowerCase()) : "")) +
    "</div>" +
    '<div class="row" style="align-items:baseline;gap:12px">' +
    '<span class="n" style="font-size:30px;letter-spacing:-.03em">' + DL.money(d.price) + "</span>" +
    '<span class="n ' + DL.tone(an ? an.chgPct : 0) + '" style="font-size:15px">' + (an ? DL.pct(an.chgPct) : "") + "</span>" +
    (d.stale ? '<span class="eyebrow">dato en caché</span>' : "") +
    "</div>";

  html += '<div class="row" style="margin-top:12px;gap:6px"><div class="seg" id="rangeSeg">' +
    [["30", "1M"], ["90", "3M"], ["180", "6M"], ["250", "1A"]].map(function (r) {
      return '<button data-r="' + r[0] + '" aria-pressed="' + (DL.current.range == r[0]) + '">' + r[1] + "</button>";
    }).join("") + "</div></div>";
  html += '<div class="chartbox" style="margin-top:10px"><canvas id="assetChart"></canvas></div>';
  html += "</section>";

  /* decision score con condiciones explícitas */
  if (an) {
    html += '<section class="card"><div class="head"><h3>Decision Score</h3>' +
      DL.tag(an.state, an.state.toLowerCase()) + "</div>" +
      '<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:12px">' +
      '<span class="score"><b>' + an.score + '</b><span>/100</span></span>' +
      '<span class="n" style="font-size:12px;color:var(--muted)">' + an.confirmed + " de " + an.total + " condiciones confirmadas</span></div>" +
      '<div class="bar" style="margin-bottom:14px"><i class="' +
      (an.score >= 75 ? "pos" : an.score >= 50 ? "amber" : "neg") + '" style="width:' + an.score + '%"></i></div>' +
      an.conditions.map(function (c) {
        return '<div class="cond ' + (c.ok ? "ok" : "") + '">' +
          '<span class="ic">' + (c.ok ? "✅" : "❌") + "</span>" +
          '<span class="lb">' + DL.esc(c.label) + "</span>" +
          '<span class="vl">' + DL.esc(c.value) + "</span></div>";
      }).join("") +
      '<p style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5">' +
      "El score es la cuenta de condiciones confirmadas — nada más. No predice el precio: describe el estado actual del activo con reglas que puedes verificar tú mismo en el gráfico.</p>" +
      "</section>";
  }

  /* plan sugerido según el modo activo */
  if (an && !pos) {
    var plan = DL.ENG.suggestPlan(an);
    var M = DL.mode();
    if (plan) {
      html += '<section class="card"><div class="head"><h3>Plan sugerido · ' + DL.esc(M.label) + "</h3>" +
        DL.tag(M.sub, "watch") + "</div>";
      if (plan.buyZone) {
        html += '<div class="zone buy"><span class="lab">Zona de compra</span>' +
          '<span class="val">' + DL.money(plan.buyZone[0]) + " – " + DL.money(plan.buyZone[1]) + "</span></div>" +
          '<div class="zone"><span class="lab">Stop</span><span class="val neg">' + DL.money(plan.stop) + "</span></div>" +
          '<div class="zone sell"><span class="lab">Zona de venta</span>' +
          '<span class="val">' + DL.money(plan.sellZone[0]) + " – " + DL.money(plan.sellZone[1]) + "</span></div>";
      } else {
        html += '<div class="grid g3" style="margin-bottom:10px">' +
          DL.ro("Entrada", DL.money(plan.entry), "", "sm") +
          DL.ro("Stop", DL.money(plan.stop), "neg", "sm") +
          DL.ro("Target", DL.money(plan.target), "pos", "sm") +
          "</div>";
      }
      html += '<p style="margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5">' +
        DL.esc(plan.note) + "</p>" +
        '<p style="margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5">' +
        (M.id === "scalp"
          ? "Un " + DL.term("tight stop") + " te saca rápido cuando te equivocas, pero también te saca del ruido normal. En intradía la " + DL.term("execution speed") + " es parte del plan."
          : "Una ruptura sin " + DL.term("volume confirmation") + " suele ser falsa. Si el precio está cerca del soporte, es rebote; si supera la resistencia, es " + DL.term("breakout") + ".") +
        "</p></section>";
    }
  }

  /* posición abierta */
  if (pos) {
    var plPct = pos._cost > 0 ? (pos._pl / pos._cost) * 100 : 0;
    html += '<section class="card"><div class="head"><h3>Tu posición</h3>' + DL.tag(state.s, state.s.toLowerCase()) + "</div>" +
      '<div class="note" style="margin-bottom:12px">' + DL.esc(state.why) + "</div>" +
      '<div class="grid g3" style="margin-bottom:12px">' +
      DL.ro("Cantidad", DL.qty(pos.qty), "", "sm") +
      DL.ro("Precio de registro", DL.money(pos.entry), "", "sm") +
      DL.ro("P/L", DL.sgn(pos._pl) + " (" + DL.pct(plPct) + ")", DL.tone(pos._pl), "sm") +
      "</div>" +
      '<div class="grid g3">' +
      DL.ro("Stop", DL.money(pos.stop), "neg", "sm") +
      DL.ro("Target", pos.target ? DL.money(pos.target) : "—", "pos", "sm") +
      DL.ro("Invertido", DL.money(pos._cost, 0), "", "sm") +
      "</div>" +
      '<div class="row" style="margin-top:14px">' +
      '<button class="btn sm" id="btnFollow">Registrar seguimiento</button>' +
      '<button class="btn sm" id="btnMoveStop">Ajustar stop</button>' +
      '<button class="btn sm dngr" id="btnClose">Cerrar posición</button>' +
      "</div></section>";
  }

  /* línea de tiempo del activo */
  var events = DL.S.diary.filter(function (e) { return e.sym === sym; });
  html += '<section class="card"><div class="head"><h3>Línea de tiempo</h3>' +
    '<span class="eyebrow">' + events.length + " registros</span></div>";
  if (!events.length) html += DL.empty("Sin historial todavía", "Cada acción sobre este activo queda registrada aquí.");
  else {
    html += events.slice(0, 40).map(function (e) {
      var pct = (e.pxAt && d.price) ? ((d.price - e.pxAt) / e.pxAt) * 100 : null;
      return '<div class="tl"><div class="w">' + DL.day(e.t) + '</div><div class="m"><i></i></div>' +
        '<div class="b">' + DL.esc(e.text) +
        (e.pxAt ? "<small>en " + DL.money(e.pxAt) +
          (pct != null ? ' · <span class="' + DL.tone(pct) + '">' + DL.pct(pct) + " desde entonces</span>" : "") + "</small>" : "") +
        "</div></div>";
    }).join("");
  }
  html += "</section>";

  /* acciones */
  html += '<section class="card"><div class="row">' +
    (pos ? "" : '<button class="btn p" id="btnTrade">Operar ' + DL.esc(sym) + "</button>") +
    '<button class="btn" id="btnNote">Nota al diario</button>' +
    (inWatch
      ? '<button class="btn g" id="btnUnwatch">Quitar de watchlist</button>'
      : '<button class="btn" id="btnWatch">Agregar a watchlist</button>') +
    "</div></section>";

  root.innerHTML = html;

  /* gráfico */
  var cv = DL.$("#assetChart", root);
  if (cv) {
    DL.CH.candles(cv, {
      bars: d.bars,
      sma: DL.mode().id === "scalp" ? [20, 50] : [20, 50, 200],
      count: DL.current.range, height: 250,
      levels: pos ? { entry: pos.entry, stop: pos.stop, target: pos.target } : null,
      sr: (an && DL.mode().id === "swing") ? { support: an.support, resistance: an.resistance } : null
    });
  }
  DL.$$("#rangeSeg button", root).forEach(function (b) {
    b.onclick = function () { DL.current.range = parseInt(b.dataset.r, 10); DL.render(); };
  });

  var bt;
  if ((bt = DL.$("#btnTrade", root))) bt.onclick = function () { DL.tradeSym = sym; DL.go("trade"); };
  if ((bt = DL.$("#btnWatch", root))) bt.onclick = function () { DL.addSymbol(sym, d.name); };
  if ((bt = DL.$("#btnUnwatch", root))) bt.onclick = function () {
    DL.S.watch = DL.S.watch.filter(function (w) { return w.sym !== sym; });
    DL.save(); DL.toast(sym + " quitado de la watchlist"); DL.go("watch");
  };
  if ((bt = DL.$("#btnNote", root))) bt.onclick = function () { DL.noteSheet(sym, d.price); };
  if ((bt = DL.$("#btnFollow", root))) bt.onclick = function () { DL.followSheet(pos, d.price); };
  if ((bt = DL.$("#btnMoveStop", root))) bt.onclick = function () { DL.moveStopSheet(pos, d.price); };
  if ((bt = DL.$("#btnClose", root))) bt.onclick = function () { DL.closeSheet(pos, d.price); };
};

/* ---------- hojas de acción sobre una posición ---------- */
DL.noteSheet = function (sym, px) {
  var body = DL.el('<div><div class="fld"><label for="ntx">Nota</label>' +
    '<textarea id="ntx" placeholder="Qué observaste, qué esperas, qué te haría cambiar de opinión."></textarea></div></div>');
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p">Guardar</button>');
  ok.onclick = function () {
    var v = body.querySelector("#ntx").value.trim();
    if (!v) return;
    DL.addDiary(sym, "note", v, px);
    s.close(); DL.toast("Nota guardada"); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet("Nota · " + sym, body, foot);
};

DL.followSheet = function (pos, px) {
  var pct = ((px - pos.entry) / pos.entry) * 100;
  var body = DL.el('<div><div class="grid g3" style="margin-bottom:14px">' +
    DL.ro("Precio de registro", DL.money(pos.entry), "", "sm") +
    DL.ro("Precio hoy", DL.money(px), "", "sm") +
    DL.ro("Cambio", DL.pct(pct), DL.tone(pct), "sm") +
    "</div><div class=\"fld\"><label for=\"ftx\">¿Qué está pasando con tu tesis?</label>" +
    '<textarea id="ftx" placeholder="Sigue vigente / se debilitó / apareció algo nuevo."></textarea></div></div>');
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p">Registrar seguimiento</button>');
  ok.onclick = function () {
    var v = body.querySelector("#ftx").value.trim() || "Seguimiento sin observaciones";
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "follow", px: px, note: v }]);
    DL.addDiary(pos.sym, "follow", "Seguimiento: " + v, px);
    DL.save(); s.close(); DL.toast("Seguimiento registrado"); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet("Seguimiento · " + pos.sym, body, foot);
};

DL.moveStopSheet = function (pos, px) {
  var body = DL.el('<div><div class="fld"><label for="nst">Nuevo stop</label>' +
    '<input type="number" step="0.01" id="nst" value="' + pos.stop.toFixed(2) + '"></div>' +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' +
    "Subir el stop protege ganancia. Bajarlo para no perder es cambiar el plan a mitad de camino — queda registrado en la línea de tiempo.</p></div>");
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p">Guardar</button>');
  ok.onclick = function () {
    var v = parseFloat(body.querySelector("#nst").value);
    if (!v || v <= 0) return;
    var dir = v > pos.stop ? "subido" : "bajado";
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "stop", px: v, note: "stop " + dir }]);
    DL.addDiary(pos.sym, "stop", "Stop " + dir + " de " + DL.money(pos.stop) + " a " + DL.money(v), px);
    pos.stop = v;
    DL.save(); s.close(); DL.toast("Stop actualizado"); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet("Ajustar stop · " + pos.sym, body, foot);
};

DL.closeSheet = function (pos, px) {
  var body = DL.el('<div><div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="cpx">Precio de cierre</label><input type="number" step="0.01" id="cpx" value="' + px.toFixed(2) + '"></div>' +
    '<div class="fld"><label for="crs">Motivo</label><select id="crs">' +
    '<option value="target">Target alcanzado</option>' +
    '<option value="stop">Stop alcanzado</option>' +
    '<option value="tesis">Tesis invalidada</option>' +
    '<option value="manual">Decisión discrecional</option></select></div></div>' +
    '<div id="cprev"></div>' +
    '<div class="fld" style="margin-top:12px"><label for="clr">¿Qué aprendiste?</label>' +
    '<textarea id="clr" placeholder="Qué esperabas, qué pasó, qué harías distinto."></textarea></div></div>');
  function upd() {
    var v = parseFloat(body.querySelector("#cpx").value) || 0;
    var pl = (v - pos.entry) * pos.qty;
    var r = Math.abs(pos.entry - pos.stop) * pos.qty;
    body.querySelector("#cprev").innerHTML = '<div class="grid g2">' +
      DL.ro("Resultado", DL.sgn(pl), DL.tone(pl)) +
      DL.ro("Múltiplo R", r > 0 ? (pl / r >= 0 ? "+" : "") + (pl / r).toFixed(2) + "R" : "—") + "</div>";
  }
  body.querySelector("#cpx").oninput = upd; upd();
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p">Cerrar posición</button>');
  ok.onclick = function () {
    var v = parseFloat(body.querySelector("#cpx").value);
    if (!v || v <= 0) return;
    var r = Math.abs(pos.entry - pos.stop) * pos.qty;
    pos.status = "closed";
    pos.exitPx = v; pos.exitAt = Date.now();
    pos.exitReason = body.querySelector("#crs").value;
    pos.pl = (v - pos.entry) * pos.qty;
    pos.rMultiple = r > 0 ? pos.pl / r : 0;
    pos.lesson = body.querySelector("#clr").value.trim();
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "exit", px: v, note: pos.exitReason }]);
    DL.addDiary(pos.sym, "exit", "Posición cerrada en " + DL.money(v) + " · " + DL.sgn(pos.pl) +
      (pos.lesson ? " · " + pos.lesson : ""), v);
    DL.save(); s.close(); DL.toast("Posición cerrada · " + DL.sgn(pos.pl)); DL.go("port");
  };
  foot.appendChild(ok);
  var s = DL.sheet("Cerrar · " + pos.sym, body, foot);
};

/* ============================================================
   TRADE BUILDER — jerarquía símbolo → precio → cantidad
   ============================================================ */
DL.tradeSym = null;
DL.VIEW_trade = function (root) {
  var P = DL.ENG.portfolio(DL.prices());
  var pr = DL.S.profile;
  var sym = DL.tradeSym || (DL.S.watch[0] && DL.S.watch[0].sym) || "";
  var d = sym ? DL.data.bySym[sym] : null;
  var an = sym ? DL.data.an[sym] : null;

  var opts = DL.S.watch.map(function (w) { return w.sym; });
  Object.keys(DL.data.bySym).forEach(function (s) { if (opts.indexOf(s) < 0) opts.push(s); });

  var html = '<section class="card"><div class="head"><h3>Operar</h3>' +
    DL.tag("simulado", "watch") + "</div>";

  if (!opts.length) {
    html += DL.empty("Primero agrega un activo", "Ve a Watchlist y escribe un símbolo real.");
    root.innerHTML = html + "</section>";
    return;
  }

  html += '<div class="fld" style="margin-bottom:12px"><label for="tsym">1 · Símbolo</label>' +
    '<select id="tsym">' + opts.map(function (s) {
      return '<option value="' + DL.esc(s) + '"' + (s === sym ? " selected" : "") + ">" + DL.esc(s) + "</option>";
    }).join("") + "</select></div>";

  if (an) {
    var failed = an.conditions.filter(function (c) { return !c.ok; });
    html += '<div class="note' + (an.score < 50 ? " bad" : "") + '" style="margin-bottom:12px">' +
      "<b>" + an.score + "/100 — " + an.state + ", " + an.confirmed + " de " + an.total + " condiciones confirmadas.</b>" +
      (failed.length ? "<br>Sin confirmar: " + DL.esc(failed.map(function (c) { return c.label.split(" —")[0].split(" (")[0]; }).join(" · ")) : "") +
      (an.score < 50 ? "<br>Puedes operar igual — pero escribe en tu tesis por qué entras contra las condiciones." : "") +
      "</div>";
  }

  html += '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="tpx">2 · Precio</label><input type="number" step="0.01" id="tpx" value="' +
    (d ? d.price.toFixed(2) : "") + '"></div>' +
    '<div class="fld"><label for="tqty">3 · Cantidad</label><input type="number" step="1" min="0" id="tqty" value=""></div>' +
    "</div>";

  html += '<div class="row" style="margin-bottom:12px;gap:6px">' +
    '<button class="btn sm" id="qSug">Cantidad sugerida</button>' +
    '<button class="btn sm" id="qMax">Máximo permitido</button></div>';

  var plan = an ? DL.ENG.suggestPlan(an) : null;
  var MD = DL.mode();

  if (plan && plan.buyZone) {
    html += '<div class="zone buy" style="margin-bottom:10px"><span class="lab">Zona de compra sugerida</span>' +
      '<span class="val">' + DL.money(plan.buyZone[0]) + " – " + DL.money(plan.buyZone[1]) + "</span></div>";
  }

  html += '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="tstop">4 · Stop' +
    (MD.id === "scalp" ? " (tight stop, " + MD.stopAtr + "× ATR)" : " (dónde tu idea queda invalidada)") + "</label>" +
    '<input type="number" step="0.01" id="tstop" value="' + (plan ? plan.stop.toFixed(2) : "") + '"></div>' +
    '<div class="fld"><label for="ttgt">5 · Target</label>' +
    '<input type="number" step="0.01" id="ttgt" value="' + (plan ? plan.target.toFixed(2) : "") + '"></div>' +
    "</div>";

  html += '<div id="riskOut"></div>';
  html += '<div class="fld" style="margin-top:12px"><label for="tthesis">Tu tesis en una frase</label>' +
    '<textarea id="tthesis" placeholder="Qué crees que va a pasar y por qué."></textarea></div>';
  html += '<button class="btn p blk" id="tgo" style="margin-top:12px">Registrar operación simulada</button>';
  html += "</section>";

  root.innerHTML = html;

  var elSym = DL.$("#tsym", root), elPx = DL.$("#tpx", root), elQty = DL.$("#tqty", root),
      elStop = DL.$("#tstop", root), elTgt = DL.$("#ttgt", root), out = DL.$("#riskOut", root),
      go = DL.$("#tgo", root);

  function calc() {
    return DL.ENG.tradeRisk({
      price: elPx.value, qty: elQty.value, stop: elStop.value, target: elTgt.value,
      equity: P.equity, cash: P.cash, maxDailyPct: pr.maxDailyPct, maxRiskPct: pr.maxRiskPct,
      deployedToday: P.deployedToday
    });
  }
  function paint() {
    var c = calc();
    var warn = "";
    if (c.overCash) warn += '<div class="note bad" style="margin-bottom:8px"><b>Excede tu efectivo.</b> Tienes ' +
      DL.money(P.cash, 0) + " disponible y esta compra cuesta " + DL.money(c.cost, 0) + ".</div>";
    if (c.overDaily) warn += '<div class="note bad" style="margin-bottom:8px"><b>Excede el límite diario.</b> Llegarías a ' +
      DL.pctp(c.dayPct, 1) + " del equity y tu tope es " + pr.maxDailyPct + "%.</div>";
    if (c.overRisk) warn += '<div class="note bad" style="margin-bottom:8px"><b>Excede tu riesgo por operación.</b> Arriesgas ' +
      DL.pctp(c.riskPct, 2) + " y tu tope es " + pr.maxRiskPct + "%.</div>";
    if (!c.stopValid) warn += '<div class="note" style="margin-bottom:8px"><b>Falta el stop.</b> ' +
      "Sin stop no hay riesgo calculable: pon el precio por debajo de la entrada, donde tu idea quedaría invalidada.</div>";

    out.innerHTML = warn +
      '<div class="grid g3" style="margin-bottom:10px">' +
      DL.ro("Costo total", DL.money(c.cost, 2)) +
      DL.ro("% del capital", DL.pctp(c.costPct, 1), c.costPct > pr.maxDailyPct ? "neg" : "") +
      DL.ro("Efectivo después", DL.money(c.cashAfter, 0), c.cashAfter < 0 ? "neg" : "") +
      "</div>" +
      '<div class="grid g3" style="margin-bottom:10px">' +
      DL.ro("Pérdida en el stop", DL.money(c.riskAmount), "neg") +
      DL.ro("Eso es del equity", DL.pctp(c.riskPct, 2), c.overRisk ? "neg" : "pos") +
      DL.ro("Distancia al stop", DL.pctp(c.stopDistPct, 2)) +
      "</div>" +
      '<div class="grid g3">' +
      DL.ro("Ganancia en el target", DL.money(c.rewardAmount), "pos") +
      DL.ro("Reward / Risk", c.rr ? "1 : " + c.rr.toFixed(2) : "—", c.rr >= 2 ? "pos" : c.rr >= 1.5 ? "warn" : "neg") +
      DL.ro("Distancia al target", DL.pctp(c.targetDistPct, 2)) +
      "</div>" +
      '<div class="note" style="margin-top:12px"><b>Desplegar no es arriesgar.</b> Pones ' +
      DL.money(c.cost, 0) + " en el mercado (" + DL.pctp(c.costPct, 1) + " del capital), pero con el stop en " +
      DL.money(parseFloat(elStop.value) || 0) + " tu pérdida máxima planeada es " + DL.money(c.riskAmount) +
      " — " + DL.pctp(c.riskPct, 2) + " del equity.</div>";

    go.disabled = !c.ok;
    return c;
  }

  [elPx, elQty, elStop, elTgt].forEach(function (x) { x.oninput = paint; });
  elSym.onchange = function () {
    DL.tradeSym = elSym.value;
    if (!DL.data.bySym[DL.tradeSym]) {
      DL.MKT.daily(DL.tradeSym).then(function (dd) {
        DL.data.bySym[dd.symbol || DL.tradeSym] = dd; DL.recompute(); DL.render();
      });
    } else DL.render();
  };
  DL.$("#qSug", root).onclick = function () { elQty.value = calc().suggestedQty; paint(); };
  DL.$("#qMax", root).onclick = function () {
    var c = calc();
    var px = parseFloat(elPx.value) || 0;
    elQty.value = px > 0 ? Math.floor(Math.min(P.cash, c.roomToday) / px) : 0;
    paint();
  };
  paint();

  go.onclick = function () {
    var c = calc();
    if (!c.ok) return;
    var p = {
      id: DL.uid("p"), sym: elSym.value, qty: parseFloat(elQty.value),
      entry: parseFloat(elPx.value), stop: parseFloat(elStop.value),
      target: parseFloat(elTgt.value) || null,
      thesis: DL.$("#tthesis", root).value.trim(),
      openedAt: Date.now(), status: "open",
      mode: DL.S.profile.mode,
      riskPct: c.riskPct, rr: c.rr, costPct: c.costPct,
      events: [{ t: Date.now(), k: "entry", px: parseFloat(elPx.value), note: "Entrada registrada" }]
    };
    DL.S.pos.push(p);
    DL.addDiary(p.sym, "entry", "Compra simulada: " + DL.qty(p.qty) + " a " + DL.money(p.entry) +
      " · stop " + DL.money(p.stop) + (p.target ? " · target " + DL.money(p.target) : "") +
      (p.thesis ? " · " + p.thesis : ""), p.entry);
    if (!DL.S.watch.some(function (w) { return w.sym === p.sym; })) {
      DL.S.watch.push({ sym: p.sym, name: (DL.data.bySym[p.sym] || {}).name || p.sym, note: "", addedAt: Date.now() });
    }
    DL.save(); DL.toast("Operación registrada"); DL.go("port");
  };
};

DL.VIEW_port = function (root) {
  var P = DL.ENG.portfolio(DL.prices());
  var html = "";

  html += '<section class="card"><div class="head"><h3>Portafolio</h3>' +
    DL.tag(DL.S.pos.filter(function (p) { return p.status === "open"; }).length + " abiertas", "hold") + "</div>" +
    '<div class="grid g2" style="margin-bottom:12px">' +
    DL.ro("Equity", DL.money(P.equity), DL.tone(P.totalPL), "lg") +
    DL.ro("Retorno total", DL.pct(P.returnPct), DL.tone(P.returnPct), "lg") +
    "</div>" +
    '<div class="grid g3">' +
    DL.ro("Efectivo", DL.money(P.cash, 0), "", "sm") +
    DL.ro("Invertido", DL.money(P.mktValue, 0), "", "sm") +
    DL.ro("Exposición", DL.pctp(P.exposurePct, 1), "", "sm") +
    DL.ro("P/L abierto", DL.sgn(P.openPL), DL.tone(P.openPL), "sm") +
    DL.ro("P/L realizado", DL.sgn(P.realized), DL.tone(P.realized), "sm") +
    DL.ro("Riesgo abierto", DL.pctp(P.openRiskPct, 2), "", "sm") +
    "</div>";

  // curva de capital realizada (semanal si hay suficientes cierres)
  if (P.closed.length >= 2) {
    html += '<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Curva de capital</div>' +
      '<div class="chartbox"><canvas id="eqCurve"></canvas></div></div>';
  }
  html += "</section>";

  /* posiciones abiertas */
  html += '<section class="card"><div class="head"><h3>Posiciones abiertas</h3></div>';
  if (!P.open.length) {
    html += DL.empty("Sin posiciones abiertas", "Desde Operar puedes registrar tu primera compra simulada.");
  } else {
    html += '<div id="openList"></div>';
  }
  html += "</section>";

  /* cerradas */
  html += '<section class="card"><div class="head"><h3>Historial</h3>' +
    '<span class="eyebrow">' + P.closed.length + " cerradas</span></div>";
  if (!P.closed.length) {
    html += DL.empty("Todavía no cierras ninguna posición", "El historial no se sobrescribe nunca.");
  } else {
    html += '<div class="grid g4" style="margin-bottom:12px">' +
      DL.ro("Aciertos", P.winRate == null ? "—" : DL.pctp(P.winRate, 0), "", "sm") +
      DL.ro("Ganancia media", P.avgWin == null ? "—" : DL.money(P.avgWin), "pos", "sm") +
      DL.ro("Pérdida media", P.avgLoss == null ? "—" : DL.money(P.avgLoss), "neg", "sm") +
      DL.ro("Drawdown máx.", DL.pctp(P.maxDD, 1), "", "sm") +
      "</div>";
    html += '<div class="scroll"><table><thead><tr><th></th><th>Entrada</th><th>Salida</th><th>Resultado</th><th>R</th></tr></thead><tbody>' +
      P.closed.slice().sort(function (a, b) { return b.exitAt - a.exitAt; }).map(function (p) {
        return "<tr><td><b class='n'>" + DL.esc(p.sym) + "</b><br><span class='eyebrow'>" + DL.day(p.exitAt) + "</span></td>" +
          "<td class='n'>" + DL.money(p.entry) + "</td>" +
          "<td class='n'>" + DL.money(p.exitPx) + "</td>" +
          "<td class='n " + DL.tone(p.pl) + "'>" + DL.sgn(p.pl) + "</td>" +
          "<td class='n'>" + (p.rMultiple == null ? "—" : (p.rMultiple >= 0 ? "+" : "") + p.rMultiple.toFixed(2) + "R") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  html += "</section>";

  root.innerHTML = html;

  var list = DL.$("#openList", root);
  if (list) {
    P.open.forEach(function (p) {
      var an = DL.data.an[p.sym];
      var st = DL.ENG.positionState(p, an);
      var card = DL.el('<button type="button" style="display:block;width:100%;text-align:left;background:var(--plate2);' +
        'border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px"></button>');
      card.innerHTML =
        '<div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<span class="n" style="font-size:14px;font-weight:600">' + DL.esc(p.sym) + "</span>" +
        DL.tag(st.s, st.s.toLowerCase()) + "</div>" +
        '<div class="grid g4">' +
        DL.ro("Cantidad", DL.qty(p.qty), "", "sm") +
        DL.ro("Registro", DL.money(p.entry), "", "sm") +
        DL.ro("Hoy", DL.money(p._px), "", "sm") +
        DL.ro("P/L", DL.sgn(p._pl), DL.tone(p._pl), "sm") +
        "</div>" +
        '<div class="row" style="margin-top:8px;gap:10px">' +
        '<span class="n" style="font-size:11px;color:var(--neg)">stop ' + DL.money(p.stop) + "</span>" +
        '<span class="n" style="font-size:11px;color:var(--pos)">target ' + (p.target ? DL.money(p.target) : "—") + "</span>" +
        '<span class="n" style="font-size:11px;color:var(--muted)">' + DL.pct(p._plPct) + "</span></div>";
      card.onclick = function () { DL.openAsset(p.sym); };
      list.appendChild(card);
    });
  }

  var cv = DL.$("#eqCurve", root);
  if (cv) {
    var pts = [DL.S.profile.capital], eq = DL.S.profile.capital;
    P.closed.slice().sort(function (a, b) { return a.exitAt - b.exitAt; })
      .forEach(function (p) { eq += (p.pl || 0); pts.push(eq); });
    pts.push(P.equity);
    DL.CH.equityCurve(cv, pts, 90);
  }
};

DL.VIEW_diary = function (root) {
  var html = '<section class="card"><div class="head"><h3>Diario</h3>' +
    '<span class="eyebrow">' + DL.S.diary.length + " registros</span></div>";
  if (!DL.S.diary.length) {
    html += DL.empty("Tu diario está vacío",
      "Cada activo agregado, cada compra, seguimiento y cierre queda registrado aquí automáticamente.");
    root.innerHTML = html + "</section>";
    return;
  }
  var KIND = {
    watch: ["Watchlist", "watch"], entry: ["Compra", "buy"], follow: ["Seguimiento", "hold"],
    stop: ["Stop", "wait"], exit: ["Cierre", "sell"], note: ["Nota", ""]
  };
  html += DL.S.diary.slice(0, 120).map(function (e) {
    var d = DL.data.bySym[e.sym];
    var pct = (e.pxAt && d) ? ((d.price - e.pxAt) / e.pxAt) * 100 : null;
    var k = KIND[e.kind] || ["Registro", ""];
    return '<div style="padding:12px 0;border-bottom:1px solid var(--soft)">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:5px">' +
      '<span class="row" style="gap:7px"><b class="n" style="font-size:13px">' + DL.esc(e.sym) + "</b>" +
      DL.tag(k[0], k[1]) + "</span>" +
      '<span class="eyebrow">' + DL.day(e.t) + "</span></div>" +
      '<div style="font-size:12.5px;color:var(--text2);line-height:1.45">' + DL.esc(e.text) + "</div>" +
      (e.pxAt ? '<div class="row" style="margin-top:6px;gap:12px">' +
        '<span class="n" style="font-size:11.5px;color:var(--muted)">registro ' + DL.money(e.pxAt) + "</span>" +
        (pct != null ? '<span class="n ' + DL.tone(pct) + '" style="font-size:11.5px">' +
          DL.pct(pct) + " hoy vs. ese precio</span>" : "") + "</div>" : "");
  }).join("");
  html += "</section>";
  root.innerHTML = html;
};

DL.settingsSheet = function () {
  var pr = DL.S.profile;
  var body = DL.el('<div>' +
    '<div class="fld" style="margin-bottom:12px"><label for="sName">Tu nombre</label>' +
    '<input type="text" id="sName" value="' + DL.esc(pr.name) + '"></div>' +
    '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="sCap">Capital simulado (USD)</label>' +

    '<div class="fld"><label for="sDay">Despliegue máx. diario (%)</label>' +
    '<input type="number" id="sDay" step="1" min="1" max="100" value="' + pr.maxDailyPct + '"></div></div>' +
    '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="sRisk">Riesgo máx. por operación (%)</label>' +

    '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="sVol">Liquidez mínima del día (millones)</label>' +
    '<input type="number" id="sVol" step="1" min="0" value="' + (pr.minVolume / 1e6) + '"></div>' +
    '<div class="fld"><label for="sHold">Máximo en posición (horas)</label>' +
    '<input type="number" id="sHold" step="0.5" min="0.5" value="' + pr.maxHoldHours + '"></div></div>' +
    '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="sIMin">Variación mínima del día (%)</label>' +
    '<input type="number" id="sIMin" step="0.1" min="0" value="' + pr.intradayMin + '"></div>' +
    '<div class="fld"><label for="sIMax">Variación máxima del día (%)</label>' +
    '<input type="number" id="sIMax" step="0.1" min="0" value="' + pr.intradayMax + '"></div></div>' +
    '<div class="fld" style="margin-bottom:12px"><label for="sProxy">Proxy CORS (opcional, usa {url})</label>' +
    '<input type="text" id="sProxy" placeholder="https://mi-proxy.com/?{url}" value="' + DL.esc(pr.proxy) + '"></div>' +
    '<div class="note">Solo necesitas un proxy si tu red bloquea a Yahoo Finance. La app ya intenta varios ' +
    "públicos por su cuenta antes de fallar.</div>" +
    '<div id="sPrev" style="margin-top:12px"></div>' +
    "</div>");

  function prev() {
    var cap = parseFloat(body.querySelector("#sCap").value) || 0;
    var day = parseFloat(body.querySelector("#sDay").value) || 20;
    var rk = parseFloat(body.querySelector("#sRisk").value) || 2;
    body.querySelector("#sPrev").innerHTML = '<div class="note"><b>Con estos números:</b> puedes poner hasta ' +
      DL.money(cap * day / 100, 0) + " en el mercado en un día (" + day + "%), y tu pérdida máxima planeada por operación es " +
      DL.money(cap * rk / 100, 0) + " (" + rk + "%). Con un stop 5% abajo de tu entrada, desplegar el " + day +
      "% completo solo arriesga " + (5 * day / 100).toFixed(1) + "% del capital.</div>";
  }
  ["#sCap", "#sDay", "#sRisk"].forEach(function (s) { body.querySelector(s).oninput = prev; });
  prev();

  var legalBtn = DL.el('<button class="btn sm g" style="margin-top:12px;width:100%">Leer el aviso legal</button>');
  legalBtn.onclick = DL.legalSheet;
  body.appendChild(legalBtn);

  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:space-between"></div>');
  var reset = DL.el('<button class="btn dngr sm">Borrar todo</button>');
  reset.onclick = function () {
    DL.confirm("Borrar todo", "Se eliminan watchlist, posiciones y diario de este navegador. No se puede deshacer.",
      function () {
        localStorage.removeItem(DL.KEY);
        DL.MKT.clearCache();
        location.reload();
      }, "Borrar");
  };
  var ok = DL.el('<button class="btn p">Guardar</button>');
  ok.onclick = function () {
    pr.name = body.querySelector("#sName").value.trim() || pr.name;
    pr.capital = Math.max(100, parseFloat(body.querySelector("#sCap").value) || 3000);
    pr.maxDailyPct = Math.min(100, Math.max(1, parseFloat(body.querySelector("#sDay").value) || 20));
    pr.maxRiskPct = Math.min(10, Math.max(0.1, parseFloat(body.querySelector("#sRisk").value) || 2));
    pr.proxy = body.querySelector("#sProxy").value.trim();
    pr.minVolume = Math.max(0, (parseFloat(body.querySelector("#sVol").value) || 5) * 1e6);
    pr.maxHoldHours = Math.max(0.5, parseFloat(body.querySelector("#sHold").value) || 2);
    pr.intradayMin = Math.max(0, parseFloat(body.querySelector("#sIMin").value) || 0.2);
    pr.intradayMax = Math.max(pr.intradayMin, parseFloat(body.querySelector("#sIMax").value) || 0.5);
    var b = body.querySelector("#sBench").value.trim().toUpperCase();
    if (b) DL.BENCH = b;
    DL.save(); s.close(); DL.toast("Ajustes guardados"); DL.sync(true);
  };
  foot.appendChild(reset); foot.appendChild(ok);
  var s = DL.sheet("Ajustes", body, foot);
};

    ' <button type="button" id="uLegal">Leer el aviso legal completo</button></div>' +
    "</section>";

  var go = DL.$("#uGo", root);
  var nm = DL.$("#uName", root);
  DL.$("#uLegal", root).onclick = DL.legalSheet;
  function start() {
    var n = nm.value.trim();
    if (!n) { nm.focus(); DL.toast("Escribe tu nombre"); return; }
    if (!DL.$("#uOk", root).checked) { DL.toast("Debes aceptar el aviso para continuar"); return; }
    DL.S.profile.accepted = true;
    DL.S.profile.name = n;
    DL.S.profile.capital = parseFloat(DL.$("#uCap", root).value) || 3000;
    DL.S.profile.setup = true;
    // watchlist inicial para que la app abra con algo vivo en pantalla
    ["AAPL", "MSFT", "NVDA", "SPY"].forEach(function (s) {
      DL.S.watch.push({ sym: s, name: s, note: "", addedAt: Date.now() });
    });
    DL.save();
    DL.go("home");
    DL.sync(true);
  }
  go.onclick = start;
  nm.onkeydown = function (e) { if (e.key === "Enter") start(); };
};
/* ============================================================
   Módulo 5d/6 — vista del Backtest Lab
   Pestaña aislada: no lee ni escribe el portafolio en vivo.
   ============================================================ */

DL.bt = { sym: null, rule: { type: "rsi", period: 14, buy: 30, sell: 70, fast: 20, slow: 50, splitPct: 60 },
          result: null, loading: false, error: null, bars: null };

DL.VIEW_backtest = function (root) {
  var R = DL.bt.rule;
  var opts = DL.S.watch.map(function (w) { return w.sym; });
  if (!DL.bt.sym) DL.bt.sym = opts[0] || "AAPL";
  if (opts.indexOf(DL.bt.sym) < 0) opts.unshift(DL.bt.sym);

  var html = '<section class="card"><div class="head"><h3>Backtest Lab</h3>' +
    DL.tag("sandbox", "watch") + "</div>" +
    '<p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px">' +
    "Defines una regla, se corre contra " + DL.term("historical data") + " real y se parte en dos: " +
    "un periodo de <b>ajuste</b>, donde eliges tus " + DL.term("parameter") + "s, y uno de <b>prueba</b> " +
    "que la regla nunca vio. Si solo funciona en el primero, tienes " + DL.term("overfitting") + ".</p>" +
    '<div class="note" style="margin-bottom:12px"><b>Aislado del portafolio.</b> ' +
    "Nada de lo que hagas aquí toca tu capital simulado ni tus posiciones abiertas.</div>";

  html += '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="btSym">Símbolo</label><select id="btSym">' +
    opts.map(function (s) {
      return '<option value="' + DL.esc(s) + '"' + (s === DL.bt.sym ? " selected" : "") + ">" + DL.esc(s) + "</option>";
    }).join("") + "</select></div>" +
    '<div class="fld"><label for="btType">Regla</label><select id="btType">' +
    '<option value="rsi"' + (R.type === "rsi" ? " selected" : "") + ">RSI sobreventa / sobrecompra</option>" +
    '<option value="sma"' + (R.type === "sma" ? " selected" : "") + ">Cruce de medias móviles</option>" +
    "</select></div></div>";

  if (R.type === "rsi") {
    html += '<div class="grid g2" style="margin-bottom:12px">' +
      '<div class="fld"><label for="btBuy">Comprar cuando ' + DL.term("RSI") + ' baje de</label>' +
      '<input type="number" id="btBuy" step="1" min="5" max="50" value="' + R.buy + '"></div>' +
      '<div class="fld"><label for="btSell">Vender cuando RSI suba de</label>' +
      '<input type="number" id="btSell" step="1" min="50" max="95" value="' + R.sell + '"></div></div>';
  } else {
    html += '<div class="grid g2" style="margin-bottom:12px">' +
      '<div class="fld"><label for="btFast">Media rápida (sesiones)</label>' +
      '<input type="number" id="btFast" step="1" min="3" max="100" value="' + R.fast + '"></div>' +
      '<div class="fld"><label for="btSlow">Media lenta (sesiones)</label>' +
      '<input type="number" id="btSlow" step="1" min="10" max="250" value="' + R.slow + '"></div></div>';
  }

  html += '<div class="fld" style="margin-bottom:12px"><label for="btSplit">Porcentaje del histórico para ajuste' +
    ' — el resto queda para la prueba</label>' +
    '<input type="number" id="btSplit" step="5" min="40" max="80" value="' + R.splitPct + '"></div>';

  html += '<button class="btn p blk" id="btRun"' + (DL.bt.loading ? " disabled" : "") + ">" +
    (DL.bt.loading ? '<span class="spin"></span> Corriendo…' : "Correr el backtest") + "</button>";
  html += "</section>";

  html += '<div id="btOut"></div>';

  /* glosario del modo */
  var gl = DL.GLOSS.backtest;
  html += '<section class="card"><div class="head"><h3>Términos de este modo</h3>' +
    DL.tag("EN → ES", "gold") + '</div><div class="terms">' +
    gl.map(function (p) { return "<div><b>" + DL.esc(p[0]) + "</b> — " + DL.esc(p[1]) + "</div>"; }).join("") +
    "</div></section>";

  html += '<div class="legal">Resultados hipotéticos. No incluyen comisiones, impuestos, spread ni slippage. ' +
    'El desempeño pasado no predice el futuro. <button type="button" id="btLegal">Aviso legal</button></div>';

  root.innerHTML = html;

  DL.$("#btLegal", root).onclick = DL.legalSheet;
  DL.$("#btSym", root).onchange = function (e) { DL.bt.sym = e.target.value; DL.bt.result = null; DL.render(); };
  DL.$("#btType", root).onchange = function (e) { R.type = e.target.value; DL.bt.result = null; DL.render(); };
  ["btBuy", "btSell", "btFast", "btSlow", "btSplit"].forEach(function (id) {
    var n = DL.$("#" + id, root);
    if (!n) return;
    n.onchange = function () {
      var v = parseFloat(n.value) || 0;
      if (id === "btBuy") R.buy = v;
      if (id === "btSell") R.sell = v;
      if (id === "btFast") R.fast = v;
      if (id === "btSlow") R.slow = v;
      if (id === "btSplit") R.splitPct = Math.min(80, Math.max(40, v));
    };
  });

  DL.$("#btRun", root).onclick = function () {
    DL.bt.loading = true; DL.bt.error = null; DL.render();
    DL.MKT.history(DL.bt.sym, "5y").then(function (d) {
      DL.bt.bars = d.bars;
      DL.bt.result = DL.BT.run(d.bars, R);
      if (!DL.bt.result) DL.bt.error = "No hay suficiente histórico para este símbolo.";
      DL.bt.loading = false; DL.render();
    }).catch(function (e) {
      DL.bt.loading = false;
      DL.bt.error = "No se pudo traer el histórico (" + (e.message || "error") + "). Revisa el proxy en Ajustes.";
      DL.render();
    });
  };

  /* ---------- resultados ---------- */
  var out = DL.$("#btOut", root);
  if (DL.bt.error) {
    out.innerHTML = '<div class="note bad"><b>Error.</b> ' + DL.esc(DL.bt.error) + "</div>";
    return;
  }
  if (!DL.bt.result) return;

  var res = DL.bt.result;
  function win(w, title, sub, tone) {
    return '<div class="window"><div class="wh"><b>' + DL.esc(title) + "</b>" +
      '<span class="eyebrow">' + DL.esc(sub) + "</span></div>" +
      '<div class="grid g3" style="margin-bottom:10px">' +
      DL.ro("Operaciones", String(w.count), "", "sm") +
      DL.ro("Aciertos", w.winRate == null ? "—" : DL.pctp(w.winRate, 0), "", "sm") +
      DL.ro("Retorno", DL.pct(w.totalReturn, 1), DL.tone(w.totalReturn), "sm") +
      "</div>" +
      '<div class="grid g3">' +
      DL.ro("Comprar y mantener", DL.pct(w.buyHold, 1), DL.tone(w.buyHold), "sm") +
      DL.ro("Profit factor", w.profitFactor == null ? "—" :
        (w.profitFactor === Infinity ? "∞" : w.profitFactor.toFixed(2)), "", "sm") +
      DL.ro("Drawdown máx.", DL.pctp(w.maxDD, 1), "", "sm") +
      "</div></div>";
  }

  var fmtRange = function (w) {
    return w.from && w.to
      ? new Date(w.from).toLocaleDateString("es", { month: "short", year: "numeric" }) + " → " +
        new Date(w.to).toLocaleDateString("es", { month: "short", year: "numeric" })
      : "—";
  };

  var h = '<section class="card"><div class="head"><h3>Resultado · ' + DL.esc(DL.bt.sym) + "</h3>" +
    DL.tag(R.type === "rsi" ? "RSI " + R.buy + "/" + R.sell : "SMA " + R.fast + "/" + R.slow) + "</div>" +
    win(res.inSample, "Periodo de ajuste", fmtRange(res.inSample)) +
    win(res.outSample, "Periodo de prueba (out-of-sample)", fmtRange(res.outSample)) +
    "</section>";

  h += '<section class="card"><div class="head"><h3>Lectura</h3></div>' +
    res.warnings.map(function (w) {
      return '<div class="warn ' + w.lvl + '"><div><b>' + DL.esc(w.t) + "</b>" + DL.esc(w.d) + "</div></div>";
    }).join("") +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' +
    "El periodo de prueba es el único que dice algo. Ajustar los números hasta que el primer periodo se vea " +
    "bien es exactamente lo que produce " + DL.term("overfitting") + ": una regla que explica el pasado " +
    "y falla con dinero real.</p></section>";

  out.innerHTML = h;
};
/* ============================================================
   Módulo 6/6 — arranque y navegación
   ============================================================ */

DL.route = "home";

DL.go = function (r) {
  DL.route = r;
  DL.render();
  window.scrollTo(0, 0);
};

DL.render = function () {
  var views = { home: "v-home", watch: "v-watch", trade: "v-trade", port: "v-port",
                diary: "v-diary", asset: "v-asset", backtest: "v-backtest" };

  /* la tercera pestaña es Operar en Scalping/Swing y Backtest Lab en modo backtest */
  var nt = document.getElementById("navTrade");
  if (nt) {
    var bt = DL.S.profile.mode === "backtest";
    nt.dataset.go = bt ? "backtest" : "trade";
    nt.querySelector("span:last-child").textContent = bt ? "Backtest" : "Operar";
    nt.onclick = function () { DL.go(nt.dataset.go); };
  }
  if (DL.route === "backtest" && DL.S.profile.mode !== "backtest") DL.route = "trade";
  if (DL.route === "trade" && DL.S.profile.mode === "backtest") DL.route = "backtest";
  Object.keys(views).forEach(function (k) {
    var n = document.getElementById(views[k]);
    if (n) n.classList.toggle("on", k === DL.route);
  });
  DL.$$("#nav button").forEach(function (b) {
    b.setAttribute("aria-current", b.dataset.go === DL.route ? "true" : "false");
  });

  var root = document.getElementById(views[DL.route]);
  if (!root) return;

  if (!DL.S.profile.setup) {
    document.getElementById("v-home").classList.add("on");
    DL.setupScreen(document.getElementById("v-home"));
    return;
  }

  var sub = document.getElementById("brandsub");
  if (sub) {
    sub.textContent = DL.S.profile.name
      ? DL.S.profile.name + " · simulado"
      : "Simulacro · capital simulado";
  }

  try {
    if (DL.route === "home") DL.VIEW_home(root);
    else if (DL.route === "watch") DL.VIEW_watch(root);
    else if (DL.route === "trade") DL.VIEW_trade(root);
    else if (DL.route === "port") DL.VIEW_port(root);
    else if (DL.route === "diary") DL.VIEW_diary(root);
    else if (DL.route === "asset") DL.VIEW_asset(root);
    else if (DL.route === "backtest") DL.VIEW_backtest(root);
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="note bad"><b>Algo falló al dibujar esta pantalla.</b> ' +
      DL.esc(e.message || e) + "</div>";
  }

  var rf = document.getElementById("btnRefresh");
  if (rf) rf.innerHTML = DL.data.loading ? '<span class="spin"></span>' : "⟳";
};

/* ---------- arranque ---------- */
(function boot() {
  DL.load();

  DL.$$("#nav button").forEach(function (b) {
    b.onclick = function () { DL.go(b.dataset.go); };
  });
  document.getElementById("btnSettings").onclick = function () {
    if (!DL.S.profile.setup) return;
    DL.settingsSheet();
  };
  document.getElementById("btnRefresh").onclick = function () {
    if (!DL.S.profile.setup || DL.data.loading) return;
    DL.sync(true, function () { DL.toast("Precios actualizados"); });
  };

  // redibuja los gráficos cuando cambia el ancho (rotar el teléfono)
  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { DL.render(); }, 220);
  });

  // al volver a la app, refresca si los datos ya envejecieron
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && DL.S.profile.setup &&
        Date.now() - DL.S.lastSync > 5 * 60 * 1000 && !DL.data.loading) {
      DL.sync(false);
    }
  });

  DL.render();
  if (DL.S.profile.setup) DL.sync(false);
})();

</script>
</body>
</html>
