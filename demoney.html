    body.innerHTML = '<p style="font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.45">' +
      DL.esc(T("Los que más se mueven dentro de " + name + " en este periodo, de una lista de referencia — no es una lista exhaustiva del sector.",
               "The biggest movers within " + name + " over this period, from a reference list — not the full sector.")) + "</p>";
    rows.forEach(function (r, i) {
      var row = DL.el('<button type="button" class="mv"></button>');
      row.innerHTML =
        '<span class="row" style="gap:9px"><span class="eyebrow">' + (i + 1) + '</span>' +
        '<span class="n" style="font-weight:600">' + DL.esc(r.sym) + "</span></span>" +
        '<span class="n ' + DL.tone(r.ret) + '">' + DL.pct(r.ret, 1) + "</span>";
      row.onclick = function () { s.close(); DL.openAsset(r.sym); };
      body.appendChild(row);
    });
  });
};
/* ============================================================
   Módulo 4/6 — gráficos en canvas
   ============================================================ */

DL.CH = (function () {
  function tok(n) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888";
  }
  function pal() {
    return {
      text: tok("--text"), muted: tok("--muted"), faint: tok("--faint"), plate: tok("--plate"),
      line: tok("--line"), soft: tok("--soft"), up: tok("--pos"), down: tok("--neg"),
      purple: tok("--purple"), purple2: tok("--purple2"), brass: tok("--brass"), amber: tok("--amber"),
      sky: tok("--sky")
    };
  }
  /* los mismos tres colores en todos los gráficos de la app */
  function smaColors(C) { return { 20: C.amber, 50: C.purple2, 200: C.sky }; }
  var SMA_SET = [20, 50, 200];

  function setup(cv, h) {
    var dpr = window.devicePixelRatio || 1;
    var w = (cv.parentNode && cv.parentNode.clientWidth) || cv.clientWidth || 300;
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    cv.style.height = h + "px";
    var x = cv.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    return { ctx: x, w: w, h: h };
  }
  function niceStep(range, ticks) {
    var raw = range / ticks;
    var mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    var norm = raw / mag;
    return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  }
  function fmtPx(v) { return v >= 1000 ? v.toFixed(0) : v >= 1 ? v.toFixed(2) : v.toPrecision(3); }

  /* Escala con medias: una media lejana (p. ej. la SMA 200 a 25% del precio)
     no puede aplastar las velas. Se amplía el eje para incluirla solo hasta
     cierto punto; si queda fuera, se marca en el borde con su valor. */
  function scaleWith(lo, hi, extra) {
    var span = hi - lo, mid = (hi + lo) / 2;
    var allow = Math.max(span * 0.9, Math.abs(mid) * 0.015);
    var capLo = lo - allow, capHi = hi + allow;
    extra.forEach(function (v) {
      if (v == null || !isFinite(v)) return;
      if (v >= capLo && v <= capHi) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    });
    return { lo: lo, hi: hi };
  }
  function lastOf(a) { for (var i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; }

  /* leyenda de medias con su valor actual, sobre una placa para que se lea encima de las velas */
  function smaLegend(c, C, x, y, items, font) {
    c.font = font || '10px "IBM Plex Mono", monospace';
    c.textAlign = "left"; c.textBaseline = "top";
    var parts = items.map(function (it) {
      return { txt: "SMA" + it.n + " " + (it.v == null ? "—" : fmtPx(it.v)), col: it.col };
    });
    var w = 0;
    parts.forEach(function (p) { w += c.measureText(p.txt).width + 10; });
    c.globalAlpha = 0.78; c.fillStyle = C.plate;
    c.fillRect(x - 3, y - 2, w + 2, 14);
    c.globalAlpha = 1;
    var lx = x;
    parts.forEach(function (p) {
      c.fillStyle = p.col;
      c.fillText(p.txt, lx, y);
      lx += c.measureText(p.txt).width + 10;
    });
  }
  /* marca de borde para una media fuera del rango visible */
  function edgeMark(c, x, y, txt, col, dir) {
    c.font = '9px "IBM Plex Mono", monospace';
    c.textAlign = "right"; c.textBaseline = dir < 0 ? "top" : "bottom";
    c.fillStyle = col;
    c.fillText(txt, x, y);
  }

  /* mini gráfico de la watchlist: últimas N velas + SMA 20 / 50 / 200 */
  function spark(cv, bars, h, count) {
    if (!bars || bars.length < 2) return;
    var s = setup(cv, h || 34), c = s.ctx, C = pal(), cols = smaColors(C);
    var N = Math.min(bars.length, count || 30);
    var pts = bars.slice(-N);
    var lo = Infinity, hi = -Infinity;
    pts.forEach(function (b) { lo = Math.min(lo, b.c); hi = Math.max(hi, b.c); });
    var smas = {}, extra = [];
    SMA_SET.forEach(function (n) {
      var arr = DL.IND.sma(bars, n).slice(-N);
      smas[n] = arr;
      arr.forEach(function (v) { if (v != null) extra.push(v); });
    });
    var sc = scaleWith(lo, hi, extra);
    lo = sc.lo; hi = sc.hi;
    var pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.01 || 0.5;
    lo -= pad; hi += pad;
    var X = function (i) { return (i / (pts.length - 1)) * (s.w - 2) + 1; };
    var Y = function (v) { return s.h - 3 - ((v - lo) / (hi - lo)) * (s.h - 6); };
    var rising = pts[pts.length - 1].c >= pts[0].c;
    var col = rising ? C.up : C.down;

    // medias (recortadas al área del gráfico)
    c.save();
    c.beginPath(); c.rect(0, 0, s.w, s.h); c.clip();
    SMA_SET.forEach(function (n) {
      var arr = smas[n], started = false;
      c.beginPath();
      arr.forEach(function (v, i) {
        if (v == null) return;
        started ? c.lineTo(X(i), Y(v)) : (c.moveTo(X(i), Y(v)), started = true);
      });
      if (started) { c.strokeStyle = cols[n]; c.lineWidth = 1; c.globalAlpha = 0.85; c.stroke(); c.globalAlpha = 1; }
    });
    c.restore();

    // relleno bajo la línea de precio
    c.beginPath();
    c.moveTo(X(0), Y(pts[0].c));
    pts.forEach(function (b, i) { c.lineTo(X(i), Y(b.c)); });
    c.lineTo(X(pts.length - 1), s.h); c.lineTo(X(0), s.h); c.closePath();
    c.globalAlpha = 0.12; c.fillStyle = col; c.fill(); c.globalAlpha = 1;

    c.beginPath();
    pts.forEach(function (b, i) { i ? c.lineTo(X(i), Y(b.c)) : c.moveTo(X(i), Y(b.c)); });
    c.strokeStyle = col; c.lineWidth = 1.5; c.lineJoin = "round"; c.stroke();

    // media fuera de rango: pequeño triángulo en el borde derecho
    SMA_SET.forEach(function (n) {
      var v = lastOf(smas[n]);
      if (v == null || (v >= lo && v <= hi)) return;
      var up = v > hi, y = up ? 1 : s.h - 1, x = s.w - 3;
      c.beginPath();
      c.moveTo(x - 3, up ? y + 4 : y - 4); c.lineTo(x + 3, up ? y + 4 : y - 4); c.lineTo(x, y);
      c.closePath(); c.fillStyle = cols[n]; c.fill();
    });

    // punto final enfatizado
    c.beginPath();
    c.arc(X(pts.length - 1), Y(pts[pts.length - 1].c), 2.2, 0, Math.PI * 2);
    c.fillStyle = col; c.fill();
  }

  /* gráfico principal: velas + SMA 20/50/200 + volumen + niveles de la operación
     opt.sma        → periodos calculados sobre opt.bars (velas diarias)
     opt.smaLevels  → {20:v,50:v,200:v} medias DIARIAS como líneas horizontales (gráficos intradía) */
  function candles(cv, opt) {
    var bars = opt.bars || [];
    if (bars.length < 2) return;
    var h = opt.height || 260;
    var s = setup(cv, h), c = s.ctx, C = pal(), cols = smaColors(C);
    c.font = '10px "IBM Plex Mono", monospace';

    var show = Math.min(bars.length, opt.count || 90);
    var vis = bars.slice(-show);
    var padL = 6, padR = 52, padB = 18, padT = 20;
    var volH = opt.volume === false ? 0 : 34;
    var W = s.w - padL - padR;
    var H = h - padT - padB - volH - (volH ? 6 : 0);

    var lo = Infinity, hi = -Infinity;
    vis.forEach(function (b) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); });
    var lv = opt.levels || null;
    if (lv) [lv.entry, lv.stop, lv.target].forEach(function (v) {
      if (v && isFinite(v) && v > 0) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    });

    var periods = opt.sma || (opt.smaLevels ? [] : SMA_SET);
    var smas = {}, extra = [];
    periods.forEach(function (n) {
      var arr = DL.IND.sma(bars, n).slice(-show);
      smas[n] = arr;
      arr.forEach(function (v) { if (v != null) extra.push(v); });
    });
    var levelsSma = opt.smaLevels || null;
    if (levelsSma) SMA_SET.forEach(function (n) { if (levelsSma[n] != null) extra.push(levelsSma[n]); });

    var sc = scaleWith(lo, hi, extra);
    lo = sc.lo; hi = sc.hi;
    var pad = (hi - lo) * 0.06 || 1;
    lo -= pad; hi += pad;

    var Y = function (v) { return padT + H - ((v - lo) / (hi - lo)) * H; };
    var slot = W / vis.length;
    var X = function (i) { return padL + i * slot + slot / 2; };

    // rejilla y eje derecho
    var step = niceStep(hi - lo, 4);
    c.strokeStyle = C.soft; c.lineWidth = 1;
    c.fillStyle = C.faint; c.textAlign = "left"; c.textBaseline = "middle";
    for (var g = Math.ceil(lo / step) * step; g <= hi; g += step) {
      var y = Math.round(Y(g)) + 0.5;
      c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
      c.fillText(fmtPx(g), padL + W + 6, y);
    }

    // zonas de riesgo y recompensa
    if (lv && lv.entry) {
      if (lv.stop) {
        c.fillStyle = C.down; c.globalAlpha = 0.10;
        c.fillRect(padL, Math.min(Y(lv.entry), Y(lv.stop)), W, Math.abs(Y(lv.entry) - Y(lv.stop)));
        c.globalAlpha = 1;
      }
      if (lv.target) {
        c.fillStyle = C.up; c.globalAlpha = 0.08;
        c.fillRect(padL, Math.min(Y(lv.entry), Y(lv.target)), W, Math.abs(Y(lv.entry) - Y(lv.target)));
        c.globalAlpha = 1;
      }
    }

    // medias móviles, recortadas al área de precio
    c.save();
    c.beginPath(); c.rect(padL, padT, W, H); c.clip();
    Object.keys(smas).forEach(function (n) {
      c.strokeStyle = cols[n] || C.muted; c.lineWidth = n === "200" ? 1.6 : 1.3;
      c.beginPath();
      var started = false;
      smas[n].forEach(function (v, i) {
        if (v == null) return;
        started ? c.lineTo(X(i), Y(v)) : (c.moveTo(X(i), Y(v)), started = true);
      });
      c.stroke();
    });
    if (levelsSma) {
      SMA_SET.forEach(function (n) {
        var v = levelsSma[n];
        if (v == null || !isFinite(v)) return;
        var yy = Math.round(Y(v)) + 0.5;
        c.strokeStyle = cols[n]; c.lineWidth = n === 200 ? 1.5 : 1.2; c.setLineDash([6, 4]);
        c.beginPath(); c.moveTo(padL, yy); c.lineTo(padL + W, yy); c.stroke();
        c.setLineDash([]);
      });
    }
    c.restore();

    // velas
    var bw = Math.max(1.2, Math.min(8, slot * 0.6));
    vis.forEach(function (b, i) {
      var up = b.c >= b.o, col = up ? C.up : C.down, x = X(i);
      c.strokeStyle = col; c.lineWidth = 1;
      c.beginPath();
      c.moveTo(Math.round(x) + 0.5, Y(b.h));
      c.lineTo(Math.round(x) + 0.5, Y(b.l));
      c.stroke();
      var y0 = Y(Math.max(b.o, b.c)), y1 = Y(Math.min(b.o, b.c));
      c.fillStyle = col;
      c.fillRect(x - bw / 2, y0, bw, Math.max(1, y1 - y0));
    });

    // soporte y resistencia (modo swing)
    if (opt.sr) {
      [[opt.sr.support, C.up, T("SOPORTE", "SUPPORT")], [opt.sr.resistance, C.down, T("RESISTENCIA", "RESISTANCE")]]
        .forEach(function (m) {
          if (!m[0] || !isFinite(m[0]) || m[0] <= 0 || m[0] < lo || m[0] > hi) return;
          var y = Math.round(Y(m[0])) + 0.5;
          c.strokeStyle = m[1]; c.lineWidth = 1; c.globalAlpha = 0.6;
          c.setLineDash([2, 4]);
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
          c.setLineDash([]); c.globalAlpha = 1;
          c.font = '10px "IBM Plex Mono", monospace';
          c.fillStyle = m[1]; c.textAlign = "right"; c.textBaseline = "bottom";
          c.fillText(m[2], padL + W - 2, y - 2);
        });
    }

    // niveles
    if (lv) {
      [[lv.entry, C.text, T("ENTRADA", "ENTRY")], [lv.stop, C.down, "STOP"], [lv.target, C.up, "TARGET"]]
        .forEach(function (m) {
          if (!m[0] || !isFinite(m[0]) || m[0] <= 0) return;
          var y = Math.round(Y(m[0])) + 0.5;
          c.strokeStyle = m[1]; c.lineWidth = 1; c.setLineDash([4, 3]);
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
          c.setLineDash([]);
          c.font = '10px "IBM Plex Mono", monospace';
          c.fillStyle = m[1]; c.textAlign = "left"; c.textBaseline = "bottom";
          c.fillText(m[2], padL + 3, y - 2);
        });
    }

    // medias fuera del rango visible: marca en el borde con su valor
    var legendItems = [], nAbove = 0, nBelow = 0;
    SMA_SET.forEach(function (n) {
      var v = smas[n] ? lastOf(smas[n]) : (levelsSma ? levelsSma[n] : null);
      if (!smas[n] && !levelsSma) return;
      legendItems.push({ n: n, v: v, col: cols[n] });
      if (v == null || (v >= lo && v <= hi)) return;
      var above = v > hi;
      var k = above ? nAbove++ : nBelow++;
      edgeMark(c, padL + W - 2, above ? padT + 1 + k * 11 : padT + H - 1 - k * 11,
        "SMA" + n + (above ? " ↑ " : " ↓ ") + fmtPx(v), cols[n], above ? -1 : 1);
    });

    // volumen
    if (volH) {
      var vy = padT + H + 6;
      var mv = Math.max.apply(null, vis.map(function (b) { return b.v; })) || 1;
      vis.forEach(function (b, i) {
        var bh = (b.v / mv) * (volH - 4);
        c.fillStyle = b.c >= b.o ? C.up : C.down;
        c.globalAlpha = 0.4;
        c.fillRect(X(i) - bw / 2, vy + volH - bh, bw, bh);
        c.globalAlpha = 1;
      });
    }

    // eje temporal
    c.font = '10px "IBM Plex Mono", monospace';
    c.fillStyle = C.faint; c.textBaseline = "top";
    var every = Math.max(1, Math.floor(vis.length / 5));
    vis.forEach(function (b, i) {
      if (i % every !== 0) return;
      var isFirst = i === 0, isLast = i > vis.length - every;
      c.textAlign = isFirst ? "left" : isLast ? "right" : "center";
      var x = isFirst ? padL : isLast ? padL + W : X(i);
      var lbl = opt.intraday
        ? new Date(b.t).toLocaleTimeString(DL.loc(), { hour: "2-digit", minute: "2-digit" })
        : new Date(b.t).toLocaleDateString(DL.loc(), { day: "numeric", month: "short" });
      c.fillText(lbl, x, h - padB + 4);
    });

    // leyenda de medias con su valor (en intradía son las medias diarias)
    if (legendItems.length) smaLegend(c, C, padL + 3, 3, legendItems);
  }

  /* panel RSI(14): línea 0–100 con referencias en 30 y 70 */
  function rsiPanel(cv, bars, opt) {
    opt = opt || {};
    var h = opt.height || 84;
    var s = setup(cv, h), c = s.ctx, C = pal();
    c.font = '9px "IBM Plex Mono", monospace';
    var show = Math.min(bars.length, opt.count || 90);
    var arr = DL.IND.rsi(bars, 14).slice(-show);
    var padL = 6, padR = 28, padT = 12, padB = 4;
    var W = s.w - padL - padR, H = h - padT - padB;
    var Y = function (v) { return padT + H - (v / 100) * H; };
    var X = function (i) { return padL + (i / Math.max(1, arr.length - 1)) * W; };

    [30, 70].forEach(function (v) {
      var y = Math.round(Y(v)) + 0.5;
      c.strokeStyle = C.line; c.lineWidth = 1; c.setLineDash([2, 3]);
      c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + W, y); c.stroke();
      c.setLineDash([]);
      c.fillStyle = C.faint; c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText(String(v), padL + W + 4, y);
    });

    c.beginPath();
    var started = false;
    arr.forEach(function (v, i) {
      if (v == null) return;
      started ? c.lineTo(X(i), Y(v)) : (c.moveTo(X(i), Y(v)), started = true);
    });
    c.strokeStyle = C.purple2; c.lineWidth = 1.4; c.stroke();

    c.fillStyle = C.faint; c.textAlign = "left"; c.textBaseline = "top";
    c.fillText("RSI(14)", padL + 2, 1);
  }

  /* panel MACD: histograma + línea + señal */
  function macdPanel(cv, bars, opt) {
    opt = opt || {};
    var h = opt.height || 84;
    var s = setup(cv, h), c = s.ctx, C = pal();
    c.font = '9px "IBM Plex Mono", monospace';
    var show = Math.min(bars.length, opt.count || 90);
    var m = DL.IND.macd(bars);
    var line = m.line.slice(-show), sig = m.signal.slice(-show), hist = m.hist.slice(-show);
    var padL = 6, padR = 28, padT = 12, padB = 4;
    var W = s.w - padL - padR, H = h - padT - padB;
    var vals = line.concat(sig).filter(function (v) { return v != null; });
    if (!vals.length) return;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo) * 0.18 || Math.abs(hi) * 0.1 || 0.1;
    lo -= pad; hi += pad;
    var Y = function (v) { return padT + H - ((v - lo) / (hi - lo)) * H; };
    var X = function (i) { return padL + (i / Math.max(1, line.length - 1)) * W; };
    var slot = W / line.length, bw = Math.max(1, Math.min(5, slot * 0.6));

    var y0 = Math.round(Y(0)) + 0.5;
    c.strokeStyle = C.line; c.lineWidth = 1;
    c.beginPath(); c.moveTo(padL, y0); c.lineTo(padL + W, y0); c.stroke();

    hist.forEach(function (v, i) {
      if (v == null) return;
      var y = Y(v);
      c.fillStyle = v >= 0 ? C.up : C.down; c.globalAlpha = 0.45;
      c.fillRect(X(i) - bw / 2, Math.min(y, y0), bw, Math.max(1, Math.abs(y - y0)));
      c.globalAlpha = 1;
    });

    function drawLine(arr, color) {
      c.beginPath();
      var started = false;
      arr.forEach(function (v, i) {
        if (v == null) return;
        started ? c.lineTo(X(i), Y(v)) : (c.moveTo(X(i), Y(v)), started = true);
      });
      c.strokeStyle = color; c.lineWidth = 1.3; c.stroke();
    }
    drawLine(line, C.purple2);
    drawLine(sig, C.brass);

    c.fillStyle = C.faint; c.textAlign = "left"; c.textBaseline = "top";
    c.fillText("MACD", padL + 2, 1);
  }

  /* curva de capital del portafolio */
  function equityCurve(cv, points, h) {
    if (!points || points.length < 2) return;
    var s = setup(cv, h || 90), c = s.ctx, C = pal();
    var lo = Math.min.apply(null, points), hi = Math.max.apply(null, points);
    var pad = (hi - lo) * 0.12 || 1;
    lo -= pad; hi += pad;
    var X = function (i) { return (i / (points.length - 1)) * (s.w - 2) + 1; };
    var Y = function (v) { return s.h - 4 - ((v - lo) / (hi - lo)) * (s.h - 8); };
    var col = points[points.length - 1] >= points[0] ? C.up : C.down;
    c.beginPath();
    c.moveTo(X(0), Y(points[0]));
    points.forEach(function (v, i) { c.lineTo(X(i), Y(v)); });
    c.lineTo(X(points.length - 1), s.h); c.lineTo(X(0), s.h); c.closePath();
    c.globalAlpha = 0.12; c.fillStyle = col; c.fill(); c.globalAlpha = 1;
    c.beginPath();
    points.forEach(function (v, i) { i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)); });
    c.strokeStyle = col; c.lineWidth = 1.6; c.stroke();
    c.beginPath(); c.arc(X(points.length - 1), Y(points[points.length - 1]), 2.5, 0, Math.PI * 2);
    c.fillStyle = col; c.fill();
  }

  return { spark: spark, candles: candles, equityCurve: equityCurve, rsiPanel: rsiPanel, macdPanel: macdPanel };
})();
/* ============================================================
   Módulo 5/6 — vistas: Hoy, Watchlist y ficha del activo
   ============================================================ */

DL.data = { bySym: {}, an: {}, bench: null, loading: false, error: null, intraBySym: {}, intraLoading: {} };
DL.BENCH = "SPY";

DL.symbolsInUse = function () {
  var set = {};
  DL.S.watch.forEach(function (w) { set[w.sym] = 1; });
  DL.S.pos.forEach(function (p) { if (p.status === "open") set[p.sym] = 1; });
  return Object.keys(set);
};

DL.recompute = function () {
  DL.data.an = {};
  Object.keys(DL.data.bySym).forEach(function (s) { DL.recomputeOne(s); });
};
DL.recomputeOne = function (s) {
  var a = DL.ENG.analyze(DL.data.bySym[s], DL.data.bench);
  if (a) DL.data.an[s] = a; else delete DL.data.an[s];
};

DL.prices = function () {
  var out = {};
  Object.keys(DL.data.bySym).forEach(function (s) {
    if (DL.data.bySym[s]) out[s] = DL.data.bySym[s].price;
  });
  return out;
};

/* primera pintura instantánea: lo que haya en caché, aunque tenga horas */
DL.hydrate = function () {
  var any = false;
  DL.symbolsInUse().concat([DL.BENCH]).forEach(function (s) {
    if (DL.data.bySym[s] && s !== DL.BENCH) return;
    var c = DL.MKT.peek(s);
    if (!c) return;
    any = true;
    if (s === DL.BENCH && !DL.data.bench) DL.data.bench = c;
    if (DL.symbolsInUse().indexOf(s) >= 0 && !DL.data.bySym[s]) DL.data.bySym[s] = c;
  });
  if (any) DL.recompute();
};

/* re-render agrupado por cuadro de animación. No interrumpe a quien escribe:
   si el foco está en un campo, se pinta al salir de él. */
DL._raf = 0;
DL._dirty = false;
DL._tradeTouched = false;
DL.isTyping = function () {
  var a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest("main"));
};
DL.renderSoon = function () {
  if (DL._raf) return;
  var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : function (f) { return setTimeout(f, 16); };
  DL._raf = raf(function () {
    DL._raf = 0;
    if (DL.isTyping() || (DL.route === "trade" && DL._tradeTouched)) { DL._dirty = true; return; }
    DL.render();
  });
};
document.addEventListener("focusout", function () {
  if (!DL._dirty) return;
  setTimeout(function () {
    if (!DL._dirty || DL.isTyping() || (DL.route === "trade" && DL._tradeTouched)) return;
    DL._dirty = false;
    DL.render();
  }, 0);
});

DL.sync = function (force, done) {
  var syms = DL.symbolsInUse();
  DL.data.loading = true; DL.data.error = null;
  DL.hydrate();
  DL.render();
  var jobs = [];
  jobs.push(DL.MKT.daily(DL.BENCH, force).then(function (d) {
    DL.data.bench = d; DL.recompute(); DL.renderSoon();
  }).catch(function () { if (!DL.data.bench) DL.data.bench = null; }));
  var got = 0;
  if (syms.length) {
    jobs.push(DL.MKT.refresh(syms, function (sym, d) {
      if (!d) return;
      got++;
      DL.data.bySym[sym] = d;
      DL.recomputeOne(sym);
      DL.renderSoon();
    }, force));
  }
  if (DL.modeId === "market") jobs.push(DL.loadMovers(force));
  if (DL.route === "radar") jobs.push(DL.loadRadar(force));
  Promise.all(jobs).then(function () {
    DL.data.loading = false;
    if (syms.length && !got && !Object.keys(DL.data.bySym).length) {
      DL.data.error = DL.MKT.lastFailure() || "sin_conexion";
    }
    DL.recompute();
    DL.S.lastSync = Date.now(); DL.save();
    DL.renderSoon();
    if (done) done();
  });
};

/* ---------- sesión y estado del mercado ---------- */
DL.isCrypto = function (d) {
  return !!d && (d.type === "CRYPTOCURRENCY" || /-USD$/.test(d.symbol || ""));
};
DL.fmtYmd = function (ymd, opts) {
  return new Date(ymd + "T12:00:00Z").toLocaleDateString(DL.loc(), Object.assign({ timeZone: "UTC" }, opts));
};
/* ¿a qué sesión corresponde el cambio que muestro? Nunca "hoy" si hoy no hubo mercado */
DL.sess = function (d) {
  if (DL.isCrypto(d)) return { live: true, today: true, short: "24 h", tiny: "24 h" };
  var c = DL.MKT.clock();
  var sDay = d && d.sessionT ? c.nyDate(d.sessionT) : null;
  var today = sDay === c.ymd;
  var live = today && c.open;
  var short = today ? (live ? T("hoy", "today") : T("hoy, al cierre", "today, at close"))
    : sDay ? DL.fmtYmd(sDay, { weekday: "short", day: "numeric", month: "short" }) : "—";
  var tiny = today ? (live ? T("hoy", "today") : T("cierre", "close"))
    : sDay ? DL.fmtYmd(sDay, { day: "numeric", month: "short" }) : "";
  return { live: live, today: today, short: short, tiny: tiny, ymd: sDay };
};
DL.chgLabel = function (d) {
  var s = DL.sess(d);
  return s.live ? T("Cambio hoy", "Change today") : T("Cambio · ", "Change · ") + s.short;
};
DL.marketStatus = function () {
  var c = DL.MKT.clock();
  var out = { open: c.open, state: c.state, title: "", sub: "" };
  if (c.open) {
    var closeAt = DL.MKT.openInstant(c.ymd) + (c.closeMin - 570) * 60000;
    out.title = T("Mercado abierto", "Market open");
    out.sub = T("Cierra a las ", "Closes at ") + DL.hm(closeAt) + T(" (tu hora)", " (your time)");
  } else {
    out.title = c.state === "pre" ? T("Pre-mercado", "Pre-market")
      : c.state === "post" ? T("Post-mercado", "After hours") : T("Mercado cerrado", "Market closed");
    if (c.nextOpen) {
      var at = DL.MKT.openInstant(c.nextOpen);
      var dayTxt = c.nextOpen === c.ymd ? T("hoy", "today")
        : new Date(at).toLocaleDateString(DL.loc(), { weekday: "long", day: "numeric", month: "short" });
      out.sub = T("Abre ", "Opens ") + dayTxt + " · " + DL.hm(at) + T(" tu hora (9:30 ET)", " your time (9:30 ET)");
    }
  }
  return out;
};
DL.marketPill = function () {
  var s = DL.marketStatus();
  return '<span class="mstat' + (s.open ? " on" : "") + '"><i></i>' + DL.esc(s.title) + "</span>";
};

/* ---------- etiquetas ---------- */
DL.trendTag = function (an) {
  if (!an) return DL.tag("—", "");
  return an.trend === "up" ? DL.tag(T("Alcista", "Uptrend"), "buy")
    : an.trend === "down" ? DL.tag(T("Bajista", "Downtrend"), "sell")
    : DL.tag(T("Mixta", "Mixed"), "wait");
};
DL.smaKey = function () {
  return '<span class="smakey"><i style="background:var(--amber)"></i>SMA 20<i style="background:var(--purple2)"></i>SMA 50' +
    '<i style="background:var(--sky)"></i>SMA 200</span>';
};
DL.smaBadges = function (an) {
  if (!an) return "";
  function b(n, v) {
    var ok = v != null && an.price > v;
    return '<span class="' + (v == null ? "mute" : ok ? "pos" : "neg") + '">SMA' + n + " " + (v == null ? "—" : ok ? "▲" : "▼") + "</span>";
  }
  return '<span class="n smab">' + b(20, an.sma20) + b(50, an.sma50) + b(200, an.sma200) + "</span>";
};

DL.marketCards = function () {
  var st = DL.marketStatus();
  var M = DL.MOVERS;
  var spy = M.data.SPY || DL.data.bench;

  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Mercado del día", "Today's market")) + "</h3>" +

    (sess && !sess.live ? DL.esc(T(". Los cambios son de la última sesión: ", ". Changes are from the last session: ") + sess.short + ".") : "") +
    "</p>" +

    }).join("") + "</div></section>";

  /* --- sectores en la última sesión --- */
  var secs = DL.SECTORS.map(function (s) {
    return { sym: s[0], name: DL.sectorName(s[0]), chg: DL.ENG.dayChange(M.data[s[0]]) };
  }).filter(function (r) { return r.chg != null; }).sort(function (a, b) { return b.chg - a.chg; });

  if (!secs.length) {

      : DL.empty(T("Sin datos de sectores", "No sector data"), T("Toca ⟳ arriba para reintentar.", "Tap ⟳ above to retry."));
  } else {
    var up = secs.filter(function (r) { return r.chg > 0; }).length;
    var maxAbs = Math.max.apply(null, secs.map(function (r) { return Math.abs(r.chg); }).concat([0.5]));
    html += '<p style="font-size:12px;color:var(--text2);margin-bottom:6px">' +
      DL.esc(T(up + " de " + secs.length + " sectores en verde", up + " of " + secs.length + " sectors up")) +
      " · " + DL.term("market breadth") + "</p>" +
      secs.map(function (r) {
        var w = Math.min(100, (Math.abs(r.chg) / maxAbs) * 100);
        return '<div class="sector-row wide" data-etf="' + DL.esc(r.sym) + '" role="button" tabindex="0">' +
          '<div><div class="et">' + DL.esc(r.sym) + '</div><div class="nm">' + DL.esc(r.name) + "</div></div>" +
          '<div class="rsbar"><i class="' + (r.chg >= 0 ? "pos" : "neg") + '" style="' +
          (r.chg >= 0 ? "left:50%;" : "right:50%;") + "width:" + (w / 2).toFixed(1) + '%"></i></div>' +
          '<div class="pc ' + DL.tone(r.chg) + '">' + DL.pct(r.chg) + "</div></div>";
      }).join("");
  }
  html += "</section>";

  /* --- mayores movimientos dentro de esos sectores --- */
  var mv = DL.moversList();
  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Mayores movimientos", "Biggest movers")) + "</h3>" +
    (M.loading ? '<span class="spin"></span>' : '<span class="eyebrow">' + DL.esc(T("en los 11 sectores", "across the 11 sectors")) + "</span>") + "</div>";
  if (!mv.total) {
    html += M.loading ? '<p class="mute" style="font-size:13px"><span class="spin"></span> ' + DL.esc(T("Buscando los que más se mueven…", "Finding the biggest movers…")) + "</p>"
      : DL.empty(T("Sin datos todavía", "No data yet"), T("Toca ⟳ arriba para reintentar.", "Tap ⟳ above to retry."));
  } else {
    var moverRow = function (r) {
      return '<button type="button" class="mv" data-sym="' + DL.esc(r.sym) + '">' +
        '<span><span class="n" style="font-weight:600;font-size:12.5px">' + DL.esc(r.sym) + "</span>" +
        '<span class="eyebrow" style="display:block;margin-top:1px">' + DL.esc(DL.sectorName(r.etf)) + "</span></span>" +
        '<span style="text-align:right"><span class="n ' + DL.tone(r.chg) + '" style="font-size:12.5px">' + DL.pct(r.chg) + "</span>" +
        '<span class="n" style="display:block;font-size:10.5px;color:var(--faint)">' + DL.px(r.price) + "</span></span></button>";
    };
    html += '<p style="font-size:12px;color:var(--text2);margin-bottom:10px">' +
      DL.esc(T(mv.up + " de " + mv.total + " acciones de referencia suben", mv.up + " of " + mv.total + " reference stocks are up")) +
      " · " + DL.term("top movers") + "</p>" +
      '<div class="movers"><div><div class="eyebrow" style="margin-bottom:6px;color:var(--pos)">' + DL.esc(T("Suben más", "Top gainers")) + "</div>" +
      (mv.gainers.length ? mv.gainers.map(moverRow).join("") : '<p class="mute" style="font-size:12px">—</p>') + "</div>" +
      '<div><div class="eyebrow" style="margin-bottom:6px;color:var(--neg)">' + DL.esc(T("Bajan más", "Top losers")) + "</div>" +
      (mv.losers.length ? mv.losers.map(moverRow).join("") : '<p class="mute" style="font-size:12px">—</p>') + "</div></div>";
  }
  html += "</section>";

  /* --- el índice de referencia con sus tres medias --- */
  var ba = DL.data.bench ? DL.ENG.analyze(DL.data.bench, DL.data.bench, "market") : null;
  if (ba) {
    html += '<section class="card"><div class="head"><h3>' + DL.esc(DL.BENCH) + " · " + DL.esc(T("tendencia", "trend")) + "</h3>" +
      DL.trendTag(ba) + "</div>" +
      '<div class="grid g3">' +
      DL.ro(T("Último", "Last"), DL.money(ba.price), "", "sm") +
      DL.ro(DL.chgLabel(DL.data.bench), DL.pct(ba.chgPct), DL.tone(ba.chgPct), "sm") +
      DL.ro(T("3 meses", "3 months"), DL.pct(ba.ret3m, 1), DL.tone(ba.ret3m), "sm") +
      "</div>" +
      '<div style="margin-top:8px">' + DL.smaBadges(ba) + "</div>" +
      '<div class="chartbox" style="margin-top:10px"><canvas id="benchChart"></canvas></div>' +
      "</section>";
  }
  return html;
};

DL.VIEW_home = function (root) {
  var P = DL.ENG.portfolio(DL.prices());
  var pr = DL.S.profile;
  var M = DL.mode();
  var market = M.id === "market";

  // el número del día: P/L de la última sesión sobre las posiciones abiertas
  var dayPL = 0, dayBase = 0, haveDay = false, live = false;
  P.open.forEach(function (p) {
    var d = DL.data.bySym[p.sym];
    if (!d || !d.prevClose) return;
    haveDay = true;
    if (DL.sess(d).live) live = true;
    dayPL += (d.price - d.prevClose) * p.qty;
    dayBase += d.prevClose * p.qty;
  });
  var dayPct = dayBase > 0 ? (dayPL / dayBase) * 100 : 0;
  var clock = DL.MKT.clock();

  var html = DL.modeCard(M);
  if (market) html += DL.marketCards();

  /* --- tarjeta de portafolio --- */
  html += '<section class="card">' +
    '<div class="head"><h3>' + DL.esc(market ? T("Tu portafolio", "Your portfolio") : T("Hoy", "Today")) + "</h3>" +
    '<span class="eyebrow">' + DL.esc(DL.S.lastSync ? T("actualizado ", "updated ") + DL.hm(DL.S.lastSync) : T("sin sincronizar", "not synced")) +
    (DL.data.loading ? ' <span class="spin"></span>' : "") + "</span></div>" +
    '<div class="row" style="justify-content:space-between;align-items:flex-end;gap:14px">' +
    '<div class="ro lg"><span class="k">' + DL.esc(live || clock.open
      ? T("Ganancia o pérdida del día", "Today's profit or loss")
      : T("Ganancia o pérdida · última sesión", "Profit or loss · last session")) + '</span><span class="v ' +
    (haveDay ? DL.tone(dayPL) : "") + '">' + (haveDay ? DL.sgn(dayPL) : "$0.00") + "</span></div>" +
    '<div class="ro" style="text-align:right"><span class="k">&nbsp;</span><span class="v ' +
    (haveDay ? DL.tone(dayPct) : "") + '">' + (haveDay ? DL.pct(dayPct) : "—") + "</span></div>" +
    "</div>" +
    '<hr><div class="grid g3">' +
    DL.ro("Equity", DL.money(P.equity), DL.tone(P.totalPL), "sm") +
    DL.ro(T("Efectivo", "Cash"), DL.money(P.cash, 0), "", "sm") +
    DL.ro(T("Retorno total", "Total return"), DL.pct(P.returnPct), DL.tone(P.returnPct), "sm") +
    "</div>";

  /* scalping: el hábito que se mide es cerrar, no abrir */
  if (M.id === "scalp") {
    html += '<hr><div class="grid g3">' +
      DL.ro(T("Trades cerrados hoy", "Trades closed today"), String(P.closedToday), P.closedToday > 0 ? "" : "warn", "sm") +
      DL.ro(T("Resultado del día", "Day result"), DL.sgn(P.plToday), DL.tone(P.plToday), "sm") +
      DL.ro(T("Abiertas ahora", "Open now"), String(P.open.length), "", "sm") +
      "</div>" +
      '<p style="margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.45">' +
      DL.esc(T("En scalping el número que importa no es cuánto abriste, es cuánto cerraste. Una posición que se queda abierta deja de ser scalping.",
               "In scalping the number that matters isn't how much you opened, it's how much you closed. A position left open stops being a scalp.")) + "</p>";
  }

  // efectivo vs invertido
  var invPct = P.equity > 0 ? (P.mktValue / P.equity) * 100 : 0;
  html += '<div style="margin-top:14px">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:5px">' +
    '<span class="eyebrow">' + DL.esc(T("Dinero usado vs disponible", "Money used vs available")) + "</span>" +
    '<span class="n" style="font-size:11px;color:var(--muted)">' + DL.money(P.mktValue, 0) + T(" de ", " of ") + DL.money(P.equity, 0) + "</span></div>" +
    '<div class="bar"><i class="' + (invPct > 80 ? "amber" : "") + '" style="width:' + Math.min(100, invPct).toFixed(1) + '%"></i></div>' +
    '<div class="row" style="justify-content:space-between;margin-top:5px">' +
    '<span class="n" style="font-size:10.5px;color:var(--faint)">' + DL.pctp(invPct, 1) + T(" invertido", " invested") + "</span>" +
    '<span class="n" style="font-size:10.5px;color:var(--faint)">' + T("P/L abierto ", "Open P/L ") + DL.pct(P.openPLPct) + "</span></div></div>";

  if (P.open.length) {
    html += '<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">' + DL.esc(T("Posiciones abiertas", "Open positions")) + "</div>" +
      '<div id="homeOpenList"></div></div>';
  }
  html += "</section>";

  /* --- qué hago hoy (con estrategia) o tu watchlist (sin estrategia) --- */
  var actions = [];
  P.open.forEach(function (p) {
    var an = DL.data.an[p.sym];
    var st = DL.ENG.positionState(p, an);
    actions.push({ sym: p.sym, state: st.s, why: st.why, pos: p });
  });
  DL.S.watch.forEach(function (w) {
    var an = DL.data.an[w.sym];
    var held = P.open.some(function (p) { return p.sym === w.sym; });
    if (held) return;
    if (!an) { if (market) actions.push({ sym: w.sym, state: "WATCH", why: "" }); return; }
    actions.push({
      sym: w.sym, state: an.state,
      why: market
        ? T("Precio vs medias: ", "Price vs averages: ") + [["20", an.sma20], ["50", an.sma50], ["200", an.sma200]].map(function (x) {
            return "SMA" + x[0] + (x[1] == null ? " —" : an.price > x[1] ? " ▲" : " ▼");
          }).join(" · ")
        : T(an.confirmed + " de " + an.total + " condiciones confirmadas · score " + an.score + "/100",
            an.confirmed + " of " + an.total + " conditions confirmed · score " + an.score + "/100")
    });
  });
  var order = { SELL: 0, BUY: 1, HOLD: 2, WAIT: 3, WATCH: 4, AVOID: 5 };
  actions.sort(function (a, b) { return (order[a.state] || 9) - (order[b.state] || 9); });

  html += '<section class="card"><div class="head"><h3>' +
    DL.esc(market ? T("Tu watchlist", "Your watchlist") : T("¿Qué hago hoy?", "What do I do today?")) + "</h3>" +
    '<span class="eyebrow">' + actions.length + T(" activos", " assets") + "</span></div>";
  if (!actions.length) {
    html += DL.empty(T("Todavía no sigues ningún activo", "You're not following any asset yet"),
      T("Agrega símbolos reales a tu watchlist y aquí verás cómo va cada uno.", "Add real symbols to your watchlist and you'll see each one here."));
  } else {
    html += '<div id="todayList"></div>';
  }
  html += "</section>";

  /* --- pulso del mercado (con estrategia; en modo mercado ya está arriba) --- */
  var ba = null;
  if (!market) {
    ba = DL.data.bench ? DL.ENG.analyze(DL.data.bench, DL.data.bench) : null;
    if (ba) {
      html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Mercado · ", "Market · ") + DL.BENCH) + "</h3>" +
        '<span class="row" style="gap:6px">' + DL.marketPill() + "</span></div>" +
        '<div class="grid g3">' +
        DL.ro(T("Último", "Last"), DL.money(ba.price), "", "sm") +
        DL.ro(DL.chgLabel(DL.data.bench), DL.pct(ba.chgPct), DL.tone(ba.chgPct), "sm") +
        DL.ro(T("3 meses", "3 months"), DL.pct(ba.ret3m, 1), DL.tone(ba.ret3m), "sm") +
        "</div>" +
        '<div style="margin-top:8px">' + DL.smaBadges(ba) + "</div>" +
        '<div class="chartbox" style="margin-top:10px"><canvas id="benchChart"></canvas></div>' +
        "</section>";
    }
  }

  /* --- capital y límite del día --- */
  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Capital y límite del día", "Capital and daily limit")) + "</h3>" +
    DL.tag(T("tope ", "cap ") + pr.maxDailyPct + "%", "watch") + "</div>" +
    '<div class="grid g3" style="margin-bottom:12px">' +
    DL.ro(T("Capital inicial", "Starting capital"), DL.money(pr.capital, 0), "", "sm") +
    DL.ro(T("Desplegado hoy", "Deployed today"), DL.money(P.deployedToday, 0), "", "sm") +
    DL.ro(T("Cupo restante", "Room left"), DL.money(P.roomToday, 0), "", "sm") +
    "</div>" +
    '<div class="bar"><i class="' + (P.deployedToday > P.dailyCeiling ? "neg" : "pos") + '" style="width:' +
    Math.min(100, P.dailyCeiling > 0 ? (P.deployedToday / P.dailyCeiling) * 100 : 0).toFixed(1) + '%"></i></div>' +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' +
    T("Puedes <b>desplegar</b> hasta " + DL.money(P.dailyCeiling, 0) + " hoy (" + pr.maxDailyPct + "% del equity). " +
      "Eso no es lo que <b>arriesgas</b>: con el stop puesto, tu pérdida máxima planeada es " +
      DL.money(P.openRisk) + " (" + DL.pctp(P.openRiskPct, 2) + " del equity).",
      "You can <b>deploy</b> up to " + DL.money(P.dailyCeiling, 0) + " today (" + pr.maxDailyPct + "% of equity). " +
      "That's not what you <b>risk</b>: with stops in place, your maximum planned loss is " +
      DL.money(P.openRisk) + " (" + DL.pctp(P.openRiskPct, 2) + " of equity).") + "</p>" +
    "</section>";

  /* --- glosario del modo: solo lo pertinente --- */
  var gl = DL.GLOSS[M.id] || [];
  if (gl.length) {
    html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Términos de este modo", "Terms for this mode")) + "</h3>" +
      DL.tag(T("EN → ES", "EN"), "watch") + "</div><div class=\"terms\">" +
      gl.map(function (p) {
        return "<div><b>" + DL.esc(p[0]) + "</b> — " + DL.esc(T(p[1], p[2])) + "</div>";
      }).join("") + "</div></section>";
  }

  html += '<div class="legal">' + DL.esc(DL.legalShort()) +
    ' <button type="button" id="legalLink">' + DL.esc(T("Leer el aviso legal completo", "Read the full legal notice")) + "</button></div>";

  root.innerHTML = html;

  DL.$$("#modeSel button", root).forEach(function (b) {
    b.onclick = function () { DL.setMode(b.dataset.mode); };
  });
  var lk = DL.$("#legalLink", root);
  if (lk) lk.onclick = DL.legalSheet;
  DL.$$(".idx, .mv", root).forEach(function (b) { b.onclick = function () { DL.openAsset(b.dataset.sym); }; });
  DL.$$(".sector-row[data-etf]", root).forEach(function (r) {
    var go = function () { DL.sectorLeadersSheet(r.dataset.etf); };
    r.onclick = go;
    r.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });

  // lista de acciones / watchlist (con manejadores)
  var list = DL.$("#todayList", root);
  if (list) {
    actions.forEach(function (a) {
      var an = DL.data.an[a.sym], d = DL.data.bySym[a.sym];
      var tag = a.pos ? DL.tag(a.state, a.state.toLowerCase())
        : market ? DL.trendTag(an) : DL.tag(a.state, a.state.toLowerCase());
      var row = DL.el('<button type="button" style="display:block;width:100%;text-align:left;background:var(--plate2);' +
        'border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:7px"></button>');
      row.innerHTML =
        '<div class="row" style="justify-content:space-between;margin-bottom:4px">' +
        '<span class="n" style="font-size:13.5px;font-weight:600">' + DL.esc(a.sym) + "</span>" + tag + "</div>" +
        (a.why ? '<div style="font-size:12px;color:var(--muted);line-height:1.45">' + DL.esc(a.why) + "</div>" : "") +
        (an ? '<div class="row" style="margin-top:6px;gap:12px">' +
          '<span class="n" style="font-size:12px">' + DL.money(an.price) + "</span>" +
          '<span class="n ' + DL.tone(an.chgPct) + '" style="font-size:12px">' + DL.pct(an.chgPct) + "</span>" +
          '<span class="eyebrow">' + DL.esc(DL.sess(d).short) + "</span></div>"
          : '<div class="row" style="margin-top:6px"><span class="spin"></span></div>');
      row.onclick = function () { DL.openAsset(a.sym); };
      list.appendChild(row);
    });
  }

  var openList = DL.$("#homeOpenList", root);
  if (openList) {
    P.open.forEach(function (p) {
      var row = DL.el('<button type="button" style="display:flex;justify-content:space-between;align-items:center;' +
        'width:100%;text-align:left;background:var(--plate2);border:1px solid var(--line);border-radius:8px;' +
        'padding:9px 11px;margin-bottom:6px"></button>');
      row.innerHTML =
        '<span class="row" style="gap:8px"><span class="n" style="font-weight:600;font-size:12.5px">' + DL.esc(p.sym) + "</span>" +
        '<span class="eyebrow">' + DL.qty(p.qty) + " · reg " + DL.money(p.entry) + "</span></span>" +
        '<span class="row" style="gap:8px"><span class="n ' + DL.tone(p._pl) + '" style="font-size:12.5px">' + DL.sgn(p._pl) + "</span>" +
        '<span class="eyebrow">' + DL.esc(T("explorar →", "open →")) + "</span></span>";
      row.onclick = function () { DL.openAsset(p.sym); };
      openList.appendChild(row);
    });
  }

  var cv = DL.$("#benchChart", root);
  if (cv && DL.data.bench) DL.CH.candles(cv, { bars: DL.data.bench.bars, sma: [20, 50, 200], count: 120, height: 170, volume: false });
};

/* ============================================================
   WATCHLIST
   ============================================================ */
DL.VIEW_watch = function (root) {
  var P = DL.ENG.portfolio(DL.prices());
  var M = DL.mode();
  if (DL.current.list == null) DL.current.list = "all";
  // si la lista activa ya no existe (se borró en otro dispositivo), vuelve a "Todas"
  if (DL.current.list !== "all" && !DL.S.lists.some(function (l) { return l.id === DL.current.list; })) DL.current.list = "all";
  var html = '<section class="card"><div class="head"><h3>' + DL.esc(T("Lista de seguimiento", "Watchlist")) + "</h3>" +
    '<span class="eyebrow">' + DL.S.watch.length + T(" activos", " assets") + "</span></div>" +
    '<div class="row" style="gap:7px"><input type="text" id="symIn" placeholder="AAPL, GOOG, SPY, BTC-USD…" ' +
    'autocapitalize="characters" autocomplete="off" style="flex:1;min-width:140px">' +
    '<button class="btn p" id="addSym">' + DL.esc(T("Agregar", "Add")) + "</button></div>" +
    '<div id="searchOut" style="margin-top:10px"></div></section>';

  html += '<div class="row" style="margin-top:10px;gap:7px;align-items:center;flex-wrap:nowrap">' +
    '<div class="pills" id="listPills" style="flex:1;min-width:0">' +
    '<button type="button" class="pill' + (DL.current.list === "all" ? " on" : "") + '" data-list="all">' +
    DL.esc(T("Todas", "All")) + " (" + DL.S.watch.length + ")</button>" +
    DL.S.lists.map(function (l) {
      var n = DL.S.watch.filter(function (w) { return w.list === l.id; }).length;
      return '<button type="button" class="pill' + (DL.current.list === l.id ? " on" : "") + '" data-list="' +
        DL.esc(l.id) + '">' + DL.esc(l.name) + " (" + n + ")</button>";
    }).join("") + "</div>" +
    '<button class="btn sm g" id="manageLists" title="' + DL.esc(T("Gestionar listas", "Manage lists")) +
    '" aria-label="' + DL.esc(T("Gestionar listas", "Manage lists")) + '">⚙</button></div>';

  if (DL.data.error && !Object.keys(DL.data.bySym).length) {
    html += '<div class="note bad" style="margin-top:10px"><b>' + DL.esc(T("No se pudo conectar al mercado.", "Couldn't reach the market.")) + "</b> " +
      DL.esc(T("Prueba de nuevo, o abre Ajustes y configura un proxy CORS. Detalle: ", "Try again, or open Settings and set a CORS proxy. Detail: ")) +
      DL.esc(DL.data.error) + "</div>";
  }

  if (M.id === "scalp") {
    html += '<section class="card" style="margin-top:10px"><div class="head" style="margin-bottom:8px">' +
      "<h3>" + DL.esc(T("Filtro de scalping", "Scalping filter")) + "</h3>" + DL.tag(T("intradía", "intraday"), "watch") + "</div>" +
      '<p style="font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:10px">' +
      T("Resalta solo los activos con ", "Highlights only assets with ") + DL.term("liquidity") +
      T(" sobre ", " above ") + (DL.S.profile.minVolume / 1e6).toFixed(0) +
      T("M y variación de la sesión entre ", "M and a session move between ") +
      DL.S.profile.intradayMin + "% " + T("y", "and") + " " + DL.S.profile.intradayMax + "%.</p>" +
      '<label class="chk"><input type="checkbox" id="scalpOnly"' +
      (DL.current.scalpOnly ? " checked" : "") + "> " + DL.esc(T("Mostrar solo candidatos", "Show candidates only")) + "</label></section>";
  }

  html += '<div class="row" style="justify-content:space-between;margin:12px 2px 6px">' + DL.smaKey() +
    '<span class="eyebrow">' + DL.esc(T("30 sesiones", "30 sessions")) + "</span></div>";
  html += '<div id="wlist"></div>';
  root.innerHTML = html;

  var so = DL.$("#scalpOnly", root);
  if (so) so.onchange = function () { DL.current.scalpOnly = so.checked; DL.render(); };

  var listEl = DL.$("#wlist", root);
  var inList = DL.S.watch.filter(function (w) { return DL.current.list === "all" || w.list === DL.current.list; });
  if (!DL.S.watch.length) {
    listEl.innerHTML = DL.empty(T("Tu watchlist está vacía", "Your watchlist is empty"),
      T("Escribe un símbolo real arriba. El precio, el gráfico y las condiciones se cargan solos.",
        "Type a real symbol above. Price, chart and conditions load on their own."));
  } else if (!inList.length) {
    listEl.innerHTML = DL.empty(T("Esta lista está vacía", "This list is empty"),
      T("Agrega un símbolo arriba (cae en esta lista) o cambia de pestaña.",
        "Add a symbol above (it goes into this list) or switch tabs."));
  } else {
    var shown = 0;
    inList.forEach(function (w) {
      var an = DL.data.an[w.sym];
      var d = DL.data.bySym[w.sym];
      var held = P.open.filter(function (p) { return p.sym === w.sym; })[0];
      var tag;
      if (held) { var ps = DL.ENG.positionState(held, an).s; tag = DL.tag(ps, ps.toLowerCase()); }
      else if (M.id === "market") tag = DL.trendTag(an);
      else tag = an ? DL.tag(an.state, an.state.toLowerCase()) : DL.tag("WATCH", "watch");

      // candidato de scalping: liquidez y variación dentro del rango buscado
      var pr = DL.S.profile, eligible = true;
      if (M.id === "scalp") {
        var abs = an ? Math.abs(an.chgPct) : 0;
        eligible = !!an && an.vol >= pr.minVolume && abs >= pr.intradayMin && abs <= pr.intradayMax;
        if (DL.current.scalpOnly && !eligible) return;
      }
      shown++;

      var row = DL.el('<div class="wrow" role="button" tabindex="0"></div>');
      if (M.id === "scalp") {
        row.style.opacity = eligible ? "1" : "0.45";
        if (eligible) row.style.borderColor = "var(--pos)";
      }
      var px = an ? an.price : (d ? d.price : null);
      var pc = an ? an.prevClose : (d ? d.prevClose : null);
      var chgAmt = (px != null && pc) ? px - pc : null;
      var chgPct = an ? an.chgPct : (chgAmt != null ? (chgAmt / pc) * 100 : null);
      row.innerHTML =
        '<div class="wtop"><div class="idblk"><span class="sy">' + DL.esc(w.sym) + '</span><span class="nm">' +
        DL.esc((d && d.name) || w.name || "—") + "</span></div>" + '<div class="st">' + tag + "</div></div>" +
        '<div class="chart"><canvas></canvas></div>' +
        '<div class="bottom"><span class="px">' + (px != null ? DL.money(px) : '<span class="spin"></span>') + "</span>" +
        (chgAmt != null ? '<span class="chg ' + DL.tone(chgPct) + '">' + DL.sgn(chgAmt) + "</span>" +
          '<span class="pct ' + DL.tone(chgPct) + '">' + DL.pct(chgPct) + "<small>" + DL.esc(d ? DL.sess(d).tiny : "") + "</small></span>" : "") +
        "</div>";
      row.onclick = function () { DL.openAsset(w.sym); };
      row.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); DL.openAsset(w.sym); } };
      listEl.appendChild(row);
      if (d && d.bars) DL.CH.spark(row.querySelector("canvas"), d.bars, 58, 30);
    });
    if (!shown) {
      listEl.innerHTML = DL.empty(T("Ningún activo pasa el filtro de scalping hoy", "No asset passes the scalping filter today"),
        T("Eso también es información: hoy no hay setup. Desactiva el filtro para ver toda la lista.",
          "That's information too: no setup today. Turn the filter off to see the whole list."));
    }
  }

  DL.$$("#listPills button", root).forEach(function (b) {
    b.onclick = function () { DL.current.list = b.dataset.list; DL.render(); };
  });
  var ml = DL.$("#manageLists", root);
  if (ml) ml.onclick = DL.listsSheet;

  var input = DL.$("#symIn", root);
  var out = DL.$("#searchOut", root);
  function addNow() {
    var q = (input.value || "").trim().toUpperCase();
    if (!q) return;
    input.blur();
    DL.addSymbol(q);
  }
  DL.$("#addSym", root).onclick = addNow;
  input.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); addNow(); } };

  var searchT = null;
  input.oninput = function () {
    clearTimeout(searchT);
    var q = input.value.trim();
    if (q.length < 2) { out.innerHTML = ""; return; }
    searchT = setTimeout(function () {
      out.innerHTML = '<span class="spin"></span> <span class="eyebrow">' + DL.esc(T("buscando…", "searching…")) + "</span>";
      DL.MKT.search(q).then(function (rows) {
        if (!rows.length) { out.innerHTML = '<div class="eyebrow">' + DL.esc(T("Sin resultados", "No results")) + "</div>"; return; }
        out.innerHTML = "";
        rows.slice(0, 6).forEach(function (r) {
          var b = DL.el('<button type="button" class="btn sm" style="display:block;width:100%;text-align:left;margin-bottom:5px"></button>');
          b.innerHTML = '<span class="n" style="font-weight:600">' + DL.esc(r.symbol) + "</span> " +
            '<span style="color:var(--muted);font-size:12px">' + DL.esc(r.name) + "</span> " +
            '<span class="eyebrow">' + DL.esc(r.exchange) + "</span>";
          b.onclick = function () { input.value = r.symbol; out.innerHTML = ""; input.blur(); DL.addSymbol(r.symbol, r.name); };
          out.appendChild(b);
        });
      }).catch(function () {
        out.innerHTML = '<div class="eyebrow">' + DL.esc(T("Búsqueda no disponible — escribe el símbolo exacto", "Search unavailable — type the exact symbol")) + "</div>";
      });
    }, 420);
  };
};

DL.addSymbol = function (sym, name) {
  sym = String(sym).trim().toUpperCase();
  if (!sym) return;
  if (DL.S.watch.some(function (w) { return w.sym === sym; })) {
    DL.toast(T(sym + " ya está en tu watchlist", sym + " is already in your watchlist")); return;
  }
  DL.toast(T("Cargando ", "Loading ") + sym + "…");
  DL.MKT.daily(sym, true).then(function (d) {
    var s2 = d.symbol || sym;
    DL.data.bySym[s2] = d;
    var cur = DL.current && DL.current.list;
    var target = (cur && cur !== "all" && DL.S.lists.some(function (l) { return l.id === cur; })) ? cur
      : (DL.S.lists[0] ? DL.S.lists[0].id : "default");
    DL.S.watch.push({
      sym: s2, name: name || d.name || sym, note: "",
      addedAt: Date.now(), goalBuy: null, goalSell: null, list: target
    });
    DL.addDiary(s2, "watch", T("Agregado a la watchlist", "Added to the watchlist"), d.price);
    DL.save(); DL.recomputeOne(s2); DL.render();
    DL.toast(T(sym + " agregado", sym + " added"));
  }).catch(function (e) {
    DL.toast(T("No se encontró ", "Couldn't find ") + sym + " (" + (e.message || "error") + ")");
  });
};
/* ============================================================
   Módulo 5b/6 — ficha del activo, trade builder, portafolio, diario
   ============================================================ */

DL.current = { sym: null, range: "3M", from: null };

DL.openAsset = function (sym) {
  if (DL.route !== "asset") DL.current.from = DL.route;
  DL.current.sym = sym;
  if (!DL.data.bySym[sym]) {
    var c = DL.MKT.peek(sym);                        // pinta ya con la caché si existe
    if (c) { DL.data.bySym[sym] = c; DL.recomputeOne(sym); }
  }
  DL.go("asset");
  var cached = DL.data.bySym[sym];
  if (!cached || cached.closesOnly || cached.cachedAt) {
    DL.MKT.daily(sym).then(function (d) {
      DL.data.bySym[d.symbol || sym] = d; DL.recomputeOne(d.symbol || sym); DL.renderSoon();
    }).catch(function () { DL.renderSoon(); });
  }
};

DL.addDiary = function (sym, kind, text, px) {
  DL.S.diary.unshift({ id: DL.uid("j"), sym: sym, kind: kind, text: text, pxAt: px || null, t: Date.now() });
  if (DL.S.diary.length > 400) DL.S.diary.length = 400;   // el historial no se sobrescribe, solo se acota
  DL.save();
};

/* ---------- rangos del gráfico de la ficha: 1D y 1W usan velas intradía ---------- */
DL.ASSET_RANGES = [
  { key: "1D", label: "1D", intraday: true },
  { key: "1W", label: "1W", intraday: true },
  { key: "1M", label: "1M", days: 30 },
  { key: "3M", label: "3M", days: 90 },
  { key: "6M", label: "6M", days: 180 },
  { key: "1A", label: function () { return T("1A", "1Y"); }, days: 250 }
];
DL.rangeLabel = function (r) { return typeof r.label === "function" ? r.label() : r.label; };

DL.lastSessionBars = function (bars) {
  if (!bars || !bars.length) return [];
  var lastDate = new Date(bars[bars.length - 1].t).toDateString();
  var out = [];
  for (var i = bars.length - 1; i >= 0; i--) {
    if (new Date(bars[i].t).toDateString() === lastDate) out.unshift(bars[i]); else break;
  }
  return out.length ? out : bars.slice(-13);
};

/* cambio % correspondiente al rango elegido — nunca ambiguo sobre a qué periodo se refiere */
DL.rangeChange = function (d, an, rdef) {
  if (!d) return null;
  if (rdef.key === "1D") return an ? an.chgPct : DL.ENG.dayChange(d);
  if (rdef.key === "1W") return DL.ENG.periodReturn(d.bars, 5);
  return DL.ENG.periodReturn(d.bars, rdef.days);
};

/* ---------- búsqueda profunda: prompt fijo de analista senior, 14 secciones ---------- */
DL.deepSearchPrompt = function (sym, d, an) {
  var L = [], en = DL.lang() === "en";
  var S = en ? [
    "Act as a senior financial analyst. Analyze " + sym + (d && d.name ? " (" + d.name + ")" : "") +
      " with the most recent information available and deliver a report in English with exactly these 14 numbered sections:",
    "1. Overview table with a traffic light (green/yellow/red) for the overall state",
    "2. Most relevant recent fundamental change",
    "3. Current market narrative about the company",
    "4. Key data point from the most recent quarter",
    "5. Fundamentals rated out of 10, with a brief justification",
    "6. Main danger or risk to watch",
    "7. Capital structure (debt, cash, dilution)",
    "8. Technical reading of the current chart, including SMA 20 / 50 / 200",
    "9. Key support and resistance levels",
    "10. Bear / base / bull / super bull scenarios with approximate price targets",
    "11. Investment matrix (potential return vs. risk)",
    "12. Staged entry strategy",
    "13. Final traffic light for the thesis",
    "14. Close with one actionable summary sentence",
    "", "Reference data from my app (may be out of date — verify with current sources):"
  ] : [
    "Actúa como analista financiero senior. Analiza " + sym + (d && d.name ? " (" + d.name + ")" : "") +
      " con la información más reciente disponible y entrega un informe en español con exactamente estas 14 secciones, numeradas:",
    "1. Cuadro integral con semáforo (verde/amarillo/rojo) del estado general",
    "2. Cambio fundamental más relevante reciente",
    "3. Narrativa actual del mercado sobre la empresa",
    "4. Dato clave del trimestre más reciente",
    "5. Fundamentales calificados sobre 10, con justificación breve",
    "6. Principal peligro o riesgo a vigilar",
    "7. Estructura de capital (deuda, caja, dilución)",
    "8. Lectura técnica del gráfico actual, incluidas las SMA 20 / 50 / 200",
    "9. Niveles clave de soporte y resistencia",
    "10. Escenarios bear / base / bull / super bull con precios objetivo aproximados",
    "11. Matriz de inversión (retorno potencial vs. riesgo)",
    "12. Estrategia de entrada por tramos",
    "13. Semáforo final de la tesis",
    "14. Cierre con una frase resumen accionable",
    "", "Datos de referencia desde mi app (pueden estar desactualizados — verifica con fuentes actuales):"
  ];
  S.forEach(function (x) { L.push(x); });
  if (d) {
    L.push(T("Precio: ", "Price: ") + DL.money(d.price));
    L.push(DL.chgLabel(d) + ": " + (an ? DL.pct(an.chgPct) : "—"));
  }
  if (an) {
    L.push("RSI(14): " + (an.rsi == null ? "—" : an.rsi.toFixed(1)));
    L.push("SMA20: " + (an.sma20 == null ? "—" : an.sma20.toFixed(2)) +
      " · SMA50: " + (an.sma50 == null ? "—" : an.sma50.toFixed(2)) +
      " · SMA200: " + (an.sma200 == null ? "—" : an.sma200.toFixed(2)));
    L.push(T("Rango 52 semanas: ", "52-week range: ") + DL.money(an.lo52) + " – " + DL.money(an.hi52));
  }
  return L.join("\n");
};

DL.deepSearchSheet = function (sym) {
  var d = DL.data.bySym[sym], an = DL.data.an[sym];
  if (!d) { DL.toast(T("Todavía cargando datos de ", "Still loading data for ") + sym); return; }
  var prompt = DL.deepSearchPrompt(sym, d, an);
  var body = DL.el('<div><p style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px">' +
    DL.esc(T("Copia este prompt y pégalo en ChatGPT o Claude para un análisis profundo de 14 secciones. La app no lo envía por ti.",
             "Copy this prompt and paste it into ChatGPT or Claude for a 14-section deep analysis. The app doesn't send it for you.")) + "</p>" +
    '<textarea id="dspx" readonly style="min-height:220px;font-size:11.5px;line-height:1.5"></textarea></div>');
  body.querySelector("#dspx").value = prompt;
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var cp = DL.el('<button class="btn p"></button>');
  cp.textContent = T("Copiar prompt", "Copy prompt");
  cp.onclick = function () {
    var ta = body.querySelector("#dspx");
    ta.focus(); ta.select();
    function done() { DL.toast(T("Prompt copiado", "Prompt copied")); }
    function fallback() {
      try { document.execCommand("copy"); done(); }
      catch (e) { DL.toast(T("No se pudo copiar — selecciona y copia manualmente", "Couldn't copy — select and copy it manually")); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(done).catch(fallback);
    } else { fallback(); }
  };
  foot.appendChild(cp);
  DL.sheet(T("Búsqueda profunda · ", "Deep research · ") + sym, body, foot);
};

DL.VIEW_asset = function (root) {
  var sym = DL.current.sym;

    DL.esc(T("← Volver", "← Back")) + "</button></div>";

    root.innerHTML = DL.empty(T("Ningún activo seleccionado", "No asset selected"), T("Elige uno desde la watchlist.", "Pick one from the watchlist."));
    return;
  }
  var d = DL.data.bySym[sym], an = DL.data.an[sym];
  var P = DL.ENG.portfolio(DL.prices());
  var pos = P.open.filter(function (p) { return p.sym === sym; })[0];
  var inWatch = DL.S.watch.some(function (w) { return w.sym === sym; });

  }

  var state = pos ? DL.ENG.positionState(pos, an) : null;

  /* rango elegido: 1D y 1W usan velas intradía (30m), el resto velas diarias */
  var rdef = DL.ASSET_RANGES.filter(function (r) { return r.key === DL.current.range; })[0] || DL.ASSET_RANGES[3];

  var chartBars = null, chartCount = 90;
  if (isIntra) {
    var intra = DL.data.intraBySym[sym];
    if (intra) {
      chartBars = rdef.key === "1D" ? DL.lastSessionBars(intra.bars) : intra.bars;
      chartCount = chartBars.length;
    } else if (!DL.data.intraLoading[sym]) {

      }).catch(function () { DL.data.intraLoading[sym] = false; DL.renderSoon(); });

  } else if (!d.closesOnly) {
    chartBars = d.bars; chartCount = rdef.days;
  }
  var rngChg = DL.rangeChange(d, an, rdef);
  var sess = DL.sess(d);

  var html = backBtn;

  /* cabecera */
  html += '<section class="card">' +
    '<div class="head" style="margin-bottom:8px"><div>' +
    '<h3 style="font-size:20px;font-family:var(--m);letter-spacing:-.01em">' + DL.esc(sym) + "</h3>" +
    '<div class="eyebrow" style="margin-top:2px">' + DL.esc(d.name || "") + (d.exchange ? " · " + DL.esc(d.exchange) : "") + "</div></div>" +
    (state ? DL.tag(state.s, state.s.toLowerCase()) : (an ? (M.id === "market" ? DL.trendTag(an) : DL.tag(an.state, an.state.toLowerCase())) : "")) +
    "</div>" +
    '<div class="row" style="align-items:baseline;gap:8px">' +
    '<span class="n" style="font-size:30px;letter-spacing:-.03em">' + DL.money(d.price) + "</span>" +
    '<span class="n ' + DL.tone(rngChg) + '" style="font-size:15px">' + (rngChg == null ? "—" : DL.pct(rngChg)) + "</span>" +
    '<span class="eyebrow">' + DL.esc(rdef.key === "1D" ? sess.short : DL.rangeLabel(rdef)) + "</span>" +
    (d.stale || d.cachedAt ? '<span class="eyebrow">' + DL.esc(T("dato en caché", "cached data")) + "</span>" : "") +
    "</div>";

  html += '<div class="row" style="margin-top:12px;gap:6px;justify-content:space-between"><div class="seg" id="rangeSeg">' +
    DL.ASSET_RANGES.map(function (r) {
      return '<button type="button" data-r="' + r.key + '" aria-pressed="' + (DL.current.range === r.key) + '">' + DL.esc(DL.rangeLabel(r)) + "</button>";

  } else if (!chartBars) {
    html += '<p class="mute" style="font-size:11.5px;margin-top:6px"><span class="spin"></span> ' + DL.esc(T("Cargando velas…", "Loading candles…")) + "</p>";
  }
  html += "</section>";

  /* medias móviles: siempre las tres, con la distancia del precio a cada una */
  if (an) {
    var smaRo = function (n, v) {
      var dist = v ? ((an.price / v) - 1) * 100 : null;

               "The % is the price's distance to each average. Uptrend = price above SMA 50 and SMA 50 above SMA 200; downtrend = the reverse; mixed = anything else.")) +
      "</p></section>";
  }

  /* búsqueda profunda */
  html += '<section class="card"><div class="row" style="justify-content:space-between;align-items:center">' +
    '<div><h3 style="margin:0">' + DL.esc(T("Búsqueda profunda", "Deep research")) + "</h3>" +

      html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Plan sugerido · ", "Suggested plan · ") + M.label()) + "</h3>" +
        DL.tag(M.sub(), "watch") + "</div>";
      if (plan.buyZone) {
        html += '<div class="zone buy"><span class="lab">' + DL.esc(T("Zona de compra", "Buy zone")) + "</span>" +
          '<span class="val">' + DL.money(plan.buyZone[0]) + " – " + DL.money(plan.buyZone[1]) + "</span></div>" +
          '<div class="zone"><span class="lab">Stop</span><span class="val neg">' + DL.money(plan.stop) + "</span></div>" +
          '<div class="zone sell"><span class="lab">' + DL.esc(T("Zona de venta", "Sell zone")) + "</span>" +
          '<span class="val">' + DL.money(plan.sellZone[0]) + " – " + DL.money(plan.sellZone[1]) + "</span></div>";
      } else {
        html += '<div class="grid g3" style="margin-bottom:10px">' +
          DL.ro(T("Entrada", "Entry"), DL.money(plan.entry), "", "sm") +
          DL.ro("Stop", DL.money(plan.stop), "neg", "sm") +
          DL.ro("Target", DL.money(plan.target), "pos", "sm") +
          "</div>";
      }
      html += '<p style="margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5">' +
        DL.esc(plan.note) + "</p>" +
        '<p style="margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5">' +
        (M.id === "scalp"
          ? T("Un " + DL.term("tight stop") + " te saca rápido cuando te equivocas, pero también te saca del ruido normal. En intradía la " + DL.term("execution speed") + " es parte del plan.",
              "A " + DL.term("tight stop") + " gets you out fast when you're wrong, but normal noise also takes you out. Intraday, " + DL.term("execution speed") + " is part of the plan.")
          : T("Una ruptura sin " + DL.term("volume confirmation") + " suele ser falsa. Si el precio está cerca del soporte, es rebote; si supera la resistencia, es " + DL.term("breakout") + ".",
              "A breakout without " + DL.term("volume confirmation") + " is often false. Near support it's a bounce; above resistance it's a " + DL.term("breakout") + ".")) +
        "</p></section>";
    }
  }

  /* posición abierta */
  if (pos) {
    var plPct = pos._cost > 0 ? (pos._pl / pos._cost) * 100 : 0;
    html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Tu posición", "Your position")) + "</h3>" + DL.tag(state.s, state.s.toLowerCase()) + "</div>" +
      '<div class="note" style="margin-bottom:12px">' + DL.esc(state.why) + "</div>" +
      '<div class="grid g3" style="margin-bottom:12px">' +
      DL.ro(T("Cantidad", "Quantity"), DL.qty(pos.qty), "", "sm") +
      DL.ro(T("Precio de registro", "Entry price"), DL.money(pos.entry), "", "sm") +
      DL.ro("P/L", DL.sgn(pos._pl) + " (" + DL.pct(plPct) + ")", DL.tone(pos._pl), "sm") +
      "</div>" +
      '<div class="grid g3">' +
      DL.ro("Stop", DL.money(pos.stop), "neg", "sm") +
      DL.ro("Target", pos.target ? DL.money(pos.target) : "—", "pos", "sm") +
      DL.ro(T("Invertido", "Invested"), DL.money(pos._cost, 0), "", "sm") +
      "</div>" +
      '<div class="row" style="margin-top:14px">' +
      '<button class="btn sm" id="btnFollow">' + DL.esc(T("Registrar seguimiento", "Log follow-up")) + "</button>" +
      '<button class="btn sm" id="btnMoveStop">' + DL.esc(T("Ajustar stop", "Move stop")) + "</button>" +
      '<button class="btn sm dngr" id="btnClose">' + DL.esc(T("Cerrar posición", "Close position")) + "</button>" +
      "</div></section>";
  }

  /* línea de tiempo del activo */
  var events = DL.S.diary.filter(function (e) { return e.sym === sym; });
  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Línea de tiempo", "Timeline")) + "</h3>" +
    '<span class="eyebrow">' + events.length + T(" registros", " entries") + "</span></div>";
  if (!events.length) html += DL.empty(T("Sin historial todavía", "No history yet"), T("Cada acción sobre este activo queda registrada aquí.", "Every action on this asset is logged here."));
  else {
    html += events.slice(0, 40).map(function (e) {
      var pct = (e.pxAt && d.price) ? ((d.price - e.pxAt) / e.pxAt) * 100 : null;
      return '<div class="tl"><div class="w">' + DL.day(e.t) + '</div><div class="m"><i></i></div>' +
        '<div class="b">' + DL.esc(e.text) +
        (e.pxAt ? "<small>" + T("en ", "at ") + DL.money(e.pxAt) +
          (pct != null ? ' · <span class="' + DL.tone(pct) + '">' + DL.pct(pct) + T(" desde entonces", " since then") + "</span>" : "") + "</small>" : "") +
        "</div></div>";
    }).join("");
  }
  html += "</section>";

  /* acciones */
  html += '<section class="card"><div class="row">' +
    (pos ? "" : '<button class="btn p" id="btnTrade">' + DL.esc(T("Operar ", "Trade ") + sym) + "</button>") +
    '<button class="btn" id="btnNote">' + DL.esc(T("Nota al diario", "Journal note")) + "</button>" +
    (inWatch ? '<button class="btn g" id="btnMoveList">' + DL.esc(T("Mover de lista", "Move to list")) + "</button>" : "") +
    (inWatch
      ? '<button class="btn g" id="btnUnwatch">' + DL.esc(T("Quitar de watchlist", "Remove from watchlist")) + "</button>"
      : '<button class="btn" id="btnWatch">' + DL.esc(T("Agregar a watchlist", "Add to watchlist")) + "</button>") +
    "</div></section>";

  root.innerHTML = html;

  /* gráfico: SMA 20 / 50 / 200 en TODOS los rangos */
  var cv = DL.$("#assetChart", root);
  if (cv && chartBars && chartBars.length > 1) {
    DL.CH.candles(cv, {
      bars: chartBars,
      sma: isIntra ? null : [20, 50, 200],
      smaLevels: isIntra && an ? { 20: an.sma20, 50: an.sma50, 200: an.sma200 } : null,
      count: chartCount, height: 260,
      levels: (!isIntra && pos) ? { entry: pos.entry, stop: pos.stop, target: pos.target } : null,
      sr: (!isIntra && an && M.id === "swing") ? { support: an.support, resistance: an.resistance } : null,
      intraday: isIntra
    });
  }
  DL.$$("#rangeSeg button", root).forEach(function (b) {
    b.onclick = function () { DL.current.range = b.dataset.r; DL.render(); };
  });
  var techCount = isIntra ? 30 : rdef.days;
  var rsiCv = DL.$("#rsiChart", root), macdCv = DL.$("#macdChart", root);
  if (rsiCv && !d.closesOnly) DL.CH.rsiPanel(rsiCv, d.bars, { count: techCount });
  if (macdCv && !d.closesOnly) DL.CH.macdPanel(macdCv, d.bars, { count: techCount });

  DL.$$("[data-setmode]", root).forEach(function (b) { b.onclick = function () { DL.setMode(b.dataset.setmode); }; });
  var bt;
  if ((bt = DL.$("#btnBack", root))) bt.onclick = function () { DL.go(DL.current.from || "watch"); };
  if ((bt = DL.$("#btnDeep", root))) bt.onclick = function () { DL.deepSearchSheet(sym); };
  if ((bt = DL.$("#btnTrade", root))) bt.onclick = function () { DL.tradeSym = sym; DL.go("trade"); };
  if ((bt = DL.$("#btnWatch", root))) bt.onclick = function () { DL.addSymbol(sym, d.name); };
  if ((bt = DL.$("#btnMoveList", root))) bt.onclick = function () { DL.moveListSheet(sym); };
  if ((bt = DL.$("#btnUnwatch", root))) bt.onclick = function () {
    DL.S.watch = DL.S.watch.filter(function (w) { return w.sym !== sym; });
    DL.save(); DL.toast(T(sym + " quitado de la watchlist", sym + " removed from the watchlist")); DL.go("watch");
  };
  if ((bt = DL.$("#btnNote", root))) bt.onclick = function () { DL.noteSheet(sym, d.price); };
  if ((bt = DL.$("#btnFollow", root))) bt.onclick = function () { DL.followSheet(pos, d.price); };
  if ((bt = DL.$("#btnMoveStop", root))) bt.onclick = function () { DL.moveStopSheet(pos, d.price); };
  if ((bt = DL.$("#btnClose", root))) bt.onclick = function () { DL.closeSheet(pos, d.price); };
};

/* ---------- hojas de acción sobre una posición ---------- */
DL.noteSheet = function (sym, px) {
  var body = DL.el('<div><div class="fld"><label for="ntx">' + DL.esc(T("Nota", "Note")) + "</label>" +
    '<textarea id="ntx" placeholder="' + DL.esc(T("Qué observaste, qué esperas, qué te haría cambiar de opinión.",
      "What you saw, what you expect, what would change your mind.")) + '"></textarea></div></div>');
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p"></button>');
  ok.textContent = T("Guardar", "Save");
  ok.onclick = function () {
    var v = body.querySelector("#ntx").value.trim();
    if (!v) return;
    DL.addDiary(sym, "note", v, px);
    s.close(); DL.toast(T("Nota guardada", "Note saved")); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet(T("Nota · ", "Note · ") + sym, body, foot);
};

DL.followSheet = function (pos, px) {
  var pct = ((px - pos.entry) / pos.entry) * 100;
  var body = DL.el('<div><div class="grid g3" style="margin-bottom:14px">' +
    DL.ro(T("Precio de registro", "Entry price"), DL.money(pos.entry), "", "sm") +
    DL.ro(T("Precio actual", "Current price"), DL.money(px), "", "sm") +
    DL.ro(T("Cambio", "Change"), DL.pct(pct), DL.tone(pct), "sm") +
    "</div><div class=\"fld\"><label for=\"ftx\">" + DL.esc(T("¿Qué está pasando con tu tesis?", "What's happening with your thesis?")) + "</label>" +
    '<textarea id="ftx" placeholder="' + DL.esc(T("Sigue vigente / se debilitó / apareció algo nuevo.", "Still valid / weakened / something new showed up.")) + '"></textarea></div></div>');
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p"></button>');
  ok.textContent = T("Registrar seguimiento", "Log follow-up");
  ok.onclick = function () {
    var v = body.querySelector("#ftx").value.trim() || T("Seguimiento sin observaciones", "Follow-up with no notes");
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "follow", px: px, note: v }]);
    DL.addDiary(pos.sym, "follow", T("Seguimiento: ", "Follow-up: ") + v, px);
    DL.save(); s.close(); DL.toast(T("Seguimiento registrado", "Follow-up logged")); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet(T("Seguimiento · ", "Follow-up · ") + pos.sym, body, foot);
};

DL.moveStopSheet = function (pos, px) {
  var body = DL.el('<div><div class="fld"><label for="nst">' + DL.esc(T("Nuevo stop", "New stop")) + "</label>" +
    '<input type="number" step="0.01" id="nst" value="' + pos.stop.toFixed(2) + '"></div>' +
    '<p style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">' +
    DL.esc(T("Subir el stop protege ganancia. Bajarlo para no perder es cambiar el plan a mitad de camino — queda registrado en la línea de tiempo.",
             "Raising the stop protects profit. Lowering it to avoid a loss is changing the plan midway — it gets logged in the timeline.")) + "</p></div>");
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p"></button>');
  ok.textContent = T("Guardar", "Save");
  ok.onclick = function () {
    var v = parseFloat(body.querySelector("#nst").value);
    if (!v || v <= 0) return;
    var raised = v > pos.stop;
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "stop", px: v, note: raised ? "stop up" : "stop down" }]);
    DL.addDiary(pos.sym, "stop", T("Stop " + (raised ? "subido" : "bajado") + " de ", "Stop " + (raised ? "raised" : "lowered") + " from ") +
      DL.money(pos.stop) + T(" a ", " to ") + DL.money(v), px);
    pos.stop = v;
    DL.save(); s.close(); DL.toast(T("Stop actualizado", "Stop updated")); DL.render();
  };
  foot.appendChild(ok);
  var s = DL.sheet(T("Ajustar stop · ", "Move stop · ") + pos.sym, body, foot);
};

DL.closeSheet = function (pos, px) {
  var body = DL.el('<div><div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="cpx">' + DL.esc(T("Precio de cierre", "Exit price")) + '</label><input type="number" step="0.01" id="cpx" value="' + px.toFixed(2) + '"></div>' +
    '<div class="fld"><label for="crs">' + DL.esc(T("Motivo", "Reason")) + '</label><select id="crs">' +
    '<option value="target">' + DL.esc(T("Target alcanzado", "Target reached")) + "</option>" +
    '<option value="stop">' + DL.esc(T("Stop alcanzado", "Stop hit")) + "</option>" +
    '<option value="tesis">' + DL.esc(T("Tesis invalidada", "Thesis invalidated")) + "</option>" +
    '<option value="manual">' + DL.esc(T("Decisión discrecional", "Discretionary decision")) + "</option></select></div></div>" +
    '<div id="cprev"></div>' +
    '<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:8px">' +
    DL.esc(T("3 cosas para cambiar o mejorar la próxima vez", "3 things to change or improve next time")) + "</div>" +
    '<div class="fld" style="margin-bottom:8px"><input type="text" id="imp1" maxlength="140" placeholder="' +
    DL.esc(T("1. Por ejemplo: esperar confirmación de volumen", "1. For example: wait for volume confirmation")) + '"></div>' +
    '<div class="fld" style="margin-bottom:8px"><input type="text" id="imp2" maxlength="140" placeholder="' +
    DL.esc(T("2. Por ejemplo: no mover el stop a mitad de camino", "2. For example: don't move the stop midway")) + '"></div>' +
    '<div class="fld"><input type="text" id="imp3" maxlength="140" placeholder="' +
    DL.esc(T("3. Por ejemplo: respetar el tamaño de posición planeado", "3. For example: respect the planned position size")) + '"></div></div></div>');
  function upd() {
    var v = parseFloat(body.querySelector("#cpx").value) || 0;
    var pl = (v - pos.entry) * pos.qty;
    var r = Math.abs(pos.entry - pos.stop) * pos.qty;
    body.querySelector("#cprev").innerHTML = '<div class="grid g2">' +
      DL.ro(T("Resultado", "Result"), DL.sgn(pl), DL.tone(pl)) +
      DL.ro(T("Múltiplo R", "R multiple"), r > 0 ? (pl / r >= 0 ? "+" : "") + (pl / r).toFixed(2) + "R" : "—") + "</div>";
  }
  body.querySelector("#cpx").oninput = upd; upd();
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p"></button>');
  ok.textContent = T("Cerrar posición", "Close position");
  ok.onclick = function () {
    var v = parseFloat(body.querySelector("#cpx").value);
    if (!v || v <= 0) return;
    var r = Math.abs(pos.entry - pos.stop) * pos.qty;
    var imps = [body.querySelector("#imp1").value.trim(), body.querySelector("#imp2").value.trim(), body.querySelector("#imp3").value.trim()]
      .filter(function (t) { return t; });
    pos.status = "closed";
    pos.exitPx = v; pos.exitAt = Date.now();
    pos.exitReason = body.querySelector("#crs").value;
    pos.pl = (v - pos.entry) * pos.qty;
    pos.rMultiple = r > 0 ? pos.pl / r : 0;
    pos.improvements = imps;
    pos.lesson = imps.length ? imps.map(function (t, i) { return (i + 1) + ") " + t; }).join(" · ") : "";
    pos.events = (pos.events || []).concat([{ t: Date.now(), k: "exit", px: v, note: pos.exitReason }]);
    DL.addDiary(pos.sym, "exit", T("Posición cerrada en ", "Position closed at ") + DL.money(v) + " · " + DL.sgn(pos.pl) +
      (pos.lesson ? " · " + pos.lesson : ""), v);
    DL.save(); s.close(); DL.toast(T("Posición cerrada · ", "Position closed · ") + DL.sgn(pos.pl)); DL.go("port");
  };
  foot.appendChild(ok);
  var s = DL.sheet(T("Cerrar · ", "Close · ") + pos.sym, body, foot);
};
/* ============================================================

DL.tradeSym = null;
DL.VIEW_trade = function (root) {
