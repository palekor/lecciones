<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0910">
<title>Decision Lab · ProfGermandario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0B0910; --plate:#14111C; --plate2:#1A1624; --plate3:#221D2E;
  --line:#2C2639; --soft:#201B2B;
  --text:#EDEAF2; --text2:#C3BCD2; --muted:#958CA8; --faint:#6B6380;
  --purple:#8C6DFF; --purple2:#A48DFF; --purpleDim:rgba(140,109,255,.14);
  --brass:#C8A45C; --brassDim:rgba(200,164,92,.13);
  --pos:#3FCB82; --posDim:rgba(63,203,130,.13);
  --neg:#F0625F; --negDim:rgba(240,98,95,.13);
  --amber:#FFA23A; --amberDim:rgba(255,162,58,.13);
  --sky:#56B6F0;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple2)}
:focus-visible{outline:2px solid var(--purple2);outline-offset:2px;border-radius:4px}
.num,.n{font-family:var(--m);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--amber)} .mute{color:var(--muted)}

/* ---------- layout ---------- */
.top{
  position:sticky;top:0;z-index:30;background:rgba(11,9,16,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-family:var(--m);font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:14px;max-width:1180px;margin:0 auto}
.view{display:none} .view.on{display:block}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-auto-flow:column;
  background:rgba(20,17,28,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));
}
.nav button{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;font-size:9.5px;color:var(--faint);letter-spacing:.02em;
}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--purple2);font-weight:600}

/* ---------- atoms ---------- */
.card{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h3{font-size:14px}
.eyebrow{font-family:var(--m);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ro{display:flex;flex-direction:column;gap:1px;min-width:0}
.ro .k{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:-.02em}
.ro.lg .v{font-size:24px} .ro.sm .v{font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--plate2);font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--purple)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.p:hover{background:var(--purple2)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.g{background:transparent}
.btn.dngr{color:var(--neg);border-color:var(--neg);background:var(--negDim)}
.btn.blk{width:100%}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.buy{color:var(--pos);border-color:var(--pos);background:var(--posDim)}
.tag.hold{color:var(--purple2);border-color:var(--purple);background:var(--purpleDim)}
.tag.wait{color:var(--amber);border-color:var(--amber);background:var(--amberDim)}
.tag.sell{color:var(--neg);border-color:var(--neg);background:var(--negDim)}
.tag.watch{color:var(--brass);border-color:var(--brass);background:var(--brassDim)}
.tag.avoid{color:var(--faint)}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--plate2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;
  font-family:var(--m);font-size:14px}
textarea{font-family:var(--f);resize:vertical;min-height:70px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-family:var(--m);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--purpleDim);color:var(--purple2)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:5px}

.bar{height:6px;background:var(--plate3);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--purple);display:block}
.bar i.pos{background:var(--pos)} .bar i.neg{background:var(--neg)} .bar i.amber{background:var(--amber)}

/* ---------- watchlist rows ---------- */
.wrow{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--plate);
  margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.wrow:hover{border-color:var(--purple)}
.wrow .wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px}
.wrow .idblk{min-width:0}
.wrow .sy{font-family:var(--m);font-size:16.5px;font-weight:600;letter-spacing:.01em;display:block}
.wrow .nm{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:60vw}
.wrow .st{display:flex;justify-content:flex-end;flex:none}
.wrow .chart{margin-bottom:7px}
.wrow .chart canvas{width:100%;height:58px;display:block}
.wrow .bottom{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wrow .px{font-family:var(--m);font-size:19px;font-weight:600;letter-spacing:-.02em}
.wrow .chg{font-family:var(--m);font-size:15px;font-weight:500}
.wrow .pct{font-family:var(--m);font-size:15px;font-weight:600;margin-left:auto;
  padding:3px 9px;border-radius:7px;background:var(--plate3)}
.wrow .pct.pos{background:var(--posDim)} .wrow .pct.neg{background:var(--negDim)}
.wrow .pct small{font-size:9.5px;font-weight:400;margin-left:5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ---------- listas con nombre de la watchlist ---------- */
.pills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--plate2);border-radius:999px;
  padding:7px 13px;font-family:var(--m);font-size:11px;color:var(--muted);white-space:nowrap}
.pill.on{border-color:var(--purple);background:var(--purpleDim);color:var(--purple2);font-weight:600}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.listrow:last-child{border-bottom:0}

/* ---------- conditions ---------- */
.cond{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px}
.cond:last-child{border-bottom:0}
.cond .ic{font-size:13px;line-height:1.2}
.cond .lb{color:var(--text2)}
.cond .vl{font-family:var(--m);font-size:12px;color:var(--muted);white-space:nowrap}
.cond.ok .lb{color:var(--text)}

.score{display:flex;align-items:baseline;gap:7px}
.score b{font-family:var(--m);font-size:42px;letter-spacing:-.045em;line-height:1;font-weight:500}
.score span{font-family:var(--m);font-size:13px;color:var(--faint)}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:62px 12px 1fr;gap:9px;padding-bottom:13px;position:relative}
.tl .w{font-family:var(--m);font-size:10px;color:var(--faint);text-align:right;padding-top:2px}
.tl .m{position:relative}
.tl .m i{position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--purple)}
.tl .m::before{content:"";position:absolute;left:6px;top:12px;bottom:-8px;width:1px;background:var(--line)}
.tl:last-child .m::before{display:none}
.tl .b{font-size:12.5px}
.tl .b small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* ---------- chart ---------- */
.chartbox{position:relative}
.chartbox canvas{width:100%;display:block;border-radius:6px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--m);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:400;padding:0 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--plate2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- sheet / modal ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(5,4,9,.72);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet{background:var(--plate);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;
  max-width:720px;padding:16px 14px calc(22px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet .hd h3{font-size:18px;letter-spacing:-.01em}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--plate);border:1px solid var(--purple);padding:10px 16px;border-radius:999px;
  font-size:12.5px;z-index:90;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}

.note{border:1px solid var(--brass);background:var(--brassDim);border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--text2);line-height:1.5}
.note b{color:var(--brass)}
.note.bad{border-color:var(--neg);background:var(--negDim)} .note.bad b{color:var(--neg)}

/* ---------- selector de modo ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{
  border:1px solid var(--line);background:var(--plate2);border-radius:9px;padding:9px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.modes button b{font-size:12.5px;font-weight:600}
.modes button span{font-family:var(--m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.modes button[aria-pressed=true]{border-color:var(--purple);background:var(--purpleDim)}
.modes button[aria-pressed=true] span{color:var(--purple2)}

/* ---------- término del glosario ---------- */
.term{
  border-bottom:1px dotted var(--brass);color:var(--brass);cursor:help;
  font-style:italic;white-space:nowrap}
.terms{display:flex;flex-direction:column;gap:9px}
.terms div{font-size:12.5px;line-height:1.45;color:var(--text2)}
.terms b{color:var(--brass);font-style:italic;font-weight:500}

/* ---------- zonas de compra/venta ---------- */
.zone{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px}
.zone.buy{border-color:var(--pos);background:var(--posDim)}
.zone.sell{border-color:var(--neg);background:var(--negDim)}
.zone .lab{font-size:11.5px;color:var(--muted)}
.zone .val{font-family:var(--m);font-size:13.5px}

/* ---------- paneles y alertas ---------- */
.window{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--plate2)}
.window + .window{margin-top:8px}
.window .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.window .wh b{font-size:13px}
.alert{display:flex;flex-direction:column;gap:2px;padding:10px 11px;border-radius:8px;margin-bottom:7px;font-size:12.5px;line-height:1.45}
.alert.bad{border:1px solid var(--neg);background:var(--negDim)}
.alert.rev{border:1px solid var(--amber);background:var(--amberDim)}
.alert.ok{border:1px solid var(--pos);background:var(--posDim)}
.alert b{display:block;margin-bottom:3px}

/* ---------- radar: rotación sectorial y volumen ---------- */
.sector-row{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.sector-row:last-child{border-bottom:0}
.sector-row .et{font-family:var(--m);font-size:13px;font-weight:600}
.sector-row .nm{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sector-row .pc{font-family:var(--m);font-size:12.5px;text-align:right}
.rsbar{height:6px;background:var(--plate3);border-radius:3px;position:relative;overflow:hidden}
.rsbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.rsbar i.pos{background:var(--pos)} .rsbar i.neg{background:var(--neg)}
.tag.spike{color:var(--amber);border-color:var(--amber);background:var(--amberDim)}

.legal{font-size:11px;color:var(--faint);line-height:1.5;text-align:center;padding:16px 4px 4px}
.legal button{background:none;border:0;color:var(--brass);text-decoration:underline;font-size:11px;padding:0}

.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--text2)}
.chk input{width:auto;margin-top:2px;flex:none}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--purple);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}


/* ---------- idioma, estado del mercado, índices y movers ---------- */
.langbtn{font-family:var(--m);font-size:11px;letter-spacing:.08em;min-width:38px}
.mstat{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mstat i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.mstat.on{color:var(--pos);border-color:var(--pos);background:var(--posDim)}
.mstat.on i{background:var(--pos);box-shadow:0 0 0 3px var(--posDim)}
.idx{background:var(--plate2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:left;width:100%;min-width:0;transition:border-color .15s}
.idx:hover,.mv:hover{border-color:var(--purple)}
.idx .s{font-family:var(--m);font-size:12.5px;font-weight:600}
.idx .nm{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx .p{font-family:var(--m);font-size:12.5px;margin-top:5px;font-variant-numeric:tabular-nums}
.idx .c{font-family:var(--m);font-size:11.5px;font-variant-numeric:tabular-nums}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mv{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--plate2);margin-bottom:6px;width:100%;text-align:left;transition:border-color .15s}
.smakey{display:inline-flex;align-items:center;gap:5px;font-family:var(--m);font-size:9.5px;color:var(--muted);letter-spacing:.04em;flex-wrap:wrap}
.smakey i{display:inline-block;width:12px;height:2px;border-radius:1px;margin-left:4px}
.smakey i:first-child{margin-left:0}
.smab{display:inline-flex;gap:10px;font-size:11px}
.sector-row.wide{grid-template-columns:150px 1fr 64px}

@media (min-width:760px){
  .wrap{padding:20px}
  .g2s{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  .g4{grid-template-columns:1fr 1fr}
  .wrow .st .tag{padding:3px 6px;letter-spacing:.05em;font-size:9px}
  .sector-row{grid-template-columns:66px 1fr 56px;gap:6px}
  .sector-row.wide{grid-template-columns:112px 1fr 58px}
  .modes button b{font-size:11.5px}
  .idx{padding:8px}
  .movers{gap:7px}
  .mv{padding:7px 8px}
  .nav button{font-size:8.6px}
  .nav button svg{width:17px;height:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Decision Lab</b><span id="brandsub">Simulacro · capital simulado</span></div>
  <div class="row" style="gap:4px;flex-wrap:nowrap">
    <button class="btn sm g langbtn" id="btnLang" type="button">EN</button>
    <button class="btn sm g" id="btnCloud" type="button" style="color:var(--faint)">☁</button>
    <button class="btn sm g" id="btnRefresh" type="button">⟳</button>
    <button class="btn sm g" id="btnSettings" type="button">⚙</button>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-watch"></section>
  <section class="view" id="v-trade"></section>
  <section class="view" id="v-port"></section>
  <section class="view" id="v-diary"></section>
  <section class="view" id="v-asset"></section>
  <section class="view" id="v-radar"></section>
</main>

<nav class="nav" id="nav">
  <button data-go="home" aria-current="true">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav.home">Hoy</span>
  </button>
  <button data-go="watch">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="nav.watch">Watchlist</span>
  </button>
  <button data-go="radar">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg><span data-i18n="nav.radar">Radar</span>
  </button>
  <button data-go="trade">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/></svg><span data-i18n="nav.trade">Operar</span>
  </button>
  <button data-go="port">

  </button>

<script src="palekor-sync.js"></script>
<script>
/* ============================================================
   DECISION LAB — simulacro de decisiones con mercado real
   ProfGermandario · archivo único, local-first · ES / EN
   Módulo 1/6 — estado, idioma, almacenamiento y utilidades
   ============================================================ */
"use strict";

var DL = {};

/* ---------- estado ---------- */
DL.KEY = "dlab.v1";
DL.S = {
  profile: {
    name: "", capital: 3000, maxDailyPct: 20, maxRiskPct: 2, proxy: "", setup: false,
    accepted: false,            // aviso legal aceptado
    mode: "swing",              // última estrategia elegida (scalp | swing); la app ARRANCA en modo mercado
    lang: null,                 // "es" | "en" · null = según el navegador
    bench: "SPY",               // índice de referencia (antes no se guardaba)
    minVolume: 5000000,         // scalping: liquidez mínima del día
    intradayMin: 0.2,           // scalping: rango de variación buscado
    intradayMax: 0.5,
    maxHoldHours: 2             // scalping: cuánto puede durar una posición
  },
  lists: [],      // {id,name,order,_u} — listas con nombre dentro de la watchlist
  watch: [],      // {sym,name,note,addedAt,goalBuy,goalSell,list}
  pos: [],        // posiciones simuladas (abiertas y cerradas)
  diary: [],      // {id,sym,t,kind,text,pxAt}
  lastSync: 0
};

DL.load = function () {
  try {
    var raw = localStorage.getItem(DL.KEY);
    if (raw) {
      var d = JSON.parse(raw);
      DL.S.profile = Object.assign(DL.S.profile, d.profile || {});
      DL.S.watch = d.watch || [];
      DL.S.pos = d.pos || [];
      DL.S.diary = d.diary || [];
      DL.S.lists = d.lists || [];
      DL.S.lastSync = d.lastSync || 0;
    }
  } catch (e) { console.warn("load", e); }
  DL.migrateLists();
};

/* listas: si no existen (versión vieja) o un activo apunta a una lista que ya
   no está, se usa la primera — nunca se pierde un activo por esto */
DL.migrateLists = function () {
  if (!DL.S.lists || !DL.S.lists.length) {
    DL.S.lists = [{ id: "default", name: "General", order: 0, _u: Date.now() }];
  }
  DL.dedupeLists();
  var valid = {};
  DL.S.lists.forEach(function (l) { valid[l.id] = 1; });
  var def = DL.S.lists[0].id;
  DL.S.watch.forEach(function (w) { if (!w.list || !valid[w.list]) w.list = def; });
};
DL.listKey = function (name) { return String(name || "").trim().toLowerCase().replace(/\s+/g, " "); };
/* une listas con el mismo nombre (creadas dos veces por doble toque, o en dos
   dispositivos): los activos pasan a la primera. Devuelve true si cambió algo. */
DL.dedupeLists = function () {
  var seen = {}, changed = false;
  DL.S.lists = DL.S.lists.filter(function (l) {
    var k = DL.listKey(l.name);
    if (!seen[k]) { seen[k] = l.id; return true; }
    DL.S.watch.forEach(function (w) { if (w.list === l.id) w.list = seen[k]; });
    changed = true;
    return false;
  });
  return changed;
};
DL.save = function () {
  try { localStorage.setItem(DL.KEY, JSON.stringify(DL.S)); }
  catch (e) { console.warn("save", e); }
};
DL.uid = function (p) {
  return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
};

/* ---------- idioma ----------
   Cada texto vive junto a su traducción: T("español", "English").
   Así ninguna cadena queda sin traducir por una clave olvidada. */
DL.lang = function () {
  var l = DL.S.profile.lang;
  if (l === "en" || l === "es") return l;
  var nav = (navigator.language || "es").toLowerCase();
  return nav.indexOf("es") === 0 ? "es" : "en";
};
DL.T = function (es, en) { return DL.lang() === "en" && en != null ? en : es; };
var T = DL.T;
DL.loc = function () { return DL.lang() === "en" ? "en-US" : "es"; };

/* ---------- formato ---------- */
DL.money = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  dp = dp == null ? 2 : dp;
  var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return (n < 0 ? "-$" : "$") + s;
};
DL.sgn = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  return (n > 0 ? "+" : "") + DL.money(n, dp);
};
DL.pct = function (n, dp) {
  if (n == null || isNaN(n)) return "—";
  dp = dp == null ? 2 : dp;
  var r = +Math.abs(n).toFixed(dp);          // sin "-0.00%": el signo sigue al valor redondeado
  return (r === 0 ? "" : n > 0 ? "+" : "-") + r.toFixed(dp) + "%";
};
DL.pctp = function (n, dp) { // porcentaje sin signo forzado
  if (n == null || isNaN(n)) return "—";
  return n.toFixed(dp == null ? 1 : dp) + "%";
};
DL.qty = function (n) {
  if (n == null || isNaN(n)) return "—";
  return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
};
DL.px = function (n) {         // precio sin símbolo: 2 decimales, más si el precio es muy pequeño
  if (n == null || !isFinite(n)) return "—";
  var dp = Math.abs(n) < 1 ? 4 : 2;
  return n.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
};
DL.tone = function (n) {
  if (n == null || isNaN(n) || Math.abs(n) < 1e-9) return "";
  return n > 0 ? "pos" : "neg";
};
DL.esc = function (s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
};
DL.day = function (ts) {
  return new Date(ts).toLocaleDateString(DL.loc(), { day: "2-digit", month: "short" });
};
DL.hm = function (ts) {
  return new Date(ts).toLocaleTimeString(DL.loc(), { hour: "2-digit", minute: "2-digit" });
};
DL.ago = function (ts) {
  if (!ts) return "—";
  var d = Math.floor((Date.now() - ts) / 86400000);
  return d <= 0 ? T("hoy", "today") : d === 1 ? T("ayer", "yesterday") : T("hace " + d + "d", d + "d ago");
};
DL.vol = function (v) {
  if (v == null || !isFinite(v)) return "—";
  return v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(Math.round(v));
};

/* ---------- DOM ---------- */
DL.el = function (html) {

DL.$ = function (s, r) { return (r || document).querySelector(s); };

DL.toast = function (msg) {

/* hoja inferior (bottom sheet) — el patrón de diálogo en móvil */
DL.sheet = function (title, bodyNode, footNode) {

  if (footNode) sh.appendChild(footNode);
  bg.appendChild(sh);
  bg.addEventListener("mousedown", function (e) { if (e.target === bg) close(); });
  document.addEventListener("keydown", onKey);
  function onKey(e) { if (e.key === "Escape") close(); }
  function close() { document.removeEventListener("keydown", onKey); bg.remove(); }
  document.body.appendChild(bg);
  return { close: close, node: sh };

  no.onclick = function () { s.close(); };

/* ============================================================
   Módulo 1c — nube: la misma cuenta en todos tus dispositivos
   Usa palekor-sync.js (compartido por todas las apps).
   Si la nube no está disponible, la app sigue funcionando local.
   ============================================================ */

DL.CLOUD = (function () {
  var APP = "demoney";
  var META_KEY = "dlab.sync.v1";
  var COLLS = {
    watch: { id: function (x) { return x.sym; },  order: function (a, b) { return (a.addedAt || 0) - (b.addedAt || 0); } },
    pos:   { id: function (x) { return x.id; },   order: function (a, b) { return (a.openedAt || 0) - (b.openedAt || 0); } },
    diary: { id: function (x) { return x.id; },   order: function (a, b) { return (b.t || 0) - (a.t || 0); } },
    lists: { id: function (x) { return x.id; },   order: function (a, b) { return (a.order || 0) - (b.order || 0); } }
  };

  var S = { status: "off", lastSync: 0, error: null };  // off | idle | syncing | pending | error
  var meta = { tomb: { watch: {}, pos: {}, diary: {}, lists: {} }, dirty: {}, everPushed: false };
  var shadow = { watch: {}, pos: {}, diary: {}, lists: {}, profile: null };
  var pushT = null, pollT = null, applying = false;
  // marca de versión para "pendiente de subir": siempre creciente, aun entre recargas
  var seq = 0;
  function nextSeq() { seq = Math.max(seq + 1, Date.now()); return seq; }

  try {
    var raw = localStorage.getItem(META_KEY);
    if (raw) meta = Object.assign(meta, JSON.parse(raw));
  } catch (e) {}
  function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} }

  function PS() { return window.PalekorSync || null; }
  function fp(o) { return PS() ? PS().fingerprint(o) : JSON.stringify(o); }

  /* ---------- 1. detectar qué cambió desde el último guardado ---------- */
  function naturalTime(coll, x) {
    return coll === "watch" ? (x.addedAt || 1) : coll === "pos" ? (x.exitAt || x.openedAt || 1)
      : coll === "lists" ? (x._u || 1) : (x.t || 1);
  }

  // Primera vez: registra el estado actual sin marcarlo como "recién editado"
  function primeShadow() {
    Object.keys(COLLS).forEach(function (c) {
      shadow[c] = {};
      (DL.S[c] || []).forEach(function (x) {
        if (!x._u) x._u = naturalTime(c, x);
        shadow[c][COLLS[c].id(x)] = fp(x);
      });
    });
    if (!DL.S.profile._u) DL.S.profile._u = DL.S.profile.setup ? 1 : 0;
    shadow.profile = fp(DL.S.profile);
    if (!meta.everPushed) { meta.dirty = { watch: 1, pos: 1, diary: 1, lists: 1, profile: 1 }; saveMeta(); }
  }

  function markChanges() {
    var now = Date.now(), any = false;
    Object.keys(COLLS).forEach(function (c) {
      var seen = {};
      (DL.S[c] || []).forEach(function (x) {
        var id = COLLS[c].id(x), h = fp(x);
        seen[id] = 1;
        if (shadow[c][id] !== h) {
          x._u = now; shadow[c][id] = h;
          if (meta.tomb[c][id]) delete meta.tomb[c][id];   // se volvió a agregar
          meta.dirty[c] = nextSeq(); any = true;
        }
      });
      Object.keys(shadow[c]).forEach(function (id) {
        if (!seen[id]) {                                    // se borró en este dispositivo
          meta.tomb[c][id] = now; delete shadow[c][id];
          meta.dirty[c] = nextSeq(); any = true;
        }
      });
    });
    var hp = fp(DL.S.profile);
    if (hp !== shadow.profile) {
      DL.S.profile._u = now; shadow.profile = hp;
      meta.dirty.profile = nextSeq(); any = true;
    }
    if (any) saveMeta();
    return any;
  }

  /* ---------- 2. subir lo pendiente ---------- */
  function docFor(c) {
    var items = {};
    (DL.S[c] || []).forEach(function (x) { items[COLLS[c].id(x)] = PS().clean(x); });
    return { items: items, tomb: meta.tomb[c] || {} };
  }

  function schedulePush() {
    if (!signedIn()) { if (Object.keys(meta.dirty).length) setStatus("off"); return; }
    setStatus("pending");
    clearTimeout(pushT);
    pushT = setTimeout(pushNow, 1500);
  }

  var pulledOnce = false;   // nunca se sube nada antes de haber traído lo de la nube:
                            // subir primero reemplazaría datos de otros dispositivos
  function pushNow() {
    if (!signedIn() || !pulledOnce) return Promise.resolve();
    var keys = Object.keys(meta.dirty);
    if (!keys.length) { setStatus("idle"); return Promise.resolve(); }
    setStatus("syncing");
    var sent = {}, results = {};
    return Promise.all(keys.map(function (k) {
      sent[k] = meta.dirty[k];
      var data = k === "profile" ? { v: PS().clean(DL.S.profile) } : docFor(k);
      // fusión atómica en el servidor: devuelve lo combinado con otros dispositivos
      return PS().merge(APP, k, data).then(function (merged) {
        results[k] = { data: merged };
        // solo se limpia si nadie editó esa lista mientras viajaba la petición
        if (meta.dirty[k] === sent[k]) delete meta.dirty[k];
      });
    })).then(function () {
      meta.everPushed = true;
      var changed = applyRemote(results, false);
      saveMeta();
      S.lastSync = Date.now(); S.error = null;
      if (changed && DL.recompute) { DL.recompute(); DL.render(); }
      if (Object.keys(meta.dirty).length) schedulePush(); else setStatus("idle");
    }).catch(function (e) {
      saveMeta();
      S.error = e.message || "error";
      setStatus(navigator.onLine === false ? "pending" : "error");
    });
  }

  /* ---------- 3. fusionar lo que llega de la nube ---------- */
  function applyRemote(rows, isPull) {
    applying = true;
    var changed = false;

    Object.keys(COLLS).forEach(function (c) {
      if (!isPull && !rows[c]) return;               // al subir, solo se aplica lo que se subió
      var local = docFor(c);
      var remote = rows[c] ? rows[c].data : null;
      var merged = PS().mergeCollection(local, remote);
      var list = Object.keys(merged.items).map(function (id) { return merged.items[id]; }).sort(COLLS[c].order);

      if (fp(list) !== fp(DL.S[c] || [])) changed = true;
      DL.S[c] = list;
      meta.tomb[c] = merged.tomb;

      // si lo local tenía algo que la nube no tenía, hay que subirlo
      if (!remote || fp(merged) !== fp(remote)) meta.dirty[c] = nextSeq();
    });

    if (isPull || rows.profile) {
      var rp = rows.profile && rows.profile.data ? rows.profile.data.v : null;
      // Primera sincronización de este dispositivo: si la cuenta ya tiene un
      // perfil, manda el de la nube (tu capital, tu nombre, tus ajustes)
      // aunque este dispositivo haya creado uno por defecto hace un minuto.
      var mp = (isPull && !meta.everPushed && rp) ? rp : PS().mergeObject(DL.S.profile, rp);
      if (mp !== DL.S.profile) {
        if (fp(mp) !== fp(DL.S.profile)) changed = true;
        DL.S.profile = Object.assign({}, DL.S.profile, mp);
      } else if (!rp || fp(rp) !== fp(DL.S.profile)) {
        meta.dirty.profile = nextSeq();
      }
    }

    // reconstruir la sombra sin marcar nada como editado
    Object.keys(COLLS).forEach(function (c) {

      add(T("SMA 50 sobre la SMA 200", "SMA 50 above SMA 200"), s50 != null && s200 != null && s50 > s200, vs(s50, s200));
      add(T("RSI(14) entre 40 y 70", "RSI(14) between 40 and 70"), r != null && r >= 40 && r <= 70, r == null ? "—" : r.toFixed(1));
      add(T("MACD sobre su línea de señal", "MACD above its signal line"),
        mLine != null && mSig != null && mLine > mSig, mLine == null ? "—" : mLine.toFixed(2) + " vs " + mSig.toFixed(2));
      add(T("Volumen sobre el promedio de 20 sesiones", "Volume above its 20-session average"), av > 0 && vol > av, avTxt);

    } else if (mode.id === "scalp") {
      var minVol = P.minVolume || 5000000;
      var absChg = Math.abs(chgPct);

      add(T("Liquidez suficiente para entrar y salir rápido", "Enough liquidity to get in and out fast"),
        vol >= minVol,
        (vol / 1e6).toFixed(1) + "M vs " + (minVol / 1e6).toFixed(0) + T("M mínimo", "M minimum"));

      add(T("Volumen de la sesión sobre el promedio de 20 sesiones", "Session volume above the 20-session average"),
        av > 0 && vol > av, avTxt);

      add(T("Variación de la sesión dentro del rango de scalping (", "Session move inside the scalping range (") +
        (P.intradayMin || 0.2) + "%–" + (P.intradayMax || 0.5) + "%)",
        absChg >= (P.intradayMin || 0.2) && absChg <= (P.intradayMax || 0.5),
        DL.pctp(absChg, 2));

      add(T("Precio por encima de la SMA 20 (tendencia inmediata)", "Price above SMA 20 (immediate trend)"),
        s20 != null && px > s20, vs(px, s20));

      add(T("RSI(14) entre 40 y 70 — con fuerza, sin sobrecompra", "RSI(14) between 40 and 70 — strong, not overbought"),
        r != null && r >= 40 && r <= 70,
        r == null ? "—" : r.toFixed(1));

      add(T("MACD por encima de su línea de señal", "MACD above its signal line"),
        mLine != null && mSig != null && mLine > mSig,
        mLine == null ? "—" : mLine.toFixed(2) + " vs " + mSig.toFixed(2));

      add(T("Volatilidad contenida: ATR(14) menor al 3% del precio", "Contained volatility: ATR(14) under 3% of price"),
        (a / px) * 100 < 3,
        DL.pctp((a / px) * 100, 2) + T(" del precio", " of price"));

      add(T("Más fuerte que el mercado en la sesión", "Stronger than the market this session"),
        bChg != null && chgPct > bChg,
        bChg == null ? T("sin referencia", "no benchmark") : DL.pct(chgPct, 2) + " vs " + DL.pct(bChg, 2));

    } else {
      add(T("Precio por encima de la SMA 50", "Price above SMA 50"),
        s50 != null && px > s50,
        s50 == null ? T("sin datos", "no data") : vs(px, s50));

      add(T("SMA 50 por encima de la SMA 200 (tendencia mayor)", "SMA 50 above SMA 200 (major trend)"),
        s50 != null && s200 != null && s50 > s200,
        (s50 == null || s200 == null) ? T("faltan 200 sesiones", "needs 200 sessions") : vs(s50, s200));

      add(T("Cruce reciente de la SMA 20 sobre la SMA 50", "Recent SMA 20 cross above SMA 50"),
        crossed,
        crossed ? T("hace " + crossAgo + " sesiones", crossAgo + " sessions ago") : T("sin cruce en 10 sesiones", "no cross in 10 sessions"));

      add(T("MACD por encima de su línea de señal", "MACD above its signal line"),
        mLine != null && mSig != null && mLine > mSig,
        mLine == null ? "—" : mLine.toFixed(2) + " vs " + mSig.toFixed(2));

      add(T("Confirmación por volumen sobre el promedio de 20 sesiones", "Volume confirmation above the 20-session average"),
        av > 0 && vol > av, avTxt);

      add(T("Precio por encima del soporte más cercano", "Price above the nearest support"),
        lv.support != null && px > lv.support,
        lv.support == null ? T("sin soporte identificado", "no support found")
          : DL.money(lv.support) + " (" + DL.pctp(((px - lv.support) / px) * 100, 1) + T(" abajo)", " below)"));

      add(T("Más fuerte que el mercado en 3 meses", "Stronger than the market over 3 months"),
        rel != null && rel > 0,
        rel == null ? T("sin referencia", "no benchmark") : DL.pct(ret3, 1) + " vs " + DL.pct(bRet3, 1));

      add(T("Volatilidad manejable: ATR(14) menor al 5% del precio", "Manageable volatility: ATR(14) under 5% of price"),
        (a / px) * 100 < 5,
        DL.pctp((a / px) * 100, 2) + T(" del precio", " of price"));
    }

    var confirmed = C.filter(function (x) { return x.ok; }).length;
    var score = Math.round((confirmed / C.length) * 100);
    var state = mode.id === "market" ? "WATCH" : score >= 75 ? "BUY" : score >= 50 ? "WAIT" : "AVOID";

    return {
      symbol: d.symbol, name: d.name, price: px, chgPct: chgPct, prevClose: d.prevClose,
      sessionT: d.sessionT, currency: d.currency, exchange: d.exchange, type: d.type,
      stale: !!d.stale, asOf: d.asOf,
      mode: mode.id,
      sma20: s20, sma50: s50, sma200: s200, rsi: r,
      d200: s200 ? ((px / s200) - 1) * 100 : null,
      trend: trend,
      macd: mLine, macdSignal: mSig, atr: a, atrPct: (a / px) * 100,
      vol: vol, avgVol: av, hi52: hi52, lo52: lo52,
      support: lv.support, resistance: lv.resistance, crossed: crossed,
      ret3m: ret3, benchRet3m: bRet3, rel: rel,
      conditions: C, confirmed: confirmed, total: C.length, score: score, state: state
    };
  }

  /* ---------- plan sugerido según el modo ----------
     Scalping propone un precio único y un tight stop.
     Swing propone ZONAS, no precios exactos.
     Mercado (sin estrategia) no propone plan. */
  function suggestPlan(an) {
    if (!an || an.mode === "market") return null;
    var mode = DL.MODES[an.mode] || DL.MODES.swing;
    var px = an.price, atr = an.atr;

    if (mode.id === "scalp") {
      var stop = px - atr * mode.stopAtr;
      return {
        mode: "scalp",
        entry: px, stop: stop, target: px + (px - stop) * mode.targetR,
        buyZone: null, sellZone: null,
        note: T("Tight stop a " + mode.stopAtr + "× ATR. Objetivo " + mode.targetR + "R, mismo día.",
                "Tight stop at " + mode.stopAtr + "× ATR. Target " + mode.targetR + "R, same day.")
      };
    }

    // swing: si el precio está cerca del soporte es rebote; si superó resistencia, ruptura
    var sup = an.support, res = an.resistance;
    var nearSupport = sup != null && (px - sup) / px < 0.04;
    var entry, stop2, target, buyZone, sellZone, note;

    if (nearSupport) {
      buyZone = [sup, sup + atr * 0.5];
      entry = sup + atr * 0.25;
      stop2 = sup - atr * 0.8;
      target = res != null && res > entry ? res : entry + (entry - stop2) * mode.targetR;
      note = T("Rebote en soporte: compra dentro de la zona, con volumen. Stop debajo del soporte.",
               "Bounce at support: buy inside the zone, with volume. Stop below support.");
    } else if (res != null) {
      buyZone = [res, res + atr * 0.5];
      entry = res + atr * 0.25;
      stop2 = sup != null ? Math.min(sup - atr * 0.3, entry - atr * mode.stopAtr) : entry - atr * mode.stopAtr;
      target = entry + (entry - stop2) * mode.targetR;
      note = T("Ruptura: compra sobre la resistencia solo con volumen fuerte (volume confirmation).",
               "Breakout: buy above resistance only with strong volume (volume confirmation).");
    } else {
      entry = px;
      stop2 = px - atr * mode.stopAtr;
      target = px + (px - stop2) * mode.targetR;
      buyZone = [px - atr * 0.25, px + atr * 0.25];
      note = T("Sin niveles claros: entrada en zona amplia y stop por volatilidad.",
               "No clear levels: wide entry zone and a volatility-based stop.");
    }
    sellZone = [target, target + atr * 0.5];
    return { mode: "swing", entry: entry, stop: stop2, target: target, buyZone: buyZone, sellZone: sellZone, note: note };
  }

  /* ---------- estado de una posición abierta ---------- */
  function positionState(p, an) {
    var px = an ? an.price : p.entry;
    var mode = DL.MODES[p.mode] || DL.mode();

    if (px <= p.stop) return { s: "SELL", why: T("El precio tocó tu stop (" + DL.money(p.stop) + "). Tu tesis quedó invalidada.",
                                                 "Price hit your stop (" + DL.money(p.stop) + "). Your thesis is invalidated.") };
    if (p.target && px >= p.target) return { s: "SELL", why: T("El precio alcanzó tu target (" + DL.money(p.target) + "). El plan se cumplió.",
                                                               "Price reached your target (" + DL.money(p.target) + "). The plan played out.") };

    // scalping: la posición tiene fecha de vencimiento
    if (mode.id === "scalp" && p.openedAt) {
      var hrs = (Date.now() - p.openedAt) / 3600000;
      var lim = DL.S.profile.maxHoldHours || 2;
      if (hrs > lim) {
        return {
          s: "SELL",
          why: T("Llevas " + hrs.toFixed(1) + " h en una posición de scalping (límite: " + lim +
                 " h). Estás actuando como swing trader, no como scalper. Cierra o cambia de modo conscientemente.",
                 "You've held a scalping position for " + hrs.toFixed(1) + " h (limit: " + lim +
                 " h). You're acting like a swing trader, not a scalper. Close it or switch mode on purpose.")
        };
      }
    }

    // en modo mercado el score es contexto, no señal: solo cuentan stop y target
    if (!an || an.mode === "market") {
      return { s: "HOLD", why: T("Stop en " + DL.money(p.stop) + ", target en " + (p.target ? DL.money(p.target) : "—") + ". Elige una estrategia para evaluar la posición con sus condiciones.",
                                 "Stop at " + DL.money(p.stop) + ", target at " + (p.target ? DL.money(p.target) : "—") + ". Pick a strategy to judge the position against its conditions.") };
    }

    var aged = p.openedAt && (Date.now() - p.openedAt) > 20 * 60 * 60 * 1000;
    if (an.score < 40) {
      return aged
        ? { s: "SELL", why: T("Solo " + an.confirmed + " de " + an.total + " condiciones siguen confirmadas. La estructura se deterioró.",
                              "Only " + an.confirmed + " of " + an.total + " conditions still hold. The structure has deteriorated.") }
        : { s: "HOLD", why: T("Entraste con solo " + an.confirmed + " de " + an.total + " condiciones confirmadas. Vigila el stop en " + DL.money(p.stop) + " y anota por qué entraste igual.",
                              "You entered with only " + an.confirmed + " of " + an.total + " conditions confirmed. Watch the stop at " + DL.money(p.stop) + " and write down why you entered anyway.") };
    }
    if (an.score < 60) return { s: "HOLD", why: T("Condiciones debilitándose (" + an.confirmed + "/" + an.total + "). Vigila el stop, no agregues.",
                                                  "Conditions weakening (" + an.confirmed + "/" + an.total + "). Watch the stop, don't add.") };
    return { s: "HOLD", why: T("El plan sigue vigente. Stop en " + DL.money(p.stop) + ", target en " + (p.target ? DL.money(p.target) : "—") + ".",
                               "The plan still stands. Stop at " + DL.money(p.stop) + ", target at " + (p.target ? DL.money(p.target) : "—") + ".") };
  }

  /* ---------- riesgo de una operación ----------
     Los límites globales (20% diario, riesgo máximo por operación) son
     iguales en todos los modos. El modo nunca los relaja. */
  function tradeRisk(inp) {
    var o = {};
    var price = num(inp.price), qty = num(inp.qty), stop = num(inp.stop), target = num(inp.target);
    var equity = num(inp.equity), cash = num(inp.cash);
    var maxDaily = num(inp.maxDailyPct) || 20, maxRisk = num(inp.maxRiskPct) || 2;
    var deployedToday = num(inp.deployedToday);

    o.cost = price * qty;
    o.costPct = equity > 0 ? (o.cost / equity) * 100 : 0;
    o.cash = cash;
    o.cashAfter = cash - o.cost;
    o.overCash = o.cost > cash + 1e-9;

    o.dailyCeiling = equity * (maxDaily / 100);
    o.deployedToday = deployedToday;
    o.dayAfter = deployedToday + o.cost;
    o.dayPct = equity > 0 ? (o.dayAfter / equity) * 100 : 0;
    o.overDaily = o.dayAfter > o.dailyCeiling + 1e-9;
    o.roomToday = Math.max(0, o.dailyCeiling - deployedToday);

    o.stopValid = stop > 0 && stop < price;
    o.riskPerShare = o.stopValid ? price - stop : 0;
    o.riskAmount = o.riskPerShare * qty;
    o.riskPct = equity > 0 ? (o.riskAmount / equity) * 100 : 0;
    o.overRisk = o.riskPct > maxRisk + 1e-9;
    o.stopDistPct = price > 0 && o.stopValid ? (o.riskPerShare / price) * 100 : 0;

    o.targetValid = target > 0 && target > price;
    o.rewardPerShare = o.targetValid ? target - price : 0;
    o.rewardAmount = o.rewardPerShare * qty;
    o.targetDistPct = price > 0 && o.targetValid ? (o.rewardPerShare / price) * 100 : 0;
    o.rr = o.riskPerShare > 0 && o.rewardPerShare > 0 ? o.rewardPerShare / o.riskPerShare : 0;

    var byRisk = o.riskPerShare > 0 ? Math.floor((equity * maxRisk / 100) / o.riskPerShare) : 0;
    var byCash = price > 0 ? Math.floor(cash / price) : 0;
    var byDay = price > 0 ? Math.floor(o.roomToday / price) : 0;
    o.suggestedQty = Math.max(0, Math.min(byRisk || byCash, byCash, byDay));
    o.limitedBy = o.suggestedQty === byRisk ? "risk" : o.suggestedQty === byDay ? "day" : "cash";

    o.ok = qty > 0 && price > 0 && !o.overCash && !o.overDaily && !o.overRisk && o.stopValid;
    return o;
  }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  /* ---------- portafolio ---------- */
  function portfolio(prices) {
    var P = DL.S.pos, cap = DL.S.profile.capital;
    var open = P.filter(function (p) { return p.status === "open"; });
    var closed = P.filter(function (p) { return p.status === "closed"; });

    var invested = 0, mktValue = 0, openPL = 0, openRisk = 0;
    open.forEach(function (p) {
      var px = prices && prices[p.sym] != null ? prices[p.sym] : p.entry;
      p._px = px;
      p._cost = p.entry * p.qty;
      p._value = px * p.qty;
      p._pl = p._value - p._cost;
      p._plPct = p._cost > 0 ? (p._pl / p._cost) * 100 : 0;
      invested += p._cost;
      mktValue += p._value;
      openPL += p._pl;
      openRisk += Math.max(0, (p.entry - p.stop)) * p.qty;
    });

    var realized = closed.reduce(function (s, p) { return s + (p.pl || 0); }, 0);
    var cash = cap + realized - invested;
    var equity = cash + mktValue;

    var today = new Date().toDateString();
    var deployedToday = 0, closedToday = 0, plToday = 0;
    P.forEach(function (p) {
      if (p.openedAt && new Date(p.openedAt).toDateString() === today) deployedToday += p.entry * p.qty;
      if (p.status === "closed" && p.exitAt && new Date(p.exitAt).toDateString() === today) {
        closedToday++; plToday += (p.pl || 0);
      }
    });

    var wins = closed.filter(function (p) { return (p.pl || 0) > 0; });
    var losses = closed.filter(function (p) { return (p.pl || 0) <= 0; });
    var gw = wins.reduce(function (s, p) { return s + p.pl; }, 0);
    var gl = Math.abs(losses.reduce(function (s, p) { return s + p.pl; }, 0));

    var curve = closed.slice().sort(function (a, b) { return (a.exitAt || 0) - (b.exitAt || 0); });
    var eq = cap, peak = cap, maxDD = 0;
    curve.forEach(function (p) {
      eq += (p.pl || 0);
      if (eq > peak) peak = eq;
      if (peak > 0) maxDD = Math.max(maxDD, ((peak - eq) / peak) * 100);
    });
    if (equity > peak) peak = equity;
    var curDD = peak > 0 ? Math.max(0, ((peak - equity) / peak) * 100) : 0;
    maxDD = Math.max(maxDD, curDD);

    return {
      capital: cap, cash: cash, invested: invested, mktValue: mktValue, equity: equity,
      openPL: openPL, openPLPct: invested > 0 ? (openPL / invested) * 100 : 0,
      realized: realized, totalPL: equity - cap,
      returnPct: cap > 0 ? ((equity - cap) / cap) * 100 : 0,
      exposurePct: equity > 0 ? (mktValue / equity) * 100 : 0,
      openRisk: openRisk, openRiskPct: equity > 0 ? (openRisk / equity) * 100 : 0,
      deployedToday: deployedToday, closedToday: closedToday, plToday: plToday,
      dailyCeiling: equity * (DL.S.profile.maxDailyPct / 100),
      roomToday: Math.max(0, equity * (DL.S.profile.maxDailyPct / 100) - deployedToday),
      open: open, closed: closed,
      winRate: closed.length ? (wins.length / closed.length) * 100 : null,
      avgWin: wins.length ? gw / wins.length : null,
      avgLoss: losses.length ? -gl / losses.length : null,
      profitFactor: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null),
      maxDD: maxDD, drawdown: curDD
    };
  }

  /* ---------- patrones del diario ----------
     Analiza TUS operaciones cerradas para encontrar reglas propias:
     no predice nada nuevo, describe cómo has operado hasta ahora.
     Exige un mínimo de operaciones por grupo para no confundir
     casualidad con patrón — la misma lección que enseñaba el
     Backtest Lab sobre el sobreajuste, aplicada a tu propio historial. */
  var MIN_TRADES = 5, MIN_BUCKET = 3, MIN_GAP = 25;

  function bucketize(closed, keyFn) {
    var b = {};
    closed.forEach(function (p) {
      var k = keyFn(p);
      if (k == null) return;
      b[k] = b[k] || { n: 0, wins: 0, pl: 0 };
      b[k].n++;
      if ((p.pl || 0) > 0) b[k].wins++;
      b[k].pl += (p.pl || 0);
    });
    return b;
  }

  function spread(buckets, minGap) {
    var keys = Object.keys(buckets).filter(function (k) { return buckets[k].n >= MIN_BUCKET; });
    if (keys.length < 2) return null;
    keys.forEach(function (k) { buckets[k].wr = (buckets[k].wins / buckets[k].n) * 100; });
    keys.sort(function (a, b) { return buckets[a].wr - buckets[b].wr; });
    var worst = keys[0], best = keys[keys.length - 1];
    if (buckets[best].wr - buckets[worst].wr < minGap) return null;
    return { worst: worst, best: best, wWorst: buckets[worst], wBest: buckets[best] };
  }

  function journalInsights() {
    var closed = DL.S.pos.filter(function (p) { return p.status === "closed"; });
    if (closed.length < MIN_TRADES) return { ready: false, n: closed.length, need: MIN_TRADES - closed.length };

    var out = [];

    // 1 · tiempo en la posición vs. resultado
    var holdB = bucketize(closed, function (p) {
      if (!p.openedAt || !p.exitAt) return null;
      var hrs = (p.exitAt - p.openedAt) / 3600000;
      return hrs < 2 ? T("menos de 2 h", "under 2 h") : hrs < 24 ? "2–24 h" : hrs < 120 ? T("1–5 días", "1–5 days") : T("más de 5 días", "over 5 days");
    });
    var sHold = spread(holdB, MIN_GAP);
    if (sHold) out.push({
      tone: "bad",
      text: T("Cuando la operación dura " + sHold.worst + " aciertas solo " + sHold.wWorst.wr.toFixed(0) +
              "% (" + sHold.wWorst.n + " operaciones), contra " + sHold.wBest.wr.toFixed(0) + "% cuando dura " + sHold.best + ".",
              "When a trade lasts " + sHold.worst + " you win only " + sHold.wWorst.wr.toFixed(0) +
              "% (" + sHold.wWorst.n + " trades), versus " + sHold.wBest.wr.toFixed(0) + "% when it lasts " + sHold.best + ".")
    });

    // 2 · tamaño de la posición vs. resultado
    var sizeB = bucketize(closed, function (p) {
      if (p.costPct == null) return null;
      return p.costPct < 5 ? T("posiciones pequeñas (<5%)", "small positions (<5%)")
        : p.costPct < 12 ? T("posiciones medianas (5–12%)", "medium positions (5–12%)")
        : T("posiciones grandes (>12%)", "large positions (>12%)");
    });
    var sSize = spread(sizeB, MIN_GAP);
    if (sSize) out.push({
      tone: "bad",
      text: T("En " + sSize.worst + " aciertas " + sSize.wWorst.wr.toFixed(0) + "%, contra " + sSize.wBest.wr.toFixed(0) + "% en " + sSize.best + ".",
              "In " + sSize.worst + " you win " + sSize.wWorst.wr.toFixed(0) + "%, versus " + sSize.wBest.wr.toFixed(0) + "% in " + sSize.best + ".")
    });

    // 3 · modo (si hay operaciones mezcladas)
    var modeName = function (id) { return DL.MODES[id] ? DL.MODES[id].label() : id; };
    var modeB = bucketize(closed, function (p) { return p.mode || null; });
    var sMode = spread(modeB, MIN_GAP);
    if (sMode) out.push({
      tone: "rev",
      text: T("En modo " + modeName(sMode.worst) + " aciertas " + sMode.wWorst.wr.toFixed(0) + "% de tus operaciones, contra " +
              sMode.wBest.wr.toFixed(0) + "% en " + modeName(sMode.best) + ".",
              "In " + modeName(sMode.worst) + " mode you win " + sMode.wWorst.wr.toFixed(0) + "% of your trades, versus " +
              sMode.wBest.wr.toFixed(0) + "% in " + modeName(sMode.best) + ".")
    });

    // 4 · salidas discrecionales (fuera del plan) vs. resultado
    var reasonB = bucketize(closed, function (p) { return p.exitReason || null; });
    if (reasonB.manual && reasonB.manual.n >= MIN_BUCKET && reasonB.manual.pl < 0) {
      out.push({
        tone: "bad",
        text: T("Tus " + reasonB.manual.n + " cierres discrecionales (antes de llegar al stop o al target) suman " +
                DL.sgn(reasonB.manual.pl) + " — salir del plan antes de tiempo te está costando dinero.",
                "Your " + reasonB.manual.n + " discretionary exits (before stop or target) add up to " +
                DL.sgn(reasonB.manual.pl) + " — leaving the plan early is costing you money.")
      });
    }

    // 5 · día de la semana en que cierras
    var DOW = function () {
      return DL.lang() === "en"
        ? ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"]
        : ["domingos", "lunes", "martes", "miércoles", "jueves", "viernes", "sábados"];
    };
    var dowB = bucketize(closed, function (p) {
      if (!p.exitAt) return null;
      return DOW()[new Date(p.exitAt).getDay()];
    });
    var sDow = spread(dowB, 30);
    if (sDow) out.push({
      tone: "rev",
      text: T("Los " + sDow.worst + " cierras con " + sDow.wWorst.wr.toFixed(0) + "% de aciertos (" +
              sDow.wWorst.n + " operaciones) — tu peor día de la semana.",
              "On " + sDow.worst + " you close with a " + sDow.wWorst.wr.toFixed(0) + "% win rate (" +
              sDow.wWorst.n + " trades) — your worst day of the week.")
    });

    if (!out.length) out.push({
      tone: "ok",
      text: T("Con " + closed.length + " operaciones cerradas todavía no aparece ningún patrón claro. Eso también es información: sigue registrando.",
              "With " + closed.length + " closed trades no clear pattern shows up yet. That's information too: keep logging.")
    });

    return { ready: true, n: closed.length, insights: out };
  }

  return {
    analyze: analyze, levels: levels, suggestPlan: suggestPlan,
    positionState: positionState, tradeRisk: tradeRisk, portfolio: portfolio,
    journalInsights: journalInsights
  };
})();
/* ============================================================
   Módulo 3b/6 — Radar y modo Mercado: sectores, índices y movers
   Datos reales de Yahoo Finance (los 11 ETF sectoriales SPDR
   estándar), igual que el resto de la app: nada inventado.
   ============================================================ */

DL.SECTORS = [
  ["XLK", "Tecnología", "Technology"], ["XLF", "Financiero", "Financials"], ["XLE", "Energía", "Energy"],
  ["XLV", "Salud", "Health care"], ["XLY", "Consumo discrecional", "Consumer discretionary"],

];
DL.sectorName = function (etf) {

DL.SECTOR_LEADERS = {

DL.sectorOf = function (sym) {

  return out;

/* índices del modo Mercado. BTC opera 24/7: es lo único que se mueve el fin de semana */
DL.INDICES = [

];

DL.RADAR = { loading: false, data: {}, days: 21, spikeThreshold: 1.5, updatedAt: 0 };
DL.MOVERS = { loading: false, data: {}, updatedAt: 0 };

DL.ENG.periodReturn = function (bars, days) {
  if (!bars || bars.length < 2) return null;
  var back = Math.min(days, bars.length - 1);
  var a = bars[bars.length - 1].c, b0 = bars[bars.length - 1 - back].c;
  return b0 ? ((a / b0) - 1) * 100 : null;
};
/* cambio de la última sesión: precio contra el cierre anterior real */
DL.ENG.dayChange = function (d) {
  if (!d || !d.prevClose || d.price == null) return null;
  return ((d.price - d.prevClose) / d.prevClose) * 100;
};
DL.ENG.ret = function (d, days) {
  if (!d) return null;
  return days === 1 ? DL.ENG.dayChange(d) : DL.ENG.periodReturn(d.bars, days);
};
DL.ENG.volRatio = function (vol, avgVol) {
  if (!avgVol || avgVol <= 0) return null;
  return vol / avgVol;
};

/* ---------- carga rápida y progresiva ----------
   1) pinta al instante lo que haya en caché, aunque sea viejo;
   2) pide todos los símbolos en UNA petición (spark, 20 por lote);
   3) lo que falte se pide uno por uno y se pinta a medida que llega. */
function fastLoad(store, syms, range, force) {
  syms.forEach(function (s) {
    if (!store.data[s]) {
      var c = DL.MKT.peekSpark(s, range) || DL.MKT.peek(s);
      if (c) store.data[s] = c;
    }
  });
  store.loading = true;
  DL.renderSoon();
  return DL.MKT.spark(syms, range, force).then(function (res) {
    Object.keys(res.data).forEach(function (s) { store.data[s] = res.data[s]; });
    DL.renderSoon();
    if (!res.missing.length) return;
    return Promise.all(res.missing.map(function (s) {
      var get = range === "5d" ? DL.MKT.quick(s, "5d", force) : DL.MKT.daily(s, force);
      return get.then(function (d) { store.data[s] = d; DL.renderSoon(); })
        .catch(function () { /* deja el dato anterior si lo hay */ });
    }));
  }).then(function () {
    store.loading = false;
    store.updatedAt = Date.now();
    DL.renderSoon();
  }, function () {
    store.loading = false;
    DL.renderSoon();
  });
}

DL.loadRadar = function (force) {
  if (DL.RADAR.loading) return Promise.resolve();
  var syms = DL.SECTORS.map(function (s) { return s[0]; });
  if (syms.indexOf(DL.BENCH) < 0) syms.push(DL.BENCH);
  return fastLoad(DL.RADAR, syms, "1y", force);
};

DL.moverUniverse = function () {
  var set = {};
  DL.INDICES.forEach(function (x) { set[x[0]] = 1; });
  DL.SECTORS.forEach(function (x) { set[x[0]] = 1; });
  Object.keys(DL.SECTOR_LEADERS).forEach(function (k) { DL.SECTOR_LEADERS[k].forEach(function (s) { set[s] = 1; }); });
  return Object.keys(set);
};
DL.loadMovers = function (force) {
  if (DL.MOVERS.loading) return Promise.resolve();
  return fastLoad(DL.MOVERS, DL.moverUniverse(), "5d", force);
};

/* mayores movimientos de la última sesión dentro de los sectores que seguimos */
DL.moversList = function () {
  var rows = [];
  Object.keys(DL.SECTOR_LEADERS).forEach(function (etf) {
    DL.SECTOR_LEADERS[etf].forEach(function (s) {
      var d = DL.MOVERS.data[s];
      var c = DL.ENG.dayChange(d);
      if (c != null) rows.push({ sym: s, etf: etf, chg: c, price: d.price, d: d });
    });
  });
  rows.sort(function (a, b) { return b.chg - a.chg; });
  var up = rows.filter(function (r) { return r.chg > 0; }).length;
  return {
    total: rows.length, up: up, down: rows.length - up,
    gainers: rows.slice(0, 5).filter(function (r) { return r.chg > 0; }),
    losers: rows.slice(-5).reverse().filter(function (r) { return r.chg < 0; })
  };
};

DL.sectorLeadersSheet = function (etf) {
  var name = DL.sectorName(etf);
  var cands = DL.SECTOR_LEADERS[etf] || [];
  var days = DL.route === "radar" ? DL.RADAR.days : 1;
  var body = DL.el('<div><p class="mute" style="font-size:12px"><span class="spin"></span> ' +

  var foot = DL.el('<div class="row" style="margin-top:12px;justify-content:flex-end"></div>');
  var seeEtf = DL.el('<button class="btn sm g"></button>');

  var s = DL.sheet(T("Líderes · ", "Leaders · ") + name, body, foot);

  foot.appendChild(seeEtf);

      return DL.MKT.daily(sym).then(function (d) {
