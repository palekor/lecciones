  var P = DL.ENG.portfolio(DL.prices());
  var pr = DL.S.profile;
  var sym = DL.tradeSym || (DL.S.watch[0] && DL.S.watch[0].sym) || "";
  var d = sym ? DL.data.bySym[sym] : null;
  var an = sym ? DL.data.an[sym] : null;
  var MD = DL.mode();

  var opts = DL.S.watch.map(function (w) { return w.sym; });
  Object.keys(DL.data.bySym).forEach(function (s) { if (opts.indexOf(s) < 0) opts.push(s); });

  var html = '<section class="card"><div class="head"><h3>' + DL.esc(T("Operar", "Trade")) + "</h3>" +
    DL.tag(T("simulado", "simulated"), "watch") + "</div>";

  if (!opts.length) {
    html += DL.empty(T("Primero agrega un activo", "Add an asset first"), T("Ve a Watchlist y escribe un símbolo real.", "Go to Watchlist and type a real symbol."));
    root.innerHTML = html + "</section>";
    return;
  }

  html += '<div class="fld" style="margin-bottom:12px"><label for="tsym">1 · ' + DL.esc(T("Símbolo", "Symbol")) + "</label>" +
    '<select id="tsym">' + opts.map(function (s) {
      return '<option value="' + DL.esc(s) + '"' + (s === sym ? " selected" : "") + ">" + DL.esc(s) + "</option>";
    }).join("") + "</select></div>";

  if (an && an.mode === "market") {
    html += '<div class="note" style="margin-bottom:12px"><b>' + DL.esc(T("Modo Mercado — sin estrategia.", "Market mode — no strategy.")) + "</b> " +
      DL.esc(T("La app no sugiere stop ni target: defínelos tú, o elige Scalping o Swing en Hoy para ver un plan. Tendencia: ",
               "The app won't suggest a stop or target: set them yourself, or pick Scalping or Swing on Today to see a plan. Trend: ")) +
      DL.esc(an.trend === "up" ? T("alcista", "up") : an.trend === "down" ? T("bajista", "down") : T("mixta", "mixed")) + ".</div>";
  } else if (an) {

    html += '<div class="note' + (an.score < 50 ? " bad" : "") + '" style="margin-bottom:12px">' +
      "<b>" + an.score + "/100 — " + an.state + ", " +
      DL.esc(T(an.confirmed + " de " + an.total + " condiciones confirmadas.", an.confirmed + " of " + an.total + " conditions confirmed.")) + "</b>" +
      (failed.length ? "<br>" + DL.esc(T("Sin confirmar: ", "Not confirmed: ")) +
        DL.esc(failed.map(function (c) { return c.label.split(" —")[0].split(" (")[0]; }).join(" · ")) : "") +
      (an.score < 50 ? "<br>" + DL.esc(T("Puedes operar igual — pero escribe en tu tesis por qué entras contra las condiciones.",
                                         "You can still trade — but write in your thesis why you're entering against the conditions.")) : "") +
      "</div>";
  }

  html += '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="tpx">2 · ' + DL.esc(T("Precio", "Price")) + '</label><input type="number" step="0.01" id="tpx" value="' +
    (d ? d.price.toFixed(2) : "") + '"></div>' +
    '<div class="fld"><label for="tqty">3 · ' + DL.esc(T("Cantidad", "Quantity")) + '</label><input type="number" step="1" min="0" id="tqty" value=""></div>' +
    "</div>";

  html += '<div class="row" style="margin-bottom:12px;gap:6px">' +
    '<button class="btn sm" id="qSug">' + DL.esc(T("Cantidad sugerida", "Suggested quantity")) + "</button>" +
    '<button class="btn sm" id="qMax">' + DL.esc(T("Máximo permitido", "Maximum allowed")) + "</button></div>";

  var plan = an ? DL.ENG.suggestPlan(an) : null;

  if (plan && plan.buyZone) {
    html += '<div class="zone buy" style="margin-bottom:10px"><span class="lab">' + DL.esc(T("Zona de compra sugerida", "Suggested buy zone")) + "</span>" +
      '<span class="val">' + DL.money(plan.buyZone[0]) + " – " + DL.money(plan.buyZone[1]) + "</span></div>";
  }

  html += '<div class="grid g2" style="margin-bottom:12px">' +
    '<div class="fld"><label for="tstop">4 · Stop' +
    DL.esc(MD.id === "scalp" ? " (tight stop, " + MD.stopAtr + "× ATR)" : T(" (dónde tu idea queda invalidada)", " (where your idea is invalidated)")) + "</label>" +
    '<input type="number" step="0.01" id="tstop" value="' + (plan ? plan.stop.toFixed(2) : "") + '"></div>' +
    '<div class="fld"><label for="ttgt">5 · Target</label>' +

    "</div>";

  html += '<div id="riskOut"></div>';
  html += '<div class="fld" style="margin-top:12px"><label for="tthesis">' + DL.esc(T("Tu tesis en una frase", "Your thesis in one sentence")) + "</label>" +
    '<textarea id="tthesis" placeholder="' + DL.esc(T("Qué crees que va a pasar y por qué.", "What you think will happen and why.")) + '"></textarea></div>';
  html += '<button class="btn p blk" id="tgo" style="margin-top:12px">' + DL.esc(T("Registrar operación simulada", "Log simulated trade")) + "</button>";

  var elSym = DL.$("#tsym", root), elPx = DL.$("#tpx", root), elQty = DL.$("#tqty", root),

      go = DL.$("#tgo", root);

  function calc() {
    return DL.ENG.tradeRisk({
      price: elPx.value, qty: elQty.value, stop: elStop.value, target: elTgt.value,
      equity: P.equity, cash: P.cash, maxDailyPct: pr.maxDailyPct, maxRiskPct: pr.maxRiskPct,
      deployedToday: P.deployedToday
    });
  }
  var LIMIT = { risk: T("riesgo", "risk"), day: T("cupo diario", "daily room"), cash: T("efectivo", "cash") };
  function paint() {
    var c = calc();
    var warn = "";
    if (c.overCash) warn += '<div class="note bad" style="margin-bottom:8px"><b>' + DL.esc(T("Excede tu efectivo.", "Exceeds your cash.")) + "</b> " +
      DL.esc(T("Tienes " + DL.money(P.cash, 0) + " disponible y esta compra cuesta " + DL.money(c.cost, 0) + ".",
               "You have " + DL.money(P.cash, 0) + " available and this purchase costs " + DL.money(c.cost, 0) + ".")) + "</div>";
    if (c.overDaily) warn += '<div class="note bad" style="margin-bottom:8px"><b>' + DL.esc(T("Excede el límite diario.", "Exceeds the daily limit.")) + "</b> " +
      DL.esc(T("Llegarías a " + DL.pctp(c.dayPct, 1) + " del equity y tu tope es " + pr.maxDailyPct + "%.",
               "You'd reach " + DL.pctp(c.dayPct, 1) + " of equity and your cap is " + pr.maxDailyPct + "%.")) + "</div>";
    if (c.overRisk) warn += '<div class="note bad" style="margin-bottom:8px"><b>' + DL.esc(T("Excede tu riesgo por operación.", "Exceeds your risk per trade.")) + "</b> " +
      DL.esc(T("Arriesgas " + DL.pctp(c.riskPct, 2) + " y tu tope es " + pr.maxRiskPct + "%.",
               "You're risking " + DL.pctp(c.riskPct, 2) + " and your cap is " + pr.maxRiskPct + "%.")) + "</div>";
    if (!c.stopValid) warn += '<div class="note" style="margin-bottom:8px"><b>' + DL.esc(T("Falta el stop.", "Stop missing.")) + "</b> " +
      DL.esc(T("Sin stop no hay riesgo calculable: pon el precio por debajo de la entrada, donde tu idea quedaría invalidada.",
               "Without a stop there's no measurable risk: set a price below entry, where your idea would be invalidated.")) + "</div>";

    out.innerHTML = warn +
      '<div class="grid g3" style="margin-bottom:10px">' +
      DL.ro(T("Costo total", "Total cost"), DL.money(c.cost, 2)) +
      DL.ro(T("% del capital", "% of capital"), DL.pctp(c.costPct, 1), c.costPct > pr.maxDailyPct ? "neg" : "") +
      DL.ro(T("Efectivo después", "Cash after"), DL.money(c.cashAfter, 0), c.cashAfter < 0 ? "neg" : "") +
      "</div>" +
      '<div class="grid g3" style="margin-bottom:10px">' +
      DL.ro(T("Pérdida en el stop", "Loss at stop"), DL.money(c.riskAmount), "neg") +
      DL.ro(T("Eso es del equity", "Share of equity"), DL.pctp(c.riskPct, 2), c.overRisk ? "neg" : "pos") +
      DL.ro(T("Distancia al stop", "Distance to stop"), DL.pctp(c.stopDistPct, 2)) +
      "</div>" +
      '<div class="grid g3">' +
      DL.ro(T("Ganancia en el target", "Gain at target"), DL.money(c.rewardAmount), "pos") +
      DL.ro("Reward / Risk", c.rr ? "1 : " + c.rr.toFixed(2) : "—", c.rr >= 2 ? "pos" : c.rr >= 1.5 ? "warn" : "neg") +
      DL.ro(T("Distancia al target", "Distance to target"), DL.pctp(c.targetDistPct, 2)) +
      "</div>" +
      '<div class="note" style="margin-top:12px"><b>' + DL.esc(T("Desplegar no es arriesgar.", "Deploying isn't risking.")) + "</b> " +
      DL.esc(T("Pones " + DL.money(c.cost, 0) + " en el mercado (" + DL.pctp(c.costPct, 1) + " del capital), pero con el stop en " +
               DL.money(parseFloat(elStop.value) || 0) + " tu pérdida máxima planeada es " + DL.money(c.riskAmount) + " — " + DL.pctp(c.riskPct, 2) + " del equity.",
               "You put " + DL.money(c.cost, 0) + " in the market (" + DL.pctp(c.costPct, 1) + " of capital), but with the stop at " +
               DL.money(parseFloat(elStop.value) || 0) + " your maximum planned loss is " + DL.money(c.riskAmount) + " — " + DL.pctp(c.riskPct, 2) + " of equity.")) + "</div>" +
      '<div class="note" style="margin-top:8px"><b>' + DL.esc(T("Cómo se calcula el tamaño de posición por riesgo:", "How risk-based position size is calculated:")) + "</b><br>" +
      DL.esc(T("(Equity × " + pr.maxRiskPct + "% de riesgo) ÷ distancia al stop por unidad = cantidad máxima que arriesga solo lo permitido.",
               "(Equity × " + pr.maxRiskPct + "% risk) ÷ stop distance per unit = the maximum quantity that risks only what's allowed.")) + "<br>" +
      "(" + DL.money(P.equity, 0) + " × " + pr.maxRiskPct + "%) ÷ " + DL.money(c.riskPerShare || 0) +
      " = <b>" + DL.qty(c.suggestedQty) + T(" unidades", " units") + "</b> (" + DL.esc(T("limitado por ", "limited by ") + (LIMIT[c.limitedBy] || c.limitedBy)) + ").</div>";

    go.disabled = !c.ok;
    return c;
  }

  [elPx, elQty, elStop, elTgt].forEach(function (x) { x.oninput = function () { DL._tradeTouched = true; paint(); }; });
  DL.$("#tthesis", root).oninput = function () { DL._tradeTouched = true; };
  elSym.onchange = function () {
    DL.tradeSym = elSym.value;
    DL._tradeTouched = false;
    if (!DL.data.bySym[DL.tradeSym]) {
      DL.MKT.daily(DL.tradeSym).then(function (dd) {
        DL.data.bySym[dd.symbol || DL.tradeSym] = dd; DL.recomputeOne(dd.symbol || DL.tradeSym); DL.render();
      });
    } else DL.render();
  };
  DL.$("#qSug", root).onclick = function () { DL._tradeTouched = true; elQty.value = calc().suggestedQty; paint(); };
  DL.$("#qMax", root).onclick = function () {
    DL._tradeTouched = true;
    var c = calc();
    var px = parseFloat(elPx.value) || 0;
    elQty.value = px > 0 ? Math.floor(Math.min(P.cash, c.roomToday) / px) : 0;
    paint();
  };
  paint();

  go.onclick = function () {
    var c = calc();
    if (!c.ok) return;
    var p = {
      id: DL.uid("p"), sym: elSym.value, qty: parseFloat(elQty.value),
      entry: parseFloat(elPx.value), stop: parseFloat(elStop.value),
      target: parseFloat(elTgt.value) || null,
      thesis: DL.$("#tthesis", root).value.trim(),
      openedAt: Date.now(), status: "open",
      mode: DL.modeId,
      riskPct: c.riskPct, rr: c.rr, costPct: c.costPct,
      events: [{ t: Date.now(), k: "entry", px: parseFloat(elPx.value), note: "entry" }]
    };
    DL.S.pos.push(p);
    DL.addDiary(p.sym, "entry", T("Compra simulada: ", "Simulated buy: ") + DL.qty(p.qty) + T(" a ", " at ") + DL.money(p.entry) +
      " · stop " + DL.money(p.stop) + (p.target ? " · target " + DL.money(p.target) : "") +
      (p.thesis ? " · " + p.thesis : ""), p.entry);
    if (!DL.S.watch.some(function (w) { return w.sym === p.sym; })) {
      DL.S.watch.push({ sym: p.sym, name: (DL.data.bySym[p.sym] || {}).name || p.sym, note: "", addedAt: Date.now() });
    }
    DL._tradeTouched = false;
    DL.save(); DL.toast(T("Operación registrada", "Trade logged")); DL.go("port");
  };
};

    DL.ro(T("Retorno total", "Total return"), DL.pct(P.returnPct), DL.tone(P.returnPct), "lg") +
    "</div>" +
    '<div class="grid g3">' +
    DL.ro(T("Efectivo", "Cash"), DL.money(P.cash, 0), "", "sm") +
    DL.ro(T("Invertido", "Invested"), DL.money(P.mktValue, 0), "", "sm") +
    DL.ro(T("Exposición", "Exposure"), DL.pctp(P.exposurePct, 1), "", "sm") +
    DL.ro(T("P/L abierto", "Open P/L"), DL.sgn(P.openPL), DL.tone(P.openPL), "sm") +

  if (!P.closed.length) {
    html += DL.empty(T("Todavía no cierras ninguna posición", "You haven't closed any position yet"), T("El historial no se sobrescribe nunca.", "History is never overwritten."));
  } else {
    html += '<div class="grid g4" style="margin-bottom:12px">' +
      DL.ro(T("Aciertos", "Win rate"), P.winRate == null ? "—" : DL.pctp(P.winRate, 0), "", "sm") +
      DL.ro(T("Ganancia media", "Average win"), P.avgWin == null ? "—" : DL.money(P.avgWin), "pos", "sm") +
      DL.ro(T("Pérdida media", "Average loss"), P.avgLoss == null ? "—" : DL.money(P.avgLoss), "neg", "sm") +
      DL.ro(T("Drawdown máx.", "Max drawdown"), DL.pctp(P.maxDD, 1), "", "sm") +
      "</div>";
    html += '<div class="scroll"><table><thead><tr><th></th><th>' + DL.esc(T("Entrada", "Entry")) + "</th><th>" + DL.esc(T("Salida", "Exit")) +
      "</th><th>" + DL.esc(T("Resultado", "Result")) + "</th><th>R</th></tr></thead><tbody>" +
      P.closed.slice().sort(function (a, b) { return b.exitAt - a.exitAt; }).map(function (p) {
        return "<tr class='clk' data-sym='" + DL.esc(p.sym) + "'><td><b class='n'>" + DL.esc(p.sym) + "</b><br><span class='eyebrow'>" + DL.day(p.exitAt) + "</span></td>" +
          "<td class='n'>" + DL.money(p.entry) + "</td>" +
          "<td class='n'>" + DL.money(p.exitPx) + "</td>" +
          "<td class='n " + DL.tone(p.pl) + "'>" + DL.sgn(p.pl) + "</td>" +
          "<td class='n'>" + (p.rMultiple == null ? "—" : (p.rMultiple >= 0 ? "+" : "") + p.rMultiple.toFixed(2) + "R") + "</td></tr>";
      }).join("") + "</tbody></table></div>";

  DL.$$("tr.clk", root).forEach(function (tr) { tr.onclick = function () { DL.openAsset(tr.dataset.sym); }; });

      var an = DL.data.an[p.sym];

      var card = DL.el('<button type="button" style="display:block;width:100%;text-align:left;background:var(--plate2);' +
        'border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px"></button>');
      card.innerHTML =
        '<div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<span class="n" style="font-size:14px;font-weight:600">' + DL.esc(p.sym) + "</span>" +
        DL.tag(st.s, st.s.toLowerCase()) + "</div>" +
        '<div class="grid g4">' +
        DL.ro(T("Cantidad", "Quantity"), DL.qty(p.qty), "", "sm") +
        DL.ro(T("Registro", "Entry"), DL.money(p.entry), "", "sm") +
        DL.ro(T("Actual", "Now"), DL.money(p._px), "", "sm") +
        DL.ro("P/L", DL.sgn(p._pl), DL.tone(p._pl), "sm") +
        "</div>" +
        '<div class="row" style="margin-top:8px;gap:10px">' +
        '<span class="n" style="font-size:11px;color:var(--neg)">stop ' + DL.money(p.stop) + "</span>" +
        '<span class="n" style="font-size:11px;color:var(--pos)">target ' + (p.target ? DL.money(p.target) : "—") + "</span>" +
        '<span class="n" style="font-size:11px;color:var(--muted)">' + DL.pct(p._plPct) + "</span></div>";
      card.onclick = function () { DL.openAsset(p.sym); };
      list.appendChild(card);
    });
  }

  var cv = DL.$("#eqCurve", root);
  if (cv) {
    var pts = [DL.S.profile.capital], eq = DL.S.profile.capital;
    P.closed.slice().sort(function (a, b) { return a.exitAt - b.exitAt; })
      .forEach(function (p) { eq += (p.pl || 0); pts.push(eq); });
    pts.push(P.equity);
    DL.CH.equityCurve(cv, pts, 90);
  }
};

DL.VIEW_diary = function (root) {
  var J = DL.ENG.journalInsights();
  var html = '<section class="card"><div class="head"><h3>' + DL.esc(T("Patrones en tus operaciones", "Patterns in your trades")) + "</h3>" +
    DL.tag(J.ready ? J.n + T(" cerradas", " closed") : T("faltan datos", "need more data"), "watch") + "</div>";
  if (!J.ready) {
    html += DL.empty(T("Necesitas más operaciones cerradas", "You need more closed trades"),
      T("Cierra al menos " + J.need + " operaciones más para que la app busque patrones reales en tu historial. Con pocas operaciones cualquier patrón sería casualidad, no una regla.",
        "Close at least " + J.need + " more trades so the app can look for real patterns in your history. With few trades any pattern would be chance, not a rule."));
  } else {
    html += J.insights.map(function (i) {
      var cls = i.tone === "bad" ? "bad" : i.tone === "rev" ? "rev" : "ok";
      var lab = i.tone === "bad" ? T("Atención", "Heads up") : i.tone === "rev" ? T("Fíjate", "Notice") : T("Nota", "Note");
      return '<div class="alert ' + cls + '"><b>' + DL.esc(lab) + "</b>" + DL.esc(i.text) + "</div>";
    }).join("") +
      '<p style="margin-top:8px;font-size:11.5px;color:var(--faint);line-height:1.5">' +
      DL.esc(T("Estos patrones salen de tus propias operaciones — no son garantía de nada. Con pocas operaciones un patrón puede ser casualidad; entre más operaciones cierres, más confiable se vuelve.",
               "These patterns come from your own trades — they guarantee nothing. With few trades a pattern can be chance; the more trades you close, the more reliable it gets.")) + "</p>";
  }
  html += "</section>";

  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Diario", "Journal")) + "</h3>" +
    '<span class="eyebrow">' + DL.S.diary.length + T(" registros", " entries") + "</span></div>";
  if (!DL.S.diary.length) {
    html += DL.empty(T("Tu diario está vacío", "Your journal is empty"),
      T("Cada activo agregado, cada compra, seguimiento y cierre queda registrado aquí automáticamente.",
        "Every asset added, buy, follow-up and exit is logged here automatically."));
    root.innerHTML = html + "</section>";
    return;
  }
  var KIND = {
    watch: ["Watchlist", "watch"], entry: [T("Compra", "Buy"), "buy"], follow: [T("Seguimiento", "Follow-up"), "hold"],
    stop: ["Stop", "wait"], exit: [T("Cierre", "Exit"), "sell"], note: [T("Nota", "Note"), ""]
  };
  html += DL.S.diary.slice(0, 120).map(function (e) {
    var d = DL.data.bySym[e.sym];
    var pct = (e.pxAt && d) ? ((d.price - e.pxAt) / e.pxAt) * 100 : null;
    var k = KIND[e.kind] || [T("Registro", "Entry"), ""];
    return '<div style="padding:12px 0;border-bottom:1px solid var(--soft)">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:5px">' +
      '<span class="row" style="gap:7px"><button type="button" class="diary-sym" data-sym="' + DL.esc(e.sym) +
      '" style="background:none;border:0;padding:0;cursor:pointer;color:inherit">' +
      '<b class="n" style="font-size:13px;text-decoration:underline;text-underline-offset:2px">' + DL.esc(e.sym) + "</b></button>" +
      DL.tag(k[0], k[1]) + "</span>" +
      '<span class="eyebrow">' + DL.day(e.t) + "</span></div>" +
      '<div style="font-size:12.5px;color:var(--text2);line-height:1.45">' + DL.esc(e.text) + "</div>" +
      (e.pxAt ? '<div class="row" style="margin-top:6px;gap:12px">' +
        '<span class="n" style="font-size:11.5px;color:var(--muted)">' + T("registro ", "logged at ") + DL.money(e.pxAt) + "</span>" +
        (pct != null ? '<span class="n ' + DL.tone(pct) + '" style="font-size:11.5px">' +
          DL.pct(pct) + T(" hoy vs. ese precio", " now vs. that price") + "</span>" : "") + "</div>" : "") +
      "</div>";
  }).join("");
  html += "</section>";
  root.innerHTML = html;
  DL.$$(".diary-sym", root).forEach(function (b) {
    b.onclick = function () { DL.openAsset(b.dataset.sym); };
  });
};

/* ============================================================
   LISTAS DE LA WATCHLIST
   ============================================================ */
DL.listsSheet = function () {
  var body = DL.el("<div></div>");
  var s = DL.sheet(T("Tus listas", "Your lists"), body);

  // aviso visible DENTRO de la hoja (el toast puede quedar tapado por el teclado)
  function flash(msg, tone) {
    var old = body.querySelector(".flash"); if (old) old.remove();
    var n = DL.el('<div class="flash note' + (tone === "bad" ? " bad" : "") + '" style="margin-bottom:10px"><b>' +
      DL.esc(msg) + "</b></div>");
    body.insertBefore(n, body.firstChild);
    setTimeout(function () { if (n.parentNode) n.remove(); }, 3500);
  }

  function paint() {
    body.innerHTML = '<div id="listsRows">' + DL.S.lists.map(function (l) {
      var n = DL.S.watch.filter(function (w) { return w.list === l.id; }).length;
      return '<div class="listrow" data-id="' + DL.esc(l.id) + '">' +
        '<span class="n" style="font-size:13px">' + DL.esc(l.name) +
        '<span class="eyebrow" style="margin-left:8px">' + n + T(" activos", " assets") + "</span></span>" +
        '<div class="row" style="gap:6px">' +
        '<button type="button" class="btn sm g" data-act="ren">' + DL.esc(T("Renombrar", "Rename")) + "</button>" +
        (DL.S.lists.length > 1 ? '<button type="button" class="btn sm dngr" data-act="del">' + DL.esc(T("Eliminar", "Delete")) + "</button>" : "") +
        "</div></div>";
    }).join("") + "</div>" +
      '<div class="fld" style="margin-top:14px"><label for="newList">' + DL.esc(T("Nueva lista", "New list")) + "</label>" +
      '<div class="row" style="gap:7px"><input type="text" id="newList" maxlength="30" style="flex:1" placeholder="' +
      DL.esc(T("Ej. Scalping, Dividendos, Cripto", "e.g. Scalping, Dividends, Crypto")) + '">' +
      '<button class="btn p sm" id="addList">' + DL.esc(T("Crear", "Create")) + "</button></div></div>" +
      (DL.S.lists.length === 1 ? '<p style="margin-top:10px;font-size:11.5px;color:var(--faint)">' +
        DL.esc(T("Siempre debe quedar al menos una lista.", "At least one list must always remain.")) + "</p>" : "");

    DL.$$(".listrow", body).forEach(function (row) {
      var id = row.dataset.id;
      var list = DL.S.lists.filter(function (l) { return l.id === id; })[0];
      row.querySelector('[data-act="ren"]').onclick = function () { DL.renameListSheet(list, paint); };
      var del = row.querySelector('[data-act="del"]');
      if (del) del.onclick = function () {
        var dest = DL.S.lists.filter(function (l) { return l.id !== id; })[0];   // nunca la misma que se borra
        if (!dest) return;
        var n = DL.S.watch.filter(function (w) { return w.list === id; }).length;
        DL.confirm(T("Eliminar “", "Delete “") + list.name + "”",
          n ? T("Los " + n + " activos de esta lista pasan a “" + dest.name + "” — no se borra ningún activo.",
                "The " + n + " assets in this list move to “" + dest.name + "” — no asset is deleted.")
            : T("Esta lista está vacía. Se elimina sin tocar nada más.", "This list is empty. It is deleted without touching anything else."),
          function () {
            DL.S.watch.forEach(function (w) { if (w.list === id) w.list = dest.id; });
            DL.S.lists = DL.S.lists.filter(function (l) { return l.id !== id; });
            if (DL.current.list === id) DL.current.list = "all";
            DL.save(); paint(); DL.render();
            flash("“" + list.name + "” " + T("eliminada", "deleted"), "bad");
          }, T("Eliminar", "Delete"));
      };
    });

    var addBtn = body.querySelector("#addList");
    var inp = body.querySelector("#newList");
    function create() {
      var v = inp.value.trim().replace(/\s+/g, " ");
      if (!v) { flash(T("Escribe un nombre para la lista", "Type a name for the list"), "bad"); inp.focus(); return; }
      var dup = DL.S.lists.filter(function (l) { return DL.listKey(l.name) === DL.listKey(v); })[0];
      if (dup) { flash(T("Ya tienes una lista llamada “", "You already have a list called “") + dup.name + "”", "bad"); inp.select(); return; }
      addBtn.disabled = true;   // evita el doble toque
      var nl = { id: DL.uid("l"), name: v, order: DL.S.lists.length, _u: Date.now() };
      DL.S.lists.push(nl);
      DL.current.list = nl.id;  // la lista nueva queda abierta: lo que agregues cae ahí
      DL.save();
      inp.blur(); s.close(); DL.render();
      DL.toast("✓ " + T("Lista “" + v + "” creada — lo que agregues ahora cae aquí",
                             "List “" + v + "” created — what you add now goes here"));
    }
    addBtn.onclick = create;
    inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); create(); } };
  }
  paint();
};

DL.renameListSheet = function (list, after) {
  var body = DL.el('<div class="fld"><label for="rlName">' + DL.esc(T("Nombre de la lista", "List name")) + "</label>" +
    '<input type="text" id="rlName" maxlength="30" value="' + DL.esc(list.name) + '"></div>');
  var foot = DL.el('<div class="row" style="margin-top:14px;justify-content:flex-end"></div>');
  var ok = DL.el('<button class="btn p">' + DL.esc(T("Guardar", "Save")) + "</button>");
  ok.onclick = function () {
    var v = body.querySelector("#rlName").value.trim().replace(/\s+/g, " ");
    if (!v) return;
    var dup = DL.S.lists.some(function (l) { return l.id !== list.id && DL.listKey(l.name) === DL.listKey(v); });
    if (dup) { DL.toast(T("Ya tienes otra lista con ese nombre", "You already have another list with that name")); return; }
    list.name = v; list._u = Date.now();
    DL.save(); s.close(); DL.toast(T("Lista renombrada", "List renamed")); DL.render();
    if (after) after();
  };
  foot.appendChild(ok);
  var inp = body.querySelector("#rlName");

  };

};

/* ============================================================
   Módulo 6b/6 — vista Radar: rotación sectorial y señales de volumen
   ============================================================ */
DL.RADAR_RANGES = [[1, "1D"], [5, "1S", "1W"], [21, "1M"], [63, "3M"], [126, "6M"], [252, "1A", "1Y"]];
DL.VIEW_radar = function (root) {
  var R = DL.RADAR;
  var html = "";
  var bench = R.data[DL.BENCH];

  /* --- rotación sectorial --- */
  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Rotación sectorial", "Sector rotation")) + "</h3>" +
    '<div class="row" style="gap:6px">' +
    '<div class="seg" id="secRange">' +
    DL.RADAR_RANGES.map(function (r) {
      return '<button type="button" data-d="' + r[0] + '" aria-pressed="' + (R.days === r[0]) + '">' + DL.esc(T(r[1], r[2] || r[1])) + "</button>";
    }).join("") + "</div>" +
    '<button class="btn sm g" id="secRefresh" title="' + DL.esc(T("Actualizar sectores", "Refresh sectors")) + '" aria-label="' +
    DL.esc(T("Actualizar sectores", "Refresh sectors")) + '">' + (R.loading ? '<span class="spin"></span>' : "⟳") + "</button></div></div>";

  var bRet = bench ? DL.ENG.ret(bench, R.days) : null;
  var rows = DL.SECTORS.map(function (s) {
    var d = R.data[s[0]];
    var ret = d ? DL.ENG.ret(d, R.days) : null;
    return { sym: s[0], name: DL.sectorName(s[0]), ret: ret, rel: (ret != null && bRet != null) ? ret - bRet : null };
  }).filter(function (r) { return r.ret != null; })
    .sort(function (a, b) { return b.ret - a.ret; });

  if (!rows.length) {
    html += R.loading
      ? '<p class="mute" style="font-size:13px"><span class="spin"></span> ' + DL.esc(T("Cargando los 11 sectores…", "Loading the 11 sectors…")) + "</p>"
      : DL.empty(T("Sin datos de sectores todavía", "No sector data yet"), T("Toca ⟳ para cargar los 11 ETF sectoriales.", "Tap ⟳ to load the 11 sector ETFs."));
  } else {
    var maxAbs = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.ret); }).concat([R.days === 1 ? 0.5 : 1]));
    html += '<div id="secList">' + rows.map(function (r) {
      var w = Math.min(100, (Math.abs(r.ret) / maxAbs) * 100);
      var up = r.ret >= 0;
      return '<div class="sector-row" data-sym="' + DL.esc(r.sym) + '" role="button" tabindex="0">' +
        '<div><div class="et">' + DL.esc(r.sym) + '</div><div class="nm">' + DL.esc(r.name) + "</div></div>" +
        '<div class="rsbar"><i class="' + (up ? "pos" : "neg") + '" style="' +
        (up ? "left:50%;" : "right:50%;") + "width:" + (w / 2).toFixed(1) + '%"></i></div>' +
        '<div class="pc ' + DL.tone(r.ret) + '">' + DL.pct(r.ret, R.days === 1 ? 2 : 1) + "</div>" +
        "</div>";
    }).join("") + "</div>";
    if (rows.length < DL.SECTORS.length && R.loading) {
      html += '<p class="mute" style="font-size:11.5px;margin-top:6px"><span class="spin"></span> ' +
        DL.esc(T("Faltan " + (DL.SECTORS.length - rows.length) + " sectores…", (DL.SECTORS.length - rows.length) + " sectors to go…")) + "</p>";
    }
    html += '<p style="margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.5">' +
      T("Comparado contra ", "Compared against ") + DL.esc(DL.BENCH) + " (" + (bRet == null ? "—" : DL.pct(bRet, 1)) +
      T(" en el mismo periodo). Los sectores arriba están liderando el mercado (", " over the same period). Sectors at the top are leading the market (") +
      DL.term("sector rotation") + T("); los de abajo se están quedando atrás.", "); those at the bottom are lagging.") +
      (R.days === 1 && bench ? " " + DL.esc(T("1D = última sesión: ", "1D = last session: ") + DL.sess(bench).short + ".") : "") +
      (R.updatedAt ? " " + DL.esc(T("Actualizado ", "Updated ") + DL.hm(R.updatedAt) + ".") : "") + "</p>";
  }
  html += "</section>";

  /* --- señales de volumen (sobre tu watchlist) --- */
  var syms = DL.symbolsInUse();
  var spikes = syms.map(function (s) {
    var an = DL.data.an[s];
    if (!an) return null;
    var r = DL.ENG.volRatio(an.vol, an.avgVol);
    return r != null ? { sym: s, ratio: r, chg: an.chgPct } : null;
  }).filter(function (x) { return x && x.ratio >= R.spikeThreshold; })
    .sort(function (a, b) { return b.ratio - a.ratio; });

  html += '<section class="card"><div class="head"><h3>' + DL.esc(T("Señales de volumen", "Volume signals")) + "</h3>" +
    '<span class="eyebrow">' + DL.esc(T("tu watchlist", "your watchlist")) + "</span></div>";
  if (!syms.length) {
    html += DL.empty(T("Tu watchlist está vacía", "Your watchlist is empty"), T("Agrega activos reales para que la app vigile su volumen.", "Add real assets so the app can watch their volume."));
  } else if (!spikes.length) {
    html += DL.empty(T("Sin picos de volumen ahora mismo", "No volume spikes right now"),
      T("Se marca un activo cuando el volumen de su última sesión supera " + R.spikeThreshold + "× su promedio de 20 sesiones.",
        "An asset is flagged when its last session's volume exceeds " + R.spikeThreshold + "× its 20-session average."));
  } else {
    html += spikes.map(function (sp) {
      return '<div class="sector-row" data-sym="' + DL.esc(sp.sym) + '" role="button" tabindex="0">' +
        '<div><div class="et">' + DL.esc(sp.sym) + '</div><div class="nm">' + DL.term("volume spike") + "</div></div>" +
        "<div>" + DL.tag(sp.ratio.toFixed(1) + T("× promedio", "× average"), "spike") + "</div>" +
        '<div class="pc ' + DL.tone(sp.chg) + '">' + DL.pct(sp.chg) + "</div>" +
        "</div>";
    }).join("") +
      '<p style="margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.5">' +
      T("Un pico de volumen no dice si el precio va a subir o bajar — dice que algo cambió. La ",
        "A volume spike doesn't say whether price will rise or fall — it says something changed. The asset's ") +
      DL.term("relative strength") + T(" del activo frente al mercado te ayuda a leer si el movimiento tiene fuerza real.",
        " against the market helps you read whether the move has real strength.") + "</p>";
  }
  html += "</section>";

  root.innerHTML = html;

  DL.$$("#secRange button", root).forEach(function (b) {
    b.onclick = function () { R.days = parseInt(b.dataset.d, 10); DL.render(); };
  });
  var rf = DL.$("#secRefresh", root);
  if (rf) rf.onclick = function () { DL.loadRadar(true); };

  DL.$$(".sector-row", root).forEach(function (row) {
    var go = function (e) {
      if (e && e.target && e.target.closest && e.target.closest(".term")) return;   // tocar el término muestra su glosa
      var sym = row.dataset.sym;
      if (DL.SECTOR_LEADERS[sym]) DL.sectorLeadersSheet(sym); else DL.openAsset(sym);
    };
    row.onclick = go;
    row.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });

  // carga (o refresca en segundo plano) si no hay datos o si envejecieron
  var old = !R.updatedAt || Date.now() - R.updatedAt > (DL.MKT.clock().open ? 5 : 30) * 60000;
  if (!R.loading && old) DL.loadRadar(false);
};

  var views = { "v-home": T("Hoy", "Today"), "v-watch": "Watchlist", "v-trade": T("Operar", "Trade"),
                "v-port": T("Portafolio", "Portfolio"), "v-diary": T("Diario", "Journal"),
                "v-asset": T("Activo", "Asset"), "v-radar": "Radar" };
  Object.keys(views).forEach(function (id) { var v = document.getElementById(id); if (v) v.setAttribute("aria-label", views[id]); });
  if (DL.CLOUD && DL.CLOUD.repaint) DL.CLOUD.repaint();
};
DL.toggleLang = function () {
  DL.S.profile.lang = DL.lang() === "en" ? "es" : "en";
  DL.save();
  DL.applyLang();
  DL.recompute();                     // las condiciones del análisis se rotulan en el idioma activo
  DL.render();
};

DL._lastRenderedRoute = null;
DL.render = function () {
  var views = { home: "v-home", watch: "v-watch", trade: "v-trade", port: "v-port",
                diary: "v-diary", asset: "v-asset", radar: "v-radar" };
  DL._dirty = false;
  // si se vuelve a dibujar la MISMA pantalla (precios nuevos, sincronización),
  // se conserva el desplazamiento; al navegar (DL.go) sí se sube arriba
  var sameRoute = DL._lastRenderedRoute === DL.route;
  var keepY = sameRoute ? window.scrollY : 0;
  DL._lastRenderedRoute = DL.route;

  Object.keys(views).forEach(function (k) {
    var n = document.getElementById(views[k]);
    if (n) n.classList.toggle("on", k === DL.route);
  });
  DL.$$("#nav button").forEach(function (b) {
    b.setAttribute("aria-current", b.dataset.go === DL.route ? "true" : "false");
  });

  var root = document.getElementById(views[DL.route]);
  if (!root) return;

  if (!DL.S.profile.setup) {
    document.getElementById("v-home").classList.add("on");
    DL.setupScreen(document.getElementById("v-home"));
    return;
  }

  var sub = document.getElementById("brandsub");
  if (sub) {
    sub.textContent = DL.S.profile.name
      ? DL.S.profile.name + " · " + DL.mode().label()
      : T("Simulacro · capital simulado", "Simulation · simulated capital");
  }

  try {
    if (DL.route === "home") DL.VIEW_home(root);
    else if (DL.route === "watch") DL.VIEW_watch(root);
    else if (DL.route === "trade") DL.VIEW_trade(root);
    else if (DL.route === "port") DL.VIEW_port(root);
    else if (DL.route === "diary") DL.VIEW_diary(root);
    else if (DL.route === "asset") DL.VIEW_asset(root);
    else if (DL.route === "radar") DL.VIEW_radar(root);
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="note bad"><b>' + DL.esc(T("Algo falló al dibujar esta pantalla.", "Something failed while drawing this screen.")) + "</b> " +
      DL.esc(e.message || e) + "</div>";
  }

  var rf = document.getElementById("btnRefresh");
  if (rf) rf.innerHTML = DL.data.loading ? '<span class="spin"></span>' : "⟳";

  if (sameRoute && keepY > 0 && Math.abs(window.scrollY - keepY) > 1) window.scrollTo(0, keepY);
};

/* ---------- arranque ---------- */
(function boot() {
  DL.load();
  if (DL.S.profile.bench) DL.BENCH = DL.S.profile.bench;
  DL.modeId = "market";               // siempre arranca SIN estrategia, mirando el mercado del día
  DL.CLOUD.start();
  DL.applyLang();

  document.getElementById("btnCloud").onclick = function () { DL.CLOUD.accountSheet(); };
  document.getElementById("btnLang").onclick = DL.toggleLang;

  DL.$$("#nav button").forEach(function (b) {
    b.onclick = function () { DL.go(b.dataset.go); };
  });
  document.getElementById("btnSettings").onclick = function () {
    if (!DL.S.profile.setup) return;
    DL.settingsSheet();
  };
  document.getElementById("btnRefresh").onclick = function () {
    if (!DL.S.profile.setup || DL.data.loading) return;
    if (DL.route === "radar") DL.loadRadar(true);
    DL.sync(true, function () { DL.toast(T("Precios actualizados", "Prices updated")); });
  };

  // redibuja los gráficos cuando cambia el ancho (rotar el teléfono)
  var rt = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW) return;       // en móvil, mostrar/ocultar el teclado no cambia el ancho
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(function () { DL.renderSoon(); }, 220);
  });

  // al volver a la app, refresca si los datos ya envejecieron
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && DL.S.profile.setup &&
        Date.now() - DL.S.lastSync > 5 * 60 * 1000 && !DL.data.loading) {
      DL.sync(false);
    }
  });

  // con el mercado abierto, precios frescos cada 3 minutos mientras miras la app
  setInterval(function () {
    if (document.visibilityState !== "visible" || !DL.S.profile.setup || DL.data.loading) return;
    if (!DL.MKT.clock().open) return;
    if (Date.now() - DL.S.lastSync < 170 * 1000) return;
    DL.sync(true);
  }, 60 * 1000);

  // primera pintura con la caché: la app se ve completa antes de la primera respuesta de red
  DL.hydrate();
  DL.render();
  if (DL.S.profile.setup) DL.sync(false);
})();

</script>
</body>
</html>
