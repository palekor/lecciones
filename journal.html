/* re-draw the current page behind an open sheet, keeping the scroll position */
function repaint(){
  if(!["home","plan","classes","evolution"].includes(curRoute) || document.body.classList.contains("in-lesson")) return;
  const y = window.scrollY; VIEWS[curRoute](); window.scrollTo(0,y);
}
function setBody(cls){ document.body.classList.remove("in-lesson","in-onboarding"); if(cls) document.body.classList.add(cls); }

function teardown(){
  if(SP) finishSpeaking(true);
  stopReading();
  shadowPlaying = false;
}
function render(){
  teardown();
  let r = (location.hash||"#home").slice(1) || "home";
  if(r.startsWith("t=")){ receiveShared(r.slice(2)); r = "classes"; }
  if(r.startsWith("code=")){ const c = decodeURIComponent(r.slice(5)); r = state.onboarded ? "toolbox" : "onboarding"; setTimeout(()=>redeemLink(c), 80); }
  if(!state.onboarded && !(r==="lesson" && run && run.kind==="mirror")) r = "onboarding";
  else if(r==="onboarding") r = "home";
  if(r==="lesson" && !run){
    if(state.draft){ run = state.draft; run.lastTick = Date.now(); }
    else r = "home";
  }
  if(r!=="lesson" && run && run.finalized) run = null;
  if(("#"+r)!==location.hash) history.replaceState(null,"","#"+r);
  hideAction();
  closeSheet();
  setTab(r);
  curRoute = VIEWS[r] ? r : "home";
  if(state.onboarded && planOn()) todaySpec();
  VIEWS[curRoute]();
  window.scrollTo(0,0);
  if(pendingShare && state.onboarded && curRoute!=="lesson"){ const id = pendingShare; pendingShare = null; sharedSheet(id); }
  paintTierChip();
}

      : `<div class="panel mt"><p class="kicker">Your first mission</p><h3>Mission 1: ${esc(LESSONS[0].t)}</h3><p class="muted mt-s">${esc(LESSONS[0].obj)}</p></div>`;
    if(!(adv||mid)) ob.placement = "0";
    h = `<p class="ob-step mt">Step 4 of 5</p><h2 class="display">Your route</h2>
    <p class="muted mt-s">Seventeen missions in four stages. Your examples will focus on ${esc(CTX_LABEL[contextOf(ob.goal)])}.</p>${route}`;
    view.innerHTML = h; setAction({label:"Continue", act:"obNext", back:"obBack", disabled:ob.placement===null}); return;
  }
  if(s===5){
    if(!ob.plan) ob.plan = defaultPlanFor(ob.level);
    h = `<p class="ob-step mt">Step 5 of 5</p><h2 class="display">${T("Your study rhythm","Tu ritmo de estudio")}</h2>
    <p class="muted mt-s">${T("Small daily goals beat long weekends. Every mission becomes short, numbered micro-goals on your calendar — each one you check is a victory.","Las metas pequeñas diarias le ganan a los maratones de fin de semana. Cada misión se vuelve micro-metas cortas y numeradas en tu calendario: cada una que cumples es una victoria.")}</p>
    <div class="mt">${planSetupBody(ob.plan, "ob")}</div>`;
    view.innerHTML = h; setAction({label:"Save my route", act:"obFinish", back:"obBack", disabled:!ob.plan.days.length || ob.plan.habits.length<2}); return;
  }
};

VIEWS.evolution = function(){
  setBody("");
  const st = stats(), cyc = cycleInfo();
  const mir = state.mirrorSamples, ws = state.writingSamples.filter(w=>w.kind!=="mirror");
  let a=null, b=null, la="", lb="";
  if(mir.length>=2){ a=mir[0]; b=mir[mir.length-1]; la="Your starting point"; lb="Same prompt, now"; }
  else if(mir.length===1 && ws.length){ a=mir[0]; b=ws[ws.length-1]; la="Your starting point"; lb="Your latest writing"; }
  else if(state.writingSamples.length>=2){ a=state.writingSamples[0]; b=state.writingSamples[state.writingSamples.length-1]; la="Your first sample"; lb="Your latest sample"; }
  const sampleCard = (x,label,later) => {
    const text = x.text!=null ? x.text : x.content;
    const words = x.words||x.wordCount||wc(text);
    const date = x.date||x.createdAt;
    return `<article class="sample ${later?"later":""}"><header><span>${esc(label)}</span><span>${fmtDate(date)}</span></header>
      <p class="en">${esc(text)}</p><p class="small muted mt-s">${words} words${x.seconds?", spoke "+mmss(x.seconds):""}</p>
      ${x.recordingId?`<audio class="hide mt-s" controls preload="none" data-rec="${esc(x.recordingId)}"></audio>`:""}</article>`;
  };
  const only = !a && (mir[0] || state.writingSamples[0]);
  const compare = a&&b ? `<div class="compare mt">${sampleCard(a,la,false)}${sampleCard(b,lb,true)}</div>`
    : only ? `<div class="mt">${sampleCard(only, mir[0]?"Your starting point":"Your first sample", false)}<p class="small muted mt-s">Your next sample will appear beside this one, so you can compare.</p></div>`
    : `<div class="panel mt"><p>Your first writing sample will appear here. Complete a mission or record your starting point, and this page starts filling with evidence.</p></div>`;
  const recent = state.speakingAttempts.slice(-24);
  const maxS = Math.max(60, ...recent.map(x=>x.duration));
  const bars = recent.length>=2 ? `<section class="mt-l"><h3>Speaking over time</h3><p class="muted small mt-s">Each bar is one attempt. Longer bars mean you kept your thought alive longer.</p>
    <div class="bars">${recent.map(x=>`<i style="height:${Math.max(4,Math.round(x.duration/maxS*100))}%" title="${mmss(x.duration)}"></i>`).join("")}</div>
    <div class="bars-caption"><span>${fmtDate(recent[0].date)}</span><span>${fmtDate(recent[recent.length-1].date)}</span></div></section>` : "";
  const due = mirrorDue();
  const cell = (v,l) => `<div><b>${v}</b><span>${l}</span></div>`;
  view.innerHTML = `
    <section class="greet"><h1 class="display" style="font-size:clamp(30px,7vw,40px)">Look what you can do now.</h1>
      <p>No invented percentages. Only what you wrote, what you said, and when.</p></section>
    ${compare}
    <div class="row-gap mt">
      <button class="btn-line" data-act="startMirror">${due==="first"?"Record my starting point":"Record a mirror sample"}</button>
      ${depth()>=3?'<button class="btn-line" data-act="portfolioReview">Request a portfolio review</button>':""}
    </div>
    <section class="mt-l"><h3>Evidence</h3>
      <div class="evidence mt-s">
        ${cell(st.missions,"missions complete")}${cell(st.samples,"writing samples")}${cell(st.words,"words written")}${cell(st.attempts,"speaking attempts")}
        ${cell(Math.round(st.secs/60),"minutes spoken")}${cell(mmss(st.longest),"longest attempt")}${cell(st.hours.toFixed(1),"practice hours")}${cell(st.topics,"topics explored")}
        ${cell(st.reflections,"reflections")}${cell(st.shadow,"shadowing sessions")}${cell(st.meditations,"meditations")}${cell(st.streak,"day streak")}
        ${cell(st.classesAttended,"classes attended")}${cell("★ "+st.stars,"stars earned")}${cell(st.classTextsRead,"class texts read")}${cell(st.classWords,"words in class texts")}
      </div>
      <p class="small muted mt-s">Cycle ${cyc.n}, day ${cyc.day}. ${mir.length} mirror sample${mir.length===1?"":"s"} recorded.</p>
    </section>
    ${bars}
    <section class="mt-l"><h3>Archive</h3><p class="muted small mt-s">Everything is kept exactly as you produced it.</p><div class="mt">
      ${archive("Writing samples", state.writingSamples.slice().reverse().map(w=>`<div class="archive-item"><header><span>${esc(w.label||w.topic||w.prompt||"Writing")}</span><span>${fmtDate(w.createdAt)}</span></header><p class="en" style="font-size:17px">${esc(w.content)}</p></div>`))}
      ${archive("Speaking attempts", state.speakingAttempts.slice().reverse().map(x=>`<div class="attempt"><span class="grow"><b>${mmss(x.duration)}</b> <span class="muted small">${esc(x.topic||"")}, ${fmtDate(x.date)}</span></span>${x.recordingId?`<audio class="hide" controls preload="none" data-rec="${esc(x.recordingId)}"></audio>`:""}</div>`))}
      ${archive("Reflections", state.reflections.slice().reverse().map(r=>`<div class="archive-item"><header><span>${esc(r.topic||"")}</span><span>${fmtDate(r.date)}</span></header><p><b>I managed to say:</b> ${esc(r.managed)}</p>${r.difficult?`<p><b>Difficult:</b> ${esc(r.difficult)}</p>`:""}${r.better?`<p><b>Next time:</b> ${esc(r.better)}</p>`:""}</div>`))}
      ${(()=>{ const ks = Object.keys(state.days).filter(k=>dayNote(k).trim()).sort().reverse(); return ks.length?archive("Day notes", ks.map(k=>`<div class="archive-item"><header><span>${dayStarred(k)?"★ ":""}${esc(fmtDay(k,true))}</span><span>${state.days[k].sentAt?"Sent "+esc(fmtDate(state.days[k].sentAt)):""}</span></header><p>${esc(dayNote(k))}</p></div>`)):""; })()}
      ${state.journalEntries.length?archive("Notebook entries", state.journalEntries.map(j=>`<div class="archive-item"><header><span>${esc(j.mood||"Entry")}</span><span>${fmtDate(j.date)}</span></header><p>${esc([j.learned,j.questions,j.homework,j.notes].filter(Boolean).join("\n\n"))}</p></div>`)):""}
      ${state.practiceRecords.length?archive("Earlier practice records", state.practiceRecords.slice().reverse().map(p=>`<div class="archive-item"><header><span>${esc(p.topic||p.type)}</span><span>${fmtDate(p.date)}</span></header><p>${esc(p.content||"")}</p></div>`)):""}
    </div></section>`;
  hydrateAudio();
};
function archive(title, items){
  return `<details class="more"><summary>${esc(title)} (${items.length})</summary><div class="inner">${items.length?items.join(""):'<p class="muted">Nothing here yet.</p>'}</div></details>`;
}

function calendarHTML(){
  const now = new Date(), t = dayKey();
  const first = new Date(calY, calM, 1), off = (first.getDay()+6)%7, dim = new Date(calY, calM+1, 0).getDate();
  const occ = occurrencesBetween(dayKey(first), dayKey(new Date(calY, calM, dim))).filter(o=>!o.rec.cancelled);
  const byDay = {}; occ.forEach(o=>(byDay[o.date] = byDay[o.date] || []).push(o));
  const prac = practiceDays();
  let due = 0, att = 0, stars = 0, sum = 0;
  occ.forEach(o=>{ if(classStar(o)) stars++; if(o.date<=t){ due++; if(o.rec.attended) att++; sum += classPct(o); } });
  const cells = [];
  for(let e=0;e<off;e++) cells.push('<div class="cal-day cal-blank" aria-hidden="true"></div>');
  for(let d=1; d<=dim; d++){
    const k = dayKey(new Date(calY, calM, d)), list = byDay[k]||[], fut = k>t;
    const pct = list.length ? list.reduce((a,o)=>a+classPct(o),0)/list.length : 0;
    const star = list.some(classStar), note = !!dayNote(k).trim();
    let cls = "cal-day"+(fut?" future":"")+(k===t?" today":"")+(list.length?" has-class":"")+(star?" starred":"");
    if(pct>=1) cls += " full"; else if(pct>0) cls += " partial";
    if(k<t && pct<1 && list.some(o=>!o.rec.attended)) cls += " missed";
    const fill = pct>0 ? Math.round(18+pct*82) : 0;
    let aria = MONTHS[calM]+" "+d;
    if(list.length) aria += ", "+list.length+" class"+(list.length>1?"es":"")+", "+Math.round(pct*100)+" percent complete";
    if(star) aria += ", star earned";
    if(prac.has(k)) aria += ", practice day";
    if(note) aria += ", has a note";
    cells.push(`<button type="button" class="${cls}" data-act="openDay" data-k="${k}" aria-label="${esc(aria)}">${fill?`<span class="cal-fill" style="height:${fill}%"></span>`:""}<span class="cal-num">${d}</span>${star?'<span class="cal-mark">★</span>':""}${list.length&&pct<1&&!star?'<span class="cal-dot"></span>':""}${prac.has(k)?'<span class="cal-prac"></span>':""}${note?'<span class="cal-note"></span>':""}</button>`);
  }
  const isNow = calY===now.getFullYear() && calM===now.getMonth();
  const m = (v,l) => `<div><b>${v}</b><span>${l}</span></div>`;
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  return `<section class="mt-l" id="calSection"><div class="phase-head"><h3>Your month</h3>${isNow?"":'<button class="link" data-act="calToday">Back to today</button>'}</div>
    <div class="cal-card mt-s">
      <div class="cal-nav-row"><button class="icon-btn" data-act="calShift" data-d="-1" aria-label="Previous month">${arrow("M15 6l-6 6 6 6")}</button><div class="cal-month" aria-live="polite">${MONTHS[calM]} ${calY}</div><button class="icon-btn" data-act="calShift" data-d="1" aria-label="Next month">${arrow("M9 6l6 6-6 6")}</button></div>
      <div class="cal-metrics">${m(occ.length,"Classes")}${m(due?Math.round(att/due*100)+"%":"—","Attended")}${m("★ "+stars,"Stars")}${m(due?Math.round(sum/due*100)+"%":"—","Average")}</div>

/* The day report, written for the teacher (in Spanish, like the other messages).
   limit: max characters for a WhatsApp link; writings are shortened to fit. */
function dayReport(k, limit){
  const live = occurrencesBetween(k,k).filter(o=>!o.rec.cancelled), ws = dayWritings(k);
  const atts = state.speakingAttempts.filter(x=>dayKey(x.date)===k), note = dayNote(k).trim();
  const build = per => {
    const L = ["Hola Profe, soy "+(state.name||"tu estudiante")+". Este es mi reporte del "+fmtDayEs(k)+"."];
    if(live.some(classStar)) L.push("⭐ Gané la estrella del día: asistí y escribí según las instrucciones.");
    live.forEach(o=>{
      const T = classText(o);
      L.push("", "Clase: "+o.title+" ("+fmtTime(o.time)+", "+o.level+")", "- Asistencia: "+(o.rec.attended?"sí":"no marcada"));
      if(T) L.push("- Texto de clase: \""+T.title+"\" ("+wc(T.body)+" palabras)"+(o.rec.readAt?", leído":""));
      L.push("- Avance: "+classDone(o)+" de 5 partes");
    });
    if(note) L.push("", "Nota del día:", note);
    if(ws.length){
      L.push("", "Mis escritos ("+ws.length+"):");
      ws.forEach((w,i)=>{
        const tg = writingTarget(w), c = w.content.length>per ? w.content.slice(0,per).replace(/\s+\S*$/,"")+"… (continúa)" : w.content;
        L.push("", (i+1)+") "+(w.label||w.topic||"Escrito")+" · "+w.wordCount+" palabras"+(tg?" (meta "+tg.level+": "+tg.range[0]+"–"+tg.range[1]+")":""), c);
      });
    }
    if(atts.length) L.push("", "Hablé: "+atts.length+" intento(s), el más largo "+mmss(Math.max(...atts.map(a=>a.duration)))+".");
    return L.join("\n");
  };
  let text = build(1e9);
  if(!limit || text.length<=limit) return text;
  let per = Math.max(160, Math.floor((limit - build(0).length) / Math.max(1, ws.length)));
  text = build(per);
  while(text.length>limit && per>160){ per -= 100; text = build(per); }
  return text+"\n\n(Texto recortado para WhatsApp. Tengo el reporte completo si lo necesitas.)";
}

/* ============================================================
   LESSON ENGINE — one renderer for every mission, free practice,
   and mirror sample. Content comes from LESSONS (schema above).
   THINK → WRITE → SPEAK → REFLECT → SAVE
   ============================================================ */
const STEP_NAMES = {arrive:"Arrival", read:"Read it", understand:"Understand", see:"See it", build:"Build it", write:"Write it", speak:"Speak it", reflect:"Reflect", complete:"Complete"};
function stepsFor(r){
  if(r.kind==="mission") return ["arrive","understand","see","build","write","speak","reflect","complete"];
  if(r.kind==="class") return ["read","write","speak","reflect","complete"];
  if(r.kind==="free") return ["write","speak","reflect","complete"];
  return ["arrive","write","speak","complete"];
}
function newRun(kind, o){
  return {kind, mi:o.mi!=null?o.mi:null, topicId:o.topicId||null, cid:o.cid||null, stepIdx:0, startedAt:nowISO(), lastTick:Date.now(), activeMs:0,
    ladder:1, scr:{}, write:{mode:"guided", text:"", savedId:null}, attempts:[], reflect:{a:"",b:"",c:""}, finalized:false};
}
function saveRun(){ state.draft = run && !run.finalized ? run : null; save(); }
function tickActive(){ if(!run) return; const n=Date.now(); run.activeMs=(run.activeMs||0)+Math.min(n-(run.lastTick||n), 10*60000); run.lastTick=n; }
const runLesson = () => run && run.mi!=null ? LESSONS[run.mi] : null;
const runTopicObj = () => TOPICS.find(t=>t.id===run.topicId) || TOPICS[0];
const runClass = () => run && run.kind==="class" ? occById(run.cid) : null;
function runTopic(){
  if(run.kind==="mission") return "Mission "+(run.mi+1)+": "+LESSONS[run.mi].t;
  if(run.kind==="mirror") return "Mirror sample";
  if(run.kind==="class"){ const o = runClass(), T = o && classText(o); return "Class "+(o?fmtDay(o.date):"")+(T?": "+T.title:""); }
  return runTopicObj().title;
}
const phaseRef = () => run.kind==="mission" ? run.mi : (nextMission()>=0 ? nextMission() : state.currentMission);

VIEWS.lesson = function(){ setBody("in-lesson"); renderLesson(); };

function renderLesson(){
  if(!run){ go("home"); return; }
  if(run.kind==="class" && !runClass()){ state.draft = null; run = null; save(); toast("That class was removed from your schedule."); go("classes"); return; }
  const steps = stepsFor(run), key = steps[run.stepIdx];
  const rail = steps.filter(s=>s!=="complete").map((s,i)=>`<i class="${i<run.stepIdx?"on":i===run.stepIdx?"cur":""}"></i>`).join("");
  const title = run.kind==="mission" ? "Mission "+(run.mi+1) : run.kind==="mirror" ? "Mirror sample" : run.kind==="class" ? "Class · "+fmtDay(runClass().date) : "Free practice";
  const top = `<div class="lesson-top">
      <button class="icon-btn" data-act="closeLesson" aria-label="Save and exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="rail" aria-hidden="true">${key==="complete"?steps.slice(0,-1).map(()=>'<i class="on"></i>').join(""):rail}</div>
      ${key!=="complete"?'<button class="link" style="margin-left:6px" data-act="stuck">Stuck?</button>':""}
    </div>
    ${key!=="complete"&&key!=="arrive"?`<p class="step-name"><b>${STEP_NAMES[key]}</b><span>${esc(title)}</span></p>`:""}`;
  view.innerHTML = top + stepGuideHTML(key) + STEPS[key]();
  if(STEP_AFTER[key]) STEP_AFTER[key]();
}
function nextStep(){
  tickActive();
  if(planOn()) todaySpec();
  const leaving = stepsFor(run)[run.stepIdx], who = run.kind==="mission" ? run.mi : run.kind;
  markGuideSeen(leaving);
  run.stepIdx = Math.min(run.stepIdx+1, stepsFor(run).length-1);
  if(stepsFor(run)[run.stepIdx]==="complete") finalize();
  else saveRun();
  planEvent("step:"+leaving+":"+who);
  renderLesson(); window.scrollTo(0,0);
}
function prevStep(){ if(SP) return; run.stepIdx = Math.max(0, run.stepIdx-1); saveRun(); renderLesson(); window.scrollTo(0,0); }

const STEPS = {}, STEP_AFTER = {};

/* A. ARRIVAL */
STEPS.arrive = function(){
  if(run.kind==="mirror"){
    setAction({label:"Let's begin", act:"next"});
    return `<section class="arrival"><p class="kicker">Mirror sample</p><h1 class="display">See yourself, then and now.</h1>
      <p class="lead">You'll answer one prompt in writing and out loud. Every few weeks you answer the same prompt again, and the difference becomes visible.</p>
      <div class="well mt"><p class="en">${esc(MIRROR_PROMPT)}</p></div>
      <p class="muted small mt">About 8 minutes. Nothing is corrected or graded.</p></section>`;
  }
  const L = runLesson();
  const done = state.completedMissions.includes(run.mi);
  setAction({label:"Let's begin", act:"next"});
  return `<section class="arrival">
    <div class="num">${pad2(L.n)}</div>
    <h1 class="display">${esc(L.t)}</h1>
    <p class="lead">${esc(L.obj)}</p>
    <div class="meta-row"><span class="pill gold">${esc(L.level)}</span><span class="pill">About ${L.duration} min</span><span class="pill">${esc(PHASES[phaseIndex(run.mi)].label)}</span>${done?'<span class="pill sage">Review</span>':""}</div>
    <p class="muted mt-l">Understand, see it, build it, write it, speak it, reflect. Your work is saved as you go.</p>
  </section>`;
};

/* A2. READ — the class text, sentence by sentence (classes only) */

    ${T.questions&&T.questions.length?`<details class="more ${hasKeys?"":"mt-l"}"><summary>Think about it</summary><div class="inner"><ul class="pattern">${T.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul><p class="small muted mt-s">Answer in your head or out loud. You'll use these ideas when you write and speak.</p></div></details>`:""}`;

/* B. UNDERSTAND */
STEPS.understand = function(){

/* C. SEE IT — personalized by goal */
STEPS.see = function(){

/* D. BUILD IT — progressive complexity + controlled practice */
function scrambleSentences(L){ return L.kit.shadow.filter(s=>{ const n=s.split(" ").length; return n>=3&&n<=10; }).slice(0,2); }
function ensureScr(k, words){
  if(!run.scr[k]){
    let order = words.map((_,i)=>i);
    for(let t=0;t<8;t++){ order.sort(()=>Math.random()-.5); if(order.some((v,i)=>v!==i)) break; }
    run.scr[k] = {order, placed:[], done:false, fails:0};
  }
  return run.scr[k];
}
const LADDER_LABELS = ["The core","Add detail","Add a link","The complete idea"];
STEPS.build = function(){
  const L = runLesson(), sents = scrambleSentences(L);
  const ladderDone = run.ladder>=L.build.length;
  const allDone = ladderDone && sents.every((s,k)=>ensureScr(k,s.split(" ")).done);
  setAction({label:"Continue to writing", act:"next", back:"prev", disabled:!allDone, hint: allDone?"":"Grow the sentence, then order the words to continue."});
  let h = `<h2 class="display">Watch a sentence grow</h2>
    <p class="muted mt-s">Same structure, more information each time.</p>
    <ol class="ladder mt">${L.build.map((s,i)=>`<li class="en ${i<run.ladder?"show":""}"><span>${LADDER_LABELS[i]||""}</span>${esc(s)}</li>`).join("")}</ol>
    ${!ladderDone?`<button class="btn-line mt" data-act="ladder">Add a layer</button>`:""}`;
  if(ladderDone){
    h += `<h2 class="display mt-l">Now you build</h2><p class="muted mt-s">Tap the words in the right order. Tap a placed word to return it.</p>`;
    sents.forEach((s,k)=>{
      const words = s.split(" "), sc = ensureScr(k,words);
      const full = sc.placed.length===words.length;
      const ok = sc.done, bad = full && !ok;
      h += `<div class="mt"><div class="scramble-target ${ok?"ok":bad?"bad":""}" aria-label="Your sentence">${sc.placed.length?sc.placed.map((wi,p)=>`<button class="word" data-act="unplace" data-k="${k}" data-p="${p}" ${ok?"disabled":""}>${esc(words[wi])}</button>`).join(""):'<span class="muted small">Your sentence appears here.</span>'}</div>
        ${ok?`<div class="example"><p class="small" style="color:var(--sage);flex:1">Correct.</p>${listenBtn(s)}</div>`:""}
        ${!ok?`<div class="scramble-bank">${sc.order.filter(i=>!sc.placed.includes(i)).map(i=>`<button class="word" data-act="place" data-k="${k}" data-i="${i}">${esc(words[i])}</button>`).join("")}</div>`:""}
        ${bad?`<p class="small mt-s" style="color:var(--coral)">Not quite. Check the order of the subject and the verb.</p><div class="row-gap mt-s"><button class="btn-line" data-act="scrReset" data-k="${k}">Try again</button><button class="link" data-act="scrShow" data-k="${k}">Show the answer</button></div>`:""}
      </div>`;
    });
  }
  return h;
};

/* E. WRITE IT — guided / suggested / open */
function writeConfig(){
  if(run.kind==="mirror") return {min:20, prompt:MIRROR_PROMPT, frames:["I am ___ and I work as ___.","I want English because ___.","With better English, I will ___."], topic:"Mirror sample", modes:false};
  if(run.kind==="free"){ const t=runTopicObj(); return {min:minWords(phaseRef()), prompt:t.prompt, frames:t.frames.map(f=>f.replace("…"," ___")), topic:t.title, modes:true, openPrompt:"Write about anything from your life today."}; }
  if(run.kind==="class"){
    const o = runClass(), T = classText(o) || assignText(o), L = CLASS_LEVELS[o.level];
    return {min:L.write[0], max:L.write[1], prompt:T.write||CLASS_WRITE_DEFAULT, frames:CLASS_FRAMES[o.level], topic:"Class "+fmtDay(o.date)+": "+T.title, modes:true,
      openPrompt:"Write about anything from today's class, in your own words.", keys:(T.keys||[]).map(k=>k[0]).slice(0,4)};
  }
  const L = runLesson();
  return {min:minWords(run.mi), prompt:L.topics[ctx()]||L.topics.general, frames:L.frames, topic:"Mission "+L.n+": "+L.t, modes:true, openPrompt:"Write about anything from your life today. Try to use today's idea: "+L.t.toLowerCase()+".", keys:L.vocab.map(v=>v[0].split(/[\/,·]/)[0].trim()).slice(0,4)};
}
STEPS.write = function(){
  const cfg = writeConfig(), w = run.write;
  const canBack = run.kind==="mission" || run.kind==="class";
  if(w.savedId){
    const s = state.writingSamples.find(x=>x.id===w.savedId);
    setAction({label:"Continue to speaking", act:"next", back: canBack?"prev":null});
    return `<h2 class="display">Saved as evidence</h2><p class="muted mt-s">Your original stays exactly as you wrote it. Nothing is corrected or overwritten.</p>
      <article class="sample mt"><header><span>${esc(cfg.topic)}</span><span>${s?fmtDate(s.createdAt):""}</span></header><p class="en">${esc(s?s.content:w.text)}</p><p class="small muted mt-s">${s?s.wordCount:wc(w.text)} words</p></article>`;
  }
  const mode = cfg.modes ? w.mode : "guided";
  const n = wc(w.text), ok = n>=cfg.min;
  const modeDesc = {guided:"Start from a structure. Tap one to add it, then complete it.", suggested:"Write about this topic in your own way.", open:"Your topic, your words."};
  const prompt = mode==="open" ? cfg.openPrompt : cfg.prompt;
  setAction({label:"Save and continue", act:"saveWriting", back: canBack?"prev":null, disabled:!ok, hint: ok?"":"Write at least "+cfg.min+" words to continue."});
  return `<h2 class="display">Write it</h2>
    ${cfg.modes?`<div class="seg mt" role="group" aria-label="How much guidance">
      ${["guided","suggested","open"].map(m=>`<button data-act="mode" data-m="${m}" aria-pressed="${mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
    </div><p class="seg-desc">${modeDesc[mode]}</p>`:""}
    <div class="well mt"><p class="en">${esc(prompt)}</p></div>
    ${mode==="guided"?`<div class="frames mt">${cfg.frames.map(f=>`<button class="frame" data-act="frame" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>`:""}
    ${mode==="suggested"&&cfg.keys?`<p class="small muted mt">Try to use: ${cfg.keys.map(esc).join(", ")}.</p>`:""}
    <textarea class="write mt" id="writeBox" data-in="write" placeholder="Write in English. Don't translate, don't worry about mistakes." spellcheck="false" autocapitalize="sentences">${esc(w.text)}</textarea>
    <div class="counter"><span><b id="wcount" class="${ok?"ok":""}">${n}</b> of ${cfg.min}${cfg.max?"–"+cfg.max:""} words${cfg.max?" ("+runClass().level+")":""}</span><span>Saved exactly as you write it</span></div>`;
};

/* F. SPEAK IT */
function speakConfig(){
  if(run.kind==="mirror") return {prompt:MIRROR_PROMPT, min:30, target:60, adjusted:false};
  if(run.kind==="class"){ const o = runClass(), T = classText(o) || {}; return Object.assign(classSpeakRule(o.level), {prompt:T.speak||CLASS_SPEAK_DEFAULT}); }
  const r = speakRule(phaseRef());
  return Object.assign(r, {prompt: run.kind==="mission" ? runLesson().speak : runTopicObj().prompt});
}
function bestAttempt(){ const a = state.speakingAttempts.filter(x=>run.attempts.includes(x.id)); return a.length?Math.max(...a.map(x=>x.duration)):0; }
STEPS.speak = function(){
  const cfg = speakConfig();
  const sample = state.writingSamples.find(x=>x.id===run.write.savedId);
  const text = sample ? sample.content : run.write.text;
  const cues = keywords(text);
  const best = bestAttempt(), ok = best>=cfg.min && !SP;
  const atts = state.speakingAttempts.filter(x=>run.attempts.includes(x.id));
  setAction({label: run.kind==="mirror"?"Save my mirror sample":"Continue to reflection", act:"next", back: SP?null:"prev", disabled:!ok,
    hint: SP ? "Press stop when you finish." : ok ? "" : "Reach "+mmss(cfg.min)+" in one attempt to continue."});
  const C = 2*Math.PI*54;
  return `<h2 class="display">${esc(cfg.prompt)}</h2>
    <p class="mt-s" style="font-size:17px">Use your ideas. Don't read a script. Keep your thought alive.</p>
    <p class="small muted mt-s">Minimum ${mmss(cfg.min)}, target ${mmss(cfg.target)}.${cfg.adjusted?" We lowered the minimum to help you start. Speak first; precision comes later.":""}</p>
    ${cues.length?`<div class="cues mt">${cues.map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:""}
    <div class="timer-wrap mt">
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringFg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="t"><b id="ringTime">0:00</b><span id="ringLabel">${SP?(SP.rec?'<i class="rec-dot"></i>Recording':"Speaking"):"Ready"}</span></div></div>

async function startSpeaking(record){
  if(SP) return;
  const cfg = speakConfig();
  const s = {start:0, rec:null, stream:null, chunks:[], mime:"", target:cfg.target, min:cfg.min, timer:null};
  if(record && canRecord){
    try{
      s.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      s.mime = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
      s.rec = s.mime ? new MediaRecorder(s.stream,{mimeType:s.mime}) : new MediaRecorder(s.stream);
      s.rec.ondataavailable = e => { if(e.data && e.data.size) s.chunks.push(e.data); };
      s.rec.start(1000);
    }catch(e){
      if(s.stream) s.stream.getTracks().forEach(t=>t.stop());
      s.rec = null; s.stream = null;
      toast("Microphone not available. The timer will still save your time.");
    }
  }
  s.start = Date.now();
  SP = s;
  s.timer = setInterval(tickSpeak, 250);
  renderLesson();
}
function tickSpeak(){
  if(!SP) return;
  const el = (Date.now()-SP.start)/1000, C = 2*Math.PI*54;
  const fg = $("#ringFg"), t = $("#ringTime");
  if(fg){ fg.style.strokeDashoffset = C*(1-Math.min(el/SP.target,1)); fg.classList.toggle("min", el>=SP.min); }
  if(t) t.textContent = mmss(el);
}
function finishSpeaking(silent){
  if(!SP) return;
  const s = SP; SP = null; clearInterval(s.timer);
  const dur = Math.round((Date.now()-s.start)/1000);
  const stopStream = () => { if(s.stream) s.stream.getTracks().forEach(t=>t.stop()); };
  if(dur < 3){
    if(s.rec && s.rec.state!=="inactive"){ s.rec.onstop = stopStream; s.rec.stop(); } else stopStream();
    if(!silent){ toast("Too short to save. Try again."); renderLesson(); }
    return;
  }
  const a = {id:uid("sp"), date:nowISO(), kind:run.kind, missionId:run.kind==="mission"?run.mi:null, classId:run.kind==="class"?run.cid:null, topic:runTopic(), duration:dur, recordingId:null};
  state.speakingAttempts.push(a); run.attempts.push(a.id);
  if(run.kind==="class"){ const o = runClass(); if(o){ const r = ensureRec(o); r.bestSecs = Math.max(r.bestSecs||0, dur); r.attemptIds = (r.attemptIds||[]).concat(a.id); } }
  touch(); tickActive(); saveRun();
  if(s.rec && s.rec.state!=="inactive"){
    s.rec.onstop = async () => {
      stopStream();
      try{
        const blob = new Blob(s.chunks, {type: s.rec.mimeType || s.mime || "audio/webm"});
        if(blob.size){ const rid = "rec-"+a.id; await AudioDB.put(rid, blob); a.recordingId = rid; save(); }
      }catch(e){ toast("The recording couldn't be stored. Your time was saved."); }
      if(run && stepsFor(run)[run.stepIdx]==="speak" && location.hash==="#lesson") renderLesson();
    };
    s.rec.stop();
  } else stopStream();
  if(!silent) renderLesson();
}

function finalize(){
  if(run.finalized) return;
  run.finalized = true; tickActive();
  const minutes = Math.max(1, Math.round(Math.min(run.activeMs||0, 90*60000)/60000));
  state.hours = +((state.hours||0) + minutes/60).toFixed(2);
  state.sessionLog.push({date:nowISO(), missionId:run.mi, classId:run.cid||null, minutes, kind:run.kind});
  let reflId = null;
  if(run.kind!=="mirror"){
    const r = {id:uid("rf"), date:nowISO(), kind:run.kind, missionId:run.mi, classId:run.cid||null, topic:runTopic(), managed:run.reflect.a.trim(), difficult:run.reflect.b.trim(), better:run.reflect.c.trim()};
    state.reflections.push(r); reflId = r.id;
  }
  if(run.kind==="class"){
    const o = runClass();
    if(o){ const rec = ensureRec(o); rec.reflectionId = reflId; rec.doneAt = rec.doneAt || nowISO(); rec.lastWorkAt = nowISO(); rec.minutes = (rec.minutes||0) + minutes; }
  }
  if(run.kind==="mission"){
    const i = run.mi, mp = state.missionProgress[i] || {startedAt:run.startedAt, sessions:0};
    mp.status = "done"; mp.completedAt = mp.completedAt || nowISO(); mp.lastPracticedAt = nowISO(); mp.sessions = (mp.sessions||0)+1;
    mp.writingIds = (mp.writingIds||[]).concat(run.write.savedId?[run.write.savedId]:[]);

    if(!state.completedMissions.includes(i)) state.completedMissions.push(i);
    const nx = nextMission(); state.currentMission = nx>=0 ? nx : i;
  }
  if(run.kind==="mirror"){
    const w = state.writingSamples.find(x=>x.id===run.write.savedId);
    const best = state.speakingAttempts.filter(a=>run.attempts.includes(a.id)).sort((a,b)=>b.duration-a.duration)[0];

}

function quizPool(){

    const wrong = m.wrong.replace(/\s*\(.*?\)\s*/g," ").trim(), right = m.right.split(" — ")[0].trim(), why = m.right.split(" — ").slice(1).join(" — ");

/* ============================================================
   TEACHER LINK — with a personal code from ProfGermandario's
   panel, the student can share this journal with him: progress,
   when they practice, writings, reflections and day reports.
   Nothing is sent until the student says yes, and they can stop
   at any time (Membership). Audio recordings never leave the
   device. His feedback on each writing comes back here.
   ============================================================ */
const SYNC_KEY = "pg_sync_v1";
var SYNC = null; /* var on purpose: save() can run before this block initialises */
const SYNC_EVERY = 3*60*1000, SYNC_BUDGET = 450000;
function syncMeta(){ let m = null; try{ m = JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){} m = m && typeof m==="object" ? m : {}; if(!m.t || typeof m.t!=="object") m.t = {}; if(!m.d || typeof m.d!=="object") m.d = {}; return m; }
function setSyncMeta(m){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(m)); }catch(e){} }
/* Save without scheduling a sync (for things that came from the server). */
function persistQuiet(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function fp(str){ let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36)+"."+str.length; }
const canShare = () => { const s = access(); return !!(s.server && s.member && s.canShare && !s.teacher && PGA.api && PGA.token); };
const sharingOn = () => canShare() && !!access().sharing;

function syncTexts(){
  const out = [];
  state.writingSamples.forEach(w=>{
    if(!w || !w.id || !String(w.content||"").trim()) return;
    out.push({id:w.id, kind:"writing", sub:w.kind||"", title:w.label||w.topic||"Writing", prompt:w.prompt||"", content:w.content, words:w.wordCount||wc(w.content), at:w.createdAt||null});
  });
  state.reflections.forEach(r=>{
    if(!r || !r.id) return;
    const parts = [["What I managed to say", r.managed], ["What was difficult", r.difficult], ["Next time", r.better]].filter(x=>String(x[1]||"").trim());
    if(!parts.length) return;
    const content = parts.map(x=>x[0]+": "+String(x[1]).trim()).join("\n");
    out.push({id:r.id, kind:"reflection", sub:r.kind||"", title:r.topic||"Reflection", prompt:"", content, words:wc(content), at:r.date||null});
  });
  /* Mirror samples written in this app are already writing samples; only the old starting point is separate. */
  state.mirrorSamples.forEach(m=>{
    if(!m || !m.id || !m.legacy || !String(m.text||"").trim()) return;
    out.push({id:m.id, kind:"mirror", sub:"", title:"Starting point", prompt:MIRROR_PROMPT, content:m.text, words:m.words||wc(m.text), at:m.date||null});
  });
  return out;
}
function syncDays(){
  const t = dayKey(), min = addDays(t, -60), keys = new Set(Object.keys(state.days));
  Object.values(state.classRecords).forEach(r=>{ if(r && r.date) keys.add(r.date); });
  state.writingSamples.forEach(w=>{ if(w && w.createdAt) keys.add(dayKey(w.createdAt)); });
  state.speakingAttempts.forEach(a=>{ if(a && a.date) keys.add(dayKey(a.date)); });
  return [...keys].filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k) && k>=min && k<=t).sort().reverse();
}
function syncPayload(){
  const m = syncMeta(), texts = [], reports = [], tmap = {}, dmap = {};
  let budget = SYNC_BUDGET, more = false;
  syncTexts().forEach(x=>{
    const f = fp(JSON.stringify([x.kind, x.title, x.prompt, x.content]));
    if(m.t[x.id]===f) return;
    const size = x.content.length + (x.prompt||"").length + 200;
    if(texts.length>=40 || size>budget){ more = true; return; }
    budget -= size; tmap[x.id] = f; texts.push(x);
  });
  syncDays().forEach(k=>{
    let c = ""; try{ c = dayReport(k); }catch(e){ return; }
    if(c.indexOf("\n")<0) return; /* greeting only: nothing happened that day */
    const sent = (state.days[k]||{}).sentAt||null, f = fp(c+"|"+(sent||""));
    if(m.d[k]===f) return;
    if(reports.length>=30 || c.length+200>budget){ more = true; return; }
    budget -= c.length+200; dmap[k] = f; reports.push({day:k, content:c, sent_at:sent});
  });
  const sp = state.startingPoint||{}, st = stats();
  return {more, tmap, dmap, body:{
    app:APP_VERSION, name:state.name||"", streak:liveStreak(), last_active:state.lastActiveDate||null,
    mission:state.currentMission, completed:state.completedMissions,
    profile:{level:sp.level||"", goal:sp.goal||"", block:sp.fear||"", style:sp.learningStyle||"", program:tier().name, cycle:cycleInfo().n},
    stats:Object.assign({}, st, {hours:+(st.hours||0).toFixed(2), journalEntries:state.journalEntries.length, achievements:state.achievements.length}),
    since:m.since||null, texts, reports}};
}
function scheduleSync(ms){
  if(!SYNC || !sharingOn()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(()=>syncNow(), ms==null ? 15000 : ms);
}
async function syncNow(){
  if(!SYNC || SYNC.busy || !sharingOn() || navigator.onLine===false) return false;
  const tok = PGA.token(); if(!tok) return false;
  SYNC.busy = true; clearTimeout(SYNC.timer);
  let ok = false;
  try{
    for(let round=0; round<8; round++){
      const P = syncPayload();
      const r = await PGA.api("sms_journal_sync", {p_token:tok, p_payload:P.body}, {timeout:20000});
      if(PGA.applyServer) PGA.applyServer(r);
      if(!r || !r.ok) break;
      const m = syncMeta();
      Object.keys(P.tmap).forEach(id=>{ m.t[id] = P.tmap[id]; });
      Object.keys(P.dmap).forEach(k=>{ m.d[k] = P.dmap[k]; });
      if(Array.isArray(r.feedback) && r.feedback.length){ m.since = r.feedback[r.feedback.length-1].at; takeFeedback(r.feedback); }
      m.last = nowISO(); setSyncMeta(m); ok = true;
      if(!P.more) break;
    }
  }catch(e){ /* offline or server unavailable: the next round tries again */ }
  finally{ SYNC.busy = false; }
  return ok;
}
function takeFeedback(list){
  const F = state.teacherFeedback; let fresh = 0;
  list.forEach(f=>{
    if(!f || !f.id) return;
    if(!f.feedback){ delete F[f.id]; return; }
    const old = F[f.id];
    if(!old || old.text!==f.feedback){ F[f.id] = {text:f.feedback, at:f.at, read:false}; fresh++; }
  });
  persistQuiet();
  if(fresh){ toast("ProfGermandario left feedback on "+fresh+" of your texts."); repaint(); }
}
const unreadFeedback = () => Object.values(state.teacherFeedback||{}).filter(f=>!f.read).length;
function feedbackTarget(id){
  const w = state.writingSamples.find(x=>x.id===id); if(w) return {title:w.label||w.topic||"Writing", date:w.createdAt, text:w.content};
  const r = state.reflections.find(x=>x.id===id); if(r) return {title:"Reflection · "+(r.topic||""), date:r.date, text:[r.managed,r.difficult,r.better].filter(Boolean).join(" · ")};
  const m = state.mirrorSamples.find(x=>x.id===id); if(m) return {title:"Starting point", date:m.date, text:m.text};
  return null;
}
function feedbackSheet(){
  const F = state.teacherFeedback||{}, ids = Object.keys(F).sort((a,b)=>String(F[b].at||"").localeCompare(String(F[a].at||"")));

      ${ex?`<p class="small muted mt-s">“${esc(ex.length>220?ex.slice(0,220).replace(/\s+\S*$/,"")+"…":ex)}”</p>`:""}
      <div class="well mt-s" style="white-space:pre-wrap">${esc(f.text)}</div>
      <p class="small muted mt-s">ProfGermandario · ${esc(fmtDate(f.at))}</p></article>`;
  }).join("");
  openSheet(`${sheetHead("Teacher feedback", "Corrections and comments from ProfGermandario on your writing.")}
    ${items || (sharingOn() ? `<p class="muted">No feedback yet. When ProfGermandario reviews one of your texts, it appears here.</p>`
                            : `<p class="muted">Share your journal with ProfGermandario and his feedback on your writing will appear here.</p>${canShare()?`<button class="btn block mt" data-act="shareAsk">Share my journal</button>`:""}`)}`);
  let changed = false;
  ids.forEach(id=>{ if(!F[id].read){ F[id].read = true; changed = true; } });
  if(changed){ persistQuiet(); repaint(); }
}
/* ---------- Direct messages from ProfGermandario ----------
   Written in his panel, delivered when the journal opens. Receiving them
   doesn't need sharing to be on: it only needs a code from his panel. */
const canUseInbox = () => { const s = access(); return !!(s.server && s.canShare && !s.teacher && (s.state==="active" || s.state==="expired") && PGA.api && PGA.token); };
const inboxList = () => Object.keys(state.teacherMessages||{}).map(id=>Object.assign({id}, state.teacherMessages[id])).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
const unreadMessages = () => inboxList().filter(m=>!m.read).length;
const fmtWhen = iso => { try{ return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } };
async function checkInbox(){
  if(!SYNC || SYNC.inbox || !canUseInbox() || navigator.onLine===false) return false;
  const tok = PGA.token(); if(!tok) return false;
  const M = state.teacherMessages, toAck = Object.keys(M).filter(id=>M[id].read && !M[id].acked).slice(0,200);
  SYNC.inbox = true;
  try{
    const r = await PGA.api("sms_journal_inbox", {p_token:tok, p_read:toAck});
    if(PGA.applyServer) PGA.applyServer(r);
    if(!r || !r.ok || !Array.isArray(r.messages)) return false;
    const next = {}; let fresh = 0;
    r.messages.forEach(m=>{
      const old = M[m.id], read = !!(m.read || (old && old.read));
      next[m.id] = {body:m.body, at:m.at, read, acked:!!m.read};
      if(!read) fresh++;
    });
    const changed = JSON.stringify(next)!==JSON.stringify(M);
    state.teacherMessages = next;
    if(changed) persistQuiet();
    if(fresh){
      const busy = $("#scrim").classList.contains("open") || document.body.classList.contains("in-lesson") || document.body.classList.contains("in-onboarding");
      if(busy) repaint(); else messagesSheet();
    } else if(changed) repaint();
    return true;
  }catch(e){ return false; }
  finally{ SYNC.inbox = false; }
}
function messagesSheet(){
  const L = inboxList();
  openSheet(`${sheetHead("Messages", "From ProfGermandario, just for you.")}
    ${L.length ? L.map(m=>`<article class="panel" style="margin-top:12px">
        <div class="meta-row" style="margin-top:0">${m.read?"":`<span class="pill gold">New</span>`}<span class="small muted">ProfGermandario · ${esc(fmtWhen(m.at))}</span></div>
        <div class="mt-s" style="white-space:pre-wrap">${esc(m.body)}</div></article>`).join("")
      : `<p class="muted">No messages yet. When ProfGermandario writes to you, it appears here.</p>`}
    <div class="stack mt"><a class="btn-line" style="width:100%" href="${waLink("Hola Profe, soy "+(state.name||"tu estudiante")+". Sobre tu mensaje: ")}" target="_blank" rel="noopener">${ICON_WA} Reply on WhatsApp</a></div>`);
  let changed = false;
  Object.values(state.teacherMessages||{}).forEach(m=>{ if(!m.read){ m.read = true; changed = true; } });
  if(changed){ persistQuiet(); repaint(); setTimeout(checkInbox, 800); }
}

function teacherStrip(){
  const um = unreadMessages();
  if(um) return `<button class="panel note mt" style="width:100%;text-align:left" data-act="messages"><span class="dot"></span><span><b>${um===1?"New message":um+" new messages"} from ProfGermandario</b><br><span class="muted small">Tap to read.</span></span></button>`;

function reportParts(doc, limit){
  limit = limit || 2900;
  const pieces = [];
  doc.sections.forEach(s=>s.items.forEach((it,k)=>{
    const t = itemText(it);
    if(t.length <= limit-260){ pieces.push({sec:s.title, first:k===0, text:t}); return; }
    let cur = "";
    t.split(/\n(?=\n)/).forEach(par=>{
      if(par.length > limit-260){ (par.match(/[^.!?\n]+[.!?]*\s*|\n/g)||[par]).forEach(x=>{ if((cur+x).length > limit-260){ pieces.push({sec:s.title, first:!pieces.some(p=>p.sec===s.title), text:cur}); cur = x; } else cur += x; }); return; }
      if((cur+"\n"+par).length > limit-260){ pieces.push({sec:s.title, first:!pieces.some(p=>p.sec===s.title), text:cur}); cur = par; } else cur = cur ? cur+"\n"+par : par;
    });
    if(cur) pieces.push({sec:s.title, first:!pieces.some(p=>p.sec===s.title), text:cur});
  }));
  const parts = []; let cur = reportHeader(doc), lastSec = null;
  pieces.forEach(p=>{
    const newSec = p.sec!==lastSec, title = "*"+p.sec.toUpperCase()+(newSec&&p.first?"":" (cont.)")+"*";
    const add = (newSec ? "\n\n"+title : "\n") + p.text;
    if((cur+add).length > limit-90 && cur.trim()){ parts.push(cur.trim()); cur = "*"+p.sec.toUpperCase()+(newSec&&p.first?"":" (cont.)")+"*"+p.text; }
    else cur += add;
    lastSec = p.sec;
  });
  if(cur.trim()) parts.push(cur.trim());
  if(parts.length<2) return parts;
  return parts.map((p,i)=>"*Parte "+(i+1)+" de "+parts.length+"* · "+doc.student+"\n"+(i?"\n":"")+p);
}

  startMission: el => startMission(+el.dataset.i),
  startMirror: () => { if(run && run.finalized) run=null; startMirror(); },
  startFree: el => startFree(el.dataset.t),
  openMission: el => missionSheet(+el.dataset.i),
  closeLesson: () => {
    if(SP) finishSpeaking(true);
    const toClasses = run && run.kind==="class";
    if(run && !run.finalized){ tickActive(); saveRun(); toast("Saved. Resume any time from "+(toClasses?"the class":"Home")+"."); }
    run = null; go(toClasses?"classes":"home");
  },
  next: () => nextStep(),
  prev: () => prevStep(),
  say: el => say(el.dataset.text, el),
  sayAll: () => { const t=[...view.querySelectorAll(".example .en")].slice(0,4).map(e=>e.textContent); const b=[...view.querySelectorAll(".listen")]; let k=0; const nx=()=>{ if(k<t.length){ say(t[k],b[k],()=>setTimeout(nx,900)); k++; } }; nx(); },
  ladder: () => { run.ladder++; saveRun(); renderLesson(); },
  place: el => { const sc = run.scr[el.dataset.k]; const words = scrambleSentences(runLesson())[+el.dataset.k].split(" "); sc.placed.push(+el.dataset.i);
    if(sc.placed.length===words.length){ if(sc.placed.map(i=>words[i]).join(" ")===words.join(" ")) sc.done=true; else sc.fails++; }
    saveRun(); renderLesson(); },
  unplace: el => { const sc = run.scr[el.dataset.k]; if(sc.done) return; sc.placed.splice(+el.dataset.p,1); saveRun(); renderLesson(); },
  scrReset: el => { run.scr[el.dataset.k].placed = []; saveRun(); renderLesson(); },
  scrShow: el => { const sc = run.scr[el.dataset.k]; sc.placed = sc.order.slice().sort((a,b)=>a-b); sc.done = true; saveRun(); renderLesson(); },
  mode: el => { run.write.mode = el.dataset.m; saveRun(); renderLesson(); },

function startClassWork(id){
  const o = occById(id); if(!o) return;
  if(state.draft && state.draft.kind==="class" && state.draft.cid===id){ run = state.draft; run.lastTick = Date.now(); closeSheet(); go("lesson"); return; }
  if(!confirmReplaceDraft()) return;
  assignText(o);
  run = newRun("class",{cid:id});
  if(o.rec.readAt) run.stepIdx = 1;
  saveRun(); closeSheet(); go("lesson");
}
/* per-date changes on a weekly class: store only what differs from the weekly settings */
function applyOverrides(o, f){
  const r = ensureRec(o);
  if(o.oneoff || r.frozen || !o.series){ Object.assign(r, f); return; }
  ["title","time","duration","level"].forEach(k=>{
    const base = k==="level" ? levelKey(o.series.level) : o.series[k];
    if(String(f[k])!==String(base)) r[k] = f[k]; else delete r[k];
  });
}
/* moving a weekly date: it becomes a single class on the new date, with its work */
function moveClass(o, date, f){
  const r = ensureRec(o), nid = uid("cls");
  state.classRecords[nid] = Object.assign({}, r, {id:nid, date, oneoff:true, frozen:false, seriesId:null, movedFrom:o.id, cancelled:false, movedTo:null, title:o.title, time:o.time, duration:o.duration, level:o.level}, f);
  Object.keys(r).forEach(k=>{ if(!["id","date","seriesId","frozen","time","duration","title","level"].includes(k)) delete r[k]; });
  r.cancelled = true; r.movedTo = nid;
  [state.writingSamples, state.speakingAttempts, state.reflections, state.sessionLog].forEach(list=>list.forEach(x=>{ if(x.classId===o.id) x.classId = nid; }));
  if(state.draft && state.draft.cid===o.id) state.draft.cid = nid;
  return nid;
}
function classEvidenceMessage(id){
  const o = occById(id); if(!o) return "";
  const r = o.rec, T = classText(o), w = state.writingSamples.find(x=>x.id===r.writingId), rf = state.reflections.find(x=>x.id===r.reflectionId);
  let t = `Hola Profe, soy ${state.name||"tu estudiante"}. Te envío mi trabajo de la clase del ${fmtDayEs(o.date)} (${o.level}).\n\n`;
  if(T) t += `Texto de clase: "${T.title}" (${wc(T.body)} palabras)${r.readAt?", leído":""}.\n`;
  t += `Asistencia: ${r.attended?"sí":"aún no marcada"}.\n`;
  if(w){ const c = w.content.length>700 ? w.content.slice(0,700)+"…" : w.content; t += `\nMi texto (${w.wordCount} palabras):\n${c}\n`; }
  if(r.bestSecs) t += `\nHablé: intento más largo ${mmss(r.bestSecs)}.\n`;
  if(rf) t += `\nReflexión:\n- Logré decir: ${rf.managed}\n- Difícil: ${rf.difficult||"-"}\n- Mejorar: ${rf.better||"-"}\n`;
  if(dayNote(o.date).trim()) t += `\nNota del día:\n${dayNote(o.date).trim().slice(0,400)}\n`;
  return t;
}

const planOn = () => !!(state.plan && Array.isArray(state.plan.days));
const habitById = id => HABITS.find(h=>h.id===id);
const sessionsPer = () => { const m = (state.plan||{}).minutes||15; return m<=15 ? 3 : m<=25 ? 2 : 1; };
function planRec(k){ if(!state.planLog[k]) state.planLog[k] = {}; return state.planLog[k]; }
const planDow = k => parseKey(k).getDay();
const fmtShortDay = k => { const d = parseKey(k); return lang()==="es" ? DOW_ES[d.getDay()]+" "+d.getDate() : DOW_SHORT[d.getDay()]+" "+d.getDate(); };
const fmtLongDay = k => { const d = parseKey(k); return lang()==="es" ? ucfirst(DOW_ES_LONG[d.getDay()])+" "+d.getDate()+" de "+MONTHS_ES[d.getMonth()] : fmtDay(k,true); };
function defaultPlanFor(level){

/* ---------- where the student really is ---------- */
const missionLimit = () => Math.min(tier().missionLimit, LESSONS.length);
function nextIncomplete(from){ for(let i=Math.max(0,from); i<missionLimit(); i++) if(!state.completedMissions.includes(i)) return i; return -1; }
function missionPos(){
  const d = state.draft;
  if(d && d.kind==="mission" && d.mi!=null && !state.completedMissions.includes(d.mi)){
    const order = ["arrive","understand","see","build","write","speak","reflect","complete"];
    return {mi:d.mi, step:Math.max(0, order.indexOf(stepsFor(d)[d.stepIdx]) - 1)};
  }
  const nx = nextMission();
  return nx>=0 ? {mi:nx, step:0} : null;
}
function segOf(step){ const segs = SEGS[sessionsPer()]; let c = 0; for(let i=0;i<segs.length;i++){ if(step < c+segs[i].length) return {idx:i, start:c, end:c+segs[i].length}; c += segs[i].length; } return {idx:segs.length-1, start:c, end:c}; }
function advance(pos){
  if(!pos) return null;
  const sg = segOf(pos.step);
  if(sg.end < MSTEPS.length) return {mi:pos.mi, step:sg.end};
  const n = nextIncomplete(pos.mi+1);
  return n>=0 ? {mi:n, step:0} : null;
}
const posKey = p => p ? p.mi*10 + p.step : -1;
function dayType(k){
  if(isMember() && occurrencesBetween(k,k).some(o=>!o.rec.cancelled)) return "class";
  return state.plan.days.includes(planDow(k)) ? "study" : "rest";
}
function specFor(type, pos, k){
  if(type==="class"){ const o = occurrencesBetween(k,k).find(x=>!x.rec.cancelled); return {type, cid:o?o.id:null}; }
  if(type==="rest") return {type};
  if(!pos) return {type:"study", practice:true};
  const sg = segOf(pos.step);
  return {type:"study", mi:pos.mi, n:sessionsPer(), seg:sg.idx, steps:MSTEPS.slice(pos.step, sg.end)};
}
function tasksOf(spec){
  const L = [];
  if(spec.type==="class" && spec.cid){ ["read","write","attend"].forEach(p=>L.push({id:"c:"+p+":"+spec.cid, kind:"class", part:p, cid:spec.cid})); }
  else if(spec.type==="study"){
    if(spec.practice){ L.push({id:"free", kind:"free"}); if(!state.plan.habits.includes("quiz")) L.push({id:"quizp", kind:"quiz"}); }
    else spec.steps.forEach(st=>L.push({id:"m"+spec.mi+":"+st, kind:"mstep", mi:spec.mi, step:st}));
  }
  state.plan.habits.forEach(h=>{ if(habitById(h)) L.push({id:"h:"+h, kind:"habit", h}); });
  return L;
}
/* today's list is frozen at first sight; the rest is projected from it */
function todaySpec(){
  const k = dayKey(), rec = planRec(k);
  if(!rec.spec || rec.pv!==state.plan.created){
    const spec = specFor(dayType(k), missionPos(), k);
    rec.spec = spec; rec.tasks = tasksOf(spec); rec.pv = state.plan.created;
    save();
  }
  return rec.spec;
}
function projection(days){
  const out = {}, t = dayKey(), ts = todaySpec();
  let pos = missionPos();
  if(ts.type==="study" && ts.mi!=null){ const after = advance({mi:ts.mi, step:MSTEPS.indexOf(ts.steps[0])}); if(posKey(after)>posKey(pos)) pos = after; }
  for(let i=1;i<=days;i++){
    const k = addDays(t,i), type = dayType(k), sp = specFor(type, pos, k);
    out[k] = sp;
    if(type==="study" && sp.mi!=null) pos = advance(pos);
  }
  return out;
}
function specTitle(sp){
  if(!sp) return ["",""];
  if(sp.type==="rest") return ["Rest day · habits only","Descanso activo · solo hábitos"];
  if(sp.type==="class"){ const o = sp.cid && occById(sp.cid); return ["Class day"+(o?" · "+fmtTime(o.time):""), "Día de clase"+(o?" · "+fmtTime(o.time):"")]; }
  if(sp.practice) return ["Practice day","Día de práctica"];
  const L = LESSONS[sp.mi], lab = SEG_LABELS[sp.n][sp.seg]||SEG_LABELS[sp.n][0], part = sp.n>1 ? " · "+(sp.seg+1)+"/"+sp.n : "";
  return ["Mission "+L.n+part+" · "+lab[0], "Misión "+L.n+part+" · "+lab[1]];
}
const specMinutes = sp => tasksOf(sp).reduce((a,t)=>a+taskInfo(t,null).min,0);

/* ---------- micro-goals ---------- */
function taskInfo(t, k){
  if(t.kind==="mstep"){
    const L = LESSONS[t.mi], g = MGOALS[t.step], f = s => s.replace("{n}", L.n).replace("{w}", minWords(t.mi)).replace("{s}", mmss(speakRule(t.mi).min));
    return {en:f(g.en), es:f(g.es), hen:g.hen, hes:g.hes, min:g.min, auto:true, go:()=>startMission(t.mi)};
  }
  if(t.kind==="class"){
    const o = occById(t.cid);

    const Lv = CLASS_LEVELS[o.level];
    if(t.part==="read"){ const T0 = textById((o.rec||{}).textId); return {en:"Read your class text", es:"Lee tu texto de clase", hen:T0?"“"+T0.title+"”":"A text at your level.", hes:T0?"“"+T0.title+"”":"Un texto a tu nivel.", min:Math.max(3,Math.round(Lv.read[1]/Lv.wpm)), auto:true, go:()=>startClassWork(o.id)}; }
    if(t.part==="write") return {en:"Write your class text ("+Lv.write[0]+"–"+Lv.write[1]+" words)", es:"Escribe tu texto de clase ("+Lv.write[0]+"–"+Lv.write[1]+" palabras)", hen:"With attendance, it earns the day star.", hes:"Con la asistencia, gana la estrella del día.", min:10, auto:true, go:()=>startClassWork(o.id)};
    return {en:"Attend your class at "+fmtTime(o.time), es:"Asiste a tu clase a las "+fmtTime(o.time), hen:o.duration+"-minute class. Mark it when it ends.", hes:"Clase de "+o.duration+" minutos. Márcala cuando termine.", min:0, auto:true, go:()=>classSheet(o.id)};
  }
  if(t.kind==="free") return {en:"Free speaking practice", es:"Práctica de habla libre", hen:"Pick a topic: write, speak, reflect.", hes:"Elige un tema: escribe, habla, reflexiona.", min:12, auto:true, go:()=>freeSheet()};
  if(t.kind==="quiz") return {en:"Do a quick check", es:"Haz un repaso rápido", hen:"Five questions from your missions.", hes:"Cinco preguntas de tus misiones.", min:3, auto:true, go:()=>{ quiz = null; quizSheet(); }};
  const H = habitById(t.h) || HABITS[0];
  const go = H.go==="shadow" ? ()=>shadowSheet() : H.go==="quiz" ? ()=>{ quiz = null; quizSheet(); } : H.go==="meditate" ? ()=>meditateSheet() : H.go==="note" ? ()=>noteSheet(k||dayKey()) : null;
  return {en:H.en, es:H.es, hen:H.hen, hes:H.hes, min:H.min, auto:!!(H.ev||H.auto), go, habit:true};
}
function autoDone(t, k){
  const ev = (state.planLog[k]||{}).ev || [];
  if(t.kind==="mstep") return ev.includes("step:"+t.step+":"+t.mi) || (ev.includes("done:mission:"+t.mi) && MSTEPS.indexOf(t.step)>=0 && t.step==="reflect");
  if(t.kind==="class"){
    const o = occById(t.cid); if(!o) return true;
    const r = o.rec||{};
    if(t.part==="read") return !!r.readAt;
    if(t.part==="attend") return !!r.attended;
    const w = state.writingSamples.find(x=>x.id===r.writingId); return !!w && (w.wordCount||0) >= CLASS_LEVELS[o.level].write[0];
  }
  if(t.kind==="free") return ev.includes("done:free");
  if(t.kind==="quiz") return ev.includes("quiz");
  const H = habitById(t.h); if(!H) return false;
  if(H.ev && ev.includes(H.ev)) return true;
  if(H.auto==="note") return wc(dayNote(k))>=3;
  return false;
}
function taskDone(t, k){ const d = (state.planLog[k]||{}).done||{}; if(d[t.id]) return "manual"; return autoDone(t,k) ? "auto" : false; }
function dayStatus(k){
  const rec = state.planLog[k];
  if(k===dayKey() && planOn()) todaySpec();
  const tasks = (rec && rec.tasks) || null;
  if(!tasks) return null;
  const done = tasks.filter(t=>taskDone(t,k)).length;
  return {tasks, done, total:tasks.length, victory:!!(state.planLog[k]||{}).victory};
}

/* ---------- events from the rest of the app ---------- */
function planEvent(name){
  if(!planOn()) return;
  const r = planRec(dayKey()); r.ev = r.ev || [];
  if(!r.ev.includes(name)) r.ev.push(name);
  planAfterChange();
}
function planAfterChange(silent){
  if(!planOn()) return;
  const k = dayKey(), st = dayStatus(k), rec = planRec(k);
  if(!st) return;
  const before = rec.n||0;
  rec.n = st.done; rec.t = st.total;
  if(st.total && st.done>=st.total){
    if(!rec.victory){ rec.victory = nowISO(); save(); if(!silent) setTimeout(()=>celebrate(newBadges()), 380); return; }
  } else if(rec.victory){ delete rec.victory; }
  if(!silent && st.done>before) toastT("✓ Micro-goal done · "+st.done+" of "+st.total, "✓ Micro-meta cumplida · "+st.done+" de "+st.total);
  const nb = newBadges(); if(nb.length && !silent) setTimeout(()=>toastT(nb[0].ico+" New badge: "+nb[0].en, nb[0].ico+" Nueva insignia: "+nb[0].es), 1400);
  save();
}

/* ---------- victories, streaks, badges ---------- */
function victoryStreak(){
  let k = dayKey(), n = 0;
  if(!(state.planLog[k]||{}).victory) k = addDays(k,-1);
  while((state.planLog[k]||{}).victory){ n++; k = addDays(k,-1); }
  return n;
}
function bestStreak(){
  const ks = Object.keys(state.planLog).filter(k=>state.planLog[k].victory).sort();
  let best = 0, run = 0, prev = null;
  ks.forEach(k=>{ run = prev && addDays(prev,1)===k ? run+1 : 1; best = Math.max(best, run); prev = k; });
  return best;
}
const weekStart = k => addDays(k, -((parseKey(k).getDay()+6)%7));
function weekInfo(k){
  const mon = weekStart(k||dayKey()), days = [...Array(7)].map((_,i)=>addDays(mon,i));
  let target = 0, wins = 0;
  days.forEach(d=>{ if(dayType(d)!=="rest") target++; if((state.planLog[d]||{}).victory) wins++; });
  return {mon, days, target:Math.max(1,target), wins};
}
function habitDone(h, k){ return !!taskDone({id:"h:"+h, kind:"habit", h}, k); }
function habitStreak(h){ let k = dayKey(), n = 0; if(!habitDone(h,k)) k = addDays(k,-1); while(habitDone(h,k) && n<400){ n++; k = addDays(k,-1); } return n; }
function earnedBadges(){
  const L = state.planLog, ks = Object.keys(L);
  const wins = ks.filter(k=>L[k].victory).length;
  const e = new Set();
  if(ks.some(k=>(L[k].n||0)>0 || Object.keys(L[k].done||{}).length)) e.add("first-goal");
  if(wins>=1) e.add("first-win");
  if(bestStreak()>=3) e.add("streak3");
  if(ks.some(k=>(L[k].ev||[]).some(x=>x.startsWith("done:mission:")))) e.add("mission");
  if((state.plan.habits||[]).some(h=>habitStreak(h)>=7)) e.add("habit7");
  const weeks = new Set(ks.filter(k=>L[k].victory).map(weekStart));
  if([...weeks].some(m=>{ const w = weekInfo(m); return w.wins>=w.target && addDays(m,6)<=dayKey(); })) e.add("week");
  if(wins>=10) e.add("wins10");
  if(wins>=30) e.add("wins30");
  return e;
}
function newBadges(){
  if(!planOn()) return [];
  const have = new Set(state.planBadges||[]), out = [];
  earnedBadges().forEach(id=>{ if(!have.has(id)){ have.add(id); out.push(BADGES.find(b=>b.id===id)); } });
  if(out.length){ state.planBadges = [...have]; save(); }
  return out.filter(Boolean);
}
function celebrate(badges){
  const old = $("#celebrate"); if(old) old.remove();
  const st = victoryStreak(), wk = weekInfo();
  const el = document.createElement("div"); el.className = "celebrate"; el.id = "celebrate"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  const bits = [...Array(28)].map((_,i)=>`<i style="--x:${(i*37)%100}%;--d:${(i%7)*0.12}s;--c:${["var(--gold)","var(--sk-speak)","var(--sk-listen)","var(--sk-write)","var(--sk-review)","var(--sk-mind)"][i%6]};--r:${(i*53)%360}deg"></i>`).join("");
  el.innerHTML = `<div class="confetti" aria-hidden="true">${bits}</div><div class="cel-card">
    <div class="cel-trophy" aria-hidden="true">🏆</div>
    <p class="kicker">${T("Victory of the day","Victoria del día")}</p>
    <h2 class="display">${T("Every micro-goal, done.","Todas tus micro-metas, cumplidas.")}</h2>
    <p class="muted mt-s">${T((st>1?st+" victories in a row · ":"")+wk.wins+" of "+wk.target+" this week", (st>1?st+" victorias seguidas · ":"")+wk.wins+" de "+wk.target+" esta semana")}</p>
    ${(badges||[]).map(b=>`<div class="cel-badge"><span>${b.ico}</span>${T("New badge: "+b.en, "Nueva insignia: "+b.es)}</div>`).join("")}
    <button class="btn block mt" data-act="celebrateClose">${T("Keep going","Seguir adelante")}</button></div>`;
  document.body.appendChild(el);

let pcY = new Date().getFullYear(), pcM = new Date().getMonth();

/* ---------- sheets ---------- */

  const t = dayKey(), rec = state.planLog[k]||{};

  else if(k<t){ sp = rec.spec; tasks = rec.tasks; if(!tasks) note = tt("No plan was recorded this day. Days count from the moment you open your plan.","Este día no se registró plan. Los días cuentan desde que abres tu plan."); }
  else { sp = projection(Math.max(1, daysBetween(t+"T12:00:00", k+"T12:00:00")))[k]; tasks = sp ? tasksOf(sp) : []; note = tt("Planned. It adjusts automatically if you go faster or slower.","Planeado. Se ajusta solo si vas más rápido o más lento."); }
  const ti = specTitle(sp), done = tasks ? tasks.filter(x=>taskDone(x,k)).length : 0;
  openSheet(`${sheetHead(fmtLongDay(k), sp ? tt(ti[0],ti[1]) : "")}

/* ---------- phone calendar: the cronogram, day by day ---------- */
function planIcs(){
  if(!planOn()) return;
  const t = dayKey(), proj = Object.assign({[t]:todaySpec()}, projection(27)), es = lang()!=="en";
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const P = state.plan, url = location.href.split("#")[0]+"#plan";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ProfGermandario//Fluency OS Plan//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+(es?"Mi plan de inglés":"My English plan")];
  let n = 0;
  Object.keys(proj).sort().forEach(k=>{
    const sp = proj[k]; if(!sp) return;
    const ti = specTitle(sp), tasks = tasksOf(sp), mins = sp.type==="rest" ? Math.max(5, P.habits.reduce((a,h)=>a+(habitById(h)||{min:0}).min,0)) : Math.max(P.minutes, specMinutes(sp));
    const d = parseKey(k), p = P.time.split(":").map(Number); d.setHours(p[0]||7, p[1]||0, 0, 0);
    const e = new Date(d.getTime()+mins*60000), f = x => dayKey(x).replace(/-/g,"")+"T"+pad2(x.getHours())+pad2(x.getMinutes())+"00";
    const list = tasks.map((x,i)=>{ const inf = taskInfo(x,k); return (i+1)+". "+(es?inf.es:inf.en)+" ("+inf.min+" min)"; }).join("\n");
    const sum = (sp.type==="rest" ? (es?"Inglés · hábitos (":"English · habits (")+mins+" min)" : (es?"Inglés · ":"English · ")+(es?ti[1]:ti[0]));
    L.push("BEGIN:VEVENT","UID:plan-"+k+"@fluency-os","DTSTAMP:"+stamp,"SEQUENCE:"+Math.floor(Date.now()/60000),"DTSTART:"+f(d),"DTEND:"+f(e),"SUMMARY:"+icsText(sum),
      "DESCRIPTION:"+icsText((es?"Micro-metas de hoy:\n":"Today's micro-goals:\n")+list+"\n\n"+(es?"Abre tu plan: ":"Open your plan: ")+url),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(sum),"TRIGGER:-PT10M","END:VALARM","END:VEVENT");
    n++;
  });
  L.push("END:VCALENDAR");
  download(es?"mi-plan-de-ingles.ics":"my-english-plan.ics", L.join("\r\n")+"\r\n", "text/calendar");
  toastT("Calendar file with the next 4 weeks downloaded. Open it to add your sessions.", "Archivo con las próximas 4 semanas descargado. Ábrelo para agregar tus sesiones.");
}
function planWeekMessage(){
  const w = weekInfo(), P = state.plan;
  const lines = ["Hola Profe, soy "+(state.name||"tu estudiante")+". Este es mi plan de la semana ("+fmtEsShort(w.days[0])+" – "+fmtEsShort(w.days[6])+").", "",
    "🏆 Victorias: "+w.wins+" de "+w.target+" días planeados", "🔥 Racha de victorias: "+victoryStreak()+" día(s)"];
  let dn = 0, dt = 0; w.days.forEach(k=>{ const r = state.planLog[k]||{}; dn += r.n||0; dt += r.t||0; });
  lines.push("✓ Micro-metas cumplidas: "+dn+(dt?" de "+dt:""), "", "Mis hábitos (últimos 7 días):");
  P.habits.forEach(h=>{ const H = habitById(h); if(!H) return; const c = [...Array(7)].map((_,i)=>addDays(dayKey(),i-6)).filter(k=>habitDone(h,k)).length; lines.push("- "+H.es+": "+c+"/7"); });
  const pos = missionPos(); lines.push("", pos ? "Voy en la Misión "+(pos.mi+1)+": "+(ES_MISSIONS[pos.mi]||{}).t+"." : "Terminé las misiones de mi programa.");

  },
  mgToggle: el => {
    const k = el.dataset.k, id = el.dataset.id, st = dayStatus(k);
    let task = st && st.tasks.find(x=>x.id===id);
    if(!task && id.startsWith("h:")) task = {id, kind:"habit", h:id.slice(2)};
    if(!task) return;
    if(taskDone(task,k)==="auto"){ toastT("Your work already checked this one.","Tu trabajo ya marcó esta."); return; }
    const r = planRec(k); r.done = r.done || {};
    if(r.done[id]) delete r.done[id]; else { r.done[id] = nowISO(); mgFresh = id; setTimeout(()=>{ if(mgFresh===id) mgFresh = null; }, 900); }
    touchPlan(k);
  },
  mgGo: el => {
    const k = el.dataset.k, st = dayStatus(k), task = st && st.tasks.find(x=>x.id===el.dataset.id);
    if(!task) return;
    const info = taskInfo(task,k);
    if(info.go){ if(!info.habit) closeSheet(); info.go(); }
  },
  planDay: el => planDaySheet(el.dataset.k),
  pcShift: el => { pcM += +el.dataset.d; if(pcM<0){ pcM = 11; pcY--; } if(pcM>11){ pcM = 0; pcY++; } repaintPlan(); },
  pcToday: () => { const d = new Date(); pcY = d.getFullYear(); pcM = d.getMonth(); repaintPlan(); },
  planIcs: () => planIcs(),
  planWeek: () => openExternal(waLink(planWeekMessage())),
  celebrateClose: () => { const c = $("#celebrate"); if(c){ c.classList.remove("show"); setTimeout(()=>c.remove(), 250); } repaintPlan(); },
  langSheet: () => langSheet(),

  help: () => helpSheet()
});

Object.assign(ACT, {
  obDay: el => { const d = +el.dataset.d, P = ob.plan; P.days = P.days.includes(d) ? P.days.filter(x=>x!==d) : P.days.concat(d); const y = window.scrollY; VIEWS.onboarding(); window.scrollTo(0,y); },
  obMin: el => { ob.plan.minutes = +el.dataset.v; const y = window.scrollY; VIEWS.onboarding(); window.scrollTo(0,y); },
  obHabit: el => { const h = el.dataset.h, P = ob.plan; if(P.habits.includes(h)) P.habits = P.habits.filter(x=>x!==h); else if(P.habits.length<4) P.habits.push(h); else { toastT("Four habits is the maximum. Remove one first.","Cuatro hábitos es el máximo. Quita uno primero."); return; } const y = window.scrollY; VIEWS.onboarding(); window.scrollTo(0,y); }
});
Object.assign(INP, { obTime: el => { if(ob.plan) ob.plan.time = el.value; } });

/* ---------- theme ---------- */
function applyTheme(){
  document.documentElement.dataset.theme = state.theme==="light" ? "light" : "dark";
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = state.theme==="light" ? "#F6F2EA" : "#140E1A";
}
$("#themeBtn").addEventListener("click", ()=>{ state.theme = state.theme==="light"?"dark":"light"; applyTheme(); save(); });

/* ---------- console helper for the teacher ---------- */
window.QK = {
  hash: async code => { const h = await PGA.kdf(code); console.log(h); return h; },
  version: APP_VERSION
};

/* ---------- boot ---------- */
applyTheme();
save();
LOC.start();
paintLangBtn();
render();
startSync();
</script>
</body>
