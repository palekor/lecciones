{id:"a2-general", level:"A2", ctx:"general", title:"My Favorite Place",
 body:`My favorite place in my city is a small park near my house. It is not big or famous, but it is special for me. There are tall trees, a few wooden benches, and a little fountain in the middle. In the mornings, older people walk there and children play on the grass.

When I was a child, my grandfather took me to this park every Sunday. We fed the birds and ate ice cream together. He told me stories about his life on a farm.

Today, I go to the park when I feel stressed. I sit on our old bench, breathe slowly, and listen to the birds. After fifteen minutes, I always feel calmer. I think everyone needs a place like this: a quiet place to stop and feel at home.`,
 keys:[["bench","banca"],["fountain","fuente"],["feed","alimentar"],["stressed","estresado"],["calmer","más tranquilo"]],
 questions:["What can you see in the park?","What did the writer do there as a child?","Why does the writer go to the park today?"],
 write:"Write about your favorite place. Where is it? What is there? Why is it special for you?",
 speak:"Describe your favorite place and explain why you like it."},

{id:"b1-work", level:"B1", ctx:"work", title:"Working From Home: The Good and the Bad",
 body:`Since 2020, millions of people around the world have started working from home, at least part of the week. For many, it has been a positive change. They no longer spend two hours a day in traffic, they can have lunch with their families, and they often feel more in control of their time.

However, working from home is not perfect. One common problem is that the line between work and personal life disappears. When your office is also your living room, it is easy to answer emails at ten o'clock at night. Another problem is loneliness. Many remote workers say they miss the small conversations with colleagues, like a quick coffee or a joke in the hallway. These moments may seem unimportant, but they help people build trust.

So what is the best solution? Many companies now use a hybrid model: two or three days at home and the rest in the office. If you work from home, a few simple habits can help. Start and finish at the same time every day. Create a space that is only for work. And call a colleague at least once a day, not only to talk about tasks but also to connect as people.

In the end, the question is not only where we work, but how we work. A good routine can make almost any place productive.`,
 keys:[["traffic","tráfico"],["loneliness","soledad"],["hallway","pasillo"],["trust","confianza"],["hybrid","híbrido"]],
 questions:["What are two advantages of working from home?","Why are small conversations with colleagues important?","Which habits does the text recommend?"],

 speak:"Explain the pros and cons of working from home, then give your opinion."},

{id:"b1-travel", level:"B1", ctx:"travel", title:"The Day Everything Went Wrong",
 body:`Last year, I was flying from Medellín to Madrid for a work conference. I had planned everything carefully, or at least I thought I had. The first problem appeared at check-in: my flight was delayed by three hours because of a storm. I wasn't too worried, because I still had time to catch my connection in Panama.

But when we finally landed, my second flight had already left. I ran to the airline desk, where a long line of angry passengers was waiting. After an hour, an agent told me the next flight was the following morning. I asked about my suitcase, and she wasn't sure where it was.

At that moment, I had two options: get angry or stay calm. I decided to stay calm. I asked politely if the airline could give me a hotel room and a meal, and to my surprise, she said yes. At the hotel, I met another passenger, an engineer from Chile who was going to the same conference. We had dinner together and talked for hours.

The next day, I arrived in Madrid tired, without my suitcase, and wearing the same clothes. But I also arrived with a new friend and a great story. My suitcase appeared two days later. Since then, I have learned something important: you can't control every problem when you travel, but you can always control your reaction.`,
 keys:[["delayed","retrasado"],["connection","conexión, escala"],["suitcase","maleta"],["politely","con cortesía"],["reaction","reacción"]],
 questions:["Why did the writer miss the connection?","What did the writer decide to do at the airline desk?","What positive thing came out of the problem?"],
 write:"Tell the story of a day when something went wrong. What happened, how did you react, and what did you learn?",
 speak:"Tell a story about a problem you had while traveling or at work, and how you solved it."},

{id:"b1-confidence", level:"B1", ctx:"confidence", title:"Why Mistakes Help You Learn",
 body:`Many adult learners have the same fear: they don't want to speak English because they might make a mistake. They prefer to stay silent until their grammar is perfect. Unfortunately, that day never comes. Nobody, not even a native speaker, speaks without errors.

Mistakes are not the opposite of progress; they are part of it. When you try to say something and get it wrong, your brain notices the gap between what you said and what you wanted to say. If someone corrects you, or if you hear the correct form later, that gap starts to close. Without the mistake, there is nothing to correct.

Think about how children learn their first language. A three-year-old says, "I goed to the park," and nobody tells them to stop talking. Adults simply answer, "Oh, you went to the park? That's great!" The child hears the correct form, and after a while, they start using it. Children are not afraid of looking silly, and that is one of their biggest advantages.

So what can adults do? First, change the goal of each conversation. The goal is not to be perfect; it is to communicate one idea clearly. Second, write down your common mistakes after class and review them once a week. Third, celebrate small wins, like the first time you order food or make a phone call in English.

Every mistake you make today is a lesson you won't need tomorrow.`,
 keys:[["fear","miedo"],["gap","brecha, vacío"],["silly","tonto, ridículo"],["advantage","ventaja"],["celebrate","celebrar"]],
 questions:["Why do many adults stay silent in English?","What happens in the brain when we make a mistake?","What three things can adults do differently?"],
 write:"Write about a mistake that taught you something, in English or in life. What happened, and what did you learn?",
 speak:"Do you agree that mistakes help you learn? Give your opinion with one personal example."},

{id:"b1-general", level:"B1", ctx:"general", title:"The Power of Small Habits",
 body:`Most people want big changes in their lives: a healthier body, a better job, fluent English. The problem is that big changes feel heavy, so we wait for the perfect moment to start. Meanwhile, months go by and nothing changes.

A different approach is to focus on small habits. A small habit is an action so easy that you can do it even on a bad day. For example, instead of promising to study English for two hours every night, you could promise to learn three new words with your morning coffee. Instead of planning to run ten kilometers, you could put on your running shoes and walk around the block.

These actions may seem too small to matter, but they work for two reasons. First, they are easy to repeat, and repetition is what turns an action into a habit. Second, each time you complete a small habit, you prove to yourself that you are the kind of person who keeps promises. Over time, three words become ten, and a walk becomes a run.

A useful trick is to connect a new habit to something you already do every day. For instance: "After I brush my teeth, I will read one paragraph in English." Your old habit becomes a reminder for the new one.

You don't need more motivation. You need a smaller first step and the patience to repeat it.`,
 keys:[["approach","enfoque"],["meanwhile","mientras tanto"],["repeat","repetir"],["keep a promise","cumplir una promesa"],["reminder","recordatorio"]],
 questions:["Why do big changes often fail?","What are the two reasons small habits work?","How can you connect a new habit to an old one?"],

 speak:"Describe one habit that changed your life, or one you want to build, and explain why."},

{id:"b2-work", level:"B2", ctx:"work", title:"Meetings People Actually Want to Attend",
 body:`Ask any office worker what wastes most of their time, and the answer is likely to be the same: meetings. Many professionals spend a large part of their week in meetings, and a surprising number of those hours produce few concrete results. Yet meetings are not inherently bad. When they are well designed, they are the fastest way to make decisions, resolve conflicts, and align a team. The difference lies almost entirely in preparation.

The first rule of an effective meeting is that it must have a clear purpose, stated in one sentence. "Weekly update" is not a purpose; "Decide which supplier we will sign with" is. A clear purpose also tells participants how to prepare and how to know when the meeting has succeeded. If you cannot write that sentence, you probably need an email, not a meeting.

The second rule concerns the guest list. Every person in the room should contribute information, make a decision, or be directly affected by the outcome. A useful test is to ask whether the meeting would suffer if a particular person were absent. Inviting people "just to keep them informed" turns a working session into an audience, and audiences rarely participate.

Third, share an agenda in advance, ideally with the materials people need to read. This allows participants to arrive with opinions instead of first impressions. During the meeting itself, the facilitator's job is to protect time and voices: keep the discussion on track, invite quieter colleagues to speak, and politely interrupt anyone who dominates the conversation.

Finally, no meeting should end without three things: a summary of what was decided, a list of actions, and a name next to each action. Without them, people leave the room with different memories of what happened, and the same meeting has to take place again next week.

For non-native speakers, meetings can feel especially intimidating, since conversations move quickly and interruptions are common. Preparing two or three key sentences in advance, such as "Could I add something here?" or "Just to clarify, are we saying that…?", can make the difference between staying silent and being heard.`,
 keys:[["inherently","en sí mismo"],["align","alinear"],["supplier","proveedor"],["outcome","resultado"],["intimidating","intimidante"]],
 questions:["How can you tell whether you need a meeting or an email?","Who should be invited to a meeting, according to the text?","What three things should every meeting end with?"],

 speak:"Explain how you would run a meeting that people actually want to attend. Give at least three rules."},

{id:"b2-travel", level:"B2", ctx:"travel", title:"The Case for Slow Travel",
 body:`For decades, the typical holiday has looked like a race. Travelers try to visit five cities in seven days, rushing from one famous monument to the next, taking hundreds of photos and remembering surprisingly little. They return home exhausted, often feeling that they need another holiday to recover from the first one.

In response, a growing number of people are embracing what has become known as slow travel. The idea is simple: visit fewer places and stay longer in each one. Instead of spending a single night in a city, slow travelers might rent an apartment for two weeks, shop at the local market, take a cooking class, or join a language exchange. Rather than seeing a place, they try to live in it, even briefly. Some combine their trips with remote work, staying for a month or more in a single city.

Supporters argue that this approach has several advantages. First, it is often cheaper, since weekly rentals usually cost less than hotels and travelers spend less on transport. Second, fewer flights and long journeys mean a smaller environmental footprint. Third, and perhaps most importantly, it leads to deeper experiences. When you return to the same café every morning, the owner starts to recognize you. Conversations become possible, and with them, real cultural exchange.

Slow travel also offers a remarkable opportunity for language learners. Ordering bread every day at the same bakery may sound repetitive, but repetition in a real context is exactly what makes vocabulary stick. Locals also tend to be more patient with a visitor they see every day. By the end of the second week, phrases that once required careful planning start to come out naturally.

Of course, slow travel is not for everyone. Many people only have a few days of vacation each year, and they understandably want to see as much as possible. Nevertheless, even short trips can borrow the philosophy: choose one neighborhood instead of five, leave empty space in your schedule, and allow yourself to get lost. Sometimes the most memorable moments are the ones nobody planned.`,
 keys:[["embrace","adoptar, acoger"],["briefly","brevemente"],["footprint","huella"],["stick","quedarse (en la memoria)"],["nevertheless","sin embargo"]],
 questions:["What problem does slow travel try to solve?","What are the three advantages mentioned in the text?","How can people with short holidays use the same idea?"],

 speak:"Argue for or against slow travel, using at least two reasons from the text and one of your own."},

{id:"b2-confidence", level:"B2", ctx:"confidence", title:"The Myth of the Perfect Accent",
 body:`Many English learners spend years trying to eliminate their accent. They watch pronunciation videos, imitate actors, and feel embarrassed every time someone asks them where they are from. Behind all this effort lies a common belief: that a foreign accent is a sign of poor English. This belief is not only inaccurate; it can actively hold learners back.

To begin with, there is no single correct English accent. English is spoken as a first language in countries as different as Scotland, Nigeria, Australia, and Jamaica, and as an additional language by far more people. A person from Glasgow and a person from Texas sound completely different, yet both speak perfectly good English. In international business, many conversations in English take place between people for whom it is not a first language at all.

What really matters is not accent but intelligibility: how easily a listener can understand you. Pronunciation researchers have long distinguished between the two, and their work suggests that a speaker can have a noticeable accent while being completely clear. Intelligibility depends on a few key features: placing stress on the right syllable, pronouncing certain vowel contrasts clearly, and speaking at a steady pace with natural pauses.

This is good news, because it means learners can focus their energy where it counts. Instead of trying to sound like a news presenter from London, they can work on the specific sounds that cause misunderstandings, such as the difference between "ship" and "sheep", or between "thirty" and "thirteen". For Spanish speakers, the most common difficulties involve short and long vowels and the final consonants that Spanish rarely uses. Recording yourself and comparing it with a model is one of the fastest ways to find your personal priorities.

There is also an emotional side to this issue. Your accent carries your history, your first language, and your identity. Many respected public figures speak English with a strong accent and are admired for their ideas, not criticized for their vowels. Confidence comes from clarity and preparation, not from hiding where you come from.`,
 keys:[["eliminate","eliminar"],["embarrassed","avergonzado"],["intelligibility","inteligibilidad"],["stress (a syllable)","acentuar (una sílaba)"],["misunderstanding","malentendido"]],
 questions:["Why is the belief about accents described as inaccurate?","What is the difference between accent and intelligibility?","Which features make speech easier to understand?"],
 write:"How do you feel about your accent in English? Explain whether this text changed your opinion, and set one realistic pronunciation goal.",
 speak:"Explain the difference between accent and intelligibility, then talk about your own accent with confidence."},

{id:"b2-general", level:"B2", ctx:"general", title:"Attention: The Most Valuable Thing You Own",
 body:`Every time you unlock your phone, you enter a marketplace in which your attention is the product being sold. Social media platforms, news sites, and games compete fiercely for the minutes of your day, because the longer you stay, the more advertising they can show you. To win that competition, they rely on design techniques borrowed from psychology: endless scrolling, unpredictable rewards, and notifications engineered to feel urgent.

The consequences are easy to observe. Many people report that they find it harder to read a long article or a book without checking their phone. Conversations are interrupted by vibrations. Work that requires deep thinking, such as writing a report or learning a language, is broken into small fragments, and each interruption carries a cost, because the mind needs time to return to full concentration after switching tasks.

None of this means that technology is the enemy. The same phone that distracts you can also give you access to dictionaries, podcasts, and conversation partners from around the world. The real question is who is in control: you or the app.

Fortunately, regaining control does not require dramatic measures. Turning off non-essential notifications removes dozens of interruptions a day. Keeping the phone in another room while studying reduces the temptation to check it. Scheduling specific times for email and messages, rather than responding instantly, protects longer periods for focused work. Removing the most distracting apps from the home screen adds a small but useful barrier between impulse and action.

It can also help to treat attention as a skill that can be trained. Short meditation practices, in which you repeatedly bring your focus back to your breathing, are essentially exercises in noticing distraction and choosing to return. Like a muscle, attention grows stronger with regular use. Even five minutes a day, practiced consistently, is more useful than an hour once a month.

Ultimately, what you pay attention to shapes who you become. If you want to become fluent in English, the most important investment you can make may not be money, but focused minutes.`,
 keys:[["fiercely","ferozmente"],["unpredictable","impredecible"],["fragment","fragmento"],["regain","recuperar"],["temptation","tentación"]],
 questions:["Why do apps compete for your attention?","What happens to deep work when we are interrupted?","Which three practical strategies does the text suggest?"],
 write:"Describe how your phone affects your attention. Then design a realistic plan to protect one hour of focused English practice each day.",
 speak:"Is technology helping or hurting your ability to focus? Defend your position with examples."},

{id:"c1-work", level:"C1", ctx:"work", title:"Leading Across Cultures",
 body:`When a Colombian manager joins a video call with colleagues in Germany, Japan, and the United States, the agenda may be written in a single language, but the conversation is taking place in several cultures at once. Each participant brings unspoken assumptions about how decisions should be made, how disagreement should be expressed, and even what counts as being on time. Leaders who ignore these differences often conclude that their colleagues are rude, evasive, or inefficient, when in reality they are simply following a different set of rules.

One of the most useful distinctions is between low-context and high-context communication, a framework introduced by the anthropologist Edward T. Hall. In low-context cultures, such as the Netherlands or the United States, messages are expected to be explicit: people say what they mean, and the listener is not supposed to read between the lines. In high-context cultures, which include much of Latin America and East Asia, meaning depends heavily on relationships, tone, and what is left unsaid. A Japanese colleague who describes a proposal as "difficult" may be delivering a clear refusal; a Dutch colleague who says "this plan has three serious problems" may simply be trying to help.

Feedback is another area in which misunderstandings flourish. In some workplaces, criticism is delivered directly and even publicly, and receiving it is considered a sign of respect. In others, negative feedback is softened, wrapped in compliments, or delivered privately through an intermediary. A manager accustomed to the first style may unintentionally humiliate a team member; one accustomed to the second may give feedback so gentle that the message never arrives.

Decision-making varies just as widely. Some organizations favor consensus, investing considerable time in discussion so that implementation is fast and smooth once a decision has been reached. Others prefer a top-down approach, in which the leader decides quickly and the details are adjusted later. Neither model is inherently superior, but mixing them without acknowledging the difference creates frustration on both sides.

What, then, distinguishes leaders who thrive in multicultural teams? Rather than memorizing lists of national stereotypes, they cultivate a habit of curiosity. They ask explicit questions about expectations at the start of a project: How do we prefer to receive feedback? Who needs to be consulted before a decision is final? What does a deadline actually mean here? Some teams even write these agreements down in a short document that new members read on their first day. They also learn to adapt their own style while remaining recognizably themselves, becoming slightly more direct with some colleagues and more patient with others.

For professionals working in a second language, there is an additional layer of complexity, since linguistic precision and cultural fluency are not the same thing. Mastering English grammar allows you to be understood; understanding the cultural logic behind the words allows you to be trusted. In global teams, it is often the second skill that determines who is invited to lead.`,
 keys:[["unspoken assumption","supuesto tácito"],["evasive","evasivo"],["flourish","florecer, proliferar"],["intermediary","intermediario"],["thrive","prosperar"]],
 questions:["What is the difference between low-context and high-context communication?","How can different feedback styles cause problems?","What do successful multicultural leaders do instead of relying on stereotypes?"],
 write:"Describe a cross-cultural misunderstanding you have experienced or observed. Analyze it using the concepts in the text and propose how it could have been avoided.",
 speak:"Brief a new manager on how to lead a multicultural team. Cover communication, feedback, and decisions."},

{id:"c1-travel", level:"C1", ctx:"travel", title:"The Paradox of Popular Places",
 body:`Few experiences are as disappointing as arriving at a destination you have dreamed about for years, only to find it buried under crowds. In recent years, cities such as Venice, Barcelona, and Amsterdam have struggled with what is now widely called overtourism: a situation in which the number of visitors damages the very qualities that attracted them in the first place. Residents complain of rising rents, disappearing local shops, and streets that feel more like theme parks than neighborhoods.

The causes are well documented. Cheaper flights, a growing global middle class, cruise ships that release thousands of passengers at once, and short-term rental platforms have made travel more accessible than ever before. Social media has added a powerful accelerant. When a single photograph of a hidden beach or a colorful street goes viral, thousands of people may arrive within months to recreate the same image, often with little interest in the place beyond the picture.

This creates a genuine paradox. Tourism brings employment, investment, and cultural exchange, and many communities depend on it economically. Yet when it grows without limits, it can erode housing affordability, strain infrastructure, and turn living traditions into performances staged for outsiders. The question facing local governments is not whether to welcome visitors, but how to welcome them without sacrificing the community itself.

Responses have varied considerably. Some cities have introduced tourist taxes or entry fees for their most crowded areas, using the revenue to fund public services; Venice, for example, began charging day-trippers an entry fee on its busiest days in 2024. Others have restricted short-term rentals, limited the number of cruise ships that can dock, or stopped approving new hotels in historic centers. A few have launched campaigns encouraging visitors to explore less famous neighborhoods or to travel outside the peak season. Critics argue that such measures risk turning travel into a privilege of the wealthy, while supporters respond that unregulated tourism already imposes its costs on those least able to bear them: local residents.

Colombia offers an instructive example of both opportunity and risk. After decades in which many international travelers avoided the country, regions such as the Coffee Region and the Caribbean coast have seen rapid growth in visitors. This has created new livelihoods for farmers, guides, and small business owners. In Salento and the Cocora Valley, for instance, weekend crowds now fill trails and streets that were quiet a decade ago, and residents debate how much more growth the area can absorb. At the same time, some communities have begun to ask how to protect water resources, landscapes, and traditional ways of life as the numbers increase.

Ultimately, much of the responsibility lies with travelers themselves. Choosing locally owned accommodation, spending money in small businesses, visiting outside the busiest months, and treating residents as neighbors rather than background scenery may seem like modest gestures. Multiplied by millions, however, they can determine whether a beloved destination remains a living place or becomes a crowded postcard.`,
 keys:[["accelerant","acelerador"],["erode","erosionar"],["strain","sobrecargar"],["revenue","ingresos"],["livelihood","sustento"]],
 questions:["Why is overtourism described as a paradox?","What measures have cities taken, and what is the main criticism of them?","What role does the text give to individual travelers?"],
 write:"Write an opinion piece for a local newspaper: should your region limit tourism? Weigh the economic benefits against the costs, and propose concrete measures.",
 speak:"Present a balanced two-minute argument about tourism in your region, then state your own position."},

{id:"c1-confidence", level:"C1", ctx:"confidence", title:"Speaking Under Pressure",
 body:`Almost everyone has experienced it: you prepare carefully for a presentation, a job interview, or a difficult conversation in English, and at the crucial moment your mind goes blank. Words you used fluently the night before suddenly seem to vanish. Your heart races, your voice tightens, and you hear yourself speaking in short, hesitant fragments. It is tempting to interpret this as proof that your English is not good enough. In reality, it is usually proof that your nervous system is doing exactly what it was designed to do.

When the brain perceives a threat, whether it is a predator or a room full of evaluating faces, it activates the stress response. Hormones such as adrenaline and cortisol prepare the body for action by increasing heart rate and redirecting energy toward the muscles. Useful as this was for our ancestors, it comes at a cost for complex thinking. Research suggests that high levels of stress can impair working memory, the mental workspace we use to hold information while we manipulate it. Speaking a second language places heavy demands on precisely this system, because the speaker must retrieve vocabulary, apply grammar, monitor pronunciation, and follow the conversation simultaneously.

Understanding this mechanism changes the strategy. If the problem is not a lack of knowledge but a temporary reduction in mental capacity, the solution is to reduce the load and calm the system, not to cram more grammar the night before.

Several approaches have solid support. The first is slow breathing, particularly with a long exhalation, which activates the parasympathetic nervous system and signals to the body that the danger has passed. Even a minute or two of slow, steady breathing before speaking can noticeably lower physical tension. The second is automatization: language that has been practiced until it is automatic requires far less working memory. This is why rehearsing key chunks, such as your opening sentence, transitions, and common phrases, is more valuable than memorizing an entire script, which tends to collapse at the first interruption.

A third approach involves reframing. Studies on stress have found that people who interpret their racing heart as a sign of energy, rather than of danger, often perform better under pressure. Saying "I'm excited" instead of "I'm nervous" may sound like a trick, but it changes how the body's arousal is put to use.

Finally, gradual exposure matters. Each time you speak in a moderately stressful situation and come through it, the brain updates its threat assessment. A short contribution in a meeting today makes a longer one easier next month. The same principle underlies many treatments for anxiety: avoidance keeps fear alive, while safe repetition gradually weakens it.

Fluency under pressure, in other words, is not only a linguistic achievement. It is the product of a trained mind, a regulated body, and repeated evidence that you can be uncomfortable and still communicate clearly.`,
 keys:[["go blank","quedarse en blanco"],["impair","deteriorar"],["cram","estudiar a última hora"],["reframe","replantear"],["threat assessment","evaluación de amenaza"]],
 questions:["Why can stress make a fluent speaker suddenly lose words?","Why is rehearsing chunks more useful than memorizing a full script?","What does reframing mean, and why might it help?"],
 write:"Describe a high-pressure speaking situation you will face soon. Using the text, write a concrete preparation plan for the day before and the five minutes before.",
 speak:"Explain to a nervous colleague what happens in the brain under pressure and what they can do about it."},

{id:"c1-general", level:"C1", ctx:"general", title:"Deep Work in a Distracted World",
 body:`In an economy increasingly shaped by automation and artificial intelligence, one human ability is becoming both rarer and more valuable: the capacity to concentrate intensely on a demanding task for an extended period. The writer and computer scientist Cal Newport has called this ability "deep work", contrasting it with "shallow work": the logistical tasks, such as answering messages and attending routine meetings, that can be performed while distracted and that rarely create much new value.

The argument rests on two observations. First, the skills that are hardest to automate, from designing a complex strategy to writing persuasively or mastering a language, require sustained concentration to acquire and to perform. Second, modern workplaces are organized in ways that make such concentration almost impossible. Open offices, instant messaging, and the expectation of constant availability fragment the working day into intervals of a few minutes, and each interruption leaves behind what researchers have described as "attention residue": part of the mind remains occupied with the previous task, reducing performance on the next one.

If deep work is so valuable, why do so few people practice it? Partly because shallow work is visible. Responding quickly to every email creates a sense of productivity and signals commitment to colleagues, even when it accomplishes little. Deep work, by contrast, often looks like doing nothing: a person sitting quietly with a notebook, phone switched off, apparently unreachable. In many organizations, busyness is rewarded more consistently than results.

Cultivating the ability requires deliberate structure rather than willpower alone. Newport compares the capacity for focus to a muscle: it weakens when neglected and grows stronger with deliberate training. Some people adopt a rhythmic approach, reserving the same block of time each morning for their most demanding work before checking any messages. Others prefer a more radical approach, disappearing for several days to complete a major project. Equally important is learning to tolerate boredom. If every moment of waiting in a queue is filled with a quick glance at a screen, the brain becomes conditioned to expect constant novelty, and sustained focus begins to feel almost painful.

For language learners, the implications are significant. Thirty minutes of fully focused practice, in which you read a challenging text, write a paragraph without looking up words, or record yourself speaking and then analyze the recording, will usually produce more progress than two hours of half-attentive studying with notifications appearing every few minutes. Intensity, not just time, determines how quickly new structures become automatic. A useful rule is to decide in advance exactly what a focused session should produce, such as one corrected paragraph or ten new phrases used in context.

None of this requires abandoning technology or retreating from professional life. It requires recognizing that attention is finite and treating your focused hours as the scarce resource they are. Those who learn to protect them will find that they can master difficult things quickly, which, in a rapidly changing world, may be the most important skill of all.`,
 keys:[["sustained","sostenido"],["residue","residuo"],["busyness","estar ocupado (sin resultados)"],["willpower","fuerza de voluntad"],["scarce","escaso"]],
 questions:["What is the difference between deep work and shallow work?","Why do organizations often reward shallow work?","What does the text recommend for language learners specifically?"],
 write:"Evaluate your own working or study week in terms of deep and shallow work. Propose a realistic schedule change and justify it with arguments from the text.",
 speak:"Argue whether deep work is realistic in your job or studies. Address one counterargument."}
];

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  fallbackCopy(t); return Promise.resolve();
}
function fallbackCopy(t){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(e){} a.remove(); }
function download(name, text, mime){
  const blob = new Blob([text],{type:mime||"application/json"}); const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ============================================================
   STATE — key unchanged so every existing student keeps data.
   v1/v2 data is backed up untouched before the first v3 save.
   ============================================================ */
const STORE_KEY = "qkesl_state_v1";
const DATA_VERSION = 4;
const APP_VERSION = "12.1";

function defaultState(){
  return {
    version:DATA_VERSION, uuid:uid("qk"), name:"", createdAt:nowISO(), theme:"dark",
    currentMission:0, completedMissions:[], xp:0, hours:0, vocabLearned:0, streak:0, lastActiveDate:null,
    meditationsCompleted:0, achievements:[], journalEntries:[], sessionDoneToday:false, sessionDoneDate:null,
    missionProgress:{}, writingSamples:[], sessionLog:[], meditationLog:[], stuckSignals:[], currentFocus:"",
    startingPoint:{level:"",goal:"",fear:"",learningStyle:"",baseline:""},
    practiceRecords:[], quizzes:[], lastMilestoneCycleShown:0,
    /* v3 */
    onboarded:false, tier:"essential", placementStart:0,
    speakingAttempts:[], reflections:[], mirrorSamples:[], shadowLog:[], draft:null, ttsRate:0.92,
    /* v4 — classes */
    classSeries:[], classRecords:{}, myTexts:[], days:{},
    /* 11.1 — Report Studio */
    reportLog:[],
    /* 11.2 — Teacher link: ProfGermandario's feedback on each writing */
    teacherFeedback:{},
    /* 11.3 — direct messages from ProfGermandario */
    teacherMessages:{},
    /* 12.0 — language of the instructions, study plan (cronograma), guidance */
    lang:"bi", plan:null, planLog:{}, planBadges:[], guideSeen:{}
  };
}
function migrate(raw){
  const s = defaultState();
  if(!raw || typeof raw!=="object") return s;
  Object.assign(s, raw);
  ["completedMissions","achievements","journalEntries","writingSamples","sessionLog","meditationLog","stuckSignals",
   "practiceRecords","quizzes","speakingAttempts","reflections","mirrorSamples","shadowLog","classSeries","myTexts","reportLog"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  if(!s.missionProgress || typeof s.missionProgress!=="object") s.missionProgress = {};
  if(!s.classRecords || typeof s.classRecords!=="object" || Array.isArray(s.classRecords)) s.classRecords = {};
  s.classSeries = s.classSeries.filter(x=>x && x.id && Array.isArray(x.days) && x.days.length && /^\d{4}-\d{2}-\d{2}$/.test(x.start||""));
  Object.keys(s.classRecords).forEach(k=>{ const r = s.classRecords[k]; if(!r || typeof r!=="object" || !/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")) delete s.classRecords[k]; else r.id = k; });
  s.myTexts = s.myTexts.filter(t=>t && t.id && t.title && typeof t.body==="string");
  if(!s.days || typeof s.days!=="object" || Array.isArray(s.days)) s.days = {};
  if(!s.teacherFeedback || typeof s.teacherFeedback!=="object" || Array.isArray(s.teacherFeedback)) s.teacherFeedback = {};
  if(!s.teacherMessages || typeof s.teacherMessages!=="object" || Array.isArray(s.teacherMessages)) s.teacherMessages = {};
  if(!["es","bi","en"].includes(s.lang)) s.lang = "bi";
  if(!s.planLog || typeof s.planLog!=="object" || Array.isArray(s.planLog)) s.planLog = {};
  Object.keys(s.planLog).forEach(k=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !s.planLog[k] || typeof s.planLog[k]!=="object") delete s.planLog[k]; });
  if(s.plan && (typeof s.plan!=="object" || !Array.isArray(s.plan.days) || !Array.isArray(s.plan.habits))) s.plan = null;
  if(!Array.isArray(s.planBadges)) s.planBadges = [];
  if(!s.guideSeen || typeof s.guideSeen!=="object" || Array.isArray(s.guideSeen)) s.guideSeen = {};
  Object.keys(s.days).forEach(k=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !s.days[k] || typeof s.days[k]!=="object") delete s.days[k]; });
  /* class notes from the first 11.0 build become day notes */
  Object.values(s.classRecords).forEach(r=>{ if((r.notes||"").trim()){ const d = s.days[r.date] || (s.days[r.date] = {}); d.note = d.note ? d.note+"\n"+r.notes : r.notes; } delete r.notes; });
  s.startingPoint = Object.assign({level:"",goal:"",fear:"",learningStyle:"",baseline:""}, raw.startingPoint||{});
  if(!TIERS[s.tier]) s.tier = "essential";
  if(typeof s.placementStart!=="number") s.placementStart = 0;
  s.completedMissions = [...new Set(s.completedMissions.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<LESSONS.length))];
  if(typeof s.currentMission!=="number" || s.currentMission<0) s.currentMission = 0;
  s.currentMission = Math.min(s.currentMission, LESSONS.length-1);
  if(raw.onboarded===undefined) s.onboarded = !!(raw.name || (raw.completedMissions||[]).length || (raw.startingPoint && raw.startingPoint.goal));
  if(!s.mirrorSamples.length && s.startingPoint.baseline && s.startingPoint.baseline.trim()){
    s.mirrorSamples.push({id:uid("mir"), date:s.createdAt||nowISO(), text:s.startingPoint.baseline, words:wc(s.startingPoint.baseline), seconds:0, recordingId:null, legacy:true});
  }
  if(s.draft && !s.draft.kind) s.draft = null;
  if(typeof s.hours!=="number") s.hours = parseFloat(s.hours)||0;
  s.version = DATA_VERSION;
  return s;
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ return defaultState(); }
  if(!raw) return defaultState();
  try{
    const parsed = JSON.parse(raw);
    const v = parsed && parsed.version ? parsed.version : 1;
    if(v < DATA_VERSION){
      const bk = "qkesl_backup_v"+v;
      try{ if(!localStorage.getItem(bk)) localStorage.setItem(bk, raw); }catch(e){}
    }
    return migrate(parsed);
  }catch(e){
    try{ localStorage.setItem("qkesl_backup_unreadable", raw); }catch(_){}
    return defaultState();
  }
}

  if(SYNC) scheduleSync();
}

/* ============================================================
   AUDIO STORAGE — recordings live in IndexedDB, never in
   localStorage (too small). Metadata stays in state.
   ============================================================ */
const AudioDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    if(this.db) return res(this.db);
    if(!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
    const r = indexedDB.open("qkesl_audio",1);
    r.onupgradeneeded = () => r.result.createObjectStore("rec");
    r.onsuccess = () => { this.db = r.result; res(this.db); };
    r.onerror = () => rej(r.error);
  }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("rec",mode); const out=fn(t.objectStore("rec")); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); },
  put(id,blob){ return this.tx("readwrite", s=>s.put(blob,id)); },
  get(id){ return this.tx("readonly", s=>s.get(id)); },
  del(id){ return this.tx("readwrite", s=>s.delete(id)); },
  clear(){ return this.tx("readwrite", s=>s.clear()); }
};
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function hydrateAudio(){
  document.querySelectorAll("audio[data-rec]").forEach(async el=>{
    try{ const blob = await AudioDB.get(el.dataset.rec); if(blob){ el.src = URL.createObjectURL(blob); el.classList.remove("hide"); } }catch(e){}
  });
}

const tier = () => { const s = access(); return TIERS[s.tier==="teacher" ? "mastery" : s.tier] || TIERS.spectator; };
const depth = () => tier().depth;
const ctx = () => contextOf(state.startingPoint.goal);
const CTX_LABEL = {work:"your work", travel:"travel", confidence:"speaking with confidence", general:"everyday life"};
const highestDone = () => state.completedMissions.length ? Math.max(...state.completedMissions) : -1;
function isUnlocked(i){
  if(i >= tier().missionLimit) return false;
  if(state.completedMissions.includes(i) || state.missionProgress[i]) return true;
  return i <= Math.max(state.placementStart, highestDone()+1);
}
function lockReason(i){
  if(i >= tier().missionLimit){ if(!isMember()) return "Members only. Your access code opens it."; const n = tier().next; return "Included in the "+(n?TIERS[n].name:"next")+" program."; }
  return "Complete Mission "+i+" to open this one.";
}
function nextMission(){
  const lim = Math.min(tier().missionLimit, LESSONS.length);
  const start = state.placementStart < lim ? state.placementStart : 0; /* a preview starts at Mission 1 */
  for(let i=start;i<lim;i++) if(!state.completedMissions.includes(i)) return i;
  for(let i=0;i<Math.min(start,lim);i++) if(!state.completedMissions.includes(i)) return -2; /* only review missions left */
  return -1;
}
function cycleInfo(){
  const d = Math.max(0, daysBetween(state.createdAt||nowISO(), new Date()));
  return {n:Math.floor(d/CONFIG.cycleDays)+1, day:(d%CONFIG.cycleDays)+1};
}
function liveStreak(){ return state.lastActiveDate && daysBetween(state.lastActiveDate,new Date())<=1 ? state.streak : 0; }
function touch(){
  const t = dayKey(); if(state.lastActiveDate===t) return;
  const y = dayKey(Date.now()-86400000);
  state.streak = state.lastActiveDate===y ? (state.streak||0)+1 : 1;
  state.lastActiveDate = t;
}
function stats(){
  const att = state.speakingAttempts;
  const legacy = state.practiceRecords.filter(r=>r.type==="speaking" && +r.duration>0);
  const all = att.map(a=>a.duration).concat(legacy.map(r=>+r.duration));

  return {
    missions: state.completedMissions.length,
    attempts: all.length,
    secs: all.reduce((a,b)=>a+b,0),

    words: state.writingSamples.reduce((a,w)=>a+(w.wordCount||wc(w.content)),0),
    hours: state.hours||0,

    meditations: Math.max(state.meditationsCompleted||0, state.meditationLog.length),
    shadow: state.shadowLog.length,
    reflections: state.reflections.length,
    streak: liveStreak(),
    ...classStats()
  };
}

    classesAttended: recs.filter(r=>r.attended).length,
    classTextsRead: recs.filter(r=>r.readAt).length,

  };

function mirrorDue(){

  return daysBetween(last.date,new Date()) >= CONFIG.mirrorEveryDays ? "again" : false;

function speakRule(i){
  let [min,target] = speakTargets(i);
  const adjusted = depth()>=2 && freezes(state.startingPoint.fear);
  if(adjusted) min = Math.max(20, Math.round(min*0.66/5)*5);

function keywords(text){
  const stop = new Set("about after again because before being could every first their there these those which while would should really thing things people other where today always never maybe".split(" "));
  const seen = new Set(), out = [];
  (String(text).toLowerCase().match(/[a-z'’]{5,}/g)||[]).forEach(w=>{ if(!stop.has(w) && !seen.has(w) && out.length<6){ seen.add(w); out.push(w); } });
  return out;
}

/* ============================================================
   CLASSES — ENGINE
   A weekly class is a "series" (days + time + duration). Every
   date it falls on is an occurrence with id  seriesId@YYYY-MM-DD.
   Records (progress, notes, text, per-date changes) are created
   only when needed, so empty weeks cost nothing. A single class
   is a record with oneoff:true. When a series with history is
   edited, past dates are frozen as they were (frozenUntil).
   ============================================================ */
const parseKey = k => { const p = String(k).split("-").map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dayKey(d); };
const maxKey = (...a) => a.filter(Boolean).reduce((x,y)=>x>y?x:y);
const fmtDay = (k,long) => parseKey(k).toLocaleDateString("en-US", long ? {weekday:"long",month:"long",day:"numeric"} : {weekday:"short",month:"short",day:"numeric"});
const fmtDayEs = k => parseKey(k).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
function fmtTime(t){ const p = String(t||"00:00").split(":").map(Number), h = p[0]||0; return ((h%12)||12)+":"+pad2(p[1]||0)+" "+(h>=12?"PM":"AM"); }
function levelKey(v){ const s = String(v||"").toUpperCase(); if(s.startsWith("C")) return "C1"; const k = s.slice(0,2); return CLASS_LEVELS[k] ? k : "A2"; }
const studentLevel = () => levelKey(state.startingPoint.level);
const hasClasses = () => state.classSeries.length>0 || Object.values(state.classRecords).some(r=>r.oneoff);

function seriesEnd(s){
  let e = s.end || null;
  if(s.weeks){ const w = addDays(s.start, s.weeks*7-1); if(!e || w<e) e = w; }
  return e;
}
function seriesDates(s, from, to){
  const out = [], end = seriesEnd(s);
  let k = maxKey(s.start, from, s.frozenUntil ? addDays(s.frozenUntil,1) : null);
  const last = end && end<to ? end : to;
  for(let g=0; k<=last && g<1500; g++, k=addDays(k,1)) if(s.days.includes(parseKey(k).getDay())) out.push(k);
  return out;
}
function buildOcc(id, date, s){
  const r = state.classRecords[id] || null, b = r || s || {}, base = s || b;
  return {id, date, series:s||null, oneoff:!s,
    time: (r&&r.time) || base.time || CLASS_DEFAULT.time,
    duration: +((r&&r.duration) || base.duration || CLASS_DEFAULT.duration),
    title: (r&&r.title) || base.title || CLASS_DEFAULT.title,
    level: levelKey((r&&r.level) || base.level || studentLevel()),
    rec: r || {}};
}
function occurrencesBetween(from, to){
  const out = [], seen = new Set();
  state.classSeries.forEach(s=>seriesDates(s,from,to).forEach(k=>{ const id = s.id+"@"+k; seen.add(id); out.push(buildOcc(id,k,s)); }));
  Object.values(state.classRecords).forEach(r=>{
    if(seen.has(r.id) || r.date<from || r.date>to) return;
    if(r.oneoff) out.push(buildOcc(r.id, r.date, null));
    else if(r.frozen) out.push(buildOcc(r.id, r.date, state.classSeries.find(x=>x.id===r.seriesId)||null));
  });
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function occById(id){
  if(!id) return null;
  const r = state.classRecords[id];
  if(r && r.oneoff) return buildOcc(id, r.date, null);
  const at = String(id).lastIndexOf("@"); if(at<0) return null;
  const s = state.classSeries.find(x=>x.id===id.slice(0,at)), date = id.slice(at+1);
  if(s) return buildOcc(id, date, s);
  return r ? buildOcc(id, date, null) : null;
}
function ensureRec(o){
  if(!state.classRecords[o.id]) state.classRecords[o.id] = {id:o.id, date:o.date, seriesId:o.series?o.series.id:null};
  o.rec = state.classRecords[o.id];
  return o.rec;
}
const hasProgress = r => !!(r && (r.attended || r.readAt || r.writingId || r.bestSecs || r.reflectionId));

function classSpeakRule(lv){
  let [min,target] = CLASS_LEVELS[levelKey(lv)].speak;
  const adjusted = depth()>=2 && freezes(state.startingPoint.fear);
  if(adjusted) min = Math.max(20, Math.round(min*0.66/5)*5);
  return {min, target, adjusted};
}
function classParts(o){
  const r = o.rec||{};
  return {attended:!!r.attended, read:!!r.readAt, wrote:!!r.writingId, spoke:(r.bestSecs||0)>=classSpeakRule(o.level).min, reflected:!!r.reflectionId};
}
const classDone = o => { const p = classParts(o); return CLASS_PARTS.filter(x=>p[x[0]]).length; };
const classPct = o => classDone(o)/CLASS_PARTS.length;
/* ★ The day's star: the student attended AND wrote the class text to the
   instructions — at least the minimum words for the class level. */
function classStar(o){
  const r = o.rec||{};
  if(r.cancelled || !r.attended || !r.writingId) return false;
  const w = state.writingSamples.find(x=>x.id===r.writingId);
  return !!w && (w.wordCount||0) >= CLASS_LEVELS[o.level].write[0];
}
const dayStarred = k => occurrencesBetween(k,k).some(classStar);
/* one note per calendar day, with or without a class */
const dayNote = k => ((state.days[k]||{}).note||"");
function dayRec(k){ if(!state.days[k]) state.days[k] = {}; return state.days[k]; }
/* call before a change; the returned function celebrates a newly earned star */
function starWatch(o){
  const had = classStar(o);
  return () => { const now = occById(o.id); if(now && !had && classStar(now)) toast("★ Star earned for "+fmtDay(now.date)+"!"); };
}
function classStartDate(o){ const d = parseKey(o.date), p = o.time.split(":").map(Number); d.setHours(p[0]||0, p[1]||0, 0, 0); return d; }
const classOver = o => Date.now() > classStartDate(o).getTime() + o.duration*60000;
function classStatus(o){
  const r = o.rec||{}, t = dayKey();
  if(r.cancelled) return r.movedTo ? "moved" : "cancelled";
  if(classPct(o)>=1) return "complete";
  if(r.attended) return "attended";
  if(o.date<t) return "missed";
  if(o.date===t) return classOver(o) ? "unmarked" : "today";
  return "scheduled";
}
function classNumber(o){
  if(!o.series) return null;
  const s = o.series, mine = x => x.series && x.series.id===s.id && !x.rec.cancelled;
  const n = occurrencesBetween(s.start, o.date).filter(mine).length;
  const end = seriesEnd(s);
  return {n, total: end ? occurrencesBetween(s.start, end).filter(mine).length : null};
}

/* ---------- class texts ---------- */
const allTexts = () => CLASS_TEXTS.concat(state.myTexts||[]);
const textById = id => allTexts().find(t=>t.id===id) || null;
const classText = o => textById((o.rec||{}).textId);
function assignText(o){
  const r = ensureRec(o), cur = textById(r.textId);
  if(cur) return cur;
  const used = {};
  Object.values(state.classRecords).forEach(x=>{ if(x.textId) used[x.textId] = (used[x.textId]||0)+1; });
  const c = ctx();
  const pool = CLASS_TEXTS.filter(t=>t.level===o.level).sort((a,b)=>(used[a.id]||0)-(used[b.id]||0) || (b.ctx===c)-(a.ctx===c));
  r.textId = pool[0].id; save();
  return pool[0];
}
function splitSentences(p){
  const safe = p.replace(/\s+/g," ").trim().replace(/\b(Mrs|Mr|Ms|Dr|St|vs)\./g,"$1\u0001").replace(/\b([A-Z])\.(?=\s[A-Z])/g,"$1\u0001");
  return (safe.match(/[^.!?…]+(?:[.!?…]+["”’)]*|$)/g)||[safe]).map(s=>s.replace(/\u0001/g,".").trim()).filter(Boolean);
}
function readerHTML(T){
  let i = 0;
  return `<article class="reader">${String(T.body).split(/\n\s*\n/).map(p=>`<p>${splitSentences(p).map(s=>`<span class="snt" data-act="saySnt" data-i="${i++}">${esc(s)}</span>`).join(" ")}</p>`).join("")}</article>`;
}
function readerTools(){
  return `<div class="row-gap mt" style="align-items:center"><button class="btn-line" data-act="readAll">${ICON_PLAY}<span>Listen to the text</span></button>
    <div class="seg" style="grid-template-columns:1fr 1fr;flex:1;min-width:170px" role="group" aria-label="Reading speed"><button data-act="rateR" data-v="0.75" aria-pressed="${state.ttsRate<0.85}">Slow</button><button data-act="rateR" data-v="0.95" aria-pressed="${state.ttsRate>=0.85}">Natural</button></div></div>
    <p class="small muted mt-s">Tap any sentence to hear it on its own.</p>`;
}
function meterInner(n, range, label){
  const [a,b] = range, top = b*1.35, pos = Math.min(100, n/top*100), za = a/top*100, zb = b/top*100;
  const st = n<a ? "low" : n>b ? "high" : "ok";
  const note = st==="low" ? (a-n)+" to go" : st==="high" ? (n-b)+" over" : "In range";
  return `<div class="meter ${st}"><div class="meter-track"><span class="meter-zone" style="left:${za}%;width:${zb-za}%"></span><span class="meter-pin" style="left:${pos}%"></span></div>
    <div class="meter-cap"><span><b>${n}</b> words · ${note}</span><span>${esc(label)} ${a}–${b}</span></div></div>`;
}

/* reading aloud, sentence by sentence (long texts in one utterance get cut off on some phones) */
let readTok = 0;
function stopReading(){
  readTok++;
  document.querySelectorAll(".snt.on").forEach(s=>s.classList.remove("on"));
  document.querySelectorAll('[data-act="readAll"]').forEach(b=>{ b.dataset.on = ""; const s = b.querySelector("span"); if(s) s.textContent = "Listen to the text"; });

function readerScope(){ return $("#scrim").classList.contains("open") && $("#sheet").querySelector(".reader") ? $("#sheet") : view; }
function readAll(btn){
  const scope = readerScope(), spans = [...scope.querySelectorAll(".snt")];
  const lbl = btn && btn.querySelector("span");
  if(btn && btn.dataset.on==="1"){ stopReading(); return; }
  stopReading();
  const tok = readTok;
  if(btn) btn.dataset.on = "1";
  if(lbl) lbl.textContent = "Stop";
  let k = 0;
  const next = () => {
    if(tok!==readTok) return;
    if(k>=spans.length){ stopReading(); return; }
    const sp = spans[k];
    sp.classList.add("on"); sp.scrollIntoView({block:"nearest", behavior:"smooth"});
    say(sp.textContent, null, ()=>{ if(tok!==readTok) return; sp.classList.remove("on"); k++; setTimeout(next, 220); });

function practiceDays(){
  const s = new Set(), add = iso => { if(iso) s.add(dayKey(iso)); };
  state.sessionLog.forEach(x=>add(x.date)); state.writingSamples.forEach(x=>add(x.createdAt));
  state.speakingAttempts.forEach(x=>add(x.date)); state.shadowLog.forEach(x=>add(x.date));
  state.quizzes.forEach(x=>add(x.date)); state.meditationLog.forEach(x=>add(x.date));

function dayEvidence(k){
  const w = state.writingSamples.filter(x=>dayKey(x.createdAt)===k), s = state.speakingAttempts.filter(x=>dayKey(x.date)===k);

  if(s.length) out.push(s.length+" speaking attempt"+(s.length>1?"s":"")+", "+mmss(s.reduce((a,x)=>a+(x.duration||0),0))+" spoken");

const whenLine = o => (o.date===dayKey()?"Today":fmtDay(o.date))+" · "+fmtTime(o.time)+" · "+o.duration+" min";

/* ---------- schedule changes that keep history ---------- */
function freezePast(s){
  const t = dayKey(), y = addDays(t,-1);
  if(s.start>y) return;
  seriesDates(s, s.start, y).forEach(k=>{
    const o = buildOcc(s.id+"@"+k, k, s), r = ensureRec(o);
    r.frozen = true; r.seriesId = s.id;
    if(!r.time) r.time = o.time; if(!r.duration) r.duration = o.duration; if(!r.title) r.title = o.title; if(!r.level) r.level = o.level;
  });
  s.frozenUntil = maxKey(s.frozenUntil, y);
}
function rehomeFuture(s){
  /* future records of this series that no longer fall on its dates:
     keep the ones with work in them as single classes, drop the rest */
  const t = dayKey(), valid = new Set(seriesDates(s, t, addDays(t,800)).map(k=>s.id+"@"+k));
  Object.values(state.classRecords).forEach(r=>{
    if(r.seriesId!==s.id || r.oneoff || r.frozen || r.date<t || valid.has(r.id)) return;
    if(hasProgress(r) || r.textId){
      const o = buildOcc(r.id, r.date, s);
      Object.assign(r, {oneoff:true, frozen:false, time:o.time, duration:o.duration, title:o.title, level:o.level});
    } else delete state.classRecords[r.id];
  });
}
function nextClassFor(textId){
  const t = dayKey();
  return occurrencesBetween(t, addDays(t,60)).find(o=>!o.rec.cancelled && !(o.rec||{}).readAt && !(o.date===t && classOver(o))) || null;
}

/* ---------- calendar file (.ics) — weekly repeats + reminders ---------- */
function icsText(s){ return String(s).replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n"); }
function icsExport(){
  const t = dayKey(), BY = ["SU","MO","TU","WE","TH","FR","SA"];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const dt = (k,tm) => k.replace(/-/g,"")+"T"+tm.replace(":","")+"00";
  const dtEnd = (k,tm,dur) => { const d = parseKey(k), p = tm.split(":").map(Number); d.setHours(p[0], p[1]+dur, 0, 0); return dayKey(d).replace(/-/g,"")+"T"+pad2(d.getHours())+pad2(d.getMinutes())+"00"; };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ProfGermandario//Fluency OS//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:English classes"];
  const ev = (id,k,tm,dur,title,extra) => {
    L.push("BEGIN:VEVENT","UID:"+id.replace(/[^A-Za-z0-9-]/g,"-")+"@fluency-os","DTSTAMP:"+stamp,"DTSTART:"+dt(k,tm),"DTEND:"+dtEnd(k,tm,dur),"SUMMARY:"+icsText(title),"DESCRIPTION:"+icsText("Open Fluency OS before class to read your class text."));
    (extra||[]).forEach(x=>L.push(x));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(title),"TRIGGER:-PT30M","END:VALARM","END:VEVENT");
  };
  let n = 0;
  state.classSeries.forEach(s=>{
    const end = seriesEnd(s); if(end && end<t) return;
    const lo = maxKey(t, s.start, s.frozenUntil?addDays(s.frozenUntil,1):null), first = seriesDates(s, lo, addDays(lo,7))[0];
    if(!first) return;
    let rule = "RRULE:FREQ=WEEKLY;BYDAY="+DOW_MON_FIRST.filter(d=>s.days.includes(d)).map(d=>BY[d]).join(",");
    if(end) rule += ";UNTIL="+end.replace(/-/g,"")+"T235959";
    const ex = Object.values(state.classRecords).filter(r=>r.seriesId===s.id && !r.oneoff && r.cancelled && r.date>=first).map(r=>"EXDATE:"+dt(r.date,s.time));
    ev(s.id, first, s.time, s.duration, s.title, [rule].concat(ex)); n++;
  });
  Object.values(state.classRecords).forEach(r=>{
    if(!r.oneoff || r.cancelled || r.date<t) return;
    const o = buildOcc(r.id, r.date, null); ev(r.id, o.date, o.time, o.duration, o.title); n++;
  });
  if(!n){ toast("No upcoming classes to add."); return; }
  L.push("END:VCALENDAR");
  download("english-classes.ics", L.join("\r\n")+"\r\n", "text/calendar");
  toast("Calendar file downloaded. Open it to add your classes with reminders.");
}

/* ---------- sharing a class text by link (no server) ---------- */
function b64urlEncode(str){ const b = new TextEncoder().encode(str); let s = ""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64urlDecode(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s += "="; const bin = atob(s), b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
function textShareLink(T){ return location.href.split("#")[0]+"#t="+b64urlEncode(JSON.stringify({v:1, t:T.title, l:T.level, b:T.body, w:T.write||"", s:T.speak||""})); }
let pendingShare = null;
function receiveShared(code){
  try{
    const o = JSON.parse(b64urlDecode(code));
    const title = String(o.t||"").trim().slice(0,140), body = String(o.b||"").trim().slice(0,12000);
    if(!title || wc(body)<10) throw new Error("empty");
    let T = state.myTexts.find(x=>x.body===body);
    if(!T){ T = {id:uid("txt"), title, level:levelKey(o.l), body, write:String(o.w||"").slice(0,400), speak:String(o.s||"").slice(0,400), from:"shared", createdAt:nowISO()}; state.myTexts.push(T); save(); }
    pendingShare = T.id;
  }catch(e){ toast("That class text link is incomplete. Ask for it again."); }
}

  topics:{work:"Escribe un correo pidiéndole una reunión a tu jefe.",travel:"Escribe un correo a un hotel para cambiar tu reserva.",confidence:"Escribe un mensaje presentándote de forma profesional.",general:"Escribe un mensaje profesional solicitando información."},
  explain:"El inglés de negocios prefiere oraciones cortas y directas en lugar de las fórmulas de cortesía más elaboradas del español profesional. La cortesía viene de la elección de palabras (\"Would you be able to...\"), no de oraciones más largas.",
  vocab:["sustantivo · una persona interesada en un resultado","sustantivo · un resultado concreto del trabajo"],
  mistakes:["La escritura de negocios en inglés es más corta y directa — ve al punto en la primera oración."]},
 {t:"Presentaciones", desc:"Habla ante un grupo con estructura y presencia.", obj:"Hoy vas a estructurar una charla corta que quien escucha pueda seguir.",
  speak:"Da una charla de dos minutos con tres puntos señalizados.",
  topics:{work:"Haz el esquema de una actualización de dos minutos sobre un proyecto.",travel:"Haz el esquema de una recomendación de dos minutos de un lugar para visitar.",confidence:"Haz el esquema de una charla de dos minutos sobre algo que conoces bien.",general:"Haz el esquema de una charla de dos minutos sobre un tema que te importa."},
  explain:"Las presentaciones en inglés suelen organizarse en tres puntos claros que se anuncian en voz alta (\"First… Second… Finally…\"). Eso ayuda al público a saber dónde vas, algo que un lector ve con los ojos pero un oyente no.",
  vocab:["sustantivo · cómo se posiciona la información para el público","sustantivo · el ritmo y la fluidez del habla"],
  mistakes:["El público angloparlante espera la idea principal al inicio — empieza con la conclusión y luego sustenta."]},
 {t:"Negociación", desc:"Defiende resultados con tacto y claridad.", obj:"Hoy vas a sostener tu posición con cortesía y firmeza.",
  speak:"Negocia en voz alta: plantea tu posición, haz una concesión y cierra el trato.",
  topics:{work:"Negocia un salario, una fecha de entrega o un precio.",travel:"Negocia una mejor habitación o un precio más bajo.",confidence:"Di no a una petición que no quieres aceptar.",general:"Negocia algo que quieras este mes."},
  explain:"El lenguaje de negociación en inglés une firmeza y frases suavizadoras en la misma oración —\"I understand, but I'd need...\"— en vez de separar cortesía y firmeza en oraciones distintas, como suele hacerse en español.",
  vocab:["sustantivo · una ventaja que se usa para negociar","sustantivo · algo que se cede para llegar a un acuerdo"],
  mistakes:["Plantea tu posición primero — en una negociación en inglés, firmeza y cortesía no son opuestas."]},
 {t:"Fluidez cultural", desc:"Lee el ambiente en distintas culturas y contextos.", obj:"Hoy vas a usar expresiones idiomáticas en las situaciones donde corresponden.",
  speak:"Describe una diferencia cultural que hayas notado. Usa dos expresiones idiomáticas con naturalidad.",
  topics:{work:"Escribe un mensaje corto a tu equipo usando tres expresiones idiomáticas.",travel:"Describe una sorpresa cultural que tuviste viajando.",confidence:"Describe cómo rompes el hielo con personas nuevas.",general:"Describe una diferencia cultural que hayas notado."},
  explain:"Las expresiones idiomáticas llevan una lógica cultural que la traducción literal destruye: \"break the ice\" no tiene nada que ver con hielo. Aprenderlas significa aprender la situación a la que pertenecen, no solo las palabras.",
  vocab:["sustantivo · una expresión que no se toma literalmente","sustantivo · una norma social o profesional aceptada"],
  mistakes:["Aprende la expresión como una unidad fija ligada a su situación — la traducción literal casi nunca tiene sentido en inglés."]},
 {t:"Conversación avanzada", desc:"Debate, discrepa y persuade con soltura.", obj:"Hoy vas a discrepar con respeto y defender tu punto.",
  speak:"Defiende una postura durante un minuto y luego defiende la contraria.",
  topics:{work:"Argumenta a favor o en contra del trabajo desde casa.",travel:"Argumenta a favor o en contra de viajar solo.",confidence:"Argumenta a favor o en contra de la idea de que los errores te ayudan a aprender.",general:"Argumenta a favor o en contra de una opinión popular."},
  explain:"Para discrepar en inglés se suele empezar con una pequeña concesión —\"That's fair, but...\"— antes del contraargumento. Entrar directo al desacuerdo sin esa apertura suele sonar más confrontacional de lo que quieres.",
  vocab:["sustantivo · un argumento o perspectiva contraria","sustantivo · tacto para manejar conversaciones delicadas"],
  mistakes:["Abre con una pequeña concesión antes del contraargumento — así la conversación sigue siendo colaborativa, no combativa."]},
 {t:"Presencia ejecutiva", desc:"Domina una sala con tono, ritmo y postura.", obj:"Hoy vas a hablar con ritmo, pausas y autoridad.",
  speak:"Graba una actualización de 60 segundos como si informaras a un equipo directivo.",
  topics:{work:"Escribe un informe de 60 segundos para tu equipo directivo.",travel:"Escribe un informe de 60 segundos para un viaje en grupo que lideras.",confidence:"Escribe una actualización de 60 segundos sobre tu propio progreso en inglés.",general:"Escribe una actualización de 60 segundos sobre un proyecto que te importa."},
  explain:"La presencia ejecutiva en inglés viene del ritmo, no del volumen: bajar la velocidad, hacer pausas entre ideas y usar oraciones afirmativas cortas transmite más credibilidad que hablar rápido para demostrar fluidez.",
  vocab:["sustantivo · seriedad y peso en la forma de ser","sustantivo · seguridad serena y elegante"],
  mistakes:["En inglés, un ritmo pausado transmite más credibilidad que la velocidad — baja el ritmo, sobre todo antes de los puntos clave."]},
 {t:"Maestría e integración", desc:"Une todas tus habilidades en una sola voz fluida.", obj:"Hoy vas a unir todas tus habilidades en una charla sin guion.",
  speak:"Da una charla de tres minutos sobre cualquier tema, sin guion.",
  topics:{work:"Escribe el esquema de una charla de tres minutos sobre tu carrera.",travel:"Escribe el esquema de una charla de tres minutos sobre un lugar que te cambió.",confidence:"Escribe el esquema de una charla de tres minutos sobre tu camino con el inglés.",general:"Escribe el esquema de una charla de tres minutos sobre el tema que elijas."},
  explain:"Esta misión no tiene gramática nueva: es donde los pronombres, los bloques, las preguntas, los sonidos, las preposiciones, el vocabulario, las historias y el tono profesional funcionan al mismo tiempo, sin guion, como pasa en una conversación real.",
  vocab:["sustantivo · combinar partes en un todo unificado","adjetivo · capaz de hablar con facilidad y precisión"],
  mistakes:["Confía en los bloques y las estructuras que construiste — ahora importa más la velocidad de producción que la precisión perfecta."]}
];

/* ============================================================
   BILINGUAL LAYER · ENGINE
   Three modes, chosen by the student (header button, onboarding):
     es → instructions in Spanish (English stays in the content)
     bi → English with a Spanish line under each instruction
     en → English only (full immersion)
   Every screen is still written in English in the code. After each
   render, a MutationObserver translates what reached the page, so
   every view, sheet, toast and dialog follows the mode with no
   change to the rendering code. Learning content (example
   sentences, class texts, the student's own writing) is never
   replaced: when a translation exists, it appears underneath.
   ============================================================ */
const LANG_MODES = {
  es:{short:"ES", en:"Spanish instructions", es:"Instrucciones en español", sub:"Todo lo que tienes que hacer, explicado en español. El contenido de práctica sigue en inglés."},
  bi:{short:"ES·EN", en:"Bilingual", es:"Bilingüe", sub:"Inglés con la traducción al español debajo. Recomendado para empezar."},
  en:{short:"EN", en:"English only", es:"Solo inglés", sub:"Inmersión total. Para cuando ya no necesites la ayuda."}
};
const lang = () => (state && LANG_MODES[state.lang]) ? state.lang : "bi";
/* Small helpers for new screens written in both languages at once. */
function T(en, es){
  const l = lang();
  if(l==="en" || es==null) return `<span class="notr">${en}</span>`;
  if(l==="es") return `<span class="notr" lang="es">${es}</span>`;
  return `<span class="notr">${en}<span class="es-tr" lang="es">${es}</span></span>`;
}
const tt = (en, es) => lang()==="es" ? es : en;                       /* plain text: attributes, file text */
const tb = (en, es) => lang()==="en" ? en : lang()==="es" ? es : en+" · "+es; /* short labels both ways */
function toastT(en, es){ toast(""); $("#toast").innerHTML = T(esc(en), esc(es)); }

   [/^(.+) · (\d{1,2}:\d\d [AP]M) · (\d+) min · ([A-C][12]) · (every week|until .+|ended .+)$/, m=>D(m[1])+" · "+m[2]+" · "+m[3]+" min · "+m[4]+" · "+(m[5]==="every week"?"cada semana":m[5].replace(/^until (.+)$/,(x,d)=>"hasta el "+D(d)).replace(/^ended (.+)$/,(x,d)=>"terminó el "+D(d)))],

  ];
  /* "attend the class on … and write your class text (35–80 words)." */
  const NEED = [[/^attend the class on (.+)$/i, m=>"asiste a la clase del "+D(m[1])], [/^mark that you attended$/i, ()=>"marca que asististe"],
    [/^write your class text \((\d+)–(\d+) words\)$/i, m=>"escribe tu texto de clase ("+m[1]+"–"+m[2]+" palabras)"], [/^write at least (\d+) words$/i, m=>"escribe al menos "+m[1]+" palabras"]];
  function needs(s){
    const body = s.replace(/\.$/,""); const parts = body.split(" and ");
    const out = parts.map(p=>{ for(const [re,fn] of NEED){ const m = p.match(re); if(m) return fn(m); } return null; });

  }

  function build(){
    dict = new Map();
    const add = (en, es) => { if(en && es && String(en)!==String(es)) dict.set(norm(en), es); };
    Object.keys(ES_DICT).forEach(k=>add(k, ES_DICT[k]));
    LESSONS.forEach((L,i)=>{
      const E = ES_MISSIONS[i]; if(!E) return;
      add(L.t,E.t); add(L.desc,E.desc); add(L.obj,E.obj); add(L.speak,E.speak); add(L.kit.explain,E.explain);
      Object.keys(L.topics||{}).forEach(c=>add(L.topics[c], E.topics[c]));
      L.vocab.forEach((v,j)=>add(v[1], E.vocab[j]));
      L.kit.mistakes.forEach((m,j)=>{
        const es = E.mistakes[j]; if(!es) return; add(m.right, es);
        const a = m.right.split(" — "), b = es.split(" — ");
        if(a.length>1 && b.length>1) add(a.slice(1).join(" — "), b.slice(1).join(" — "));
      });
    });
    PHASES.forEach((p,i)=>{ add(p.label, ES_PHASES[i].label); add(p.desc, ES_PHASES[i].desc); });
    CLASS_TEXTS.forEach(T=>{ const E = ES_CLASS_TEXTS[T.id]; if(!E) return; add(T.write,E.write); add(T.speak,E.speak); (T.questions||[]).forEach((q,i)=>add(q,(E.questions||[])[i])); });

  /* English → Spanish, or null when there is nothing to translate. */
  function tr(raw, el){
    const s = norm(raw);

    if(!dict) build();
    if(el && el.closest) for(const [sel,map] of ES_CTX){ if(map[s]!=null && el.closest(sel)) return map[s]; }

    if(/^(Attend|Mark|Write) /i.test(s)){ const n = needs(s); if(n) return n; }

    if(sents.length>1){ let any = false; const o = sents.map(p=>{ const t = tr(p, el); if(t!=null){ any = true; return t; } return p; }); if(any) return o.join(" "); }
    if(dateish(s)){ const d = D(s); if(d!==s) return ucfirst(d); }
    return null;
  }

  /* ---------- DOM ---------- */
  const SKIP = "script,style,textarea,input,svg,iframe,.notr,.es-tr,.word,.snt,.code-big,.code-mono,.mc-code,.brand,.cal-dow,.code-form";
  const CONTENT = ".en,.pattern li,.reader,.cues,.sample,.archive-item,.day-writing,.quiz-opt,.mistake .w";
  const CONTENT_UI = ".ladder li > span,.archive-item header span,.sample header span";
  const INLINE = ".pill,.chip,.seg button,.kicker,.step-name,.ob-step,.sent-badge,.meter-cap span,.parts-cap span,.counter span,.journey-label span,.phase-head span,.mc-k,.mc-brand,.rs-sum span,.cal-legend span,.bars-caption span,.archive-item header span,.sample header span,.cal-month,.wk-cap,.mg-meta";
  const BI_SKIP = ".glyph,.sys-num,.idx,.pct,.tier-chip,.mc-tier,.cal-num,.wk-day,.num";
  const FMT = {B:1, STRONG:1, EM:1, I:1, U:1};
  let mode = "bi";
  const isContent = el => !!el.closest(CONTENT) && !el.closest(CONTENT_UI);
  function unitOf(node){
    let el = node.parentElement;
    const mixed = e => !!e && [...e.childNodes].some(c=>c.nodeType===3 && /[A-Za-z]/.test(c.nodeValue));
    while(el && ((FMT[el.tagName] && mixed(el.parentElement)) || (el.matches("a.link,button.link") && el.parentElement && /^(P|LI|SPAN|DIV)$/.test(el.parentElement.tagName) && el.parentElement.childNodes.length>1))) el = el.parentElement;
    return el;
  }
  const skipped = el => !el || !!el.closest(SKIP);
  function textNodes(root){
    const out = [];
    if(root.nodeType===3){ if(!skipped(root.parentElement)) out.push(root); return out; }
    if(root.nodeType!==1 || skipped(root)) return out;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{
      if(!/[A-Za-z]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;

  }
  const keep = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];
  function subSpan(t, unit, inline){
    const s = document.createElement("span"); s.className = "es-tr"+(inline?" inl":""); s.lang = "es"; s.textContent = t; s.__unit = unit; return s;
  }
  function clearSubs(unit){ [...unit.querySelectorAll(".es-tr")].forEach(s=>{ if(s.__unit===unit) s.remove(); }); }

  /* es: replace in place · bi/content: add a Spanish line under it */
  function doNode(n){
    const p = n.parentElement; if(!p) return;

      if(n.__es===n.nodeValue) return;

    }

      if(n.__es===n.nodeValue) return;
      const t = tr(n.nodeValue, p); if(t==null) return;
      n.__en = n.nodeValue; n.__es = keep(n.nodeValue, t); n.nodeValue = n.__es;
    }
  }
  function doUnit(unit, nodes){
    if(!unit || (mode==="es" && !isContent(unit))) return;
    if(mode==="bi" && unit.closest(BI_SKIP)){ if(mode==="bi" && unit.matches(".glyph")) nodes.forEach(n=>{ const t = tr(n.nodeValue, unit); if(t && t.length<=4 && n.__es!==n.nodeValue){ n.__en = n.nodeValue; n.__es = t; n.nodeValue = t; } }); return; }

    if(unit.__bi===sig) return;

    const inline = !!unit.closest(INLINE) && !isContent(unit);

      const n = nodes[0], orig = n.nodeValue;

      if(mode==="bi" && dateish(norm(orig)) && norm(orig)!=="Today") return;
      let anchor = n; while(anchor.parentNode && anchor.parentNode!==unit) anchor = anchor.parentNode;
      const s = subSpan(t, unit, inline);
      anchor.parentNode.insertBefore(s, anchor.nextSibling);
      return;
    }
    let any = false;
    const txt = nodes.map(n=>{ const t = tr(n.nodeValue, unit); if(t!=null){ any = true; return keep(n.nodeValue, t); } return n.nodeValue; }).join("");
    if(any) unit.appendChild(subSpan(norm(txt), unit, inline));

  const ATTRS = ["placeholder","aria-label","title"];
  function doAttrs(el){
    ATTRS.forEach(a=>{
      if(!el.hasAttribute(a)) return;
      const cur = el.getAttribute(a); el.__tra = el.__tra || {};
      if(el.__tra[a]===cur) return;
      if(mode==="bi" && a!=="placeholder") return;
      const t = tr(cur, el); if(t==null) return;
      el.__ena = el.__ena || {}; el.__ena[a] = cur;
      const v = mode==="bi" ? cur+" / "+t : t;
      el.__tra[a] = v; el.setAttribute(a, v);
    });
  }
  function localize(root){
    if(mode==="en" || !root) return;
    const nodes = textNodes(root), units = new Map();
    nodes.forEach(n=>{ doNode(n); const u = unitOf(n); if(!u) return; if(!units.has(u)) units.set(u, []); });
    /* collect every direct text of each unit (not only the changed ones) */
    units.forEach((list, u)=>{ textNodes(u).forEach(n=>{ if(unitOf(n)===u && n.parentElement.tagName!=="OPTION") list.push(n); }); doUnit(u, list); });
    const els = root.nodeType===1 ? [root, ...root.querySelectorAll("[placeholder],[aria-label],[title]")] : [];
    els.forEach(el=>{ if(el.nodeType===1 && !el.closest(".notr,.brand")) doAttrs(el); });
  }
  /* ---------- live: every change on the page ---------- */
  let obs = null;
  function onMut(list){
    const roots = new Set();
    list.forEach(m=>{
      if(m.type==="childList") m.addedNodes.forEach(n=>{ if(n.nodeType===1 && !n.classList.contains("es-tr")) roots.add(n); else if(n.nodeType===3 && n.parentElement) roots.add(n.parentElement); });

    });

    obs.takeRecords();
  }
  function start(){
    mode = lang(); paintHtml();
    localize(document.body);
    obs = new MutationObserver(onMut);
    obs.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
  }

  /* switching modes: put the English back, then translate again */
  function relocalize(){
    if(obs) obs.disconnect();
    document.querySelectorAll(".es-tr:not(.notr .es-tr)").forEach(s=>s.remove());
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
    while((n = w.nextNode())){ if(n.__en!=null && n.nodeValue===n.__es) n.nodeValue = n.__en; delete n.__en; delete n.__es; }
    document.querySelectorAll("*").forEach(el=>{ delete el.__bi; if(el.__ena){ Object.keys(el.__ena).forEach(a=>{ if(el.getAttribute(a)===el.__tra[a]) el.setAttribute(a, el.__ena[a]); }); delete el.__ena; delete el.__tra; } });
    mode = lang(); paintHtml();
    if(obs) obs.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
    localize(document.body); if(obs) obs.takeRecords();
  }
  /* native confirm / prompt boxes */
  function dialog(msg){
    if(lang()==="en" || !msg) return msg;
    const parts = String(msg).split(/\n{2,}/), out = parts.map(p=>tr(p)||null);
    if(!out.some(x=>x)) return msg;
    const es = parts.map((p,i)=>out[i]||p).join("\n\n");
    return lang()==="es" ? es : msg+"\n\n— "+es;
  }
  return {tr, localize, relocalize, start, dialog, D};
})();
(function(){
  const c = window.confirm.bind(window), p = window.prompt.bind(window);
  window.confirm = m => c(LOC.dialog(m));
  window.prompt = (m, d) => p(LOC.dialog(m), d);

const view = $("#view");
