const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wc = s => (String(s||"").trim().match(/[A-Za-zÀ-ÿ0-9'’-]+/g)||[]).length;
const uid = p => p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const dayKey = d => { d = d ? new Date(d) : new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const daysBetween = (a,b) => Math.round((new Date(dayKey(b)+"T12:00:00") - new Date(dayKey(a)+"T12:00:00"))/86400000);
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } };
const mmss = s => { s = Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const ago = iso => { const d = daysBetween(iso,new Date()); return d<=0?"today":d===1?"yesterday":d+" days ago"; };
const pad2 = n => String(n).padStart(2,"0");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  fallbackCopy(t); return Promise.resolve();
}
function fallbackCopy(t){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(e){} a.remove(); }
function download(name, text, mime){
  const blob = new Blob([text],{type:mime||"application/json"}); const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ============================================================
   STATE — key unchanged so every existing student keeps data.
   v1/v2 data is backed up untouched before the first v3 save.
   ============================================================ */
const STORE_KEY = "qkesl_state_v1";
const DATA_VERSION = 4;
const APP_VERSION = "11.0";

function defaultState(){
  return {
    version:DATA_VERSION, uuid:uid("qk"), name:"", createdAt:nowISO(), theme:"dark",
    currentMission:0, completedMissions:[], xp:0, hours:0, vocabLearned:0, streak:0, lastActiveDate:null,
    meditationsCompleted:0, achievements:[], journalEntries:[], sessionDoneToday:false, sessionDoneDate:null,
    missionProgress:{}, writingSamples:[], sessionLog:[], meditationLog:[], stuckSignals:[], currentFocus:"",
    startingPoint:{level:"",goal:"",fear:"",learningStyle:"",baseline:""},
    practiceRecords:[], quizzes:[], lastMilestoneCycleShown:0,
    /* v3 */
    onboarded:false, tier:"essential", placementStart:0,
    speakingAttempts:[], reflections:[], mirrorSamples:[], shadowLog:[], draft:null, ttsRate:0.92,
    /* v4 — classes */
    classSeries:[], classRecords:{}, myTexts:[]
  };
}
function migrate(raw){
  const s = defaultState();
  if(!raw || typeof raw!=="object") return s;
  Object.assign(s, raw);
  ["completedMissions","achievements","journalEntries","writingSamples","sessionLog","meditationLog","stuckSignals",
   "practiceRecords","quizzes","speakingAttempts","reflections","mirrorSamples","shadowLog","classSeries","myTexts"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  if(!s.missionProgress || typeof s.missionProgress!=="object") s.missionProgress = {};
  if(!s.classRecords || typeof s.classRecords!=="object" || Array.isArray(s.classRecords)) s.classRecords = {};
  s.classSeries = s.classSeries.filter(x=>x && x.id && Array.isArray(x.days) && x.days.length && /^\d{4}-\d{2}-\d{2}$/.test(x.start||""));
  Object.keys(s.classRecords).forEach(k=>{ const r = s.classRecords[k]; if(!r || typeof r!=="object" || !/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")) delete s.classRecords[k]; else r.id = k; });
  s.myTexts = s.myTexts.filter(t=>t && t.id && t.title && typeof t.body==="string");
  s.startingPoint = Object.assign({level:"",goal:"",fear:"",learningStyle:"",baseline:""}, raw.startingPoint||{});
  if(!TIERS[s.tier]) s.tier = "essential";
  if(typeof s.placementStart!=="number") s.placementStart = 0;
  s.completedMissions = [...new Set(s.completedMissions.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<LESSONS.length))];
  if(typeof s.currentMission!=="number" || s.currentMission<0) s.currentMission = 0;
  s.currentMission = Math.min(s.currentMission, LESSONS.length-1);
  if(raw.onboarded===undefined) s.onboarded = !!(raw.name || (raw.completedMissions||[]).length || (raw.startingPoint && raw.startingPoint.goal));
  if(!s.mirrorSamples.length && s.startingPoint.baseline && s.startingPoint.baseline.trim()){
    s.mirrorSamples.push({id:uid("mir"), date:s.createdAt||nowISO(), text:s.startingPoint.baseline, words:wc(s.startingPoint.baseline), seconds:0, recordingId:null, legacy:true});
  }
  if(s.draft && !s.draft.kind) s.draft = null;
  if(typeof s.hours!=="number") s.hours = parseFloat(s.hours)||0;
  s.version = DATA_VERSION;
  return s;
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ return defaultState(); }
  if(!raw) return defaultState();
  try{
    const parsed = JSON.parse(raw);
    const v = parsed && parsed.version ? parsed.version : 1;
    if(v < DATA_VERSION){
      const bk = "qkesl_backup_v"+v;
      try{ if(!localStorage.getItem(bk)) localStorage.setItem(bk, raw); }catch(e){}
    }
    return migrate(parsed);
  }catch(e){
    try{ localStorage.setItem("qkesl_backup_unreadable", raw); }catch(_){}
    return defaultState();
  }
}
let saveWarned = false;
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ if(!saveWarned){ saveWarned=true; toast("Storage is full. Export a backup from Toolbox › My data."); } }
}
let state = load();

/* ============================================================
   AUDIO STORAGE — recordings live in IndexedDB, never in
   localStorage (too small). Metadata stays in state.
   ============================================================ */
const AudioDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    if(this.db) return res(this.db);
    if(!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
    const r = indexedDB.open("qkesl_audio",1);
    r.onupgradeneeded = () => r.result.createObjectStore("rec");
    r.onsuccess = () => { this.db = r.result; res(this.db); };
    r.onerror = () => rej(r.error);
  }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("rec",mode); const out=fn(t.objectStore("rec")); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); },
  put(id,blob){ return this.tx("readwrite", s=>s.put(blob,id)); },
  get(id){ return this.tx("readonly", s=>s.get(id)); },
  del(id){ return this.tx("readwrite", s=>s.delete(id)); },
  clear(){ return this.tx("readwrite", s=>s.clear()); }
};
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function hydrateAudio(){
  document.querySelectorAll("audio[data-rec]").forEach(async el=>{
    try{ const blob = await AudioDB.get(el.dataset.rec); if(blob){ el.src = URL.createObjectURL(blob); el.classList.remove("hide"); } }catch(e){}
  });
}

/* ============================================================
   DERIVED STATE
   ============================================================ */
const tier = () => TIERS[state.tier] || TIERS.essential;
const depth = () => tier().depth;
const ctx = () => contextOf(state.startingPoint.goal);
const CTX_LABEL = {work:"your work", travel:"travel", confidence:"speaking with confidence", general:"everyday life"};
const highestDone = () => state.completedMissions.length ? Math.max(...state.completedMissions) : -1;
function isUnlocked(i){
  if(i >= tier().missionLimit) return false;
  if(state.completedMissions.includes(i) || state.missionProgress[i]) return true;
  return i <= Math.max(state.placementStart, highestDone()+1);
}
function lockReason(i){
  if(i >= tier().missionLimit){ const n = tier().next; return "Included in the "+(n?TIERS[n].name:"next")+" program."; }
  return "Complete Mission "+i+" to open this one.";
}
function nextMission(){
  const lim = Math.min(tier().missionLimit, LESSONS.length);
  for(let i=state.placementStart;i<lim;i++) if(!state.completedMissions.includes(i)) return i;
  for(let i=0;i<Math.min(state.placementStart,lim);i++) if(!state.completedMissions.includes(i)) return -2; /* only review missions left */
  return -1;
}
function cycleInfo(){
  const d = Math.max(0, daysBetween(state.createdAt||nowISO(), new Date()));
  return {n:Math.floor(d/CONFIG.cycleDays)+1, day:(d%CONFIG.cycleDays)+1};
}
function liveStreak(){ return state.lastActiveDate && daysBetween(state.lastActiveDate,new Date())<=1 ? state.streak : 0; }
function touch(){
  const t = dayKey(); if(state.lastActiveDate===t) return;
  const y = dayKey(Date.now()-86400000);
  state.streak = state.lastActiveDate===y ? (state.streak||0)+1 : 1;
  state.lastActiveDate = t;
}
function stats(){
  const att = state.speakingAttempts;
  const legacy = state.practiceRecords.filter(r=>r.type==="speaking" && +r.duration>0);
  const all = att.map(a=>a.duration).concat(legacy.map(r=>+r.duration));
  const topics = new Set(state.writingSamples.map(w=>w.topic||w.prompt).concat(att.map(a=>a.topic)).filter(Boolean));
  return {
    missions: state.completedMissions.length,
    attempts: all.length,
    secs: all.reduce((a,b)=>a+b,0),
    longest: all.length ? Math.max(...all) : 0,
    samples: state.writingSamples.length,
    words: state.writingSamples.reduce((a,w)=>a+(w.wordCount||wc(w.content)),0),
    hours: state.hours||0,
    topics: topics.size,
    meditations: Math.max(state.meditationsCompleted||0, state.meditationLog.length),
    shadow: state.shadowLog.length,
    reflections: state.reflections.length,
    streak: liveStreak(),
    ...classStats()
  };
}
function classStats(){
  const recs = Object.values(state.classRecords).filter(r=>!r.cancelled);
  return {
    classesAttended: recs.filter(r=>r.attended).length,
    classTextsRead: recs.filter(r=>r.readAt).length,
    classesComplete: recs.map(r=>occById(r.id)).filter(o=>o && classPct(o)>=1).length,
    classWords: state.writingSamples.filter(w=>w.kind==="class").reduce((a,w)=>a+(w.wordCount||0),0)
  };
}
function mirrorDue(){
  if(!state.mirrorSamples.length) return "first";
  const last = state.mirrorSamples[state.mirrorSamples.length-1];
  return daysBetween(last.date,new Date()) >= CONFIG.mirrorEveryDays ? "again" : false;
}
function speakRule(i){
  let [min,target] = speakTargets(i);
  const adjusted = depth()>=2 && freezes(state.startingPoint.fear);
  if(adjusted) min = Math.max(20, Math.round(min*0.66/5)*5);
  return {min,target,adjusted};
}
function keywords(text){
  const stop = new Set("about after again because before being could every first their there these those which while would should really thing things people other where today always never maybe".split(" "));
  const seen = new Set(), out = [];
  (String(text).toLowerCase().match(/[a-z'’]{5,}/g)||[]).forEach(w=>{ if(!stop.has(w) && !seen.has(w) && out.length<6){ seen.add(w); out.push(w); } });
  return out;
}

/* ============================================================
   CLASSES — ENGINE
   A weekly class is a "series" (days + time + duration). Every
   date it falls on is an occurrence with id  seriesId@YYYY-MM-DD.
   Records (progress, notes, text, per-date changes) are created
   only when needed, so empty weeks cost nothing. A single class
   is a record with oneoff:true. When a series with history is
   edited, past dates are frozen as they were (frozenUntil).
   ============================================================ */
const parseKey = k => { const p = String(k).split("-").map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dayKey(d); };
const maxKey = (...a) => a.filter(Boolean).reduce((x,y)=>x>y?x:y);
const fmtDay = (k,long) => parseKey(k).toLocaleDateString("en-US", long ? {weekday:"long",month:"long",day:"numeric"} : {weekday:"short",month:"short",day:"numeric"});
const fmtDayEs = k => parseKey(k).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
function fmtTime(t){ const p = String(t||"00:00").split(":").map(Number), h = p[0]||0; return ((h%12)||12)+":"+pad2(p[1]||0)+" "+(h>=12?"PM":"AM"); }
function levelKey(v){ const s = String(v||"").toUpperCase(); if(s.startsWith("C")) return "C1"; const k = s.slice(0,2); return CLASS_LEVELS[k] ? k : "A2"; }
const studentLevel = () => levelKey(state.startingPoint.level);
const hasClasses = () => state.classSeries.length>0 || Object.values(state.classRecords).some(r=>r.oneoff);

function seriesEnd(s){
  let e = s.end || null;
  if(s.weeks){ const w = addDays(s.start, s.weeks*7-1); if(!e || w<e) e = w; }
  return e;
}
function seriesDates(s, from, to){
  const out = [], end = seriesEnd(s);
  let k = maxKey(s.start, from, s.frozenUntil ? addDays(s.frozenUntil,1) : null);
  const last = end && end<to ? end : to;
  for(let g=0; k<=last && g<1500; g++, k=addDays(k,1)) if(s.days.includes(parseKey(k).getDay())) out.push(k);
  return out;
}
function buildOcc(id, date, s){
  const r = state.classRecords[id] || null, b = r || s || {}, base = s || b;
  return {id, date, series:s||null, oneoff:!s,
    time: (r&&r.time) || base.time || CLASS_DEFAULT.time,
    duration: +((r&&r.duration) || base.duration || CLASS_DEFAULT.duration),
    title: (r&&r.title) || base.title || CLASS_DEFAULT.title,
    level: levelKey((r&&r.level) || base.level || studentLevel()),
    rec: r || {}};
}
function occurrencesBetween(from, to){
  const out = [], seen = new Set();
  state.classSeries.forEach(s=>seriesDates(s,from,to).forEach(k=>{ const id = s.id+"@"+k; seen.add(id); out.push(buildOcc(id,k,s)); }));
  Object.values(state.classRecords).forEach(r=>{
    if(seen.has(r.id) || r.date<from || r.date>to) return;
    if(r.oneoff) out.push(buildOcc(r.id, r.date, null));
    else if(r.frozen) out.push(buildOcc(r.id, r.date, state.classSeries.find(x=>x.id===r.seriesId)||null));
  });
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function occById(id){
  if(!id) return null;
  const r = state.classRecords[id];
  if(r && r.oneoff) return buildOcc(id, r.date, null);
  const at = String(id).lastIndexOf("@"); if(at<0) return null;
  const s = state.classSeries.find(x=>x.id===id.slice(0,at)), date = id.slice(at+1);
  if(s) return buildOcc(id, date, s);
  return r ? buildOcc(id, date, null) : null;
}
function ensureRec(o){
  if(!state.classRecords[o.id]) state.classRecords[o.id] = {id:o.id, date:o.date, seriesId:o.series?o.series.id:null};
  o.rec = state.classRecords[o.id];
  return o.rec;
}
const hasProgress = r => !!(r && (r.attended || r.readAt || r.writingId || r.bestSecs || r.reflectionId || (r.notes||"").trim()));

function classSpeakRule(lv){
  let [min,target] = CLASS_LEVELS[levelKey(lv)].speak;
  const adjusted = depth()>=2 && freezes(state.startingPoint.fear);
  if(adjusted) min = Math.max(20, Math.round(min*0.66/5)*5);
  return {min, target, adjusted};
}
function classParts(o){
  const r = o.rec||{};
  return {attended:!!r.attended, read:!!r.readAt, wrote:!!r.writingId, spoke:(r.bestSecs||0)>=classSpeakRule(o.level).min, reflected:!!r.reflectionId};
}
const classDone = o => { const p = classParts(o); return CLASS_PARTS.filter(x=>p[x[0]]).length; };
const classPct = o => classDone(o)/CLASS_PARTS.length;
function classStartDate(o){ const d = parseKey(o.date), p = o.time.split(":").map(Number); d.setHours(p[0]||0, p[1]||0, 0, 0); return d; }
const classOver = o => Date.now() > classStartDate(o).getTime() + o.duration*60000;
function classStatus(o){
  const r = o.rec||{}, t = dayKey();
  if(r.cancelled) return r.movedTo ? "moved" : "cancelled";
  if(classPct(o)>=1) return "complete";
  if(r.attended) return "attended";
  if(o.date<t) return "missed";
  if(o.date===t) return classOver(o) ? "unmarked" : "today";
  return "scheduled";
}
function classNumber(o){
  if(!o.series) return null;
  const s = o.series, mine = x => x.series && x.series.id===s.id && !x.rec.cancelled;
  const n = occurrencesBetween(s.start, o.date).filter(mine).length;
  const end = seriesEnd(s);
  return {n, total: end ? occurrencesBetween(s.start, end).filter(mine).length : null};
}

/* ---------- class texts ---------- */
const allTexts = () => CLASS_TEXTS.concat(state.myTexts||[]);
const textById = id => allTexts().find(t=>t.id===id) || null;
const classText = o => textById((o.rec||{}).textId);
function assignText(o){
  const r = ensureRec(o), cur = textById(r.textId);
  if(cur) return cur;
  const used = {};
  Object.values(state.classRecords).forEach(x=>{ if(x.textId) used[x.textId] = (used[x.textId]||0)+1; });
  const c = ctx();
  const pool = CLASS_TEXTS.filter(t=>t.level===o.level).sort((a,b)=>(used[a.id]||0)-(used[b.id]||0) || (b.ctx===c)-(a.ctx===c));
  r.textId = pool[0].id; save();
  return pool[0];
}
function splitSentences(p){
  const safe = p.replace(/\s+/g," ").trim().replace(/\b(Mrs|Mr|Ms|Dr|St|vs)\./g,"$1\u0001").replace(/\b([A-Z])\.(?=\s[A-Z])/g,"$1\u0001");
  return (safe.match(/[^.!?…]+(?:[.!?…]+["”’)]*|$)/g)||[safe]).map(s=>s.replace(/\u0001/g,".").trim()).filter(Boolean);
}
function readerHTML(T){
  let i = 0;
  return `<article class="reader">${String(T.body).split(/\n\s*\n/).map(p=>`<p>${splitSentences(p).map(s=>`<span class="snt" data-act="saySnt" data-i="${i++}">${esc(s)}</span>`).join(" ")}</p>`).join("")}</article>`;
}
function readerTools(){
  return `<div class="row-gap mt" style="align-items:center"><button class="btn-line" data-act="readAll">${ICON_PLAY}<span>Listen to the text</span></button>
    <div class="seg" style="grid-template-columns:1fr 1fr;flex:1;min-width:170px" role="group" aria-label="Reading speed"><button data-act="rateR" data-v="0.75" aria-pressed="${state.ttsRate<0.85}">Slow</button><button data-act="rateR" data-v="0.95" aria-pressed="${state.ttsRate>=0.85}">Natural</button></div></div>
    <p class="small muted mt-s">Tap any sentence to hear it on its own.</p>`;
}
function meterInner(n, range, label){
  const [a,b] = range, top = b*1.35, pos = Math.min(100, n/top*100), za = a/top*100, zb = b/top*100;
  const st = n<a ? "low" : n>b ? "high" : "ok";
  const note = st==="low" ? (a-n)+" to go" : st==="high" ? (n-b)+" over" : "In range";
  return `<div class="meter ${st}"><div class="meter-track"><span class="meter-zone" style="left:${za}%;width:${zb-za}%"></span><span class="meter-pin" style="left:${pos}%"></span></div>
    <div class="meter-cap"><span><b>${n}</b> words · ${note}</span><span>${esc(label)} ${a}–${b}</span></div></div>`;
}

/* reading aloud, sentence by sentence (long texts in one utterance get cut off on some phones) */
let readTok = 0;
function stopReading(){
  readTok++;
  document.querySelectorAll(".snt.on").forEach(s=>s.classList.remove("on"));
  document.querySelectorAll('[data-act="readAll"] span').forEach(s=>s.textContent="Listen to the text");
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function readerScope(){ return $("#scrim").classList.contains("open") && $("#sheet").querySelector(".reader") ? $("#sheet") : view; }
function readAll(btn){
  const scope = readerScope(), spans = [...scope.querySelectorAll(".snt")];
  const lbl = btn && btn.querySelector("span");
  if(lbl && lbl.textContent==="Stop"){ stopReading(); return; }
  stopReading();
  const tok = readTok;
  if(lbl) lbl.textContent = "Stop";
  let k = 0;
  const next = () => {
    if(tok!==readTok) return;
    if(k>=spans.length){ stopReading(); return; }
    const sp = spans[k];
    sp.classList.add("on"); sp.scrollIntoView({block:"nearest", behavior:"smooth"});
    say(sp.textContent, null, ()=>{ if(tok!==readTok) return; sp.classList.remove("on"); k++; setTimeout(next, 220); });
  };
  next();
}

/* ---------- derived views ---------- */
function focusClass(){
  const t = dayKey();
  const list = occurrencesBetween(t, addDays(t,60)).filter(o=>!o.rec.cancelled);
  return list.find(o=>o.date===t && classPct(o)<1) || list.find(o=>!(o.date===t && classOver(o))) || null;
}
function practiceDays(){
  const s = new Set(), add = iso => { if(iso) s.add(dayKey(iso)); };
  state.sessionLog.forEach(x=>add(x.date)); state.writingSamples.forEach(x=>add(x.createdAt));
  state.speakingAttempts.forEach(x=>add(x.date)); state.shadowLog.forEach(x=>add(x.date));
  state.quizzes.forEach(x=>add(x.date)); state.meditationLog.forEach(x=>add(x.date));
  return s;
}
function dayEvidence(k){
  const w = state.writingSamples.filter(x=>dayKey(x.createdAt)===k), s = state.speakingAttempts.filter(x=>dayKey(x.date)===k);
  const m = state.sessionLog.filter(x=>dayKey(x.date)===k).length;
  const out = [];
  if(m) out.push(m+" completed session"+(m>1?"s":""));
  if(w.length) out.push(w.length+" writing sample"+(w.length>1?"s":"")+", "+w.reduce((a,x)=>a+(x.wordCount||0),0)+" words");
  if(s.length) out.push(s.length+" speaking attempt"+(s.length>1?"s":"")+", "+mmss(s.reduce((a,x)=>a+(x.duration||0),0))+" spoken");
  return out.join(" · ");
}
const whenLine = o => (o.date===dayKey()?"Today":fmtDay(o.date))+" · "+fmtTime(o.time)+" · "+o.duration+" min";
function statusPill(o){ const L = CLASS_STATUS[classStatus(o)]; return `<span class="pill ${L[1]}">${L[0]}</span>`; }
function partsBar(o){ const p = classParts(o); return `<div class="parts" aria-hidden="true">${CLASS_PARTS.map(x=>`<i class="${p[x[0]]?"on":""}"></i>`).join("")}</div>`; }
function nextPartHint(o){
  const p = classParts(o);
  if(o.rec.cancelled) return "";
  if(!p.read) return "Next: read the text";
  if(!p.wrote) return "Next: write";
  if(!p.spoke) return "Next: speak";

  if(!p.attended) return o.date>dayKey() || (o.date===dayKey() && !classOver(o)) ? "Ready for class" : "Mark attendance";
  return "All five done";
}
function classCard(o, kicker){
  const num = classNumber(o);
  return `<button class="panel class-card" data-act="openClass" data-id="${esc(o.id)}">
    <p class="kicker">${esc(kicker)}${num?" · Class "+num.n+(num.total?" of "+num.total:""):""}</p>
    <h3>${esc(o.title)}</h3><p class="class-when">${esc(whenLine(o))}</p>
    <div class="meta-row">${statusPill(o)}<span class="pill gold">${o.level}</span></div>
    ${partsBar(o)}<div class="parts-cap"><span>${classDone(o)} of 5 done</span><span>${esc(nextPartHint(o))}</span></div>
  </button>`;
}
function classRow(o){
  const c = o.rec.cancelled;
  return `<button data-act="openClass" data-id="${esc(o.id)}" ${c?'style="opacity:.55"':""}><span class="glyph">${DOW_SHORT[parseKey(o.date).getDay()]}</span>
    <span class="grow"><span class="t">${esc(o.title)}</span><br><span class="s">${esc(whenLine(o))} · ${o.level}</span></span>
    ${c||classStatus(o)==="missed" ? statusPill(o) : `<span class="pct">${Math.round(classPct(o)*100)}%</span>`}</button>`;
}
const daysLabel = days => { const d = DOW_MON_FIRST.filter(x=>days.includes(x)).map(x=>DOW_SHORT[x]); return d.length<=1 ? d.join("") : d.slice(0,-1).join(", ")+" & "+d[d.length-1]; };
function seriesSummary(s){
  const e = seriesEnd(s), t = dayKey();
  return daysLabel(s.days)+" · "+fmtTime(s.time)+" · "+s.duration+" min · "+levelKey(s.level)+" · "+(e ? (e<t?"ended ":"until ")+fmtDay(e) : "every week");
}
function seriesRow(s){
  return `<button data-act="seriesEdit" data-id="${esc(s.id)}"><span class="glyph">${esc(levelKey(s.level))}</span><span class="grow"><span class="t">${esc(s.title)}</span><br><span class="s">${esc(seriesSummary(s))}</span></span><span class="chev">›</span></button>`;
}

/* ---------- schedule changes that keep history ---------- */
function freezePast(s){
  const t = dayKey(), y = addDays(t,-1);
  if(s.start>y) return;
  seriesDates(s, s.start, y).forEach(k=>{
    const o = buildOcc(s.id+"@"+k, k, s), r = ensureRec(o);
    r.frozen = true; r.seriesId = s.id;
    if(!r.time) r.time = o.time; if(!r.duration) r.duration = o.duration; if(!r.title) r.title = o.title; if(!r.level) r.level = o.level;
  });
  s.frozenUntil = maxKey(s.frozenUntil, y);
}
function rehomeFuture(s){
  /* future records of this series that no longer fall on its dates:
     keep the ones with work in them as single classes, drop the rest */
  const t = dayKey(), valid = new Set(seriesDates(s, t, addDays(t,800)).map(k=>s.id+"@"+k));
  Object.values(state.classRecords).forEach(r=>{
    if(r.seriesId!==s.id || r.oneoff || r.frozen || r.date<t || valid.has(r.id)) return;
    if(hasProgress(r) || r.textId){
      const o = buildOcc(r.id, r.date, s);
      Object.assign(r, {oneoff:true, frozen:false, time:o.time, duration:o.duration, title:o.title, level:o.level});
    } else delete state.classRecords[r.id];
  });
}
function nextClassFor(textId){
  const t = dayKey();
  return occurrencesBetween(t, addDays(t,60)).find(o=>!o.rec.cancelled && !(o.rec||{}).readAt && !(o.date===t && classOver(o))) || null;
}

/* ---------- calendar file (.ics) — weekly repeats + reminders ---------- */
function icsText(s){ return String(s).replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n"); }
function icsExport(){
  const t = dayKey(), BY = ["SU","MO","TU","WE","TH","FR","SA"];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const dt = (k,tm) => k.replace(/-/g,"")+"T"+tm.replace(":","")+"00";
  const dtEnd = (k,tm,dur) => { const d = parseKey(k), p = tm.split(":").map(Number); d.setHours(p[0], p[1]+dur, 0, 0); return dayKey(d).replace(/-/g,"")+"T"+pad2(d.getHours())+pad2(d.getMinutes())+"00"; };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ProfGermandario//Fluency OS//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:English classes"];
  const ev = (id,k,tm,dur,title,extra) => {
    L.push("BEGIN:VEVENT","UID:"+id.replace(/[^A-Za-z0-9-]/g,"-")+"@fluency-os","DTSTAMP:"+stamp,"DTSTART:"+dt(k,tm),"DTEND:"+dtEnd(k,tm,dur),"SUMMARY:"+icsText(title),"DESCRIPTION:"+icsText("Open Fluency OS before class to read your class text."));
    (extra||[]).forEach(x=>L.push(x));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(title),"TRIGGER:-PT30M","END:VALARM","END:VEVENT");
  };
  let n = 0;
  state.classSeries.forEach(s=>{
    const end = seriesEnd(s); if(end && end<t) return;
    const lo = maxKey(t, s.start, s.frozenUntil?addDays(s.frozenUntil,1):null), first = seriesDates(s, lo, addDays(lo,7))[0];
    if(!first) return;
    let rule = "RRULE:FREQ=WEEKLY;BYDAY="+DOW_MON_FIRST.filter(d=>s.days.includes(d)).map(d=>BY[d]).join(",");
    if(end) rule += ";UNTIL="+end.replace(/-/g,"")+"T235959";
    const ex = Object.values(state.classRecords).filter(r=>r.seriesId===s.id && !r.oneoff && r.cancelled && r.date>=first).map(r=>"EXDATE:"+dt(r.date,s.time));
    ev(s.id, first, s.time, s.duration, s.title, [rule].concat(ex)); n++;
  });
  Object.values(state.classRecords).forEach(r=>{
    if(!r.oneoff || r.cancelled || r.date<t) return;
    const o = buildOcc(r.id, r.date, null); ev(r.id, o.date, o.time, o.duration, o.title); n++;
  });
  if(!n){ toast("No upcoming classes to add."); return; }
  L.push("END:VCALENDAR");
  download("english-classes.ics", L.join("\r\n")+"\r\n", "text/calendar");
  toast("Calendar file downloaded. Open it to add your classes with reminders.");
}

/* ---------- sharing a class text by link (no server) ---------- */
function b64urlEncode(str){ const b = new TextEncoder().encode(str); let s = ""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64urlDecode(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s += "="; const bin = atob(s), b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
function textShareLink(T){ return location.href.split("#")[0]+"#t="+b64urlEncode(JSON.stringify({v:1, t:T.title, l:T.level, b:T.body, w:T.write||"", s:T.speak||""})); }
let pendingShare = null;
function receiveShared(code){
  try{
    const o = JSON.parse(b64urlDecode(code));
    const title = String(o.t||"").trim().slice(0,140), body = String(o.b||"").trim().slice(0,12000);
    if(!title || wc(body)<10) throw new Error("empty");
    let T = state.myTexts.find(x=>x.body===body);
    if(!T){ T = {id:uid("txt"), title, level:levelKey(o.l), body, write:String(o.w||"").slice(0,400), speak:String(o.s||"").slice(0,400), from:"shared", createdAt:nowISO()}; state.myTexts.push(T); save(); }
    pendingShare = T.id;
  }catch(e){ toast("That class text link is incomplete. Ask for it again."); }
}

let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  voice = v.find(x=>/en-US/i.test(x.lang) && /natural|google|samantha|aria|jenny/i.test(x.name)) || v.find(x=>/en-US/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null;
}

function say(text, btn, onend){
  if(!("speechSynthesis" in window)){ toast("Audio isn't available in this browser."); return; }

  document.querySelectorAll(".listen.playing").forEach(b=>b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(text);

  if(btn) btn.classList.add("playing");

}

function evidenceLine(i){
  const w = state.writingSamples.filter(x=>x.missionId===i && x.kind==="mission").length;

/* ---------------- EVOLUTION ---------------- */
VIEWS.evolution = function(){
  setBody("");
  const st = stats(), cyc = cycleInfo();
  const mir = state.mirrorSamples, ws = state.writingSamples.filter(w=>w.kind!=="mirror");
  let a=null, b=null, la="", lb="";
  if(mir.length>=2){ a=mir[0]; b=mir[mir.length-1]; la="Your starting point"; lb="Same prompt, now"; }
  else if(mir.length===1 && ws.length){ a=mir[0]; b=ws[ws.length-1]; la="Your starting point"; lb="Your latest writing"; }
  else if(state.writingSamples.length>=2){ a=state.writingSamples[0]; b=state.writingSamples[state.writingSamples.length-1]; la="Your first sample"; lb="Your latest sample"; }
  const sampleCard = (x,label,later) => {
    const text = x.text!=null ? x.text : x.content;
    const words = x.words||x.wordCount||wc(text);
    const date = x.date||x.createdAt;
    return `<article class="sample ${later?"later":""}"><header><span>${esc(label)}</span><span>${fmtDate(date)}</span></header>
      <p class="en">${esc(text)}</p><p class="small muted mt-s">${words} words${x.seconds?", spoke "+mmss(x.seconds):""}</p>
      ${x.recordingId?`<audio class="hide mt-s" controls preload="none" data-rec="${esc(x.recordingId)}"></audio>`:""}</article>`;
  };
  const only = !a && (mir[0] || state.writingSamples[0]);
  const compare = a&&b ? `<div class="compare mt">${sampleCard(a,la,false)}${sampleCard(b,lb,true)}</div>`
    : only ? `<div class="mt">${sampleCard(only, mir[0]?"Your starting point":"Your first sample", false)}<p class="small muted mt-s">Your next sample will appear beside this one, so you can compare.</p></div>`
    : `<div class="panel mt"><p>Your first writing sample will appear here. Complete a mission or record your starting point, and this page starts filling with evidence.</p></div>`;
  const recent = state.speakingAttempts.slice(-24);
  const maxS = Math.max(60, ...recent.map(x=>x.duration));
  const bars = recent.length>=2 ? `<section class="mt-l"><h3>Speaking over time</h3><p class="muted small mt-s">Each bar is one attempt. Longer bars mean you kept your thought alive longer.</p>
    <div class="bars">${recent.map(x=>`<i style="height:${Math.max(4,Math.round(x.duration/maxS*100))}%" title="${mmss(x.duration)}"></i>`).join("")}</div>
    <div class="bars-caption"><span>${fmtDate(recent[0].date)}</span><span>${fmtDate(recent[recent.length-1].date)}</span></div></section>` : "";
  const due = mirrorDue();
  const cell = (v,l) => `<div><b>${v}</b><span>${l}</span></div>`;
  view.innerHTML = `
    <section class="greet"><h1 class="display" style="font-size:clamp(30px,7vw,40px)">Look what you can do now.</h1>
      <p>No invented percentages. Only what you wrote, what you said, and when.</p></section>
    ${compare}
    <div class="row-gap mt">
      <button class="btn-line" data-act="startMirror">${due==="first"?"Record my starting point":"Record a mirror sample"}</button>
      ${depth()>=3?'<button class="btn-line" data-act="portfolioReview">Request a portfolio review</button>':""}
    </div>
    <section class="mt-l"><h3>Evidence</h3>
      <div class="evidence mt-s">
        ${cell(st.missions,"missions complete")}${cell(st.samples,"writing samples")}${cell(st.words,"words written")}${cell(st.attempts,"speaking attempts")}
        ${cell(Math.round(st.secs/60),"minutes spoken")}${cell(mmss(st.longest),"longest attempt")}${cell(st.hours.toFixed(1),"practice hours")}${cell(st.topics,"topics explored")}
        ${cell(st.reflections,"reflections")}${cell(st.shadow,"shadowing sessions")}${cell(st.meditations,"meditations")}${cell(st.streak,"day streak")}
        ${cell(st.classesAttended,"classes attended")}${cell(st.classTextsRead,"class texts read")}${cell(st.classesComplete,"classes complete")}${cell(st.classWords,"words in class texts")}
      </div>
      <p class="small muted mt-s">Cycle ${cyc.n}, day ${cyc.day}. ${mir.length} mirror sample${mir.length===1?"":"s"} recorded.</p>
    </section>
    ${bars}
    <section class="mt-l"><h3>Archive</h3><p class="muted small mt-s">Everything is kept exactly as you produced it.</p><div class="mt">
      ${archive("Writing samples", state.writingSamples.slice().reverse().map(w=>`<div class="archive-item"><header><span>${esc(w.label||w.topic||w.prompt||"Writing")}</span><span>${fmtDate(w.createdAt)}</span></header><p class="en" style="font-size:17px">${esc(w.content)}</p></div>`))}
      ${archive("Speaking attempts", state.speakingAttempts.slice().reverse().map(x=>`<div class="attempt"><span class="grow"><b>${mmss(x.duration)}</b> <span class="muted small">${esc(x.topic||"")}, ${fmtDate(x.date)}</span></span>${x.recordingId?`<audio class="hide" controls preload="none" data-rec="${esc(x.recordingId)}"></audio>`:""}</div>`))}
      ${archive("Reflections", state.reflections.slice().reverse().map(r=>`<div class="archive-item"><header><span>${esc(r.topic||"")}</span><span>${fmtDate(r.date)}</span></header><p><b>I managed to say:</b> ${esc(r.managed)}</p>${r.difficult?`<p><b>Difficult:</b> ${esc(r.difficult)}</p>`:""}${r.better?`<p><b>Next time:</b> ${esc(r.better)}</p>`:""}</div>`))}
      ${(()=>{ const notes = Object.values(state.classRecords).filter(r=>(r.notes||"").trim()).sort((a,b)=>b.date.localeCompare(a.date)); return notes.length?archive("Class notes", notes.map(r=>{ const o = occById(r.id); return `<div class="archive-item"><header><span>${esc(o?o.title:"Class")}</span><span>${esc(fmtDay(r.date))}</span></header><p>${esc(r.notes)}</p></div>`; })):""; })()}
      ${state.journalEntries.length?archive("Notebook entries", state.journalEntries.map(j=>`<div class="archive-item"><header><span>${esc(j.mood||"Entry")}</span><span>${fmtDate(j.date)}</span></header><p>${esc([j.learned,j.questions,j.homework,j.notes].filter(Boolean).join("\n\n"))}</p></div>`)):""}
      ${state.practiceRecords.length?archive("Earlier practice records", state.practiceRecords.slice().reverse().map(p=>`<div class="archive-item"><header><span>${esc(p.topic||p.type)}</span><span>${fmtDate(p.date)}</span></header><p>${esc(p.content||"")}</p></div>`)):""}
    </div></section>`;
  hydrateAudio();
};
function archive(title, items){
  return `<details class="more"><summary>${esc(title)} (${items.length})</summary><div class="inner">${items.length?items.join(""):'<p class="muted">Nothing here yet.</p>'}</div></details>`;
}

function calendarHTML(){
  const now = new Date(), t = dayKey();
  const first = new Date(calY, calM, 1), off = (first.getDay()+6)%7, dim = new Date(calY, calM+1, 0).getDate();
  const occ = occurrencesBetween(dayKey(first), dayKey(new Date(calY, calM, dim))).filter(o=>!o.rec.cancelled);
  const byDay = {}; occ.forEach(o=>(byDay[o.date] = byDay[o.date] || []).push(o));
  const prac = practiceDays();
  let due = 0, att = 0, comp = 0, sum = 0;
  occ.forEach(o=>{ const p = classPct(o); if(p>=1) comp++; if(o.date<=t){ due++; if(o.rec.attended) att++; sum += p; } });
  const cells = [];
  for(let e=0;e<off;e++) cells.push('<div class="cal-day cal-blank" aria-hidden="true"></div>');
  for(let d=1; d<=dim; d++){
    const k = dayKey(new Date(calY, calM, d)), list = byDay[k]||[], fut = k>t;
    const pct = list.length ? list.reduce((a,o)=>a+classPct(o),0)/list.length : 0;
    let cls = "cal-day"+(fut?" future":"")+(k===t?" today":"")+(list.length?" has-class":"");
    if(pct>=1) cls += " full"; else if(pct>0) cls += " partial";
    if(k<t && pct<1 && list.some(o=>!o.rec.attended)) cls += " missed";
    const fill = pct>0 ? Math.round(18+pct*82) : 0;
    let aria = MONTHS[calM]+" "+d;
    if(list.length) aria += ", "+list.length+" class"+(list.length>1?"es":"")+", "+Math.round(pct*100)+" percent complete";
    if(prac.has(k)) aria += ", practice day";
    cells.push(`<button type="button" class="${cls}" data-act="openDay" data-k="${k}" aria-label="${esc(aria)}">${fill?`<span class="cal-fill" style="height:${fill}%"></span>`:""}<span class="cal-num">${d}</span>${pct>=1?'<span class="cal-mark">★</span>':""}${list.length&&pct<1?'<span class="cal-dot"></span>':""}${prac.has(k)?'<span class="cal-prac"></span>':""}</button>`);
  }
  const isNow = calY===now.getFullYear() && calM===now.getMonth();
  const m = (v,l) => `<div><b>${v}</b><span>${l}</span></div>`;
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

/* ============================================================
   LESSON ENGINE — one renderer for every mission, free practice,
   and mirror sample. Content comes from LESSONS (schema above).
   THINK → WRITE → SPEAK → REFLECT → SAVE
   ============================================================ */
const STEP_NAMES = {arrive:"Arrival", read:"Read it", understand:"Understand", see:"See it", build:"Build it", write:"Write it", speak:"Speak it", reflect:"Reflect", complete:"Complete"};
function stepsFor(r){
  if(r.kind==="mission") return ["arrive","understand","see","build","write","speak","reflect","complete"];
  if(r.kind==="class") return ["read","write","speak","reflect","complete"];
  if(r.kind==="free") return ["write","speak","reflect","complete"];
  return ["arrive","write","speak","complete"];
}
function newRun(kind, o){
  return {kind, mi:o.mi!=null?o.mi:null, topicId:o.topicId||null, cid:o.cid||null, stepIdx:0, startedAt:nowISO(), lastTick:Date.now(), activeMs:0,
    ladder:1, scr:{}, write:{mode:"guided", text:"", savedId:null}, attempts:[], reflect:{a:"",b:"",c:""}, finalized:false};
}
function saveRun(){ state.draft = run && !run.finalized ? run : null; save(); }
function tickActive(){ if(!run) return; const n=Date.now(); run.activeMs=(run.activeMs||0)+Math.min(n-(run.lastTick||n), 10*60000); run.lastTick=n; }
const runLesson = () => run && run.mi!=null ? LESSONS[run.mi] : null;
const runTopicObj = () => TOPICS.find(t=>t.id===run.topicId) || TOPICS[0];
const runClass = () => run && run.kind==="class" ? occById(run.cid) : null;
function runTopic(){
  if(run.kind==="mission") return "Mission "+(run.mi+1)+": "+LESSONS[run.mi].t;
  if(run.kind==="mirror") return "Mirror sample";

  const steps = stepsFor(run), key = steps[run.stepIdx];
  const rail = steps.filter(s=>s!=="complete").map((s,i)=>`<i class="${i<run.stepIdx?"on":i===run.stepIdx?"cur":""}"></i>`).join("");
  const title = run.kind==="mission" ? "Mission "+(run.mi+1) : run.kind==="mirror" ? "Mirror sample" : run.kind==="class" ? "Class · "+fmtDay(runClass().date) : "Free practice";

}
function nextStep(){

}

/* D. BUILD IT — progressive complexity + controlled practice */
function scrambleSentences(L){ return L.kit.shadow.filter(s=>{ const n=s.split(" ").length; return n>=3&&n<=10; }).slice(0,2); }
function ensureScr(k, words){
  if(!run.scr[k]){
    let order = words.map((_,i)=>i);
    for(let t=0;t<8;t++){ order.sort(()=>Math.random()-.5); if(order.some((v,i)=>v!==i)) break; }
    run.scr[k] = {order, placed:[], done:false, fails:0};
  }
  return run.scr[k];
}
const LADDER_LABELS = ["The core","Add detail","Add a link","The complete idea"];
STEPS.build = function(){
  const L = runLesson(), sents = scrambleSentences(L);
  const ladderDone = run.ladder>=L.build.length;
  const allDone = ladderDone && sents.every((s,k)=>ensureScr(k,s.split(" ")).done);
  setAction({label:"Continue to writing", act:"next", back:"prev", disabled:!allDone, hint: allDone?"":"Grow the sentence, then order the words to continue."});
  let h = `<h2 class="display">Watch a sentence grow</h2>
    <p class="muted mt-s">Same structure, more information each time.</p>
    <ol class="ladder mt">${L.build.map((s,i)=>`<li class="en ${i<run.ladder?"show":""}"><span>${LADDER_LABELS[i]||""}</span>${esc(s)}</li>`).join("")}</ol>
    ${!ladderDone?`<button class="btn-line mt" data-act="ladder">Add a layer</button>`:""}`;
  if(ladderDone){
    h += `<h2 class="display mt-l">Now you build</h2><p class="muted mt-s">Tap the words in the right order. Tap a placed word to return it.</p>`;
    sents.forEach((s,k)=>{
      const words = s.split(" "), sc = ensureScr(k,words);
      const full = sc.placed.length===words.length;
      const ok = sc.done, bad = full && !ok;
      h += `<div class="mt"><div class="scramble-target ${ok?"ok":bad?"bad":""}" aria-label="Your sentence">${sc.placed.length?sc.placed.map((wi,p)=>`<button class="word" data-act="unplace" data-k="${k}" data-p="${p}" ${ok?"disabled":""}>${esc(words[wi])}</button>`).join(""):'<span class="muted small">Your sentence appears here.</span>'}</div>
        ${ok?`<div class="example"><p class="small" style="color:var(--sage);flex:1">Correct.</p>${listenBtn(s)}</div>`:""}
        ${!ok?`<div class="scramble-bank">${sc.order.filter(i=>!sc.placed.includes(i)).map(i=>`<button class="word" data-act="place" data-k="${k}" data-i="${i}">${esc(words[i])}</button>`).join("")}</div>`:""}
        ${bad?`<p class="small mt-s" style="color:var(--coral)">Not quite. Check the order of the subject and the verb.</p><div class="row-gap mt-s"><button class="btn-line" data-act="scrReset" data-k="${k}">Try again</button><button class="link" data-act="scrShow" data-k="${k}">Show the answer</button></div>`:""}
      </div>`;
    });
  }
  return h;
};

/* E. WRITE IT — guided / suggested / open */

}

    </div><p class="seg-desc">${modeDesc[mode]}</p>`:""}

    ${mode==="guided"?`<div class="frames mt">${cfg.frames.map(f=>`<button class="frame" data-act="frame" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>`:""}
    ${mode==="suggested"&&cfg.keys?`<p class="small muted mt">Try to use: ${cfg.keys.map(esc).join(", ")}.</p>`:""}

    <div class="counter"><span><b id="wcount" class="${ok?"ok":""}">${n}</b> of ${cfg.min}${cfg.max?"–"+cfg.max:""} words${cfg.max?" ("+runClass().level+")":""}</span><span>Saved exactly as you write it</span></div>`;
};

/* F. SPEAK IT */
function speakConfig(){
  if(run.kind==="mirror") return {prompt:MIRROR_PROMPT, min:30, target:60, adjusted:false};
  if(run.kind==="class"){ const o = runClass(), T = classText(o) || {}; return Object.assign(classSpeakRule(o.level), {prompt:T.speak||CLASS_SPEAK_DEFAULT}); }
  const r = speakRule(phaseRef());
  return Object.assign(r, {prompt: run.kind==="mission" ? runLesson().speak : runTopicObj().prompt});
}
function bestAttempt(){ const a = state.speakingAttempts.filter(x=>run.attempts.includes(x.id)); return a.length?Math.max(...a.map(x=>x.duration)):0; }
STEPS.speak = function(){
  const cfg = speakConfig();
  const sample = state.writingSamples.find(x=>x.id===run.write.savedId);
  const text = sample ? sample.content : run.write.text;

    hint: SP ? "Press stop when you finish." : ok ? "" : "Reach "+mmss(cfg.min)+" in one attempt to continue."});

  return `<h2 class="display">${esc(cfg.prompt)}</h2>
    <p class="mt-s" style="font-size:17px">Use your ideas. Don't read a script. Keep your thought alive.</p>

    <div class="timer-wrap mt">
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringFg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="t"><b id="ringTime">0:00</b><span id="ringLabel">${SP?(SP.rec?'<i class="rec-dot"></i>Recording':"Speaking"):"Ready"}</span></div></div>
      <div class="row-gap mt" style="justify-content:center">
        ${SP ? `<button class="btn" data-act="stopSpeak">Stop</button>`
             : `${canRecord?`<button class="btn" data-act="startSpeak" data-rec="1">Start recording</button>`:""}<button class="${canRecord?"btn-line":"btn"}" data-act="startSpeak" data-rec="0">${canRecord?"Speak without recording":"Start the timer"}</button>`}
      </div>

    ${text?`<details class="more mt"><summary>Peek at what I wrote</summary><div class="inner"><p class="en" style="font-size:17px;white-space:pre-wrap">${esc(text)}</p></div></details>`:""}
    ${depth()>=2&&run.kind==="mission"?`<p class="mt"><button class="link" data-act="speakYaBrief">Practice this prompt with Speak Ya</button></p>`:""}`;

STEP_AFTER.speak = function(){ hydrateAudio(); if(SP) tickSpeak(); };

async function startSpeaking(record){
  if(SP) return;
  const cfg = speakConfig();
  const s = {start:0, rec:null, stream:null, chunks:[], mime:"", target:cfg.target, min:cfg.min, timer:null};
  if(record && canRecord){
    try{
      s.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      s.mime = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
      s.rec = s.mime ? new MediaRecorder(s.stream,{mimeType:s.mime}) : new MediaRecorder(s.stream);
      s.rec.ondataavailable = e => { if(e.data && e.data.size) s.chunks.push(e.data); };
      s.rec.start(1000);
    }catch(e){
      if(s.stream) s.stream.getTracks().forEach(t=>t.stop());
      s.rec = null; s.stream = null;
      toast("Microphone not available. The timer will still save your time.");
    }
  }
  s.start = Date.now();
  SP = s;
  s.timer = setInterval(tickSpeak, 250);
  renderLesson();
}
function tickSpeak(){
  if(!SP) return;
  const el = (Date.now()-SP.start)/1000, C = 2*Math.PI*54;
  const fg = $("#ringFg"), t = $("#ringTime");
  if(fg){ fg.style.strokeDashoffset = C*(1-Math.min(el/SP.target,1)); fg.classList.toggle("min", el>=SP.min); }
  if(t) t.textContent = mmss(el);
}
function finishSpeaking(silent){
  if(!SP) return;
  const s = SP; SP = null; clearInterval(s.timer);
  const dur = Math.round((Date.now()-s.start)/1000);
  const stopStream = () => { if(s.stream) s.stream.getTracks().forEach(t=>t.stop()); };
  if(dur < 3){
    if(s.rec && s.rec.state!=="inactive"){ s.rec.onstop = stopStream; s.rec.stop(); } else stopStream();
    if(!silent){ toast("Too short to save. Try again."); renderLesson(); }
    return;
  }
  const a = {id:uid("sp"), date:nowISO(), kind:run.kind, missionId:run.kind==="mission"?run.mi:null, classId:run.kind==="class"?run.cid:null, topic:runTopic(), duration:dur, recordingId:null};
  state.speakingAttempts.push(a); run.attempts.push(a.id);
  if(run.kind==="class"){ const o = runClass(); if(o){ const r = ensureRec(o); r.bestSecs = Math.max(r.bestSecs||0, dur); r.attemptIds = (r.attemptIds||[]).concat(a.id); } }
  touch(); tickActive(); saveRun();
  if(s.rec && s.rec.state!=="inactive"){
    s.rec.onstop = async () => {
      stopStream();
      try{
        const blob = new Blob(s.chunks, {type: s.rec.mimeType || s.mime || "audio/webm"});
        if(blob.size){ const rid = "rec-"+a.id; await AudioDB.put(rid, blob); a.recordingId = rid; save(); }
      }catch(e){ toast("The recording couldn't be stored. Your time was saved."); }
      if(run && stepsFor(run)[run.stepIdx]==="speak" && location.hash==="#lesson") renderLesson();
    };
    s.rec.stop();
  } else stopStream();
  if(!silent) renderLesson();
}

/* G. REFLECT */

  const q = (k,label,ph) => `<label class="small muted" for="rf${k}">${label}</label><textarea class="write short mt-s" id="rf${k}" data-in="reflect" data-k="${k}" placeholder="${ph}">${esc(r[k])}</textarea>`;

    <div class="stack mt">${q("a","What did you manage to say?","I explained…")}${q("b","What was difficult?","It was hard to…")}${q("c","What would you like to say better next time?","Next time I want to…")}</div>`;

/* H. COMPLETE */
function finalize(){
  if(run.finalized) return;
  run.finalized = true; tickActive();
  const minutes = Math.max(1, Math.round(Math.min(run.activeMs||0, 90*60000)/60000));
  state.hours = +((state.hours||0) + minutes/60).toFixed(2);
  state.sessionLog.push({date:nowISO(), missionId:run.mi, classId:run.cid||null, minutes, kind:run.kind});
  let reflId = null;
  if(run.kind!=="mirror"){
    const r = {id:uid("rf"), date:nowISO(), kind:run.kind, missionId:run.mi, classId:run.cid||null, topic:runTopic(), managed:run.reflect.a.trim(), difficult:run.reflect.b.trim(), better:run.reflect.c.trim()};
    state.reflections.push(r); reflId = r.id;
  }
  if(run.kind==="class"){
    const o = runClass();
    if(o){ const rec = ensureRec(o); rec.reflectionId = reflId; rec.doneAt = rec.doneAt || nowISO(); rec.lastWorkAt = nowISO(); rec.minutes = (rec.minutes||0) + minutes; }
  }
  if(run.kind==="mission"){
    const i = run.mi, mp = state.missionProgress[i] || {startedAt:run.startedAt, sessions:0};
    mp.status = "done"; mp.completedAt = mp.completedAt || nowISO(); mp.lastPracticedAt = nowISO(); mp.sessions = (mp.sessions||0)+1;
    mp.writingIds = (mp.writingIds||[]).concat(run.write.savedId?[run.write.savedId]:[]);
    mp.speakingIds = (mp.speakingIds||[]).concat(run.attempts);
    mp.reflectionIds = (mp.reflectionIds||[]).concat(reflId?[reflId]:[]);
    state.missionProgress[i] = mp;
    if(!state.completedMissions.includes(i)) state.completedMissions.push(i);
    const nx = nextMission(); state.currentMission = nx>=0 ? nx : i;
  }
  if(run.kind==="mirror"){
    const w = state.writingSamples.find(x=>x.id===run.write.savedId);

function quizPool(){
  const src = state.completedMissions.length ? state.completedMissions : [Math.max(0,nextMission())];
  const pool = [];
  src.forEach(i=>LESSONS[i].kit.mistakes.forEach(m=>{
    if(!m.right.includes(" — ")) return;
    const wrong = m.wrong.replace(/\s*\(.*?\)\s*/g," ").trim(), right = m.right.split(" — ")[0].trim(), why = m.right.split(" — ").slice(1).join(" — ");
    if(/[.?!]$/.test(wrong) && wc(wrong)<=8 && wrong!==right) pool.push({wrong,right,why,mi:i});
  }));
  return pool.sort(()=>Math.random()-.5).slice(0,5);
}

const ACT = {
  closeSheet: () => { closeSheet(); if("speechSynthesis" in window) speechSynthesis.cancel(); },
  goHome: () => { if(run && run.finalized) run=null; go("home"); },
  goEvolution: () => { if(run && run.finalized) run=null; go("evolution"); },
  resume: () => { run = state.draft; run.lastTick = Date.now(); go("lesson"); },
  startNext: () => { const nx = nextMission(); if(run && run.finalized) run=null; if(nx>=0) startMission(nx); else go("path"); },
  startMission: el => startMission(+el.dataset.i),
  startMirror: () => { if(run && run.finalized) run=null; startMirror(); },
  startFree: el => startFree(el.dataset.t),
  openMission: el => missionSheet(+el.dataset.i),
  closeLesson: () => {
    if(SP) finishSpeaking(true);
    const toClasses = run && run.kind==="class";
    if(run && !run.finalized){ tickActive(); saveRun(); toast("Saved. Resume any time from "+(toClasses?"the class":"Home")+"."); }
    run = null; go(toClasses?"classes":"home");
  },
  next: () => nextStep(),
  prev: () => prevStep(),
  say: el => say(el.dataset.text, el),
  sayAll: () => { const t=[...view.querySelectorAll(".example .en")].slice(0,4).map(e=>e.textContent); const b=[...view.querySelectorAll(".listen")]; let k=0; const nx=()=>{ if(k<t.length){ say(t[k],b[k],()=>setTimeout(nx,900)); k++; } }; nx(); },
  ladder: () => { run.ladder++; saveRun(); renderLesson(); },
  place: el => { const sc = run.scr[el.dataset.k]; const words = scrambleSentences(runLesson())[+el.dataset.k].split(" "); sc.placed.push(+el.dataset.i);
    if(sc.placed.length===words.length){ if(sc.placed.map(i=>words[i]).join(" ")===words.join(" ")) sc.done=true; else sc.fails++; }
    saveRun(); renderLesson(); },
  unplace: el => { const sc = run.scr[el.dataset.k]; if(sc.done) return; sc.placed.splice(+el.dataset.p,1); saveRun(); renderLesson(); },
  scrReset: el => { run.scr[el.dataset.k].placed = []; saveRun(); renderLesson(); },
  scrShow: el => { const sc = run.scr[el.dataset.k]; sc.placed = sc.order.slice().sort((a,b)=>a-b); sc.done = true; saveRun(); renderLesson(); },
  mode: el => { run.write.mode = el.dataset.m; saveRun(); renderLesson(); },
  frame: el => {
    const box = $("#writeBox"); const f = el.dataset.f; const v = box.value;
    const sep = v && !/\s$/.test(v) ? " " : "";
    box.value = v + sep + f; const pos = box.value.indexOf("___", v.length);
    box.focus(); if(pos>=0) box.setSelectionRange(pos, pos+3);
    INP.write(box);
  },
  saveWriting: () => {
    const cfg = writeConfig(), text = run.write.text.trim();
    if(wc(text) < cfg.min) return;
    const s = {id:uid("w"), createdAt:nowISO(), week:cycleInfo().n, missionId:run.mi, classId:run.cid||null, kind:run.kind, prompt: run.write.mode==="open"&&cfg.openPrompt?cfg.openPrompt:cfg.prompt,
      mode:run.kind==="mirror"?"mirror":run.write.mode, content:text, wordCount:wc(text), topic:cfg.topic, label:cfg.topic};
    state.writingSamples.push(s); run.write.savedId = s.id;
    if(run.kind==="class"){ const o = runClass(); if(o) ensureRec(o).writingId = s.id; }
    touch(); nextStep();
  },
  startSpeak: el => startSpeaking(el.dataset.rec==="1"),
  stopSpeak: () => finishSpeaking(false),
  stuck: () => stuckSheet(),
  stuckPick: el => stuckHelp(STUCK_REASONS[+el.dataset.r]),
  jumpUnderstand: () => { closeSheet(); if(SP) finishSpeaking(true); run.stepIdx = 1; saveRun(); renderLesson(); window.scrollTo(0,0); },
  speakYa: () => { if(depth()>=2){ copyText(speakYaBrief()); toast("Mission brief copied. Paste it into Speak Ya."); } openExternal(CONFIG.speakYa); },
  speakYaBrief: () => { copyText(speakYaBrief()); toast("Mission brief copied. Paste it into Speak Ya."); openExternal(CONFIG.speakYa); },
  sendEvidence: el => { const i = el.dataset.i!=null ? +el.dataset.i : run.mi; openExternal(waLink(missionEvidenceMessage(i))); },
  portfolioReview: () => openExternal(waLink(portfolioMessage())),
  mirrorReview: () => { const m = state.mirrorSamples; const a=m[0], b=m[m.length-1];
    openExternal(waLink(`Hola Profe, soy ${state.name}. Quiero que revises mis muestras espejo.\n\nPrimera (${fmtDate(a.date)}, ${a.words} palabras):\n${a.text.slice(0,500)}\n\nÚltima (${fmtDate(b.date)}, ${b.words} palabras, hablé ${mmss(b.seconds)}):\n${b.text.slice(0,500)}`)); },
  tool: el => {
    const t = el.dataset.tool;
    ({free:freeSheet, shadow:()=>shadowSheet(), quiz:()=>{ quiz=null; quizSheet(); }, texts:()=>textPickerSheet(null,"library"), meditate:meditateSheet, teacher:teacherSheet, plan:planSheet, data:dataSheet, profile:profileSheet})[t]();
  },
  applyCode: async () => {
    const v = ($("#codeIn").value||"").trim().toUpperCase(); if(!v) return;
    let h; try{ h = await sha256(v); }catch(e){ toast("Codes need a secure connection (https)."); return; }
    const t = CONFIG.accessCodes[h];
    if(t && TIERS[t]){ state.tier = t; save(); toast(TIERS[t].name+" unlocked."); planSheet(); }
    else toast("That code isn't valid. Check it with ProfGermandario.");
  },
  export: () => {
    const payload = {format:"qkesl", app:"Fluency OS", appVersion:APP_VERSION, version:state.version, exportedAt:nowISO(), data:state};
    download("fluency-os-"+(state.name||"student").toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+dayKey()+".qkesl", JSON.stringify(payload,null,1));
    toast("Backup downloaded.");
  },
  import: () => $("#importFile").click(),
  resetProgress: () => {
    if(!confirm("Reset mission progress? Your writing, speaking, reflections, and mirror samples are kept.")) return;
    state.completedMissions=[]; state.missionProgress={}; state.currentMission=state.placementStart; state.streak=0; state.draft=null; run=null; save(); closeSheet(); toast("Mission progress reset."); go("home");
  },
  wipe: async () => {
    if(!confirm("Delete everything on this device? This removes all missions, evidence, and recordings.")) return;
    if(prompt("Type DELETE to confirm.")!=="DELETE") return;
    try{ localStorage.setItem("qkesl_backup_before_wipe", JSON.stringify(state)); }catch(e){}
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    try{ await AudioDB.clear(); }catch(e){}
    state = defaultState(); run = null; ob = {step:0,name:"",goal:"",level:"",block:"",style:"",placement:null}; closeSheet(); go("onboarding");
  },
  saveProfile: () => {
    state.name = $("#pfName").value.trim() || state.name;
    const sp = state.startingPoint;
    sp.goal = $("#pfGoal").value || sp.goal; sp.level = $("#pfLevel").value || sp.level; sp.fear = $("#pfBlock").value || sp.fear; sp.learningStyle = $("#pfStyle").value || sp.learningStyle;
    save(); closeSheet(); toast("Profile saved."); render();
  },
  meditated: () => { state.meditationLog.push({date:nowISO()}); state.meditationsCompleted = (state.meditationsCompleted||0)+1; touch(); save(); toast("Session saved."); meditateSheet(); },
  rate: el => { state.ttsRate = +el.dataset.v; save(); shadowSheet(+$("#shMission").value); },
  shadowAll: el => { shadowPlaying = true; playShadow(LESSONS[+el.dataset.i].kit.shadow, 0); },
  shadowDone: el => { shadowPlaying=false; if("speechSynthesis" in window) speechSynthesis.cancel(); state.shadowLog.push({date:nowISO(), missionId:+el.dataset.i}); touch(); save(); toast("Shadowing session saved."); closeSheet(); },
  quizAns: el => { const q = quiz.qs[quiz.k]; quiz.answered = el.dataset.v; if(el.dataset.v===q.right) quiz.correct++; quizSheet(); },
  quizNext: () => { quiz.k++; quiz.answered = null; quizSheet(); },
  /* onboarding */
  obPick: el => { ob[el.dataset.k] = el.dataset.v; if(el.dataset.k==="level") ob.placement = null; VIEWS.onboarding(); },
  obNext: () => { if(ob.step===0 && !ob.name.trim()) return; ob.step++; VIEWS.onboarding(); window.scrollTo(0,0); },
  obBack: () => { ob.step = Math.max(0, ob.step-1); VIEWS.onboarding(); window.scrollTo(0,0); },
  obFinish: () => {
    state.name = ob.name.trim();
    Object.assign(state.startingPoint, {goal:ob.goal, level:ob.level, fear:ob.block, learningStyle:ob.style||"A mix of everything"});
    state.placementStart = +ob.placement||0; state.currentMission = state.placementStart;
    state.onboarded = true; if(!state.createdAt) state.createdAt = nowISO(); save();
    const L = LESSONS[state.placementStart];
    view.innerHTML = `<section class="arrival stack"><p class="kicker">Your route is ready</p>
      <h1 class="display">Before your first mission, capture your starting point.</h1>
      <p class="lead">Write a few sentences and speak for 30 seconds about yourself. In four weeks you'll answer the same prompt, and you'll see the difference.</p>
      <p class="mt"><button class="link" data-act="skipMirror">Skip for now and start Mission ${L.n}: ${esc(L.t)}</button></p></section>`;
    setAction({label:"Record my starting point", act:"startMirror"});
  },
  skipMirror: () => { startMission(state.placementStart); }
};

const INP = {
  obName: el => { ob.name = el.value; const b=$("#abMain"); if(b) b.disabled = !ob.name.trim(); },
  write: el => {
    run.write.text = el.value;
    const n = wc(el.value), min = writeConfig().min, c = $("#wcount");
    if(c){ c.textContent = n; c.classList.toggle("ok", n>=min); }
    actionEnabled(n>=min, "Write at least "+min+" words to continue.");
    clearTimeout(INP._t); INP._t = setTimeout(saveRun, 700);
  },
  reflect: el => {
    run.reflect[el.dataset.k] = el.value;
    actionEnabled(wc(run.reflect.a)>=3, "Answer the first question in a few words to finish.");
    clearTimeout(INP._t); INP._t = setTimeout(saveRun, 700);
  }
};

/* ============================================================
   CLASSES — starters, messages, actions
   ============================================================ */
function startClassWork(id){
  const o = occById(id); if(!o) return;
  if(state.draft && state.draft.kind==="class" && state.draft.cid===id){ run = state.draft; run.lastTick = Date.now(); closeSheet(); go("lesson"); return; }
  if(!confirmReplaceDraft()) return;
  assignText(o);
  run = newRun("class",{cid:id});
  saveRun(); closeSheet(); go("lesson");
}
/* per-date changes on a weekly class: store only what differs from the weekly settings */
function applyOverrides(o, f){
  const r = ensureRec(o);
  if(o.oneoff || r.frozen || !o.series){ Object.assign(r, f); return; }
  ["title","time","duration","level"].forEach(k=>{
    const base = k==="level" ? levelKey(o.series.level) : o.series[k];
    if(String(f[k])!==String(base)) r[k] = f[k]; else delete r[k];
  });
}
/* moving a weekly date: it becomes a single class on the new date, with its work */
function moveClass(o, date, f){
  const r = ensureRec(o), nid = uid("cls");
  state.classRecords[nid] = Object.assign({}, r, {id:nid, date, oneoff:true, frozen:false, seriesId:null, movedFrom:o.id, cancelled:false, movedTo:null, title:o.title, time:o.time, duration:o.duration, level:o.level}, f);
  Object.keys(r).forEach(k=>{ if(!["id","date","seriesId","frozen","time","duration","title","level"].includes(k)) delete r[k]; });
  r.cancelled = true; r.movedTo = nid;
  [state.writingSamples, state.speakingAttempts, state.reflections, state.sessionLog].forEach(list=>list.forEach(x=>{ if(x.classId===o.id) x.classId = nid; }));
  if(state.draft && state.draft.cid===o.id) state.draft.cid = nid;
  return nid;
}
function classEvidenceMessage(id){
  const o = occById(id); if(!o) return "";
  const r = o.rec, T = classText(o), w = state.writingSamples.find(x=>x.id===r.writingId), rf = state.reflections.find(x=>x.id===r.reflectionId);
  let t = `Hola Profe, soy ${state.name||"tu estudiante"}. Te envío mi trabajo de la clase del ${fmtDayEs(o.date)} (${o.level}).\n\n`;
  if(T) t += `Texto de clase: "${T.title}" (${wc(T.body)} palabras)${r.readAt?", leído":""}.\n`;
  t += `Asistencia: ${r.attended?"sí":"aún no marcada"}.\n`;
  if(w){ const c = w.content.length>700 ? w.content.slice(0,700)+"…" : w.content; t += `\nMi texto (${w.wordCount} palabras):\n${c}\n`; }
  if(r.bestSecs) t += `\nHablé: intento más largo ${mmss(r.bestSecs)}.\n`;
  if(rf) t += `\nReflexión:\n- Logré decir: ${rf.managed}\n- Difícil: ${rf.difficult||"-"}\n- Mejorar: ${rf.better||"-"}\n`;
  if((r.notes||"").trim()) t += `\nMis notas de clase:\n${r.notes.trim().slice(0,400)}\n`;
  return t;
}
function afterClassChange(id, msg){ save(); if(msg) toast(msg); if(id) classSheet(id); repaint(); }

Object.assign(ACT, {
  goClasses: () => { if(run && run.finalized) run = null; go("classes"); },
  calShift: el => { calM += +el.dataset.d; if(calM<0){ calM = 11; calY--; } if(calM>11){ calM = 0; calY++; } repaint(); },
  calToday: () => { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); repaint(); },
  openDay: el => daySheet(el.dataset.k),
  openClass: el => classSheet(el.dataset.id),
  classWork: el => startClassWork(el.dataset.id),
  classRead: () => { const o = runClass(); if(o){ const r = ensureRec(o); if(!r.readAt){ r.readAt = nowISO(); touch(); } } stopReading(); nextStep(); },
  classAttend: el => {
    const o = occById(el.dataset.id); if(!o) return;
    if(o.date>dayKey()){ toast("You can mark attendance on the day of the class."); return; }
    const r = ensureRec(o);
    r.attended = !r.attended; r.attendedAt = r.attended ? nowISO() : null;
    if(r.attended) touch();
    save();
    toast(r.attended ? (classPct(o)>=1 ? "Class complete. All five parts done." : "Attendance saved.") : "Attendance removed.");
    if(location.hash==="#lesson" && run){ renderLesson(); return; }
    classSheet(o.id); repaint();
  },
  readAll: el => readAll(el),
  saySnt: el => { stopReading(); el.classList.add("on"); say(el.textContent, null, ()=>el.classList.remove("on")); },
  rateR: el => { state.ttsRate = +el.dataset.v; save(); el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b===el))); },
  readerOpen: el => readerSheet(el.dataset.id),
  textRead: el => readerSheet(null, el.dataset.t),
  texts: () => textPickerSheet(null, "library"),
  textPick: el => textPickerSheet(el.dataset.id||null, el.dataset.tab, el.dataset.edit||null),
  textUse: el => {
    const o = occById(el.dataset.id); if(!o) return;
    const r = ensureRec(o); if(r.textId!==el.dataset.t){ r.textId = el.dataset.t; r.readAt = null; }
    afterClassChange(o.id, "Text set for this class.");
  },
  textSave: el => {
    const title = ($("#ptTitle").value||"").trim(), body = ($("#ptBody").value||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim(), level = levelKey($("#ptLevel").value);
    if(!title){ toast("Give the text a title."); $("#ptTitle").focus(); return; }
    if(wc(body)<20){ toast("The text needs at least 20 words."); $("#ptBody").focus(); return; }
    const write = ($("#ptWrite").value||"").trim(), speak = ($("#ptSpeak").value||"").trim();
    let T = el.dataset.edit ? state.myTexts.find(x=>x.id===el.dataset.edit) : null;
    if(T) Object.assign(T, {title, body, level, write, speak, updatedAt:nowISO()});
    else { T = {id:uid("txt"), title, level, body, write, speak, from:"me", createdAt:nowISO()}; state.myTexts.push(T); }
    const o = el.dataset.id ? occById(el.dataset.id) : null;
    if(o){ const r = ensureRec(o); if(r.textId!==T.id){ r.textId = T.id; r.readAt = null; } }
    save();
    if(el.dataset.share){ copyText(textShareLink(T)); toast("Saved. Share link copied."); } else toast(o ? "Text set for this class." : "Saved to My texts.");
    if(o) classSheet(o.id); else textPickerSheet(null, "mine");
    repaint();
  },
  textShare: el => { const T = textById(el.dataset.t); if(T){ copyText(textShareLink(T)); toast("Share link copied. Paste it in WhatsApp."); } },
  textDel: el => {
    const T = state.myTexts.find(x=>x.id===el.dataset.t); if(!T) return;
    const used = Object.values(state.classRecords).filter(r=>r.textId===T.id).length;
    if(!confirm('Delete "'+T.title+'"?'+(used ? " "+used+(used>1?" classes use":" class uses")+" it; a library text will replace it." : ""))) return;
    state.myTexts = state.myTexts.filter(x=>x.id!==T.id);
    Object.values(state.classRecords).forEach(r=>{ if(r.textId===T.id){ r.textId = null; r.readAt = null; } });
    save(); toast("Text deleted."); textPickerSheet(el.dataset.id||null, "mine"); repaint();
  },
  useShared: el => { const o = occById(el.dataset.id); if(!o) return; const r = ensureRec(o); r.textId = el.dataset.t; r.readAt = null; afterClassChange(o.id, "Text set for "+fmtDay(o.date)+"."); },
  classEdit: el => classEditSheet(el.dataset.id),
  classEditSave: el => {
    const o = occById(el.dataset.id); if(!o) return;
    const date = $("#ceDate").value || o.date;
    const f = {title:($("#ceTitle").value||"").trim()||o.title, time:$("#ceTime").value||o.time, duration:+$("#ceDur").value||o.duration, level:levelKey($("#ceLevel").value)};
    let id = o.id;
    if(o.oneoff) Object.assign(ensureRec(o), f, {date});
    else if(date!==o.date) id = moveClass(o, date, f);
    else applyOverrides(o, f);
    const r = state.classRecords[id], T = r && textById(r.textId);
    if(T && !T.from && T.level!==f.level){ r.textId = null; r.readAt = null; }
    if(date!==o.date){ const d = parseKey(date); calY = d.getFullYear(); calM = d.getMonth(); }
    afterClassChange(id, date!==o.date ? "Class moved to "+fmtDay(date)+"." : "Class updated.");
  },
  classCancel: el => { const o = occById(el.dataset.id); if(!o) return; if(!confirm("Cancel the class on "+fmtDay(o.date,true)+"? Other weeks are not affected.")) return; ensureRec(o).cancelled = true; afterClassChange(o.id, "Class cancelled."); },
  classRestore: el => { const o = occById(el.dataset.id); if(!o) return; const r = ensureRec(o); r.cancelled = false; r.movedTo = null; afterClassChange(o.id, "Class restored."); },
  classDelete: el => {
    const o = occById(el.dataset.id); if(!o) return;
    if(!confirm("Delete this class?"+(hasProgress(o.rec) ? " Your writing, speaking, and reflections stay in your evidence." : ""))) return;
    delete state.classRecords[o.id];
    if(state.draft && state.draft.cid===o.id) state.draft = null;
    save(); closeSheet(); toast("Class deleted."); repaint();
  },
  sendClass: el => openExternal(waLink(classEvidenceMessage(el.dataset.id))),
  oneoffNew: el => oneoffSheet(el && el.dataset ? el.dataset.k : null),
  oneoffSave: () => {
    const date = $("#ooDate").value; if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast("Choose a date."); return; }
    const id = uid("cls");
    state.classRecords[id] = {id, oneoff:true, date, time:$("#ooTime").value||CLASS_DEFAULT.time, duration:+$("#ooDur").value||CLASS_DEFAULT.duration, title:($("#ooTitle").value||"").trim()||CLASS_DEFAULT.title, level:levelKey($("#ooLevel").value), createdAt:nowISO()};
    const d = parseKey(date); calY = d.getFullYear(); calM = d.getMonth();
    afterClassChange(id, "Class added for "+fmtDay(date)+".");
  },
  seriesNew: () => seriesSheet(null),
  seriesEdit: el => seriesSheet(el.dataset.id),
  chip: el => el.setAttribute("aria-pressed", String(el.getAttribute("aria-pressed")!=="true")),
  segPick: el => { el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b===el))); const w = $("#sdWeeksWrap"); if(w) w.classList.toggle("hide", el.dataset.v!=="weeks"); },
  seriesSave: el => {
    const days = [...document.querySelectorAll('#sdDays .chip[aria-pressed="true"]')].map(b=>+b.dataset.d);
    if(!days.length){ toast("Choose at least one day."); return; }
    const lenBtn = document.querySelector('#sdLen [aria-pressed="true"]');
    const v = {days, time:$("#sdTime").value||CLASS_DEFAULT.time, duration:+$("#sdDur").value||CLASS_DEFAULT.duration, level:levelKey($("#sdLevel").value),
      weeks: lenBtn && lenBtn.dataset.v==="weeks" ? Math.min(104, Math.max(1, parseInt($("#sdWeeks").value,10)||8)) : null,
      title:($("#sdTitle").value||"").trim()||CLASS_DEFAULT.title};
    const id = el.dataset.id, t = dayKey();
    if(!id){
      const s = Object.assign({id:uid("ser"), createdAt:nowISO(), start:$("#sdStart").value||t, end:null}, v);
      state.classSeries.push(s);
      const d = parseKey(maxKey(s.start, t)); calY = d.getFullYear(); calM = d.getMonth();
      save(); closeSheet(); toast("Weekly classes added: "+daysLabel(days)+" at "+fmtTime(v.time)+"."); repaint(); return;
    }
    const s = state.classSeries.find(x=>x.id===id); if(!s) return;
    if(s.start<t) freezePast(s); else v.start = $("#sdStart").value || s.start;
    Object.assign(s, v);
    rehomeFuture(s);
    Object.values(state.classRecords).forEach(r=>{
      if(r.seriesId!==s.id || r.oneoff || r.frozen || r.date<t || r.level || r.readAt) return;
      const T = textById(r.textId); if(T && !T.from && T.level!==levelKey(s.level)) r.textId = null;
    });
    save(); closeSheet(); toast("Weekly schedule updated."); repaint();
  },
  seriesStop: el => {
    const s = state.classSeries.find(x=>x.id===el.dataset.id); if(!s) return;
    if(!confirm('Stop "'+s.title+'"? Classes before today keep their evidence. Future dates are removed.')) return;
    const t = dayKey();
    if(s.start<t){ s.end = addDays(t,-1); rehomeFuture(s); }
    else { s.end = addDays(s.start,-1); rehomeFuture(s); state.classSeries = state.classSeries.filter(x=>x!==s); }
    save(); closeSheet(); toast("Weekly class stopped."); repaint();
  },
  ics: () => icsExport()
});
Object.assign(INP, {
  classNotes: el => { const o = occById(el.dataset.id); if(!o) return; ensureRec(o).notes = el.value; clearTimeout(INP._n); INP._n = setTimeout(save, 500); },
  ptBody: el => { const m = $("#ptMeter"); if(!m) return; const lv = levelKey(($("#ptLevel")||{}).value); m.innerHTML = meterInner(wc(el.value), CLASS_LEVELS[lv].read, lv+" range"); }
});

document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); }
});
document.addEventListener("input", e=>{ const k = e.target.dataset && e.target.dataset.in; if(k && INP[k]) INP[k](e.target); });
document.addEventListener("change", e=>{
  if(e.target.id==="shMission") shadowSheet(+e.target.value);
  if(e.target.id==="ptLevel"){ const b = $("#ptBody"); if(b) INP.ptBody(b); }
  if(e.target.id==="importFile" && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const obj = JSON.parse(r.result); const data = obj && obj.format==="qkesl" ? obj.data : obj;
        if(!data || typeof data!=="object" || !("completedMissions" in data || "name" in data)) throw new Error("bad");
        if(!confirm("Replace the progress on this device with this backup"+(data.name?" ("+data.name+")":"")+"?")) return;
        try{ localStorage.setItem("qkesl_backup_before_import", JSON.stringify(state)); }catch(_){}
        state = migrate(data); run = null; save(); closeSheet(); toast("Backup imported."); go("home");
      }catch(err){ toast("That file isn't a Fluency OS backup."); }
    };
    r.readAsText(e.target.files[0]);
  }
});
$("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") ACT.closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#scrim").classList.contains("open")) ACT.closeSheet(); });
window.addEventListener("hashchange", render);
window.addEventListener("scroll", ()=>$("#top").classList.toggle("scrolled", window.scrollY>8), {passive:true});
window.addEventListener("pagehide", ()=>{ if(run && !run.finalized){ tickActive(); saveRun(); } else save(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && run && !run.finalized){ tickActive(); saveRun(); } else if(run) run.lastTick = Date.now(); });

/* ---------- theme ---------- */
function applyTheme(){
  document.documentElement.dataset.theme = state.theme==="light" ? "light" : "dark";
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = state.theme==="light" ? "#F6F2EA" : "#140E1A";
}
$("#themeBtn").addEventListener("click", ()=>{ state.theme = state.theme==="light"?"dark":"light"; applyTheme(); save(); });

/* ---------- console helper for the teacher ---------- */
window.QK = {
  hash: async code => { const h = await sha256(String(code).trim().toUpperCase()); console.log(h); return h; },
  version: APP_VERSION
};

/* ---------- boot ---------- */
applyTheme();
save();
render();
</script>
