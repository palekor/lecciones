<html lang="es" data-theme="dark">
<head>

<meta name="theme-color" content="#0C1626">
<meta name="description" content="Walk the Talk: registro diario de prospección, guion de conversación y hooks listos para copiar. ProfGermandario.">
<meta name="mobile-web-app-capable" content="yes">

<title>Walk the Talk — ProfGermandario</title>

<style>
/* =========================================================
   Walk the Talk 3 — ProfGermandario
   Navy + oro. Fraunces para titulares y cifras, Figtree para la interfaz.
   Sin librerías de iconos: todos los iconos van dibujados aquí mismo.
   ========================================================= */
:root{
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --nav-h:66px; --ease:cubic-bezier(.2,.8,.2,1);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1626; --surface:#122037; --surface-2:#182A45; --sheet:#0F1C30;
  --line:rgba(214,179,106,.13); --line-strong:rgba(214,179,106,.32);
  --ink:#EEF1F6; --ink-2:#A6B1C2; --ink-3:#6F7C91;
  --gold:#D6B36A; --gold-soft:rgba(214,179,106,.13); --gold-ink:#1B1407;
  --pearl:#BCC9DF; --jade:#74C4A0; --danger:#E58595; --danger-soft:rgba(229,133,149,.12);
  --track:rgba(255,255,255,.07); --tick:rgba(255,255,255,.16);
  --shadow:0 22px 50px -28px rgba(0,0,0,.85);
  --overlay:rgba(4,9,17,.62);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F3F5F9; --sheet:#F8F9FB;
  --line:rgba(14,26,43,.09); --line-strong:rgba(154,116,40,.38);
  --ink:#0E1A2B; --ink-2:#4E5B70; --ink-3:#8590A2;
  --gold:#9A7428; --gold-soft:rgba(154,116,40,.10); --gold-ink:#FFFFFF;
  --pearl:#5D7498; --jade:#2D8A66; --danger:#B4405A; --danger-soft:rgba(180,64,90,.08);
  --track:rgba(14,26,43,.07); --tick:rgba(14,26,43,.16);
  --shadow:0 22px 50px -30px rgba(14,26,43,.4);
  --overlay:rgba(14,26,43,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden;transition:background-color .25s ease,color .25s ease;}
body.sheet-open{overflow:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em;}
.muted{color:var(--ink-2);}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:20;background:var(--bg);}
.topbar::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:1px;background:var(--line);}
.brand{display:flex;align-items:center;gap:9px;min-width:0;}
.brand-mark{width:30px;height:30px;flex:none;}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:500;white-space:nowrap;letter-spacing:-.01em;}
.top-actions{display:flex;align-items:center;gap:6px;min-width:0;}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 11px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);transition:border-color .15s ease,transform .1s ease;max-width:100%;}
.chip:hover{border-color:var(--line-strong);}
.chip:active{transform:scale(.96);}
.chip.theme{padding:0 12px 0 10px;color:var(--ink-2);}
.chip.theme svg{color:var(--gold);}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.02em;flex:none;border:1px solid var(--line-strong);}
.person-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:92px;}
@media (max-width:420px){ .chip{height:34px;font-size:12.5px;gap:6px;} .chip.theme{padding:0 10px 0 8px;} .avatar{width:24px;height:24px;font-size:10.5px;} .person-name{max-width:64px;} .top-actions{gap:5px;} .brand{gap:7px;} .brand-mark{width:26px;height:26px;} }
@media (max-width:374px){ .brand-name{font-size:15.5px;} }
@media (max-width:352px){ .brand-name{display:none;} }

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative;}
.nav button svg.i{width:22px;height:22px;}
.nav button[aria-current="page"]{color:var(--gold);}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--gold);}

/* ---------- Generic ---------- */
.view-head{padding:22px 0 14px;}
.view-head h1{font-size:28px;line-height:1.15;}
.view-head p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:46ch;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;}
.panel h2{font-size:19px;margin-bottom:4px;}
.panel > p{margin:0 0 12px;color:var(--ink-2);font-size:13.5px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);transition:border-color .15s ease,transform .1s ease,filter .15s ease;white-space:nowrap;}
.btn:hover{border-color:var(--line-strong);}
.btn:active{transform:scale(.97);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);}
.btn.gold:hover{filter:brightness(1.06);}
.btn.ghost{background:none;}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft);}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px;}
.btn.block{width:100%;}
.btn svg.i{width:17px;height:17px;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);transition:color .15s ease,border-color .15s ease,transform .1s ease;flex:none;}
.icon-btn:hover{color:var(--gold);border-color:var(--line-strong);}
.icon-btn:active{transform:scale(.92);}
.icon-btn.on{color:var(--gold);}
.icon-btn.on svg.i{fill:currentColor;}
.text-btn{background:none;border:none;color:var(--ink-2);font-size:13.5px;font-weight:600;padding:8px 2px;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px;}
.text-btn:hover{color:var(--gold);}
.text-btn.danger{color:var(--danger);}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-grid .wide{grid-column:1/-1;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label,.lbl-sm{font-size:12.5px;font-weight:600;color:var(--ink-2);}
input[type=text],input[type=search],input[type=number],textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;font-size:15px;color:var(--ink);transition:border-color .15s ease;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
.hint{font-size:12.5px;color:var(--ink-3);margin:10px 0 0;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.empty{text-align:center;color:var(--ink-3);padding:28px 8px;font-size:14px;}

/* ---------- Home: greeting ---------- */
.hello{padding:22px 0 4px;}
.hello h1{font-size:28px;line-height:1.15;}
.hello p{margin:4px 0 0;color:var(--ink-2);font-size:14px;}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 12px 12px 14px;margin:14px 0 0;font-size:13.5px;}
.banner svg.i{color:var(--gold);margin-top:2px;}
.banner .b-body{flex:1;}
.banner .b-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.banner.warn{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent);}
.banner.warn svg.i{color:var(--danger);}

/* ---------- Home: the dial (la pieza principal) ---------- */
.today{padding:18px 0 6px;}
.dial{position:relative;width:min(252px,72vw);aspect-ratio:1;margin:0 auto 18px;}
.dial svg{width:100%;height:100%;display:block;overflow:visible;}
.dial .trk{fill:none;stroke:var(--track);stroke-width:9;}
.dial .arc{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:120px 120px;transition:stroke-dashoffset .9s var(--ease);}
.dial .tk{stroke:var(--tick);stroke-width:1.4;stroke-linecap:round;transition:stroke .35s ease;}
.dial .tk.major{stroke-width:2;}
.dial .tk.lit{stroke:var(--gold);}
.dial.complete svg{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--gold) 45%,transparent));}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;}
.dial-pct{font-family:var(--serif);font-size:46px;font-weight:500;line-height:1;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em;}
.dial-pct small{font-size:22px;color:var(--ink-2);margin-left:1px;}
.dial-sub{font-size:12.5px;color:var(--ink-2);margin-top:6px;}
.dial.complete .dial-sub{color:var(--gold);font-weight:600;}

.tally{display:flex;flex-direction:column;gap:8px;}
.tally-row{display:grid;grid-template-columns:auto 1fr auto 44px;grid-template-rows:auto auto;column-gap:12px;row-gap:9px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 10px 13px 16px;transition:border-color .15s ease,transform .12s ease;}
.tally-row:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);}
.tally-row:active{transform:scale(.985);}
.tally-row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 16%,transparent);}
.tally-row .t-label{font-weight:600;font-size:15px;}
.tally-row .t-count{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.tally-row .t-count b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink);margin-right:2px;}
.tally-row .t-plus{grid-row:1/3;grid-column:4;width:44px;height:44px;border-radius:12px;background:var(--surface-2);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center;}
.tally-row .t-plus svg.i{width:22px;height:22px;stroke-width:2.2;}
.tally-row .t-bar{grid-column:1/4;height:4px;border-radius:4px;background:var(--track);overflow:hidden;}
.tally-row .t-bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .6s var(--ease);}
.tally-row.done .t-label::after{content:" ✓";color:var(--c);}

.results{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.result-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 14px;border-radius:var(--r-lg);border:1px dashed var(--line-strong);background:none;font-weight:600;font-size:14px;transition:background-color .15s ease,transform .1s ease;}
.result-btn:hover{background:var(--gold-soft);}
.result-btn:active{transform:scale(.97);}
.result-btn span{display:inline-flex;align-items:center;gap:6px;}
.result-btn svg.i{color:var(--gold);}
.result-btn b{font-family:var(--serif);font-weight:500;font-size:20px;}
.today-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);line-height:1.35;}
.today-foot{gap:12px;}
.streak svg.i{color:var(--gold);}

/* ---------- Home: month ---------- */
.month{margin-top:20px;}
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.month-head h2{font-size:21px;}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow div{text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:600;padding-bottom:6px;}
.cal-cell{position:relative;aspect-ratio:1;max-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);transition:border-color .15s ease;}
.cal-cell:hover{border-color:var(--line-strong);}
.cal-cell.blank{visibility:hidden;}
.cal-cell .heat{position:absolute;inset:0;background:var(--gold);opacity:0;}
.cal-cell .num{position:relative;z-index:1;}
.cal-cell.has .num{color:var(--ink);font-weight:600;}
.cal-cell.future{opacity:.45;}
.cal-cell.is-today{border:2px solid var(--gold);}
.cal-cell.is-today .num{color:var(--gold);font-weight:700;}
.cal-cell .mk{position:absolute;z-index:1;bottom:3px;left:50%;transform:translateX(-50%);}
.cal-cell .mk.dot{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.75;}
.cal-cell .mk.star{width:9px;height:9px;color:var(--gold);}
.cal-cell .mk.star svg{width:9px;height:9px;fill:currentColor;stroke:none;display:block;}
.cal-legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink-3);margin:12px 0 4px;}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend .d{width:5px;height:5px;border-radius:50%;background:var(--ink-2);}
.cal-legend svg{width:10px;height:10px;fill:var(--gold);stroke:none;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);padding-top:16px;}
.stats div{text-align:center;}
.stats b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;}
.stats span{font-size:12.5px;color:var(--ink-2);}
.ratios{font-size:13.5px;color:var(--ink-2);text-align:center;margin:14px auto 0;max-width:40ch;line-height:1.6;}
.ratios strong{color:var(--ink);font-weight:600;}

/* ---------- Guion ---------- */
.for-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 6px 4px 12px;margin-bottom:12px;}
.for-bar svg.i{color:var(--gold);}
.for-bar label{font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.for-bar input{border:none;background:none;padding:9px 4px;font-size:15px;}
.for-bar input:focus{border:none;}
.search{position:relative;margin-bottom:12px;}
.search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
.search input{padding-left:38px;}
.seg{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:6px;margin:0 0 16px;}
@media (max-width:479px){ .seg{grid-template-columns:1fr 1fr;} }
.seg button{height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .15s ease;}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.group-title{font-family:var(--serif);font-size:17px;font-weight:500;margin:22px 0 10px;color:var(--ink);}
.group-title:first-child{margin-top:4px;}
.script{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;}
.script h3{font-size:16.5px;display:flex;align-items:center;gap:8px;}
.script .edited{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;}
.script-text{margin:8px 0 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;max-width:68ch;}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.actions .spacer{flex:1;}
.tok{display:inline-block;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px dashed var(--line-strong);color:var(--ink-2);font-size:.92em;line-height:1.45;}
.tok.on{border-style:solid;background:var(--gold-soft);color:var(--ink);}
mark.ph{background:var(--gold-soft);color:var(--gold);border-bottom:1.5px dotted var(--gold);border-radius:3px;padding:0 2px;}

details.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;}
details.answer summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 16px;cursor:pointer;font-weight:600;font-size:15px;}
details.answer summary::-webkit-details-marker{display:none;}
details.answer summary .q{flex:1;}
details.answer summary svg.i{color:var(--ink-3);transition:transform .2s var(--ease);}
details.answer[open] summary svg.i{transform:rotate(180deg);color:var(--gold);}
details.answer .a-body{padding:0 16px 16px;}
details.answer .script-text{margin-top:0;}

.rule{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--line-strong);background:var(--gold-soft);margin-bottom:6px;}
.rule svg.i{color:var(--gold);margin-top:2px;}
.rule p{margin:0;font-size:14px;line-height:1.55;}
.rule strong{font-weight:600;}

.spec{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:22px 20px 18px;margin-bottom:10px;box-shadow:var(--shadow);}
.spec h2{font-size:25px;line-height:1.15;}
.spec .tagline{font-family:var(--serif);font-style:italic;color:var(--gold);margin:6px 0 14px;font-size:16px;}
.spec dl{margin:0 0 16px;}
.spec dt{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:12px;}
.spec dd{margin:3px 0 0;font-size:14.5px;line-height:1.55;}
.spec dd.locked{display:flex;gap:8px;align-items:flex-start;}
.spec dd.locked svg.i{color:var(--gold);width:16px;height:16px;margin-top:3px;}
.catalog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.cat-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:13px 16px;}
.cat-row:last-child{border-bottom:none;}
.cat-row:hover{background:var(--surface-2);}
.cat-row .c-main{flex:1;min-width:0;}
.cat-row .c-name{font-weight:600;font-size:14.5px;}
.cat-row .c-line{font-size:13px;color:var(--ink-2);margin-top:2px;}
.badge{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;margin-top:1px;}
.badge.price{border-color:var(--line-strong);color:var(--gold);background:var(--gold-soft);}

.diag{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:18px;margin:18px 0 10px;}
.diag-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.diag-head h3{font-size:19px;}
.diag-count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.diag > p{margin:6px 0 12px;color:var(--ink-2);font-size:13.5px;}
.meter{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin-bottom:14px;}
.meter i{display:block;height:100%;background:var(--gold);transition:width .4s var(--ease);}
.diag ol{margin:0;padding:0;list-style:none;counter-reset:q;}
.diag li{counter-increment:q;margin-bottom:12px;}
.diag li label{display:flex;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.4;}
.diag li label::before{content:counter(q);font-family:var(--serif);color:var(--gold);min-width:12px;}
.diag li .key{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--gold);border:1px solid var(--line-strong);border-radius:999px;padding:0 7px;height:18px;display:inline-flex;align-items:center;margin-left:4px;white-space:nowrap;}
.diag textarea{min-height:44px;height:44px;resize:none;font-size:14.5px;padding:10px 12px;overflow:hidden;}
.diag-state{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:11px 13px;border-radius:var(--r-md);background:var(--surface-2);color:var(--ink-2);margin:4px 0 12px;}
.diag-state.ready{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);font-weight:600;}
.diag-state svg.i{color:var(--gold);}

/* ---------- Hooks ---------- */
.hook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;margin-bottom:10px;}
.hook.pinned{border-color:var(--line-strong);}
.hook .script-text{margin:0 0 12px;}
.list-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-3);margin:2px 0 10px;}

/* ---------- Settings ---------- */
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.goal-row:last-child{border-bottom:none;}
.goal-row .g-l{display:flex;align-items:center;gap:10px;font-weight:600;}
.goal-row .g-l .dot{width:9px;height:9px;border-radius:50%;background:var(--c);}
.stepper{display:flex;align-items:center;gap:4px;}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.stepper button:active{transform:scale(.9);}
.stepper input{width:60px;text-align:center;padding:8px 4px;font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.backup-status{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 0 14px;color:var(--ink-2);}
.backup-status .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);}
.backup-status.stale .dot{background:var(--gold);}
.backup-status.never .dot{background:var(--danger);}
.version{text-align:center;font-size:12px;color:var(--ink-3);margin:22px 0 0;}

/* ---------- Sheets ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;}
@media (min-width:640px){ .overlay{align-items:center;padding:24px;} }
.sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:rise .26s var(--ease);box-shadow:var(--shadow);}
@media (min-width:640px){ .sheet{border-radius:22px;border-bottom:1px solid var(--line);padding-bottom:22px;} }
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 12px;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
.sheet-head h2{font-size:22px;line-height:1.2;}
.sheet-head p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;}
.sheet .close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;}
.sheet-foot{display:flex;gap:8px;margin-top:16px;}
.sheet-foot .btn{flex:1;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes rise{from{opacity:.4;transform:translateY(30px);}to{opacity:1;transform:none;}}

.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.counter:last-of-type{border-bottom:none;}
.counter .c-l{display:flex;align-items:center;gap:10px;font-weight:600;}
.counter .c-l .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));}

.people{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.person-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600;}
.person-row.on{border-color:var(--gold);}
.person-row .tag{margin-left:auto;font-size:12px;color:var(--gold);font-weight:600;}
.inline-form{display:flex;gap:8px;}
.inline-form input{flex:1;min-width:0;}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:12px;font-weight:600;font-size:14px;}
.switch input{width:20px;height:20px;accent-color:var(--gold);}
.import-sum{list-style:none;margin:0 0 6px;padding:0;}
.import-sum li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.import-sum li b{font-family:var(--serif);font-weight:500;font-size:17px;}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.choice button{text-align:left;height:auto;padding:12px 14px;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;}
.choice button small{font-weight:500;font-size:12.5px;opacity:.85;}

.welcome{text-align:center;padding:8px 4px 4px;}
.welcome .brand-mark{width:64px;height:64px;margin:6px auto 12px;display:block;}
.welcome h2{font-size:28px;}
.welcome > p{color:var(--ink-2);margin:6px auto 20px;max-width:34ch;font-size:14.5px;}
.welcome form{text-align:left;}

/* ---------- Toast + drop ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,16px);z-index:200;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:11px 12px 11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .25s var(--ease);}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{background:none;border:none;color:var(--gold);font-weight:700;font-size:14px;padding:4px 6px;}
[data-theme="light"] .toast button{color:#E7C981;}
.drop{position:fixed;inset:12px;z-index:300;border:2px dashed var(--gold);border-radius:24px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--gold);pointer-events:none;}
.drop.on{display:flex;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}

const $ = (s, r) => (r||document).querySelector(s);

function uid(p){ return (p||'id')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function obj(x){ return (x && typeof x==='object' && !Array.isArray(x)) ? x : {}; }
function arr(x){ return Array.isArray(x) ? x : []; }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
/* Fecha LOCAL (antes se usaba UTC y, en Colombia, después de las 7 p.m. todo caía en el día siguiente). */
function dkey(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function longDate(k){ const d = parseKey(k); return cap(DOW[d.getDay()])+' '+d.getDate()+' de '+MONTHS[d.getMonth()]; }
function shortDate(ts){ const d = new Date(ts); return d.getDate()+' de '+MONTHS[d.getMonth()]+' de '+d.getFullYear(); }
function daysSince(ts){ if(!ts) return Infinity; const a = new Date(ts); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0); return Math.round((b-a)/864e5); }
function agoText(ts){ const n = daysSince(ts); return n===0 ? 'hoy' : n===1 ? 'ayer' : 'hace '+n+' días'; }
function plural(n, one, many){ return n+' '+(n===1 ? one : (many || one+'s')); }
function initials(name){ const p = String(name||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function firstName(name){ return String(name||'').trim().split(/\s+/)[0] || ''; }
function greeting(){ const h = new Date().getHours(); return h<12 ? 'Buenos días' : h<19 ? 'Buenas tardes' : 'Buenas noches'; }

/* ---------- Normalización / migración ---------- */
function normalize(d){
  d = obj(d);
  delete d._meta;
  d.reps = arr(d.reps).filter(r => typeof r==='string' && r.trim()).map(r => r.trim());
  d.reps = d.reps.filter((r,i) => d.reps.indexOf(r)===i);
  d.dailyRecords = obj(d.dailyRecords);
  Object.keys(d.dailyRecords).forEach(rep => { d.dailyRecords[rep] = obj(d.dailyRecords[rep]); });
  d.contacts = arr(d.contacts);
  d.hooks = arr(d.hooks).filter(h => h && String(h.text||'').trim()).map(h => ({ id:h.id||uid('hook'), text:String(h.text), createdAt:h.createdAt||Date.now(), pinned:!!h.pinned }));
  d.settings = Object.assign({ dailyGoal:20, postsGoal:5, interactGoal:5, theme:'dark' }, obj(d.settings));
  ['dailyGoal','postsGoal','interactGoal'].forEach(k => { const n = parseInt(d.settings[k],10); d.settings[k] = n>0 ? n : ({dailyGoal:20,postsGoal:5,interactGoal:5})[k]; });
  if(d.settings.theme!=='light') d.settings.theme = 'dark';
  d.seeds = obj(d.seeds);
  d.script = obj(d.script);
  d.script.items = arr(d.script.items).filter(i => i && i.id && i.cat);
  d.script.removed = arr(d.script.removed);
  d.script.program = Object.assign({}, SEED_PROGRAM, obj(d.script.program));
  d.script.catalog = arr(d.script.catalog).filter(c => c && c.id);
  // Hooks: se siembran UNA vez (antes se volvían a crear los que borrabas).
  if(!d.seeds.hooks){
    const have = new Set(d.hooks.map(h => h.text.trim()));
    const t0 = Date.now();
    HOOK_LIBRARY_50.forEach((text,i) => { if(!have.has(text.trim())) d.hooks.push({ id:uid('hook'), text, createdAt:t0-i, pinned:false }); });
    d.seeds.hooks = 1;
  }
  const haveIds = new Set(d.script.items.map(i => i.id));
  SEED_SCRIPTS.forEach(s => { if(!haveIds.has(s.id) && !d.script.removed.includes(s.id)) d.script.items.push(Object.assign({ builtin:true, createdAt:0, updatedAt:0 }, s)); });
  if(!d.seeds.catalog){ if(!d.script.catalog.length) d.script.catalog = SEED_CATALOG.map(c => Object.assign({}, c)); d.seeds.catalog = 1; }
  d.schema = SCHEMA;
  return d;
}
function migrateFromOld(old){
  const reps = arr(old.reps);
  const dailyRecords = {};
  reps.forEach(r => dailyRecords[r] = {});
  const add = (rep, ts, f) => { if(!rep) return; const k = dkey(new Date(ts)); dailyRecords[rep] = dailyRecords[rep]||{}; const r = dailyRecords[rep][k] = dailyRecords[rep][k] || {messages:0,prospects:0,clients:0,posts:0,interactions:0}; r[f]++; };
  arr(old.outbound).forEach(o => { if(!o.demo) add(o.rep, o.timestamp, 'messages'); });
  arr(old.activities).forEach(a => { if(a.demo) return; if(a.type==='Respondió') add(a.rep, a.timestamp, 'prospects'); if(a.type==='Cliente ganado') add(a.rep, a.timestamp, 'clients'); });
  const contacts = arr(old.contacts).filter(c => !c.demo).map(c => ({ id:c.id||uid('ct'), name:c.name||c.phone||'Sin nombre', phone:c.phone||'', notes:c.notes||'', createdAt:c.createdAt||Date.now() }));
  const hooks = arr(old.hooks).map(h => ({ id:h.id||uid('hook'), text:h.text||h.title||'', createdAt:h.createdAt||Date.now() })).filter(h => h.text);
  return { reps, dailyRecords, contacts, hooks, settings:{ dailyGoal:(old.settings&&old.settings.dailyGoal)||20, theme:(old.settings&&old.settings.theme)||'dark' } };
}
function load(){
  const raw = lsGet(STORE_KEY);
  let d = null;
  if(raw){
    try{ d = JSON.parse(raw); }
    catch(e){ lsSet(STORE_KEY+'-danado-'+Date.now(), raw); }
  }
  if(!d){
    const old = lsGet(OLD_KEY);
    if(old){ try{ d = migrateFromOld(JSON.parse(old)); }catch(e){} }
  }
  data = normalize(d);
  const s = data.settings;
  currentRep = (s.lastRep && data.reps.includes(s.lastRep)) ? s.lastRep : (data.reps[0] || null);
  save(false);
}
function save(changed){
  if(changed !== false) data.settings.lastChangeAt = Date.now();
  const ok = lsSet(STORE_KEY, JSON.stringify(data));
  if(!ok && storageOk){ storageOk = false; if(view==='home') renderHome(); }
}

/* ---------- Registro diario ---------- */
function goals(){ const s = data.settings; return { messages:s.dailyGoal, posts:s.postsGoal, interactions:s.interactGoal }; }
function getDay(rep, k){ return Object.assign({ messages:0, prospects:0, clients:0, posts:0, interactions:0, note:'' }, (data.dailyRecords[rep]||{})[k] || {}); }
function setField(rep, k, f, v){
  if(!rep) return;
  const days = data.dailyRecords[rep] = data.dailyRecords[rep] || {};
  const rec = getDay(rep, k);
  rec[f] = f==='note' ? String(v||'') : Math.max(0, Math.min(9999, Math.round(Number(v)||0)));
  days[k] = rec;
  save();
}
function bump(rep, k, f, delta){ setField(rep, k, f, getDay(rep, k)[f] + delta); }
function dayPct(rec){ const g = goals(); let t = 0; Object.keys(ACT).forEach(f => t += Math.min(1, rec[f]/Math.max(1,g[f]))); return Math.round(t/3*100); }
function dayComplete(rec){ const g = goals(); return Object.keys(ACT).every(f => rec[f] >= g[f]); }
function hasActivity(rec){ return NUM_FIELDS.some(f => rec[f]>0); }
function streakInfo(rep){
  const goal = goals().messages; const d = new Date();
  const todayMet = getDay(rep, dkey(d)).messages >= goal;
  if(!todayMet) d.setDate(d.getDate()-1);
  let n = 0;
  for(let i=0; i<1000; i++){ if(getDay(rep, dkey(d)).messages >= goal){ n++; d.setDate(d.getDate()-1); } else break; }
  return { n, todayMet };
}
function monthTotals(rep, y, m){
  const days = new Date(y, m+1, 0).getDate();
  const t = { messages:0, prospects:0, clients:0, posts:0, interactions:0, metDays:0, activeDays:0 };
  for(let d=1; d<=days; d++){
    const rec = getDay(rep, dkey(new Date(y, m, d)));
    NUM_FIELDS.forEach(f => t[f] += rec[f]);
    if(rec.messages >= goals().messages) t.metDays++;
    if(hasActivity(rec)) t.activeDays++;
  }
  return t;
}
function countRecordedDays(){ let n = 0; Object.values(data.dailyRecords).forEach(days => Object.values(days).forEach(r => { if(hasActivity(Object.assign({messages:0,prospects:0,clients:0,posts:0,interactions:0}, r))) n++; })); return n; }

/* ---------- Guion helpers ---------- */
function fill(text){
  const name = prospectName.trim(); const p = data.script.program;
  let t = String(text)
    .replace(/\{nombre\}/g, () => name)
    .replace(/\{programa\}/g, () => p.name || 'el programa')
    .replace(/\{precio\}/g, () => p.inversion || '[valor]')
    .replace(/\{duracion\}/g, () => p.duracion || '');
  if(!name) t = t.replace(/[ \t]+([,.:;!?])/g, '$1').replace(/,{2,}/g, ',').replace(/,([.:;!?])/g, '$1');
  return t.replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').trim();
}
function hasPlaceholder(t){ return /\[[^\]\n]{2,}\]/.test(t); }
function displayText(raw){
  const name = prospectName.trim(); const p = data.script.program;
  let h = esc(raw);
  h = h.replace(/\{nombre\}/g, () => name ? `<span class="tok on">${esc(name)}</span>` : '<span class="tok">nombre</span>');
  h = h.replace(/\{programa\}/g, () => `<span class="tok on">${esc(p.name || 'programa')}</span>`);
  h = h.replace(/\{precio\}/g, () => esc(p.inversion || '[valor]'));
  h = h.replace(/\{duracion\}/g, () => esc(p.duracion || ''));
  return h.replace(/\[([^\]<\n]{2,})\]/g, '<mark class="ph">[$1]</mark>');
}
async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function copyScript(raw){
  const t = fill(raw);
  const ok = await copyText(t);
  if(!ok){ showTextSheet('Copia este texto', t); return; }
  haptic();
  toast(hasPlaceholder(t) ? 'Copiado. Completa lo que está entre [corchetes]' : 'Copiado');
}
async function sendWhatsApp(raw){
  const t = fill(raw);
  if(hasPlaceholder(t)){
    const go = await confirmDialog({ title:'Hay partes por completar', text:'Este mensaje todavía tiene texto entre [corchetes]. Puedes abrir WhatsApp y completarlo allí, o editar el guion primero.', ok:'Abrir WhatsApp igual' });
    if(!go) return;
  }
  window.open('https://wa.me/?text='+encodeURIComponent(t), '_blank', 'noopener');
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, opts){
  opts = opts || {};
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opts.action ? `<button type="button">${esc(opts.action)}</button>` : '');
  if(opts.action){ $('button', el).addEventListener('click', () => { hideToast(); opts.onAction && opts.onAction(); }); }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.ms || (opts.action ? 4200 : 2000));
}
function hideToast(){ $('#toast').classList.remove('show'); }

/* ---------- Sheets (reemplazan prompt/confirm, que fallan dentro de WhatsApp e Instagram) ---------- */
let sheetOnClose = null;
function openSheet(inner, opts){
  opts = opts || {};
  closeSheet(true); hideToast();
  const root = $('#sheetRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${opts.dismissable===false ? '' : '<div class="grab"></div>'}${inner}</div>`;
  ov.dataset.dismissable = opts.dismissable===false ? '0' : '1';
  root.appendChild(ov);
  document.body.classList.add('sheet-open');
  const sheet = ov.firstElementChild;
  sheetOnClose = opts.onClose || null;
  if(opts.dismissable !== false){ ov.addEventListener('mousedown', e => { if(e.target===ov) closeSheet(); }); }
  $$('[data-close]', sheet).forEach(b => b.addEventListener('click', () => closeSheet()));
  if(opts.onMount) opts.onMount(sheet);
  const af = $('[autofocus]', sheet);
  if(af && window.matchMedia('(hover:hover)').matches) setTimeout(() => af.focus(), 80);
  return sheet;
}
function closeSheet(silent){
  const root = $('#sheetRoot');
  if(!root.firstChild) return;
  root.innerHTML = '';
  document.body.classList.remove('sheet-open');
  const cb = sheetOnClose; sheetOnClose = null;
  if(!silent && cb) cb();
}
function sheetHead(title, sub, closable){
  return `<div class="sheet-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${closable===false ? '' : `<button class="close" data-close aria-label="Cerrar">${icon('x')}</button>`}</div>`;
}
function confirmDialog(o){
  return new Promise(resolve => {
    let answered = false;
    const s = openSheet(`${sheetHead(esc(o.title), o.text ? esc(o.text) : '', false)}
      <div class="sheet-foot"><button class="btn" data-no>${esc(o.cancel||'Cancelar')}</button><button class="btn ${o.danger ? 'danger' : 'gold'}" data-yes>${esc(o.ok||'Confirmar')}</button></div>`,
      { onClose: () => { if(!answered) resolve(false); } });
    $('[data-no]', s).addEventListener('click', () => { answered = true; closeSheet(true); resolve(false); });
    $('[data-yes]', s).addEventListener('click', () => { answered = true; closeSheet(true); resolve(true); });
  });
}
function showTextSheet(title, text){
  const s = openSheet(`${sheetHead(esc(title), 'Mantén presionado el texto para seleccionarlo y copiarlo.')}<textarea readonly style="min-height:220px;font-size:13px;">${esc(text)}</textarea><div class="sheet-foot"><button class="btn" data-close>Cerrar</button></div>`);
  const ta = $('textarea', s); setTimeout(() => { ta.focus(); ta.select(); }, 100);
}

function dialMarkup(vals, pct, complete){
  const C = r => 2*Math.PI*r;
  const rings = [['messages',98],['posts',82],['interactions',66]];
  let ticks = '';
  const lit = Math.round(pct/100*60);
  for(let i=0; i<60; i++){
    const a = (i*6-90)*Math.PI/180, major = i%5===0;
    const r1 = major ? 106 : 109, r2 = 115;
    ticks += `<line class="tk ${major?'major':''} ${i<lit?'lit':''}" x1="${(120+r1*Math.cos(a)).toFixed(2)}" y1="${(120+r1*Math.sin(a)).toFixed(2)}" x2="${(120+r2*Math.cos(a)).toFixed(2)}" y2="${(120+r2*Math.sin(a)).toFixed(2)}"/>`;
  }
  const arcs = rings.map(([f,r]) => `<circle class="trk" cx="120" cy="120" r="${r}"/><circle class="arc" data-arc="${f}" cx="120" cy="120" r="${r}" stroke="${ACT[f].c}" stroke-dasharray="${C(r).toFixed(2)}" stroke-dashoffset="${(C(r)*(1-vals[f])).toFixed(2)}"/>`).join('');
  return `<div class="dial ${complete?'complete':''}" id="dial">
    <svg viewBox="0 0 240 240" role="img" aria-label="Progreso del día: ${pct}%">${ticks}${arcs}</svg>
    <div class="dial-center"><div class="dial-pct">${pct}<small>%</small></div><div class="dial-sub">${complete ? 'Día completo' : 'del día'}</div></div>
  </div>`;
}
function backupBannerHtml(){
  const s = data.settings;
  if(!storageOk) return `<div class="banner warn">${icon('alert')}<div class="b-body">Este navegador no está guardando tus datos (modo privado o almacenamiento lleno). Descarga un respaldo antes de cerrar.<div class="b-actions"><button class="btn sm gold" data-bk="dl">${icon('download')}Descargar respaldo</button></div></div></div>`;
  if((s.backupSnoozeUntil||0) > Date.now()) return '';
  const changedSince = (s.lastChangeAt||0) > (s.lastBackupAt||0);
  if(!changedSince) return '';
  const never = !s.lastBackupAt;
  if(never && countRecordedDays() < 3) return '';
  if(!never && daysSince(s.lastBackupAt) < 7) return '';
  const msg = never ? 'Aún no tienes un respaldo. Tus números viven solo en este navegador.' : 'Tu último respaldo fue '+agoText(s.lastBackupAt)+'.';
  return `<div class="banner">${icon('download')}<div class="b-body">${msg}<div class="b-actions"><button class="btn sm gold" data-bk="dl">Descargar respaldo</button><button class="btn sm ghost" data-bk="later">Más tarde</button></div></div></div>`;
}

function calendarCells(){
  const g = goals();
  const first = new Date(viewedYear, viewedMonth, 1);
  let offset = first.getDay()-1; if(offset<0) offset = 6;
  const days = new Date(viewedYear, viewedMonth+1, 0).getDate();
  const todayK = dkey();
  let max = g.messages;
  for(let d=1; d<=days; d++) max = Math.max(max, getDay(currentRep, dkey(new Date(viewedYear, viewedMonth, d))).messages);
  let h = '';
  for(let i=0; i<offset; i++) h += '<div class="cal-cell blank" aria-hidden="true"></div>';
  for(let d=1; d<=days; d++){
    const k = dkey(new Date(viewedYear, viewedMonth, d));
    const rec = getDay(currentRep, k);
    const future = k > todayK;
    const op = rec.messages ? (0.10 + 0.38*Math.min(1, rec.messages/max)).toFixed(2) : 0;
    const full = dayComplete(rec), met = rec.messages >= g.messages;
    h += `<button class="cal-cell ${k===todayK?'is-today':''} ${future?'future':''} ${hasActivity(rec)?'has':''}" data-date="${k}" aria-label="${d} de ${MONTHS[viewedMonth]}: ${plural(rec.messages,'mensaje')}">
      <span class="heat" style="opacity:${op}"></span><span class="num">${d}</span>
      ${full ? `<span class="mk star"><svg viewBox="0 0 24 24">${ICONS.star}</svg></span>` : met ? '<span class="mk dot"></span>' : ''}
    </button>`;
  }
  return h;
}

      e.preventDefault(); const it = item(); if(!it) return;
      const a = b.dataset.act;
      if(a==='copy') copyScript(it.text);

function renderGuionBody(){

  else if(guionCat==='programa'){ body.innerHTML = programHtml(); bindProgram(body); return; }
  else if(guionCat==='precio'){

    const g = groupedItems('precio');
    body.innerHTML = `

function renderRespList(){
  const list = $('#respList'); if(!list) return;
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const q = norm(respQuery.trim());
  const g = groupedItems('respuestas', q ? i => norm(i.title+' '+i.text).includes(q) : null);
  const groups = GROUPS.respuestas.filter(x => g[x]).concat(Object.keys(g).filter(x => !GROUPS.respuestas.includes(x)));
  list.innerHTML = groups.length ? groups.map(gr => `<h3 class="group-title">${esc(gr)}</h3>${g[gr].map(i => `
      <details class="answer" data-id="${esc(i.id)}" ${q ? 'open' : ''}>
        <summary><span class="q">${esc(i.title)}</span>${icon('down')}</summary>
        <div class="a-body"><p class="script-text">${displayText(i.text)}</p>${scriptActionsHtml()}</div>
      </details>`).join('')}`).join('')
    : `<div class="empty">No hay respuestas para “${esc(respQuery)}”.<br>Agrégala con el botón de abajo.</div>`;

}
function addBtnHtml(label){ return `<button class="btn block" data-add style="margin-top:6px">${icon('plus')}${label}</button>`; }
function listJoin(a){ return a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' y '+a[a.length-1]; }
function groupedItems(cat, filter){
  const g = {};
  itemsOf(cat).filter(i => !filter || filter(i)).forEach(i => { const k = i.group || 'Otras'; (g[k] = g[k] || []).push(i); });
  return g;
}
function openScriptEditor(item, cat){
  const isNew = !item;
  const groups = GROUPS[cat];
  const seed = item && item.builtin ? SEED_SCRIPTS.find(x => x.id===item.id) : null;
  const edited = seed && (seed.text!==item.text || seed.title!==item.title);
  const s = openSheet(`${sheetHead(isNew ? 'Nuevo guion' : 'Editar guion', 'Usa {nombre} donde va el nombre del prospecto y [corchetes] para lo que hay que completar.')}
    <div class="field"><label for="seTitle">${cat==='respuestas' ? 'La duda o pregunta del prospecto' : 'Título'}</label><input type="text" id="seTitle" value="${esc(item ? item.title : '')}" ${isNew?'autofocus':''}></div>
    ${groups ? `<div class="field"><label for="seGroup">Grupo</label><select id="seGroup">${groups.map(gname => `<option ${item && item.group===gname ? 'selected' : ''}>${esc(gname)}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label for="seText">Texto</label><textarea id="seText" style="min-height:170px">${esc(item ? item.text : '')}</textarea></div>
    <div class="row"><button class="btn sm" id="seInsert">${icon('plus')}Insertar {nombre}</button>${edited ? `<button class="btn sm" id="seRestore">${icon('restore')}Volver al original</button>` : ''}</div>
    <div class="sheet-foot">${isNew ? '' : `<button class="btn danger" id="seDel" aria-label="Eliminar">${icon('trash')}</button>`}<button class="btn gold" id="seSave">Guardar</button></div>`);
  $('#seInsert', s).addEventListener('click', () => {
    const ta = $('#seText', s); const p = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0,p) + '{nombre}' + ta.value.slice(ta.selectionEnd ?? p); ta.focus(); ta.setSelectionRange(p+8, p+8);
  });
  if(edited) $('#seRestore', s).addEventListener('click', () => { $('#seTitle', s).value = seed.title; $('#seText', s).value = seed.text; });
  $('#seSave', s).addEventListener('click', () => {
    const title = $('#seTitle', s).value.trim(); const text = $('#seText', s).value.trim();
    if(!title || !text){ toast('Escribe el título y el texto'); return; }
    const group = groups ? $('#seGroup', s).value : undefined;
    if(isNew) data.script.items.push({ id:uid('sc'), cat, group, title, text, builtin:false, createdAt:Date.now(), updatedAt:Date.now() });
    else { item.title = title; item.text = text; if(group) item.group = group; item.updatedAt = (seed && seed.text===text && seed.title===title) ? 0 : Date.now(); }
    save(); closeSheet(); renderGuionBody(); toast('Guion guardado');
  });
  if(!isNew) $('#seDel', s).addEventListener('click', async () => {
    const ok = await confirmDialog({ title:'Eliminar “'+item.title+'”', text: item.builtin ? 'Puedes recuperarlo luego desde Ajustes.' : 'Esta acción no se puede deshacer.', ok:'Eliminar', danger:true });
    if(!ok) return;
    data.script.items = data.script.items.filter(x => x.id!==item.id);
    if(item.builtin && !data.script.removed.includes(item.id)) data.script.removed.push(item.id);
    save(); renderGuionBody(); toast('Guion eliminado');
  });
}

/* ---------- Diagnóstico antes del precio ---------- */
function getDiag(){ try{ return obj(JSON.parse(lsGet(DIAG_KEY)||'{}')); }catch(e){ return {}; } }
function setDiag(d){ lsSet(DIAG_KEY, JSON.stringify(d)); }
function diagStatus(d){
  const answered = DIAG_QUESTIONS.filter(q => (d[q.id]||'').trim()).length;
  const keysLeft = DIAG_QUESTIONS.filter(q => q.key && !(d[q.id]||'').trim()).length;
  return { answered, keysLeft, ready: keysLeft===0 };
}
function diagStateHtml(st){
  return st.ready ? `${icon('check')}<span>Listo: ya tienes lo necesario para presentar la inversión.</span>`
                  : `${icon('lock')}<span>Faltan ${plural(st.keysLeft,'respuesta clave','respuestas clave')} antes de hablar de precio.</span>`;
}
function diagHtml(){
  const d = getDiag(); const st = diagStatus(d);
  return `<section class="diag" id="diag">
    <div class="diag-head"><h3>Diagnóstico</h3><span class="diag-count" id="diagCount">${st.answered} de ${DIAG_QUESTIONS.length}</span></div>
    <p>Anota aquí lo que responde la persona. Cuando las preguntas clave estén completas, presentas la inversión.</p>
    <div class="meter"><i id="diagMeter" style="width:${Math.round(st.answered/DIAG_QUESTIONS.length*100)}%"></i></div>
    <ol>${DIAG_QUESTIONS.map(q => `<li><label for="dq-${q.id}">${esc(q.q)}${q.key ? '<span class="key">clave</span>' : ''}</label><textarea id="dq-${q.id}" data-q="${q.id}" rows="1" placeholder="Respuesta">${esc(d[q.id]||'')}</textarea></li>`).join('')}</ol>
    <div class="diag-state ${st.ready?'ready':''}" id="diagState">${diagStateHtml(st)}</div>
    <div class="actions"><button class="btn sm" id="dgAsk">${icon('copy')}Copiar preguntas</button><button class="btn gold sm" id="dgSum">${icon('clipboard')}Copiar resumen</button><span class="spacer"></span><button class="text-btn" id="dgClear">Limpiar</button></div>
  </section>`;
}
function autosize(ta){ ta.style.height = 'auto'; ta.style.height = Math.max(44, ta.scrollHeight+2)+'px'; }
function bindDiag(root){
  const box = $('#diag', root); if(!box) return;
  $$('textarea[data-q]', box).forEach(ta => {
    autosize(ta);
    ta.addEventListener('input', () => {
      const d = getDiag(); d[ta.dataset.q] = ta.value; setDiag(d); autosize(ta);
      const st = diagStatus(d);
      $('#diagCount').textContent = st.answered+' de '+DIAG_QUESTIONS.length;
      $('#diagMeter').style.width = Math.round(st.answered/DIAG_QUESTIONS.length*100)+'%';
      const stEl = $('#diagState'); stEl.className = 'diag-state '+(st.ready?'ready':''); stEl.innerHTML = diagStateHtml(st);
    });
  });
  $('#dgAsk', box).addEventListener('click', () => copyScript('Para darte una propuesta exacta, {nombre}, cuéntame:\n' + DIAG_QUESTIONS.map((q,i) => (i+1)+'. '+q.q).join('\n')));
  $('#dgSum', box).addEventListener('click', async () => {
    const d = getDiag(); const st = diagStatus(d);
    if(!st.answered){ toast('Todavía no hay respuestas'); return; }
    const head = 'Diagnóstico' + (prospectName.trim() ? ' de '+prospectName.trim() : '') + ', ' + shortDate(Date.now());
    const lines = DIAG_QUESTIONS.map(q => q.s+': '+((d[q.id]||'').trim() || '—'));
    const ok = await copyText(head+'\n'+lines.join('\n'));
    ok ? toast('Resumen copiado') : showTextSheet('Resumen', head+'\n'+lines.join('\n'));
  });
  $('#dgClear', box).addEventListener('click', async () => {
    if(!await confirmDialog({ title:'Limpiar el diagnóstico', text:'Se borran las respuestas anotadas para empezar con otra persona.', ok:'Limpiar' })) return;
    setDiag({}); renderGuionBody();
  });
}

let hookQuery = '';
function sortedHooks(){
  return data.hooks.map((h,i) => ({ h, i })).sort((a,b) => (b.h.pinned - a.h.pinned) || (b.h.createdAt - a.h.createdAt) || (a.i - b.i)).map(x => x.h);
}
function renderHooks(){
  $('#view').innerHTML = `

      <button class="btn sm ghost" id="hkImport">${icon('upload')}Importar .txt</button>
    </div>`;
  bindForBar(renderHookList);
  const si = $('#hookSearch'); si.addEventListener('input', () => { hookQuery = si.value; renderHookList(); });
  $('#hookAdd').addEventListener('click', () => openHookEditor(null));

}
function renderHookList(){
  const box = $('#hookList'); if(!box) return;
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const q = norm(hookQuery.trim());

  const pins = data.hooks.filter(h => h.pinned).length;
  box.innerHTML = (list.length ? `<div class="list-meta"><span>${q ? plural(list.length,'resultado') : plural(data.hooks.length,'hook')}</span><span>${pins ? plural(pins,'fijado') : ''}</span></div>` : '') +
    (list.length ? list.map(h => `<article class="hook ${h.pinned?'pinned':''}" data-hid="${esc(h.id)}">
      <p class="script-text">${displayText(h.text)}</p>
      <div class="actions"><button class="btn gold sm" data-h="copy">${icon('copy')}Copiar</button><button class="btn sm" data-h="wa">${icon('wa')}WhatsApp</button><span class="spacer"></span>
      <button class="icon-btn ${h.pinned?'on':''}" data-h="pin" aria-label="${h.pinned?'Quitar de fijados':'Fijar arriba'}" aria-pressed="${h.pinned}">${icon('star')}</button>
      <button class="icon-btn" data-h="edit" aria-label="Editar">${icon('pencil')}</button></div>
    </article>`).join('') : `<div class="empty">${q ? 'Ningún hook contiene “'+esc(hookQuery)+'”.' : 'Todavía no hay hooks. Crea el primero.'}</div>`);
  $$('[data-hid]', box).forEach(card => {
    const h = data.hooks.find(x => x.id===card.dataset.hid);

      const a = b.dataset.h;
      if(a==='copy') copyScript(h.text);
      else if(a==='wa') sendWhatsApp(h.text);
      else if(a==='edit') openHookEditor(h);
      else if(a==='pin'){ h.pinned = !h.pinned; save(); renderHookList(); toast(h.pinned ? 'Fijado arriba' : 'Quitado de fijados'); }
    }));
  });
}
function openHookEditor(h){
  const isNew = !h;
  const s = openSheet(`${sheetHead(isNew ? 'Nuevo hook' : 'Editar hook')}
    <div class="field"><label for="hkText">Mensaje</label><textarea id="hkText" style="min-height:150px" placeholder="Escribe o pega el mensaje" ${isNew?'autofocus':''}>${esc(h ? h.text : '')}</textarea></div>
    <div class="sheet-foot">${isNew ? '' : `<button class="btn danger" id="hkDel" aria-label="Eliminar">${icon('trash')}</button>`}<button class="btn gold" id="hkSave">Guardar hook</button></div>`);
  $('#hkSave', s).addEventListener('click', () => {
    const text = $('#hkText', s).value.trim(); if(!text){ toast('Escribe el mensaje'); return; }
    if(isNew) data.hooks.push({ id:uid('hook'), text, createdAt:Date.now(), pinned:false }); else h.text = text;
    save(); closeSheet(); renderHookList(); toast('Hook guardado');
  });
  if(!isNew) $('#hkDel', s).addEventListener('click', async () => {
    if(!await confirmDialog({ title:'Eliminar este hook', text:'Esta acción no se puede deshacer.', ok:'Eliminar', danger:true })) return;

function exportHooksTxt(){
  downloadBlob(sortedHooks().map(h => h.text.trim()).join('\n\n')+'\n', 'text/plain;charset=utf-8', 'walk-the-talk-hooks.txt');
  toast('Hooks exportados');
}
function importHooksText(text){
  const parts = /\n\s*\n/.test(text) ? text.split(/\n\s*\n/) : text.split(/\n/);
  const have = new Set(data.hooks.map(h => h.text.trim()));
  let added = 0; const t0 = Date.now();
  parts.map(p => p.trim()).filter(p => p.length > 3).forEach((p,i) => { if(!have.has(p)){ have.add(p); data.hooks.push({ id:uid('hook'), text:p, createdAt:t0+i, pinned:false }); added++; } });
  save();
  if(view==='hooks') renderHookList();
  toast(added ? plural(added,'hook nuevo','hooks nuevos')+' agregados' : 'Esos hooks ya estaban en tu lista');
}

      <div id="goals">${Object.keys(ACT).map(f => `<div class="goal-row" style="--c:${ACT[f].c}"><span class="g-l"><span class="dot"></span>${ACT[f].label}</span>${stepperHtml(ACT[f].goal, s[ACT[f].goal])}</div>`).join('')}</div>
    </section>
    <section class="panel">
      <h2>Personas</h2>
      <p>Cada persona lleva su propio registro en este dispositivo.</p>
      <div class="people">${data.reps.map(r => `<div class="person-row ${r===currentRep?'on':''}"><span class="avatar">${esc(initials(r))}</span>${esc(r)}${r===currentRep ? '<span class="tag">activa</span>' : ''}</div>`).join('') || '<div class="muted">Nadie todavía.</div>'}</div>
      <button class="btn block" id="peopleBtn">${icon('user')}Cambiar, agregar o renombrar</button>
    </section>
    <section class="panel">
      <h2>Guiones</h2>
      <p>${removed ? `Has eliminado ${plural(removed,'guion original','guiones originales')}.` : 'Tienes todos los guiones originales.'}</p>
      <button class="btn block" id="restoreScripts" ${removed ? '' : 'disabled style="opacity:.5"'}>${icon('restore')}Recuperar guiones eliminados</button>
    </section>
    <section class="panel">
      <h2>Borrar datos</h2>
      <p>Borra registros, hooks, guiones y personas de este navegador. Descarga un respaldo antes.</p>
      <button class="btn danger block" id="wipe">${icon('trash')}Borrar todo</button>
    </section>
    <p class="version">Walk the Talk 3 · ProfGermandario</p>`;
  $('#bkDl').addEventListener('click', downloadBackup);
  $('#bkUl').addEventListener('click', () => pickFile('backup'));
  if(canShare) $('#bkShare').addEventListener('click', shareBackup);
  else $('#bkDrive').addEventListener('click', () => { downloadBackup(); window.open('https://drive.google.com/drive/my-drive','_blank','noopener'); });
  $('#bkCopy').addEventListener('click', async () => { const t = backupJSON(false); const ok = await copyText(t); if(ok){ markBackup(); toast('Respaldo copiado. Pégalo en un chat o nota'); renderSettings(); } else showTextSheet('Tu respaldo', t); });
  $('#bkPaste').addEventListener('click', openPasteSheet);
  $('#bkCsv').addEventListener('click', exportCsv);
  bindSteppers($('#goals'), (k, v) => { const n = Math.max(1, v); data.settings[k] = n; save(); return n; });
  $('#peopleBtn').addEventListener('click', openPeopleSheet);
  if(removed) $('#restoreScripts').addEventListener('click', () => { const n = removed; data.script.removed = []; data = normalize(data); save(); renderSettings(); toast(plural(n,'guion recuperado','guiones recuperados')); });
  $('#wipe').addEventListener('click', async () => {
    const ok = await confirmDialog({ title:'¿Borrar todo?', text:'Se borran todos los registros, hooks, guiones y personas de este navegador. No se puede deshacer.', ok:'Sí, borrar todo', danger:true });
    if(!ok) return;
    const theme = data.settings.theme;
    data = normalize({ settings:{ theme } }); currentRep = null; dialShown = null; save(); lsSet(DIAG_KEY, '{}');
    view = 'home'; renderApp(); showWelcome();
  });
}
function backupJSON(pretty){
  const out = Object.assign({}, data, { _meta:{ app:'walk-the-talk', schema:SCHEMA, exportedAt:new Date().toISOString(), exportedBy:currentRep||'' } });
  return JSON.stringify(out, null, pretty===false ? 0 : 1);
}
function backupName(ext){ return 'walk-the-talk-respaldo-'+dkey()+'.'+(ext||'json'); }
function downloadBlob(content, type, filename){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
function markBackup(){ data.settings.lastBackupAt = Date.now(); data.settings.backupSnoozeUntil = 0; save(false); }
function downloadBackup(){
  downloadBlob(backupJSON(), 'application/json', backupName());
  markBackup(); toast('Respaldo descargado');
  if(view==='settings') renderSettings(); else if(view==='home') renderHome();
}
async function shareBackup(){
  const json = backupJSON();
  const candidates = [ new File([json], backupName(), { type:'application/json' }), new File([json], backupName('txt'), { type:'text/plain' }) ];
  const file = candidates.find(f => { try{ return navigator.canShare({ files:[f] }); }catch(e){ return false; } });
  if(!file){ downloadBackup(); return; }
  try{
    await navigator.share({ files:[file], title:'Respaldo Walk the Talk' });
    markBackup(); toast('Respaldo enviado'); renderSettings();
  }catch(e){ if(e && e.name!=='AbortError') { toast('No se pudo compartir. Se descargó el archivo.'); downloadBackup(); } }
}
function exportCsv(){
  const q = v => /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const rows = [['persona','fecha','mensajes','publicaciones','interacciones','prospectos','clientes','nota']];
  Object.keys(data.dailyRecords).forEach(rep => Object.keys(data.dailyRecords[rep]).sort().forEach(k => {
    const r = getDay(rep, k); if(!hasActivity(r) && !r.note) return;
    rows.push([rep, k, r.messages, r.posts, r.interactions, r.prospects, r.clients, r.note||'']);
  }));
  downloadBlob('﻿'+rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv;charset=utf-8', 'walk-the-talk-dias-'+dkey()+'.csv');
  toast('CSV descargado');
}
function pickFile(mode){ fileMode = mode; const f = $('#fileIn'); f.value = ''; f.click(); }
async function readFileText(file){ return file.text ? file.text() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); }); }
function openPasteSheet(){
  const s = openSheet(`${sheetHead('Pegar respaldo', 'Pega el texto que copiaste con “Copiar como texto”.')}
    <textarea id="pasteBox" style="min-height:180px;font-size:13px" placeholder='{"reps":[...], ...}'></textarea>
    <div class="sheet-foot"><button class="btn" data-close>Cancelar</button><button class="btn gold" id="pasteGo">Revisar respaldo</button></div>`);
  $('#pasteGo', s).addEventListener('click', () => { const t = $('#pasteBox', s).value; if(!t.trim()){ toast('Pega el texto del respaldo'); return; } handleBackupText(t); });
}
function parseBackup(text){
  let parsed;
  try{ parsed = JSON.parse(String(text).trim().replace(/^﻿/, '')); }catch(e){ return null; }
  if(!parsed || typeof parsed!=='object') return null;
  let incoming = parsed;
  if(parsed.outbound || parsed.activities) incoming = migrateFromOld(parsed);
  if(!('dailyRecords' in incoming || 'hooks' in incoming || 'reps' in incoming)) return null;
  const meta = obj(parsed._meta);
  return { meta, data: normalize(JSON.parse(JSON.stringify(incoming))) };
}
function handleBackupText(text, fromFileName){
  const res = parseBackup(text);
  if(!res){
    if(fromFileName && /\.txt$/i.test(fromFileName)){
      confirmDialog({ title:'Ese archivo no es un respaldo', text:'¿Quieres importarlo como lista de hooks? Cada párrafo se vuelve un hook.', ok:'Importar como hooks' }).then(ok => { if(ok) importHooksText(text); else if(!data.reps.length) showWelcome(); });
    } else { toast(fromFileName ? 'Ese archivo no es un respaldo de Walk the Talk' : 'Ese texto no es un respaldo de Walk the Talk'); if(!data.reps.length && fromFileName) showWelcome(); }
    return;
  }
  const inc = res.data;
  const days = Object.values(inc.dailyRecords).reduce((n, d) => n + Object.keys(d).length, 0);
  const hasData = data.reps.length || countRecordedDays();
  const s = openSheet(`${sheetHead('Subir respaldo', res.meta.exportedAt ? 'Creado el '+shortDate(res.meta.exportedAt)+(res.meta.exportedBy ? ' por '+esc(res.meta.exportedBy) : '')+'.' : '')}
    <ul class="import-sum">
      <li><span>Personas</span><b>${inc.reps.length ? esc(inc.reps.join(', ')) : '0'}</b></li>
      <li><span>Días registrados</span><b>${days}</b></li>
      <li><span>Hooks</span><b>${inc.hooks.length}</b></li>
      <li><span>Guiones</span><b>${inc.script.items.length}</b></li>
    </ul>
    <div class="choice">
      ${hasData ? `<button class="btn gold" id="imMerge">Combinar con lo que ya tengo<small>Suma personas, días, hooks y guiones. Si un día existe en ambos, queda el número más alto.</small></button>` : ''}
      <button class="btn ${hasData ? 'danger' : 'gold'}" id="imReplace">${hasData ? 'Reemplazar todo' : 'Usar este respaldo'}<small>${hasData ? 'Lo de este navegador se cambia por el respaldo.' : 'Carga todo lo del archivo en este navegador.'}</small></button>
      <button class="btn ghost" data-close>Cancelar</button>
    </div>`, { onClose: () => { if(!data.reps.length) showWelcome(); } });
  const finish = (msg) => {
    data = normalize(data);
    if(!currentRep || !data.reps.includes(currentRep)) currentRep = (data.settings.lastRep && data.reps.includes(data.settings.lastRep)) ? data.settings.lastRep : (data.reps[0]||null);
    data.settings.lastRep = currentRep; dialShown = null; save();
    closeSheet(true); renderApp(); toast(msg);
    if(!data.reps.length) showWelcome();
  };
  if(hasData) $('#imMerge', s).addEventListener('click', () => { data = mergeData(data, inc); finish('Respaldo combinado'); });
  $('#imReplace', s).addEventListener('click', async () => {
    if(hasData){ const ok = await confirmDialog({ title:'¿Reemplazar todo?', text:'Lo que hay en este navegador se cambia por el respaldo. Si no estás seguro, descarga primero un respaldo de lo actual.', ok:'Reemplazar', danger:true }); if(!ok){ handleBackupText(text, fromFileName); return; } }
    const theme = data.settings.theme; data = inc; data.settings.theme = theme; finish('Respaldo cargado');
  });
}
function mergeData(base, inc){
  const out = JSON.parse(JSON.stringify(base));
  inc.reps.forEach(r => { if(!out.reps.includes(r)) out.reps.push(r); });
  Object.keys(inc.dailyRecords).forEach(rep => {
    const target = out.dailyRecords[rep] = out.dailyRecords[rep] || {};
    Object.keys(inc.dailyRecords[rep]).forEach(k => {
      const a = obj(target[k]), b = obj(inc.dailyRecords[rep][k]); const m = {};
      NUM_FIELDS.forEach(f => m[f] = Math.max(Number(a[f])||0, Number(b[f])||0));
      const na = String(a.note||'').trim(), nb = String(b.note||'').trim();
      m.note = na && nb && na!==nb ? (na.includes(nb) ? na : nb.includes(na) ? nb : na+'\n'+nb) : (na||nb);
      target[k] = m;
    });
  });
  const ht = new Map(out.hooks.map(h => [h.text.trim(), h]));
  inc.hooks.forEach(h => { const ex = ht.get(h.text.trim()); if(ex){ ex.pinned = ex.pinned || h.pinned; } else { out.hooks.push(h); ht.set(h.text.trim(), h); } });
  const ids = new Set(out.contacts.map(c => c.id)); inc.contacts.forEach(c => { if(!ids.has(c.id)) out.contacts.push(c); });
  const si = new Map(out.script.items.map(i => [i.id, i]));
  inc.script.items.forEach(i => { const ex = si.get(i.id); if(!ex) out.script.items.push(i); else if((i.updatedAt||0) > (ex.updatedAt||0)) Object.assign(ex, i); });
  if((inc.script.program.updatedAt||0) > (out.script.program.updatedAt||0)) out.script.program = inc.script.program;
  const ci = new Map(out.script.catalog.map(c => [c.id, c]));
  inc.script.catalog.forEach(c => { const ex = ci.get(c.id); if(!ex) out.script.catalog.push(c); else if((c.updatedAt||0) > (ex.updatedAt||0)) Object.assign(ex, c); });
  return out;
}

/* =========================================================
   Personas + bienvenida
   ========================================================= */
function setRep(name){ currentRep = name; data.settings.lastRep = name; dialShown = null; save(false); }
function openPeopleSheet(){
  const s = openSheet(`${sheetHead('Personas', 'Elige quién registra ahora en este dispositivo.')}
    <div class="people">${data.reps.map(r => `<button class="person-row ${r===currentRep?'on':''}" data-rep="${esc(r)}"><span class="avatar">${esc(initials(r))}</span>${esc(r)}${r===currentRep ? '<span class="tag">activa</span>' : ''}</button>`).join('')}</div>
    <form class="inline-form" id="addRepForm"><input type="text" id="addRepName" placeholder="Agregar otra persona" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">${icon('plus')}Agregar</button></form>
    ${currentRep ? `<div class="divider"></div>
    <div class="lbl-sm" style="margin-bottom:6px">Cambiar el nombre de ${esc(currentRep)}</div>
    <form class="inline-form" id="renameForm"><input type="text" id="renameName" value="${esc(currentRep)}" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Guardar</button></form>
    ${data.reps.length > 1 ? `<button class="text-btn danger" id="removeRep" style="margin-top:8px">Quitar a ${esc(currentRep)} y su registro</button>` : ''}` : ''}
    <div class="divider"></div>
    <div class="btn-grid"><button class="btn" id="pDl">${icon('download')}Descargar respaldo</button><button class="btn" id="pUl">${icon('upload')}Subir respaldo</button></div>`,
    { onClose: () => renderApp() });
  $$('[data-rep]', s).forEach(b => b.addEventListener('click', () => { setRep(b.dataset.rep); closeSheet(); toast('Registrando como '+firstName(b.dataset.rep)); }));
  $('#addRepForm', s).addEventListener('submit', e => {
    e.preventDefault(); const n = $('#addRepName', s).value.trim().replace(/\s+/g,' ');
    if(!n){ toast('Escribe un nombre'); return; }
    if(!data.reps.includes(n)) data.reps.push(n);
    setRep(n); save(); closeSheet(); toast('Hola, '+firstName(n));
  });
  const rf = $('#renameForm', s);
  if(rf) rf.addEventListener('submit', e => {
    e.preventDefault(); const n = $('#renameName', s).value.trim().replace(/\s+/g,' ');
    if(!n || n===currentRep){ closeSheet(); return; }
    if(data.reps.includes(n)){ toast('Ya existe una persona con ese nombre'); return; }
    data.reps = data.reps.map(r => r===currentRep ? n : r);
    if(data.dailyRecords[currentRep]){ data.dailyRecords[n] = data.dailyRecords[currentRep]; delete data.dailyRecords[currentRep]; }
    setRep(n); save(); closeSheet(); toast('Nombre actualizado');
  });
  const rm = $('#removeRep', s);
  if(rm) rm.addEventListener('click', async () => {
    const who = currentRep;
    const ok = await confirmDialog({ title:'Quitar a '+who, text:'Se borra su registro diario en este navegador. Si lo necesitas, descarga un respaldo antes.', ok:'Quitar', danger:true });
    if(!ok){ openPeopleSheet(); return; }
    data.reps = data.reps.filter(r => r!==who); delete data.dailyRecords[who];
    setRep(data.reps[0]||null); save(); renderApp(); toast(who+' quitado');
  });
  $('#pDl', s).addEventListener('click', downloadBackup);
  $('#pUl', s).addEventListener('click', () => { closeSheet(true); pickFile('backup'); });
}
function showWelcome(){
  const s = openSheet(`<div class="welcome">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="23" fill="none" stroke="var(--track)" stroke-width="5"/><path d="M32 9a23 23 0 1 1-19.9 34.5" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="3.2" fill="var(--gold)"/></svg>
      <h2>Walk the Talk</h2>
      <p>Engagement 100: cada día, conversaciones que se convierten en leads. Tu registro, tu guion y tus hooks en un solo lugar.</p>
      <form id="wForm">
        <div class="field"><label for="wName">¿Cómo te llamas?</label><input type="text" id="wName" placeholder="Tu nombre" autocomplete="given-name" enterkeyhint="go" autofocus></div>
        <button class="btn gold block" type="submit" style="height:50px;font-size:15px">Empezar</button>
      </form>
      <button class="text-btn" id="wImport" style="margin-top:12px">Ya tengo un respaldo: subirlo</button>
    </div>`, { dismissable:false });
  $('#wForm', s).addEventListener('submit', e => {
    e.preventDefault(); const n = $('#wName', s).value.trim().replace(/\s+/g,' ');
    if(!n){ toast('Escribe tu nombre para continuar'); $('#wName', s).focus(); return; }
    if(!data.reps.includes(n)) data.reps.push(n);
    setRep(n); save(); closeSheet(true); view = 'home'; renderApp();
  });
  $('#wImport', s).addEventListener('click', () => { closeSheet(true); pickFile('backup'); });
}

/* =========================================================
   Eventos globales
   ========================================================= */
$('#themeBtn').addEventListener('click', () => { data.settings.theme = data.settings.theme==='dark' ? 'light' : 'dark'; save(false); applyTheme(); renderHeader(); });
$('#personBtn').addEventListener('click', () => { if(!data.reps.length) showWelcome(); else openPeopleSheet(); });
$('#fileIn').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file){ if(!data.reps.length) showWelcome(); return; }
  const text = await readFileText(file);
  if(fileMode==='hooks') importHooksText(text); else handleBackupText(text, file.name);
});
// Si la persona cancela el selector de archivos desde la bienvenida, vuelve la bienvenida.
window.addEventListener('focus', () => setTimeout(() => { if(data && !data.reps.length && !$('#sheetRoot').firstChild) showWelcome(); }, 600));
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ const ov = $('#sheetRoot .overlay'); if(ov && ov.dataset.dismissable==='1') closeSheet(); }
});
// Arrastrar y soltar el respaldo (computador)
let dragDepth = 0;
const isFileDrag = e => e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files');
window.addEventListener('dragenter', e => { if(!isFileDrag(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); });
window.addEventListener('dragover', e => { if(isFileDrag(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if(!isFileDrag(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) $('#drop').classList.remove('on'); });
window.addEventListener('drop', async e => {
  if(!isFileDrag(e)) return; e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  const file = e.dataTransfer.files[0]; if(!file) return;
  handleBackupText(await readFileText(file), file.name);
});
// Otra pestaña con la app abierta guardó algo: refrescar aquí.
window.addEventListener('storage', e => {
  if(e.key!==STORE_KEY || !e.newValue) return;
  try{ data = normalize(JSON.parse(e.newValue)); if(currentRep && !data.reps.includes(currentRep)) currentRep = data.reps[0]||null; if(!$('#sheetRoot').firstChild) renderApp(); }catch(err){}
});
// Volver a la app al día siguiente: refrescar "hoy".
let lastDayKey = dkey();
document.addEventListener('visibilitychange', () => { if(!document.hidden && dkey()!==lastDayKey){ lastDayKey = dkey(); const n = new Date(); viewedYear = n.getFullYear(); viewedMonth = n.getMonth(); dialShown = null; if(view==='home') renderHome(); } });

/* ---------- Inicio ---------- */
load();
renderApp();
if(!data.reps.length) showWelcome();
</script>
