<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk the Talk — ProfGermandario</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root[data-theme="dark"]{
    --bg:#0B0B0D; --card:#151518; --card-2:#1B1B1F; --text:#F5F5F7; --text-2:#98989F; --text-3:#68686E;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
    --accent:#E8B34C; --accent-ink:#1A1108; --ok:#5DCAA5; --danger:#E0607A;
  }
  :root[data-theme="light"]{
    --bg:#F5F5F7; --card:#FFFFFF; --card-2:#FAFAFA; --text:#1D1D1F; --text-2:#6E6E73; --text-3:#9A9AA0;
    --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
    --accent:#B8863B; --accent-ink:#FFFFFF; --ok:#1E8F6C; --danger:#C23A56;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:76px;overflow-x:hidden;}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  button,select,input,textarea{font-family:'Inter',sans-serif;}

  .app{max-width:520px;margin:0 auto;padding:0 16px;}

  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .brand{font-family:'Fraunces',serif;font-size:17px;letter-spacing:.2px;line-height:1.15;}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:1px;}
  .top-actions{display:flex;gap:8px;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text-2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .12s ease,border-color .15s ease,color .15s ease;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .icon-btn:active{transform:scale(.9);}
  select#repSelect{background:var(--card-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 9px;font-size:12px;}

  nav.tabs{display:flex;gap:4px;margin:14px 0 18px;background:var(--card-2);border-radius:10px;padding:4px;}
  .tab{flex:1;background:none;border:none;color:var(--text-2);font-size:12px;padding:9px 6px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s ease;}
  .tab.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15);}
  .tab:active{transform:scale(.96);}
  .tab i{font-size:16px;}

  main{padding-bottom:20px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  #mainContent{animation:fadeUp .3s ease;}

  .month-title{font-size:26px;text-align:center;margin-bottom:2px;}
  .greet-line{font-size:14px;color:var(--text-2);text-align:center;margin-bottom:14px;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;}
  .month-nav button{background:none;border:none;color:var(--text-2);font-size:18px;cursor:pointer;padding:4px 8px;}
  .month-nav button:hover{color:var(--accent);}

  .metrics-row{display:flex;justify-content:space-around;text-align:center;margin-bottom:10px;}
  .metric-num{font-family:'Inter',sans-serif;font-weight:700;font-size:28px;}
  .metric-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .ratio-row{text-align:center;color:var(--text-2);font-size:12px;margin-bottom:20px;line-height:1.6;}

  .streak-line{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:10px;}

  .cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:16px;max-width:340px;margin-left:auto;margin-right:auto;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px;}
  .cal-weekdays div{text-align:center;font-size:10px;color:var(--text-2);text-transform:uppercase;font-weight:700;letter-spacing:.3px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-cell{height:34px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1px solid var(--border);background:var(--card-2);overflow:hidden;transition:border-color .15s ease;}
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell.today{border:2px solid var(--accent);background:var(--card);}
  .cal-cell.full{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-day-num{font-size:10.5px;color:var(--text-2);position:relative;z-index:2;}
  .cal-cell.today .cal-day-num{color:var(--accent);font-weight:700;font-size:11.5px;}
  .cal-intensity{position:absolute;bottom:0;left:0;right:0;background:var(--accent);opacity:.55;z-index:1;}
  .cal-check{position:absolute;top:2px;right:2px;font-size:7px;color:var(--ok);z-index:2;}
  .cal-check.full{color:var(--accent);}

  .today-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;text-align:center;transition:border-color .3s ease;}
  .today-card.full{border-color:var(--accent);}
  .today-label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}

  .ring-wrap{position:relative;width:120px;height:120px;margin:4px auto 18px;}
  .ring{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--card-2);stroke-width:9;}
  .ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1),stroke .3s ease;}
  .ring-fill.done{stroke:var(--ok);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-family:'Inter',sans-serif;font-weight:800;font-size:23px;line-height:1;}
  .ring-sub{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:3px;}

  .mini-metrics{text-align:left;margin-bottom:2px;}
  .mini-metric{margin-bottom:11px;}
  .mini-metric:last-child{margin-bottom:0;}
  .mini-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .mini-row .mlbl{display:flex;align-items:center;gap:6px;color:var(--text-2);font-weight:600;}
  .mini-row .mlbl i{font-size:13px;color:var(--text-3);}
  .mini-row .mval{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;font-size:12px;}
  .mini-track{height:5px;background:var(--card-2);border-radius:3px;overflow:hidden;}
  .mini-fill{height:100%;background:var(--accent);border-radius:3px;}
  .mini-fill.done{background:var(--ok);}

  .quick-row{display:flex;gap:8px;margin-top:16px;}
  .quick-btn{flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:11.5px;padding:11px 4px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s ease,border-color .15s ease;}
  .quick-btn i{font-size:15px;color:var(--accent);}
  .quick-btn:hover{border-color:var(--accent);}
  .quick-btn:active{transform:scale(.93);}
  .link-btn{display:block;width:100%;background:none;border:none;color:var(--text-2);font-size:11.5px;padding:12px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .link-btn:hover{color:var(--accent);}

  .progress-track{height:6px;background:var(--card-2);border-radius:4px;overflow:hidden;margin:10px 0 16px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
  .progress-fill.done{background:var(--ok);}
  .big-btn{width:100%;background:var(--accent);color:var(--accent-ink);border:none;font-weight:800;font-size:16px;letter-spacing:.4px;padding:18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(232,179,76,.35);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,filter .15s ease;}
  .big-btn i{font-size:18px;}
  .big-btn:hover{filter:brightness(1.06);}
  .big-btn:active{transform:scale(.98);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  select,input,textarea{background:var(--card-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;}
  select:focus,input:focus,textarea:focus{outline:1px solid var(--accent);}
  .btn{background:none;border:1px solid var(--border-strong);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:transform .1s ease,border-color .15s ease,color .15s ease;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:default;transform:none;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:600;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn-sm{padding:6px 11px;font-size:12px;}

  .contact-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .contact-row:last-child{border-bottom:none;}
  .c-name{font-size:14px;font-weight:600;flex:1;}
  .c-phone{font-size:12px;color:var(--text-2);}
  .status-pill{font-size:10px;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .status-CONTACTED{background:var(--card-2);color:var(--text-2);}
  .status-PROSPECT{background:rgba(232,179,76,.15);color:var(--accent);}
  .status-CLIENT{background:rgba(93,202,165,.15);color:var(--ok);}

  .hook-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .hook-text{font-size:13px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px;}
  .hook-actions{display:flex;gap:6px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:overlayIn .16s ease;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes panelIn{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
  .modal-panel{background:var(--bg);width:100%;max-width:420px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;animation:panelIn .22s cubic-bezier(.16,1,.3,1);}
  @media(min-width:600px){.modal-panel{border-radius:16px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-close{background:none;border:none;color:var(--text-2);font-size:20px;cursor:pointer;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;}
  .section-label{font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:16px 0 2px;}
  .modal-head + .section-label{margin-top:2px;}

  .counter-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .counter-row:last-of-type{border-bottom:none;}
  .counter-label{font-size:13px;color:var(--text-2);}
  .counter-controls{display:flex;align-items:center;gap:14px;}
  .stepper-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-strong);background:var(--card-2);color:var(--text);font-size:16px;cursor:pointer;transition:transform .1s ease,border-color .15s ease;}
  .stepper-btn:hover{border-color:var(--accent);color:var(--accent);}
  .stepper-btn:active{transform:scale(.88);}
  .counter-val{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;min-width:34px;text-align:center;}

  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border-strong);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
  .empty{text-align:center;color:var(--text-3);font-size:13px;padding:24px 0;}
  .note{font-size:11px;color:var(--text-3);margin-top:8px;}
  .err{color:var(--danger);font-size:12px;display:none;margin-top:2px;}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <header class="topbar">
    <div class="brand">Walk the Talk<small>Engagement 100 · Haz un lead</small></div>
    <div class="top-actions">
      <select id="repSelect"></select>
      <button class="icon-btn" id="addRepBtn" title="Agregar persona"><i class="ti ti-user-plus"></i></button>

  </header>
  <nav class="tabs" id="tabsNav"></nav>

</div>
<div class="toast" id="toast"></div>

<script>
const OLD_KEY = 'lead-magnet-crm-v2';
const STORE_KEY = 'lead-magnet-simple-v1';
const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STATUSES = ["CONTACTED","PROSPECT","CLIENT"];
const STATUS_LABEL = {"CONTACTED":"Contactado","PROSPECT":"Prospecto","CLIENT":"Cliente"};
const RING_CIRCUMFERENCE = 2*Math.PI*52;

const HOOK_LIBRARY_50 = [

"¿Cuánto vale, en tu carrera, sonar tan seguro en inglés como sonás en español?",
"La mayoría no necesita más clases de inglés. Necesita dejar de traducir en su cabeza.",
"No te vendo un curso. Te ofrezco una conversación de 15 minutos para ver si esto te sirve.",
"Un cliente me dijo: en español soy el que más habla en la sala, en inglés soy el que menos.",
"Un colega tuyo me comentó que el inglés te frena más de lo que debería.",
"No prometo que hables perfecto en 12 semanas. Prometo que dejes de sentirte menos capaz.",

"Vi que comentaste en un post sobre aprender inglés. No sé qué tan en serio lo estás buscando, pero si es real, te cuento un enfoque distinto al que seguramente ya viste anunciado.",
"Me topé con tu comentario — parece que el inglés sigue pendiente. ¿Es más un tema de trabajo, de viajes, o simplemente de sentirte más seguro?",

"Capté tu comentario en ese post. Si el inglés realmente te interesa, prefiero que antes de decidir algo escuches por qué mi método no es una academia más.",
"Vi que dejaste un comentario sobre inglés hace poco. Curiosidad rápida: ¿tu problema es entender o es hablar con seguridad? Son entrenamientos distintos.",

"Vi tu comentario — quiero ahorrarte tiempo. Si buscás gramática, no soy tu opción. Si buscás hablar con seguridad en situaciones reales, hablemos.",
"Noté tu comentario. Trabajo con cupos limitados porque prefiero calidad sobre cantidad. Si te interesa, más vale que hablemos pronto.",

async function seedHooksIfMissing(){
  const existing = new Set(data.hooks.map(h=>(h.text||'').trim()));
  let added = false;
  HOOK_LIBRARY_50.forEach(text=>{
    if(!existing.has(text.trim())){
      data.hooks.push({ id:uid('hook'), text, createdAt:Date.now() });
      added = true;
    }
  });
  if(added) await saveData();
}

let data = { reps:[], dailyRecords:{}, contacts:[], hooks:[], settings:{dailyGoal:20,postsGoal:5,interactGoal:5,theme:'dark'} };
let currentRep = null;
let currentView = 'home';
let viewedYear = new Date().getFullYear();
let viewedMonth = new Date().getMonth();

function uid(p){ return (p||'id')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); }
function todayStr(ts){ return new Date(ts).toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer = null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1600);
}
function greeting(){ const h=new Date().getHours(); return h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches'); }

/* ===== MODAL MANAGER =====
   Fix for the stacking/crash bug: every open*Form/Modal call goes through
   closeAllModals() first, so it's impossible to have two overlays alive at
   once. All lookups inside a modal are scoped to that modal's own overlay
   element (overlay.querySelector) instead of document.getElementById, so a
   modal can never accidentally read or write into a different modal. */
function closeAllModals(){
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
}

/* ===== STORAGE + MIGRATION ===== */
function localGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function localSet(key,val){ try{ localStorage.setItem(key,val); return true; }catch(e){ return false; } }
async function cloudGet(key){ try{ if(window.storage){ const r = await window.storage.get(key, true); return r && r.value; } }catch(e){} return null; }
async function cloudSet(key,val){ try{ if(window.storage){ await window.storage.set(key, val, true); } }catch(e){} }

async function loadData(){
  let raw = localGet(STORE_KEY);
  if(!raw){ raw = await cloudGet(STORE_KEY); }
  if(raw){
    data = JSON.parse(raw);
  } else {
    let oldRaw = localGet(OLD_KEY);
    if(!oldRaw){ oldRaw = await cloudGet(OLD_KEY); }
    if(oldRaw){ data = migrateFromOld(JSON.parse(oldRaw)); }
  }
  if(!data.reps) data.reps=[];
  if(!data.dailyRecords) data.dailyRecords={};
  if(!data.contacts) data.contacts=[];
  if(!data.hooks) data.hooks=[];
  if(!data.settings) data.settings={dailyGoal:20,postsGoal:5,interactGoal:5,theme:'dark'};
  if(data.settings.dailyGoal==null) data.settings.dailyGoal=20;
  if(data.settings.postsGoal==null) data.settings.postsGoal=5;
  if(data.settings.interactGoal==null) data.settings.interactGoal=5;
  if(!data.settings.theme) data.settings.theme='dark';
  await seedHooksIfMissing();
  await saveData();
}
async function saveData(){
  const json = JSON.stringify(data);
  const ok = localSet(STORE_KEY, json);
  if(!ok) console.error('No se pudo guardar en este navegador (localStorage bloqueado).');
  cloudSet(STORE_KEY, json);
}

function migrateFromOld(old){
  const reps = old.reps || [];
  const dailyRecords = {};
  reps.forEach(r=> dailyRecords[r] = {});

  (old.outbound||[]).forEach(o=>{
    if(o.demo) return;
    const rep = o.rep; const d = todayStr(o.timestamp);
    dailyRecords[rep] = dailyRecords[rep] || {};
    dailyRecords[rep][d] = dailyRecords[rep][d] || {messages:0,prospects:0,clients:0,posts:0,interactions:0};
    dailyRecords[rep][d].messages++;
  });
  (old.activities||[]).forEach(a=>{
    if(a.demo) return;
    const rep = a.rep; const d = todayStr(a.timestamp);
    dailyRecords[rep] = dailyRecords[rep] || {};
    dailyRecords[rep][d] = dailyRecords[rep][d] || {messages:0,prospects:0,clients:0,posts:0,interactions:0};
    if(a.type==='Respondió') dailyRecords[rep][d].prospects++;
    if(a.type==='Cliente ganado') dailyRecords[rep][d].clients++;
  });

  const stageRank = {"Nuevo":0,"Contactado":1,"Respondió":2,"Conversación":3,"Interés":4,"Diagnóstico":5,"Propuesta":6,"Cliente":7,"Perdido":-1};
  const contacts = (old.contacts||[]).filter(c=>!c.demo).map(c=>{
    let status = 'CONTACTED';
    if(c.stage==='Cliente') status='CLIENT';
    else if(stageRank[c.stage]>=2) status='PROSPECT';
    let notes = c.notes||'';
    if(c.stage==='Perdido') notes = (notes ? notes+' ' : '') + '(perdido)';
    return { id:c.id||uid('ct'), name:c.name||c.phone||'Sin nombre', phone:c.phone||'', status, notes, createdAt:c.createdAt||Date.now() };
  });

  const hooks = (old.hooks||[]).map(h=>({ id:h.id||uid('hook'), text:h.text||h.title||'', createdAt:h.createdAt||Date.now() })).filter(h=>h.text);

  return {
    reps, dailyRecords, contacts, hooks,
    settings: { dailyGoal: (old.settings&&old.settings.dailyGoal)||20, postsGoal: 5, interactGoal: 5, theme: (old.settings&&old.settings.theme)||'dark' }
  };
}

/* ===== DAY HELPERS ===== */
const EMPTY_DAY = {messages:0,prospects:0,clients:0,posts:0,interactions:0};
function getDay(rep, dateStr){
  const stored = (data.dailyRecords[rep] && data.dailyRecords[rep][dateStr]) || {};
  return Object.assign({}, EMPTY_DAY, stored);
}
async function setDayField(rep, dateStr, field, value){
  data.dailyRecords[rep] = data.dailyRecords[rep] || {};
  const existing = data.dailyRecords[rep][dateStr] || {};
  data.dailyRecords[rep][dateStr] = Object.assign({}, EMPTY_DAY, existing);
  data.dailyRecords[rep][dateStr][field] = Math.max(0, value);
  await saveData();
}
async function bumpDayField(rep, dateStr, field, delta){
  const cur = getDay(rep, dateStr)[field];
  await setDayField(rep, dateStr, field, cur+delta);
}
function dayComplete(rec){
  const s = data.settings;
  return rec.messages>=s.dailyGoal && rec.posts>=s.postsGoal && rec.interactions>=s.interactGoal;
}
function dayCompletionPct(rec){
  const s = data.settings;
  const rM = Math.min(1, rec.messages / Math.max(1,s.dailyGoal));
  const rP = Math.min(1, rec.posts / Math.max(1,s.postsGoal));
  const rI = Math.min(1, rec.interactions / Math.max(1,s.interactGoal));
  return Math.round(((rM+rP+rI)/3)*100);
}

function computeStreak(rep){
  let streak = 0; let cursor = new Date(); const goal = data.settings.dailyGoal;
  for(let i=0;i<365;i++){
    const dStr = cursor.toISOString().slice(0,10);
    if(getDay(rep,dStr).messages >= goal) streak++; else break;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeMonthTotals(rep, year, month){
  const days = new Date(year, month+1, 0).getDate();
  let messages=0, prospects=0, clients=0, posts=0, interactions=0;
  for(let d=1; d<=days; d++){
    const dStr = new Date(year,month,d).toISOString().slice(0,10);
    const rec = getDay(rep, dStr);
    messages += rec.messages; prospects += rec.prospects; clients += rec.clients;
    posts += rec.posts; interactions += rec.interactions;
  }
  return { messages, prospects, clients, posts, interactions };
}

/* ===== VIEW: HOME ===== */
function miniMetricHtml(icon, label, val, goal){
  const pct = Math.min(100, Math.round(val/Math.max(1,goal)*100));
  const done = val>=goal;
  return `<div class="mini-metric">
    <div class="mini-row"><span class="mlbl"><i class="ti ${icon}"></i>${label}</span><span class="mval">${val}/${goal}</span></div>
    <div class="mini-track"><div class="mini-fill ${done?'done':''}" style="width:${pct}%"></div></div>
  </div>`;
}

function renderHome(){
  if(!currentRep){
    document.getElementById('mainContent').innerHTML = '<div class="empty">Agrega tu nombre arriba para empezar a registrar.</div>';
    return;
  }
  const today = todayStr(Date.now());
  const totals = computeMonthTotals(currentRep, viewedYear, viewedMonth);
  const perProspect = totals.prospects>0 ? (totals.messages/totals.prospects).toFixed(1) : '—';
  const perClient = totals.clients>0 ? (totals.messages/totals.clients).toFixed(1) : '—';
  const streak = computeStreak(currentRep);
  const isCurrentMonth = (viewedYear===new Date().getFullYear() && viewedMonth===new Date().getMonth());

  const s = data.settings;
  const todayRec = getDay(currentRep, today);
  const pctToday = dayCompletionPct(todayRec);
  const fullToday = dayComplete(todayRec);
  const ringOffset = RING_CIRCUMFERENCE * (1 - Math.min(100,pctToday)/100);

  document.getElementById('mainContent').innerHTML = `
    <div class="greet-line">${greeting()}, ${escapeHtml(currentRep)} 👋</div>
    <div class="metrics-row">
      <div><div class="metric-num">${totals.messages}</div><div class="metric-label">Mensajes</div></div>
      <div><div class="metric-num">${totals.prospects}</div><div class="metric-label">Prospectos</div></div>
      <div><div class="metric-num">${totals.clients}</div><div class="metric-label">Clientes</div></div>
    </div>
    <div class="ratio-row">1 prospecto cada ${perProspect} mensajes<br>1 cliente cada ${perClient} mensajes<br>${totals.posts} publicaciones · ${totals.interactions} interacciones este mes</div>

    ${(isCurrentMonth && streak>0) ? `<div class="streak-line">🔥 ${streak} día${streak===1?'':'s'} seguido${streak===1?'':'s'} en meta de mensajes</div>` : ''}

    <div class="month-nav">
      <button id="prevMonth"><i class="ti ti-chevron-left"></i></button>
      <div class="month-title">${MONTH_NAMES[viewedMonth]} ${viewedYear}</div>
      <button id="nextMonth"><i class="ti ti-chevron-right"></i></button>
    </div>

    <div class="cal-wrap">
      <div class="cal-weekdays"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    ${isCurrentMonth ? `
    <div class="today-card ${fullToday?'full':''}">
      <div class="today-label">Hoy · ${new Date().getDate()} ${MONTH_NAMES[viewedMonth].toUpperCase()}</div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill ${fullToday?'done':''}" cx="60" cy="60" r="52" style="stroke-dasharray:${RING_CIRCUMFERENCE.toFixed(2)};stroke-dashoffset:${ringOffset.toFixed(2)};"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-pct">${pctToday}%</div>
          <div class="ring-sub">${fullToday?'Listo':'del día'}</div>
        </div>
      </div>
      <div class="mini-metrics">
        ${miniMetricHtml('ti-send','Mensajes',todayRec.messages,s.dailyGoal)}
        ${miniMetricHtml('ti-pencil','Publicaciones',todayRec.posts,s.postsGoal)}
        ${miniMetricHtml('ti-users','Interacciones',todayRec.interactions,s.interactGoal)}
      </div>
      <div class="quick-row">
        <button class="quick-btn" data-qf="messages"><i class="ti ti-send"></i>Mensaje</button>
        <button class="quick-btn" data-qf="posts"><i class="ti ti-pencil"></i>Publicación</button>
        <button class="quick-btn" data-qf="interactions"><i class="ti ti-users"></i>Interacción</button>
      </div>
      <button class="link-btn" id="editExactBtn">Editar números exactos, prospectos o clientes</button>
    </div>` : ''}
  `;

  renderCalendarGrid();
  document.getElementById('prevMonth').addEventListener('click', ()=>{ viewedMonth--; if(viewedMonth<0){viewedMonth=11;viewedYear--;} renderHome(); });
  document.getElementById('nextMonth').addEventListener('click', ()=>{ viewedMonth++; if(viewedMonth>11){viewedMonth=0;viewedYear++;} renderHome(); });
  document.querySelectorAll('.quick-btn').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled = true;
    await bumpDayField(currentRep, today, b.dataset.qf, 1);
    renderHome();
  }));
  const editBtn = document.getElementById('editExactBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>openDayModal(today));
}

function renderCalendarGrid(){
  const grid = document.getElementById('calGrid');
  const s = data.settings;
  const firstDay = new Date(viewedYear, viewedMonth, 1);
  let startOffset = firstDay.getDay()-1; if(startOffset<0) startOffset=6;
  const daysInMonth = new Date(viewedYear, viewedMonth+1, 0).getDate();
  const today = todayStr(Date.now());

  let maxMsgs = 1;
  for(let d=1; d<=daysInMonth; d++){
    const dStr = new Date(viewedYear,viewedMonth,d).toISOString().slice(0,10);
    maxMsgs = Math.max(maxMsgs, getDay(currentRep,dStr).messages);
  }

  let html = '';
  for(let i=0;i<startOffset;i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dStr = new Date(viewedYear,viewedMonth,d).toISOString().slice(0,10);
    const rec = getDay(currentRep, dStr);
    const isToday = dStr===today;
    const met = rec.messages >= s.dailyGoal;
    const full = dayComplete(rec);
    const intensity = rec.messages>0 ? Math.min(1, rec.messages/Math.max(s.dailyGoal,maxMsgs)) : 0;
    const barHeight = intensity>0 ? Math.round(14 + intensity*55) : 0;
    html += `<div class="cal-cell ${isToday?'today':''} ${full?'full':''}" data-date="${dStr}">
      ${barHeight>0 ? `<span class="cal-intensity" style="height:${barHeight}%;"></span>` : ''}
      <span class="cal-day-num">${d}</span>
      ${full ? '<span class="cal-check full"><i class="ti ti-star-filled"></i></span>' : (met?'<span class="cal-check"><i class="ti ti-check"></i></span>':'')}
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell:not(.empty)').forEach(c=>c.addEventListener('click', ()=>openDayModal(c.dataset.date)));
}

/* ===== DAILY RECORD MODAL ===== */
function openDayModal(dateStr){
  closeAllModals();
  const rec = getDay(currentRep, dateStr);
  const d = new Date(dateStr+'T00:00:00');
  const title = d.getDate()+' '+MONTH_NAMES[d.getMonth()].toUpperCase();
  const contactOptions = data.contacts.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const hookOptions = data.hooks.map(h=>`<option value="${h.id}">${escapeHtml(h.text.slice(0,40))}${h.text.length>40?'…':''}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-head"><h2 style="font-size:18px;">${title}</h2><button class="modal-close" id="dmClose">&times;</button></div>

      <div class="section-label">Actividad</div>
      ${counterRowHtml('Mensajes','messages',rec.messages)}
      ${counterRowHtml('Publicaciones','posts',rec.posts)}
      ${counterRowHtml('Interacciones','interactions',rec.interactions)}

      <div class="section-label">Resultados</div>
      ${counterRowHtml('Prospectos','prospects',rec.prospects)}
      ${counterRowHtml('Clientes','clients',rec.clients)}

      <div class="field" style="margin-top:14px;"><label>Vincular a un contacto (opcional)</label><select id="dmContact"><option value="">—</option>${contactOptions}</select></div>
      <div class="field"><label>Hook usado (opcional)</label><select id="dmHook"><option value="">—</option>${hookOptions}</select></div>
      <div class="note">Vincular un contacto y marcar +Prospecto o +Cliente también actualiza su estado en Contactos.</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#dmClose').addEventListener('click', ()=>{ overlay.remove(); if(currentView==='home') renderHome(); });
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay){ overlay.remove(); if(currentView==='home') renderHome(); } });

  ['messages','posts','interactions','prospects','clients'].forEach(field=>{
    overlay.querySelector(`[data-minus="${field}"]`).addEventListener('click', async ()=>{
      await bumpDayField(currentRep, dateStr, field, -1);
      overlay.querySelector(`[data-val="${field}"]`).textContent = getDay(currentRep,dateStr)[field];
    });
    overlay.querySelector(`[data-plus="${field}"]`).addEventListener('click', async ()=>{
      await bumpDayField(currentRep, dateStr, field, 1);
      overlay.querySelector(`[data-val="${field}"]`).textContent = getDay(currentRep,dateStr)[field];
      if(field==='prospects' || field==='clients'){
        const contactId = overlay.querySelector('#dmContact').value;
        if(contactId){
          const c = data.contacts.find(x=>x.id===contactId);
          if(c){ c.status = field==='clients' ? 'CLIENT' : 'PROSPECT'; await saveData(); }
        }
      }
    });
    overlay.querySelector(`[data-val="${field}"]`).addEventListener('click', async ()=>{
      const v = prompt('Poner número exacto de '+field+':', getDay(currentRep,dateStr)[field]);
      if(v===null) return;
      const n = parseInt(v,10);
      if(!isNaN(n)){ await setDayField(currentRep, dateStr, field, n); overlay.querySelector(`[data-val="${field}"]`).textContent = n; }
    });
  });
}
function counterRowHtml(label, field, val){
  return `<div class="counter-row">
    <div class="counter-label">${label}</div>
    <div class="counter-controls">
      <button class="stepper-btn" data-minus="${field}">−</button>
      <span class="counter-val" data-val="${field}" title="Toca para poner número exacto">${val}</span>
      <button class="stepper-btn" data-plus="${field}">+</button>
    </div>
  </div>`;
}

function renderContacts(){
  document.getElementById('mainContent').innerHTML = `
    <div class="toolbar"><input type="text" id="contactSearch" placeholder="Buscar nombre o teléfono..."></div>
    <div class="card" style="padding:4px 14px;" id="contactList"></div>
    <button class="btn primary" id="addContactBtn" style="width:100%;">+ Nuevo contacto</button>
  `;
  renderContactList('');
  document.getElementById('contactSearch').addEventListener('input', e=>renderContactList(e.target.value));
  document.getElementById('addContactBtn').addEventListener('click', ()=>openContactForm(null));
}
function renderContactList(q){
  const box = document.getElementById('contactList');
  let cs = data.contacts.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(q) cs = cs.filter(c=>(c.name+c.phone).toLowerCase().includes(q.toLowerCase()));
  box.innerHTML = cs.length ? cs.map(c=>`
    <div class="contact-row" data-id="${c.id}">
      <div class="c-name">${escapeHtml(c.name)}</div>
      <div class="c-phone">${escapeHtml(c.phone||'')}</div>
      <span class="status-pill status-${c.status}">${STATUS_LABEL[c.status]}</span>
    </div>`).join('') : '<div class="empty">Sin contactos todavía.</div>';
  box.querySelectorAll('.contact-row').forEach(r=>r.addEventListener('click', ()=>openContactForm(r.dataset.id)));
}
function openContactForm(id){
  closeAllModals();
  const c = id ? data.contacts.find(x=>x.id===id) : null;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-head"><h2 style="font-size:18px;">${c?'Editar contacto':'Nuevo contacto'}</h2><button class="modal-close" id="cfClose">&times;</button></div>
      <div class="field"><label>Nombre</label><input type="text" id="cfName" value="${c?escapeHtml(c.name):''}"></div>
      <div class="field"><label>Teléfono</label><input type="text" id="cfPhone" value="${c?escapeHtml(c.phone||''):''}"></div>
      <div class="field"><label>Estado</label><select id="cfStatus">${STATUSES.map(s=>`<option value="${s}" ${c&&c.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
      <div class="field"><label>Notas</label><textarea id="cfNotes" style="min-height:60px;">${c?escapeHtml(c.notes||''):''}</textarea></div>
      <span class="err" id="cfErr">Escribe al menos el nombre o el teléfono.</span>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="btn primary" id="cfSave" style="flex:1;">Guardar</button>
        ${c?'<button class="btn danger" id="cfDelete">Eliminar</button>':''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cfClose').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cfSave').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    const name = overlay.querySelector('#cfName').value.trim();
    const phone = overlay.querySelector('#cfPhone').value.trim();
    if(!name && !phone){ overlay.querySelector('#cfErr').style.display='block'; return; }
    btn.disabled = true;
    const status = overlay.querySelector('#cfStatus').value;
    const notes = overlay.querySelector('#cfNotes').value.trim();
    if(c){ c.name=name||phone; c.phone=phone; c.status=status; c.notes=notes; }
    else{ data.contacts.push({ id:uid('ct'), name:name||phone, phone, status, notes, createdAt:Date.now() }); }
    await saveData(); overlay.remove(); renderContacts(); toast('Guardado');
  });
  const delBtn = overlay.querySelector('#cfDelete');
  if(delBtn) delBtn.addEventListener('click', async (e)=>{
    if(e.currentTarget.disabled) return;
    if(!confirm('¿Eliminar este contacto?')) return;
    e.currentTarget.disabled = true;
    data.contacts = data.contacts.filter(x=>x.id!==c.id);
    await saveData(); overlay.remove(); renderContacts(); toast('Eliminado');
  });
}

function renderHooks(){
  document.getElementById('mainContent').innerHTML = `
    <button class="btn primary" id="newHookBtn" style="width:100%;margin-bottom:14px;">+ NUEVO HOOK</button>
    <div id="hookList">${data.hooks.length ? data.hooks.slice().sort((a,b)=>b.createdAt-a.createdAt).map(hookCardHtml).join('') : '<div class="empty">Todavía no hay hooks.</div>'}</div>
  `;
  document.getElementById('newHookBtn').addEventListener('click', ()=>openHookForm());
  document.querySelectorAll('.hook-actions [data-act]').forEach(b=>b.addEventListener('click', async ()=>{
    const id=b.dataset.id, act=b.dataset.act, h=data.hooks.find(x=>x.id===id);
    if(act==='copy'){ try{ await navigator.clipboard.writeText(h.text); toast('✓ Copiado'); }catch(e){} return; }
    if(act==='edit'){ openHookForm(h); return; }
    if(act==='delete'){ if(!confirm('¿Eliminar este hook?')) return; data.hooks=data.hooks.filter(x=>x.id!==id); await saveData(); renderHooks(); }
  }));
}
function hookCardHtml(h){
  return `<div class="hook-card">
    <div class="hook-text">${escapeHtml(h.text)}</div>
    <div class="hook-actions">
      <button class="btn btn-sm primary" data-act="copy" data-id="${h.id}">Copiar</button>
      <button class="btn btn-sm" data-act="edit" data-id="${h.id}">Editar</button>
      <button class="btn btn-sm danger" data-act="delete" data-id="${h.id}">Eliminar</button>
    </div>
  </div>`;
}
function openHookForm(existing){
  closeAllModals();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-head"><h2 style="font-size:18px;">${existing?'Editar hook':'Pega tu hook'}</h2><button class="modal-close" id="hfClose">&times;</button></div>
      <textarea id="hfText" style="min-height:110px;" placeholder="Texto del mensaje...">${existing?escapeHtml(existing.text):''}</textarea>
      <button class="btn primary" id="hfSave" style="width:100%;margin-top:12px;">Guardar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#hfClose').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#hfSave').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    const text = overlay.querySelector('#hfText').value.trim();
    if(!text) return;
    btn.disabled = true;
    if(existing && existing.id) existing.text = text;
    else data.hooks.push({ id:uid('hook'), text, createdAt:Date.now() });
    await saveData(); overlay.remove(); renderHooks();
  });
}

/* ===== VIEW: SETTINGS ===== */
function renderSettings(){
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <div class="field"><label>Meta diaria de mensajes</label><input type="number" id="sGoal" value="${data.settings.dailyGoal}"></div>
      <div class="field"><label>Meta diaria de publicaciones</label><input type="number" id="sPosts" value="${data.settings.postsGoal}"></div>
      <div class="field"><label>Meta diaria de interacciones (personas)</label><input type="number" id="sInteract" value="${data.settings.interactGoal}"></div>
      <button class="btn primary" id="saveGoalBtn">Guardar metas</button>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" id="exportJsonBtn">Exportar JSON</button>
        <button class="btn" id="importJsonBtn">Importar JSON</button>
        <input type="file" id="importJsonFile" accept=".json" style="display:none;">
        <button class="btn" id="exportCsvBtn">Exportar CSV (días)</button>
      </div>
      <div class="note">Antes de reemplazar datos por una importación se pedirá confirmación. Nunca se pierde información en silencio.</div>
    </div>
    <div class="card">
      <div class="field" style="margin-bottom:6px;"><label>Respaldo en Google Drive</label></div>
      <div class="note" style="margin-top:0;margin-bottom:10px;">Tus datos ya se sincronizan entre todos los asociados en la nube compartida de la app — no necesitas conectar nada para eso. Conectar Google Drive de verdad (con inicio de sesión) requiere un servidor propio y credenciales, así que en vez de una integración falsa, este botón te descarga el respaldo y te abre Drive para que lo arrastres en 5 segundos.</div>
      <button class="btn" id="driveBackupBtn" style="width:100%;">Descargar respaldo y abrir Drive</button>
    </div>
    <div class="card">
      <button class="btn danger" id="resetBtn" style="width:100%;">Borrar todos los datos</button>
    </div>
  `;
  document.getElementById('saveGoalBtn').addEventListener('click', async ()=>{
    const g = parseInt(document.getElementById('sGoal').value,10);
    const p = parseInt(document.getElementById('sPosts').value,10);
    const it = parseInt(document.getElementById('sInteract').value,10);
    let changed=false;
    if(g>0){ data.settings.dailyGoal=g; changed=true; }
    if(p>0){ data.settings.postsGoal=p; changed=true; }
    if(it>0){ data.settings.interactGoal=it; changed=true; }
    if(changed){ await saveData(); renderApp(); toast('Metas guardadas'); }
  });
  document.getElementById('exportJsonBtn').addEventListener('click', ()=>downloadBlob(JSON.stringify(data,null,2),'application/json','profgermandario-datos.json'));
  document.getElementById('importJsonBtn').addEventListener('click', ()=>document.getElementById('importJsonFile').click());
  document.getElementById('importJsonFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const imported = JSON.parse(await file.text());
      if(!confirm('Esto reemplazará todos los datos actuales por los del archivo. ¿Continuar?')) return;
      data = imported; await saveData(); renderApp(); toast('Datos importados');
    }catch(err){ alert('Archivo inválido.'); }
    e.target.value='';
  });
  document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
    const rows=[['rep','fecha','mensajes','publicaciones','interacciones','prospectos','clientes']];
    Object.entries(data.dailyRecords).forEach(([rep,days])=>{
      Object.entries(days).forEach(([d,rec])=> rows.push([rep,d,rec.messages||0,rec.posts||0,rec.interactions||0,rec.prospects||0,rec.clients||0]));
    });
    downloadBlob(rows.map(r=>r.join(',')).join('\n'),'text/csv','registros-diarios.csv');
  });
  document.getElementById('driveBackupBtn').addEventListener('click', ()=>{
    downloadBlob(JSON.stringify(data,null,2),'application/json','walk-the-talk-respaldo.json');
    window.open('https://drive.google.com/drive/my-drive','_blank');
    toast('Respaldo descargado — arrástralo a Drive');
  });
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('Esto borrará TODOS los registros, contactos y hooks. ¿Confirmas?')) return;
    if(!confirm('Última confirmación: no se puede deshacer. ¿Borrar todo?')) return;
    data = { reps:data.reps, dailyRecords:{}, contacts:[], hooks:[], settings:data.settings };
    await saveData(); renderApp(); toast('Datos borrados');
  });
}

function downloadBlob(content,type,filename){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ===== APP SHELL ===== */
function renderApp(){
  renderNav();
  if(currentView==='home') renderHome();
  else if(currentView==='contacts') renderContacts();
  else if(currentView==='hooks') renderHooks();
  else if(currentView==='settings') renderSettings();
}
function applyTheme(){
  document.body.setAttribute('data-theme', data.settings.theme);
  document.querySelector('#themeBtn i').className = 'ti ' + (data.settings.theme==='dark' ? 'ti-moon' : 'ti-sun');
}

document.getElementById('addRepBtn').addEventListener('click', async ()=>{
  const name = prompt('¿Cómo te llamas? (o el nombre del nuevo asociado)');
  if(name && name.trim()){
    if(!data.reps.includes(name.trim())) data.reps.push(name.trim());
    currentRep = name.trim();
    await saveData(); renderRepSelect(); renderApp();
  }
});
document.getElementById('repSelect').addEventListener('change', e=>{ currentRep=e.target.value; renderApp(); });
document.getElementById('themeBtn').addEventListener('click', async ()=>{
  data.settings.theme = data.settings.theme==='dark'?'light':'dark';
  applyTheme(); await saveData();
});

function showWelcome(){
  closeAllModals();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel" style="text-align:center;">
      <div style="font-family:'Fraunces',serif;font-size:24px;margin-bottom:2px;">Walk the Talk</div>
      <div style="font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:22px;">Engagement 100 · Haz un lead</div>
      <div style="font-size:14px;color:var(--text-2);margin-bottom:18px;">¡Bienvenido! Antes de empezar, ¿cómo te llamas?</div>
      <div class="field" style="text-align:left;"><label>Tu nombre</label><input type="text" id="welcomeName" placeholder="Ej. Germán" autofocus></div>
      <span class="err" id="welcomeErr">Escribe tu nombre para continuar.</span>
      <button class="big-btn" id="welcomeStart" style="width:100%;margin-top:14px;"><i class="ti ti-arrow-right"></i>EMPEZAR</button>
    </div>
  `;
  document.body.appendChild(overlay);
  let submitted = false;
  const submit = async ()=>{
    if(submitted) return;
    const name = overlay.querySelector('#welcomeName').value.trim();
    if(!name){ overlay.querySelector('#welcomeErr').style.display='block'; return; }
    submitted = true;
    if(!data.reps.includes(name)) data.reps.push(name);
    currentRep = name;
    await saveData();
    overlay.remove();
    renderRepSelect();
    renderApp();
  };
  overlay.querySelector('#welcomeStart').addEventListener('click', submit);
  overlay.querySelector('#welcomeName').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

(async function init(){
  await loadData();
  renderRepSelect();
  applyTheme();
  renderApp();
  if(data.reps.length===0) showWelcome();
})();
</script>
