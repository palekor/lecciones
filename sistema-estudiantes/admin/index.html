<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · ProfGermandario</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16091F">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../../profgermandario-logo-clean.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sistema/sistema.css">
  <link rel="stylesheet" href="../sistema/admin.css">
</head>
<body class="admin">
  <div id="boot" class="login-wrap"><span class="spinner" aria-label="Cargando"></span></div>

  <!-- Acceso con código enviado al correo (misma cuenta que las demás apps) -->
  <div id="login" class="login-wrap" hidden>
    <div class="login">
      <span class="brandmark"><img src="../../profgermandario-logo-clean.png" alt="ProfGermandario"></span>
      <h1>Panel de estudiantes</h1>
      <p class="muted" id="login-hint">Entra con tu correo. Te enviamos un código de acceso.</p>
      <form id="login-email" class="inline-form" novalidate>
        <div class="field">
          <label for="login-email-input">Correo</label>
          <input class="input" id="login-email-input" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Enviar código</button>
      </form>
      <form id="login-code" class="inline-form" novalidate hidden>
        <div class="field">
          <label for="login-code-input">Código del correo</label>
          <input class="input code-input" id="login-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
          <p class="help small muted">También puedes abrir el enlace del correo en este mismo navegador.</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <button class="btn btn-soft btn-block" type="button" id="login-back">Usar otro correo</button>
      </form>
      <p class="form-alert err" id="login-alert" role="alert" hidden></p>
    </div>
  </div>

  <div id="noaccess" class="login-wrap" hidden>
    <div class="login">
      <span class="brandmark"><img src="../../profgermandario-logo-clean.png" alt="ProfGermandario"></span>
      <h1>Esta cuenta no tiene acceso</h1>
      <p class="muted">Entraste como <b id="noaccess-email"></b>, pero ese correo no está en el equipo del panel. Pide a un administrador que te invite.</p>
      <button class="btn btn-dark btn-block" type="button" id="noaccess-out">Cerrar sesión</button>
    </div>
  </div>

  <div id="shell" class="admin-shell" hidden>
    <aside class="side">
      <a class="brandmark" href="#/inicio"><img src="../../profgermandario-logo-clean.png" alt="ProfGermandario"></a>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="side-foot">
        <span id="me"></span>
        <button type="button" id="logout">Cerrar sesión</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Inicio</h1>
        <button class="icon-btn" id="bell" type="button" aria-label="Notificaciones" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="dot-count" id="bell-count" hidden></span>
        </button>
        <div class="notif-panel" id="notif-panel" hidden></div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  </div>

  <script type="module" src="../sistema/admin/app.js"></script>
</body>
</html>
