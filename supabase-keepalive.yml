# Mantiene despierto el proyecto Supabase del Sistema de Estudiantes y del journal.
# El plan gratuito pausa un proyecto tras 7 días sin actividad. Este flujo llama
# dos veces por semana a una función pública (la misma que usa el formulario de
# registro), con la llave PUBLICABLE que ya está en sistema/config.js.
# No usa ni expone ningún secreto.
#
# Dónde va: en el repositorio palekor/lecciones →
#   .github/workflows/supabase-keepalive.yml
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 * * 1,4"   # lunes y jueves, 8:17 a. m. hora Colombia
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a Supabase
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            "https://bbrdmddytqvwpbuuaqsc.supabase.co/rest/v1/rpc/sms_public_config" \
            -H "apikey: sb_publishable_0rvgSNuKBN-ZTY_Y3n89dg_Kj_FAm4W" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; head -c 300 /tmp/out.txt; echo
          # Si el proyecto ya está pausado, el dominio no responde: el flujo falla
          # y GitHub te avisa por correo para que lo reanudes en supabase.com.
          test "$code" -lt 500
