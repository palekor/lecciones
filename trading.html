<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del Curioso al Trader · Reto de 30 días</title>
<meta name="description" content="Reto de 30 días de ProfGermandario: cinco minutos al día para entender el mercado, su jerga y sus horarios.">
<meta name="theme-color" content="#0A0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Aplica el tema antes de pintar para evitar parpadeo */
(function(){try{var s=JSON.parse(localStorage.getItem('reto_trading_v1')||'{}');var t=s.tema||'auto';
if(t==='auto'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
/* ============================================================
   DEL CURIOSO AL TRADER — Sistema visual
   Oscuro: obsidiana + oro champagne · Claro: marfil + oro viejo
   ============================================================ */
:root{
  --r: 18px; --r-sm: 12px; --r-xs: 8px;
  --ff-d: "Fraunces", "Cormorant Garamond", Georgia, serif;
  --ff-b: "Figtree", "DM Sans", system-ui, -apple-system, sans-serif;
  --ff-m: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
  --tab-h: 68px;
}
html[data-theme="dark"]{
  --bg:#0A0B0F; --bg2:#0E1016; --surface:#13161E; --surface2:#1A1E28; --surface3:#222736;
  --line:rgba(214,179,106,.16); --line2:rgba(255,255,255,.07);
  --text:#F2EDE3; --muted:#A8A296; --faint:#6F6A61;
  --gold:#D6B36A; --gold2:#F0D9A0; --gold-deep:#A9823A; --on-gold:#17120A;
  --gold-soft:rgba(214,179,106,.12); --gold-glow:rgba(214,179,106,.28);
  --emerald:#46B98E; --emerald-soft:rgba(70,185,142,.14);
  --garnet:#D2777A; --garnet-soft:rgba(210,119,122,.13);
  --amber:#E3A852; --amber-soft:rgba(227,168,82,.14);
  --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.03) inset;
  --halo:radial-gradient(1200px 600px at 50% -200px, rgba(214,179,106,.13), transparent 60%);
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg:#F5F0E6; --bg2:#EEE7D9; --surface:#FFFDF8; --surface2:#F8F3EA; --surface3:#EFE7D8;
  --line:rgba(150,112,44,.22); --line2:rgba(28,24,19,.08);
  --text:#1C1813; --muted:#665E53; --faint:#978E80;
  --gold:#A27628; --gold2:#C9A45A; --gold-deep:#7E5A18; --on-gold:#FFFBF2;
  --gold-soft:rgba(162,118,40,.10); --gold-glow:rgba(162,118,40,.22);
  --emerald:#1E8660; --emerald-soft:rgba(30,134,96,.10);
  --garnet:#AD4448; --garnet-soft:rgba(173,68,72,.09);
  --amber:#AE6E14; --amber-soft:rgba(174,110,20,.11);
  --shadow:0 10px 28px rgba(92,70,30,.10), 0 1px 0 rgba(255,255,255,.8) inset;
  --halo:radial-gradient(1200px 600px at 50% -220px, rgba(201,164,90,.22), transparent 60%);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-b); background:var(--bg); background-image:var(--halo); background-attachment:fixed;
  color:var(--text); font-size:16px; line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background-color .3s var(--ease), color .3s var(--ease);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--ff-m);font-feature-settings:"tnum"}
.serif{font-family:var(--ff-d)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.gold{color:var(--gold)}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* ---------- Cabecera ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line2)}
.top-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold2),var(--gold) 50%,var(--gold-deep));color:var(--on-gold);
  font-family:var(--ff-d);font-weight:600;font-size:18px;box-shadow:0 4px 14px var(--gold-glow)}
.brand-t{font-family:var(--ff-d);font-size:17px;font-weight:500;letter-spacing:.01em;line-height:1.1}
.brand-s{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.top-act{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);
  border:1px solid var(--line2);background:var(--surface);transition:all .2s var(--ease)}
.icon-btn:hover{color:var(--gold);border-color:var(--line)}
.icon-btn .ico{width:19px;height:19px}

.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 0 10px}
.mk{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:7px 9px;min-width:0}
.mk-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px;white-space:nowrap}
.mk-n{font-size:12px;color:var(--muted);font-weight:600}
.mk-t{font-family:var(--ff-m);font-size:13.5px;font-weight:500}
.mk-s{display:flex;align-items:center;gap:5px;font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.st-open .dot{background:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft);animation:pulse 2s infinite}
.st-open .mk-st{color:var(--emerald)}
.st-ext .dot{background:var(--amber)} .st-ext .mk-st{color:var(--amber)}
.st-closed .mk-st{color:var(--faint)}
.st-holiday .dot{background:var(--garnet)} .st-holiday .mk-st{color:var(--garnet)}
.mk-c{font-size:10.5px;color:var(--faint);font-family:var(--ff-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--emerald-soft)}50%{box-shadow:0 0 0 6px transparent}}

/* ---------- Vistas ---------- */
main{padding:18px 0 calc(var(--tab-h) + 40px)}
.view{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--ff-d);font-weight:500;margin:0;letter-spacing:-.005em}
.h1{font-size:30px;line-height:1.12}
.h2{font-size:22px;line-height:1.2}
.h3{font-size:18px;line-height:1.25}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h .link{font-size:13px;color:var(--gold);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.lux{border-color:var(--line);background:
  linear-gradient(180deg,var(--gold-soft),transparent 55%), var(--surface);position:relative;overflow:hidden}
.card.lux::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  font-weight:600;font-size:15.5px;letter-spacing:.01em;transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 48%,var(--gold-deep));color:var(--on-gold);box-shadow:0 8px 22px var(--gold-glow)}
.btn-gold:hover{box-shadow:0 10px 28px var(--gold-glow)}
.btn-ghost{border:1px solid var(--line);color:var(--text);background:var(--surface)}
.btn-quiet{color:var(--muted);min-height:44px}
.btn-danger{border:1px solid var(--garnet);color:var(--garnet)}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:var(--line)}
.chip.ok{background:var(--emerald-soft);color:var(--emerald);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}

/* ---------- Hoy ---------- */
.greet{margin-bottom:16px}
.greet .h1 em{font-style:italic;color:var(--gold)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:var(--gold-soft);border:1px solid var(--line);color:var(--gold)}
.lvl-badge .ico{width:26px;height:26px}
.lvl-name{font-family:var(--ff-d);font-size:20px}
.bar{height:6px;border-radius:9px;background:var(--surface3);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold2));transition:width .8s var(--ease)}
.journey{display:flex;justify-content:space-between;gap:4px;margin-top:12px;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.journey .on{color:var(--gold);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px;text-align:left}
.stat-v{font-family:var(--ff-m);font-size:22px;font-weight:500;display:flex;align-items:center;gap:6px}
.stat-v .ico{width:18px;height:18px;color:var(--gold)}
.stat-l{font-size:11.5px;color:var(--muted);margin-top:2px}
.today .day-n{font-family:var(--ff-m);font-size:12px;color:var(--gold);letter-spacing:.08em}
.today .h2{margin:6px 0 6px}
.today .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.today .acts{display:grid;grid-template-columns:1fr;gap:8px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--gold-soft);border:1px solid var(--line);font-size:14px}
.hint .ico{color:var(--gold);margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;text-align:left;width:100%}
.li:hover{border-color:var(--line)}
.li-n{font-family:var(--ff-m);font-size:12px;color:var(--muted);width:34px;flex:none}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t span{font-size:12.5px;color:var(--muted)}
.li .ico{color:var(--faint)}

.mirror{display:grid;gap:12px}
.mi-h{display:flex;justify-content:space-between;font-size:13.5px}
.mi-h b{font-weight:600}
.mi-v{font-family:var(--ff-m);color:var(--gold)}
.mi-d{font-size:12px;color:var(--faint);margin-top:3px}

/* ---------- Calendario ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h .h2{text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{font-size:11px;text-align:center;color:var(--faint);letter-spacing:.08em;padding-bottom:4px;font-weight:600}
.cell{aspect-ratio:1/1.12;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:13px;position:relative;min-height:44px;color:var(--faint)}
.cell.in{color:var(--text);background:var(--surface);border-color:var(--line2)}
.cell.plan{cursor:pointer}
.cell .cd{font-family:var(--ff-m);font-size:13px}
.cell .cn{font-size:9.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cell.is-today{border:1.5px solid var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cell.s-today{animation:glow 2.4s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--gold-soft)}50%{box-shadow:0 0 0 6px var(--gold-soft)}}
.cell.s-done,.cell.s-ontime{background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,var(--gold-deep));color:var(--on-gold);border-color:transparent}
.cell.s-done .cn,.cell.s-ontime .cn{color:var(--on-gold);opacity:.8}
.cell.s-recovered{background:var(--gold-soft);border-color:var(--gold)}
.cell.s-pending::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.cell .flags{position:absolute;bottom:4px;display:flex;gap:2px}
.cell .flags i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.cell .spark{position:absolute;top:4px;left:5px;width:10px;height:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--line2)}
.lg-done{background:linear-gradient(160deg,var(--gold2),var(--gold))}
.lg-rec{background:var(--gold-soft);border-color:var(--gold)!important}
.lg-today{border:1.5px solid var(--gold)!important}
.lg-pend{background:var(--amber)}
.lg-plan{background:var(--surface)}

/* ---------- Hoja inferior ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,5,8,.55);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .32s var(--ease);
  background:var(--bg2);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 0 calc(24px + env(safe-area-inset-bottom))}
.sheet{visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:var(--surface3);margin:4px auto 14px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
.inp,.ta,.sel{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:12px 14px;font-size:15.5px;transition:border-color .2s}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.ta{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:10px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface3);color:var(--text);box-shadow:0 1px 0 var(--line) inset}
.steps{display:grid;gap:6px}
.stp{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line2)}
.stp .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.stp.ok .ck{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.stp .ck .ico{width:13px;height:13px}
.stp small{margin-left:auto;font-family:var(--ff-m);font-size:11px;color:var(--faint)}
.qa{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line2)}
.qa+.qa{margin-top:8px}
.qa-t{font-size:14.5px}
.qa-m{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--faint)}
.qa-a{margin-top:8px;font-size:13.5px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:14px;border:1px dashed var(--line2);border-radius:14px}

/* ---------- Sesión ---------- */
.full{position:fixed;inset:0;z-index:70;background:var(--bg);background-image:var(--halo);overflow:auto;display:flex;flex-direction:column}
.full-h{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:12px 0}
.prog{display:flex;gap:4px;margin-top:10px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--surface3);transition:background .3s}
.prog i.on{background:var(--gold)}
.full-b{flex:1;padding:18px 0 40px}
.stage{animation:fade .35s var(--ease)}
.big-q{font-family:var(--ff-d);font-size:26px;line-height:1.2;margin:8px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:15px;border:1px solid var(--line2);background:var(--surface);
  font-size:15.5px;margin-top:9px;transition:all .2s var(--ease);min-height:56px}
.opt:hover{border-color:var(--line)}
.opt .l{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface3);font-family:var(--ff-m);font-size:12.5px;flex:none;color:var(--muted)}
.opt.right{border-color:var(--emerald);background:var(--emerald-soft)}
.opt.right .l{background:var(--emerald);color:#fff}
.opt.wrong{border-color:var(--garnet);background:var(--garnet-soft)}
.opt.wrong .l{background:var(--garnet);color:#fff}
.opt[disabled]{pointer-events:none}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:14.5px;animation:fade .3s var(--ease)}
.fb.ok{background:var(--emerald-soft);border:1px solid color-mix(in srgb,var(--emerald) 35%,transparent)}
.fb.no{background:var(--garnet-soft);border:1px solid color-mix(in srgb,var(--garnet) 35%,transparent)}
.fb b{display:block;margin-bottom:2px}
.lesson p{font-size:17px;line-height:1.65;margin:0 0 14px}
.lesson .h1{margin:6px 0 16px}
.box{border-radius:15px;padding:14px 16px;margin-top:10px;border:1px solid var(--line2);background:var(--surface)}
.box .eyebrow{display:block;margin-bottom:4px}
.box.gold{border-color:var(--line);background:var(--gold-soft)}
.term{text-align:center;padding:28px 18px}
.term-w{font-family:var(--ff-d);font-size:38px;line-height:1.1;color:var(--gold)}
.term-tr{font-size:15px;color:var(--muted);margin-top:6px}
.term-acts{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.mood{display:grid;gap:9px}
.done-ring{width:112px;height:112px;margin:20px auto 10px;display:block}
.done-ring circle{fill:none;stroke-width:3}
.done-ring .bg{stroke:var(--surface3)}
.done-ring .fg{stroke:var(--gold);stroke-dasharray:302;stroke-dashoffset:302;animation:ring 1s var(--ease) forwards;stroke-linecap:round}
.done-ring path{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ring 0.6s .7s var(--ease) forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.center{text-align:center}
.foot-acts{display:grid;gap:8px;margin-top:22px}

/* ---------- Álbum ---------- */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cardw{aspect-ratio:3/4;border-radius:14px;border:1px solid var(--line2);background:var(--surface);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden}
.cardw .n{font-family:var(--ff-m);font-size:10.5px;color:var(--faint)}
.cardw .w{font-family:var(--ff-d);font-size:15px;line-height:1.15;word-break:break-word}
.cardw .t{font-size:11px;color:var(--muted)}
.cardw.got{border-color:var(--line);background:linear-gradient(165deg,var(--gold-soft),transparent 70%),var(--surface)}
.cardw.got .w{color:var(--gold)}
.cardw.no .w{color:var(--faint);font-size:22px;text-align:center}
.cardw.no{border-style:dashed}
.flip{animation:flip .7s var(--ease)}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}

/* ---------- Rastro ---------- */
.tl-day{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:6px 0 8px;font-size:14px}
.tl-i::before{content:"";position:absolute;left:-19px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--surface3);border:1.5px solid var(--gold)}
.tl-i.k-completado::before{background:var(--gold)}
.tl-i time{font-family:var(--ff-m);font-size:11.5px;color:var(--faint);margin-right:8px}

/* ---------- Tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--faint);transition:color .2s;position:relative}
.tab .ico{width:22px;height:22px}
.tab.on{color:var(--gold)}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--gold)}
.badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--amber);color:#1a1205;font-size:10px;display:grid;place-items:center;font-family:var(--ff-m)}

/* ---------- Toast / pie ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:90;
  background:var(--surface3);color:var(--text);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);
  transition:all .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.legal{margin-top:36px;padding-top:16px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6}

/* ---------- Onboarding ---------- */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.ob .mark{width:56px;height:56px;font-size:28px;border-radius:16px;margin-bottom:22px}
.ob .h1{font-size:36px}
.ob-dots{display:flex;gap:6px;margin-bottom:24px}
.ob-dots i{width:22px;height:4px;border-radius:4px;background:var(--surface3)}
.ob-dots i.on{background:var(--gold)}
.pledge{font-family:var(--ff-d);font-size:22px;line-height:1.35;font-style:italic;padding:20px;border-left:2px solid var(--gold);background:var(--gold-soft);border-radius:0 14px 14px 0}
.sig{font-family:var(--ff-d);font-style:italic;font-size:24px;text-align:center;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}

/* ---------- Desafío ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{min-height:58px;border-radius:13px;border:1px solid var(--line2);background:var(--surface);padding:8px 10px;font-size:13.5px;line-height:1.25;transition:all .2s}
.mt.sel{border-color:var(--gold);background:var(--gold-soft)}
.mt.gone{opacity:0;transform:scale(.9);pointer-events:none}
.mt.bad{border-color:var(--garnet);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.today .acts{grid-template-columns:1fr 1fr}.album{grid-template-columns:repeat(4,1fr)}}

</style>
</head>

<script>
'use strict';
/* ============================================================
   DEL CURIOSO AL TRADER — Núcleo: utilidades, datos, mercados
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/* ---------- Fechas (siempre en hora local, formato YYYY-MM-DD) ---------- */
const D = {
  iso(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  add(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
  today() { return D.iso(); },
  nice(s, o = { weekday: 'short', day: 'numeric', month: 'short' }) { return D.parse(s).toLocaleDateString('es-CO', o); },
  long(s) { return D.nice(s, { weekday: 'long', day: 'numeric', month: 'long' }); },
  time(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); },
  minutes(hhmm) { const [h, m] = String(hhmm || '00:00').split(':').map(Number); return h * 60 + m; },
  hhmm(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
};

/* ---------- Almacenamiento local (local-first) ---------- */
const KEY = 'reto_trading_v1';
const DEFAULT = () => ({
  v: 1, tema: 'auto', perfil: null, plan: [], progreso: {}, notas: [], preguntas: [], rastro: [],
  racha: { actual: 0, mejor: 0, escudos: 0, activos: [], protegidos: [], ultimoActivo: null, revisadoHasta: null, regresos: 0, bienvenidaDe: null, pendienteRegreso: false },
  coleccion: [], insignias: [], sesiones: [], desafios: {}, avisos: { on: false, ultimo: null }, decision: null
});
let S = DEFAULT();
const Store = {
  load() {
    try { const raw = localStorage.getItem(KEY); S = raw ? Store.migrate(JSON.parse(raw)) : DEFAULT(); }
    catch (e) { S = DEFAULT(); }
  },
  migrate(o) {
    const s = Object.assign(DEFAULT(), o || {});
    s.racha = Object.assign(DEFAULT().racha, (o && o.racha) || {});
    s.avisos = Object.assign(DEFAULT().avisos, (o && o.avisos) || {});
    ['plan', 'notas', 'preguntas', 'rastro', 'coleccion', 'insignias', 'sesiones'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
    if (!s.progreso || typeof s.progreso !== 'object') s.progreso = {};
    s.v = 1;
    return s;
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('No se pudo guardar en este navegador. Exporta tus datos desde Ajustes.'); }
  }
};
/* El rastro es de solo añadir: nunca se edita ni se borra automáticamente */
function log(tipo, dia, detalle) { S.rastro.push({ ts: Date.now(), tipo, dia: dia ?? null, detalle: detalle || '' }); }

/* ---------- Plan ---------- */
const LESSON = n => CURRICULUM.find(x => x.dia === n);
const CAP = { 1: 'Atención', 2: 'Enfoque', 3: 'Seguir un plan', 4: 'Persistencia', 5: 'Las cuatro' };
const ETAPA = { 1: 'El curioso', 2: 'El aprendiz', 3: 'El observador', 4: 'El practicante', 5: 'Trader en formación' };
const buildPlan = start => CURRICULUM.map((c, i) => ({ dia: c.dia, fecha: D.add(start, i) }));
const planOf = n => S.plan.find(p => p.dia === n);
const prog = n => S.progreso[n] || (S.progreso[n] = { pasos: {} });
const isDone = n => !!(S.progreso[n] && S.progreso[n].completadoEn);
const completados = () => CURRICULUM.filter(c => isDone(c.dia)).length;
const planOrdenado = () => [...S.plan].sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.dia - b.dia);

const ESTADOS = {
  ontime: { t: 'Completado a tiempo', c: 'ok' }, done: { t: 'Completado', c: 'ok' }, recovered: { t: 'Recuperado', c: 'gold' },
  today: { t: 'Hoy', c: 'gold' }, pending: { t: 'Pendiente', c: 'warn' }, planned: { t: 'Planeado', c: '' }
};
function estado(n) {
  const p = planOf(n), t = D.today(), pr = S.progreso[n];
  if (pr && pr.completadoEn) return pr.fechaCompletado === p.fecha ? 'ontime' : pr.fechaCompletado < p.fecha ? 'done' : 'recovered';
  if (p.fecha === t) return 'today';
  if (p.fecha < t) return 'pending';
  return 'planned';
}
function lessonForToday() {
  const t = D.today();
  if (completados() === CURRICULUM.length) return { dia: 30, tipo: 'fin' };
  const hoy = S.plan.filter(x => x.fecha === t).sort((a, b) => a.dia - b.dia);
  const hoyPend = hoy.find(x => !isDone(x.dia));
  if (hoyPend) return { dia: hoyPend.dia, tipo: 'hoy' };
  const next = planOrdenado().find(x => !isDone(x.dia));
  if (hoy.length) return { dia: hoy[0].dia, tipo: 'hecho', next: next && next.dia };
  if (next) return { dia: next.dia, tipo: next.fecha < t ? 'recuperar' : 'adelantar' };
  return { dia: 30, tipo: 'fin' };
}
function reprogramar(dia, nueva, cascada) {
  const p = planOf(dia); const delta = D.diff(p.fecha, nueva);
  if (!delta) return false;
  p.fecha = nueva;
  if (cascada) S.plan.filter(x => x.dia > dia && !isDone(x.dia)).forEach(x => { x.fecha = D.add(x.fecha, delta); });
  log('reprogramado', dia, 'Movido al ' + D.nice(nueva) + (cascada ? ', con los días siguientes' : ''));
  return true;
}

/* ---------- Racha, escudos y regresos ---------- */
function addInsignia(id, nombre) {
  if (S.insignias.some(i => i.id === id)) return false;
  S.insignias.push({ id, nombre, ts: Date.now() }); log('insignia', null, 'Insignia: ' + nombre); return true;
}
function procesarHuecos() {
  const r = S.racha, y = D.add(D.today(), -1);
  if (!r.ultimoActivo) return;
  const from = r.revisadoHasta && r.revisadoHasta > r.ultimoActivo ? r.revisadoHasta : r.ultimoActivo;
  let d = D.add(from, 1);
  while (d <= y && r.actual > 0) {
    if (!r.activos.includes(d)) {
      if (r.escudos > 0) { r.escudos--; r.protegidos.push(d); log('escudo', null, 'Un escudo protegió tu racha el ' + D.nice(d)); }
      else { r.actual = 0; log('racha', null, 'La racha volvió a cero. Volver también cuenta.'); }
    }
    d = D.add(d, 1);
  }

}

/* ---------- Espejo del trader: evidencia, nunca juicio ---------- */
function espejo() {
  const done = CURRICULUM.filter(c => isDone(c.dia));
  let ok = 0, tot = 0;
  Object.values(S.progreso).forEach(p => { if (p && p.quiz) { ok += p.quiz.ok; tot += p.quiz.total; } });
  const ses = S.sesiones.filter(s => s.cuenta);
  let enPlan = 0;
  const hora = S.perfil ? D.minutes(S.perfil.hora) : 0;
  done.forEach(c => {
    const p = S.progreso[c.dia], pl = planOf(c.dia);
    if (pl && p.fechaCompletado === pl.fecha && p.minCompletado != null && Math.abs(p.minCompletado - hora) <= 60) enPlan++;
  });
  const inicio = S.perfil ? S.perfil.fechaInicio : D.today(), t = D.today(), fin = D.add(inicio, 29);
  const tope = t < fin ? t : fin;
  const trans = t < inicio ? 0 : D.diff(inicio, tope) + 1;
  const aparecidos = S.racha.activos.filter(d => d >= inicio && d <= tope).length;
  const pct = (a, b) => b ? Math.round(a / b * 100) : null;
  return {
    atencion: { v: pct(ok, tot), d: tot ? `${ok} de ${tot} respuestas correctas al primer intento` : 'Aún sin preguntas respondidas' },
    enfoque: { v: pct(ses.filter(s => s.logro).length, ses.length), d: ses.length ? `${ses.filter(s => s.logro).length} de ${ses.length} sesiones terminadas de una sola vez` : 'Aún sin sesiones' },
    plan: { v: pct(enPlan, done.length), d: done.length ? `${enPlan} de ${done.length} días hechos en su fecha y cerca de tu hora` : 'Aún sin días completados' },
    persistencia: { v: pct(aparecidos, trans), d: trans ? `Apareciste ${aparecidos} de ${trans} días · ${S.racha.regresos} regreso${S.racha.regresos === 1 ? '' : 's'} tras una pausa` : 'Tu reto aún no empieza' }
  };
}

/* ---------- CALENDARIO ---------- */
function vCal() {
  const t = D.today();
  if (!CALM) { const po = planOrdenado(), ref = (t >= po[0].fecha && t <= po[po.length - 1].fecha) ? t : po[0].fecha; const d = D.parse(ref); CALM = { y: d.getFullYear(), m: d.getMonth() }; }
  const { y, m } = CALM, first = new Date(y, m, 1), startW = (first.getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  let cells = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(w => `<div class="cal-w">${w}</div>`).join('');
  for (let i = 0; i < startW; i++) cells += '<div></div>';
  for (let d = 1; d <= nd; d++) {
    const iso = `${y}-${pad(m + 1)}-${pad(d)}`, ps = S.plan.filter(p => p.fecha === iso).sort((a, b) => a.dia - b.dia);
    const st = ps.length ? estado(ps[0].dia) : '';
    const hasN = ps.some(p => S.notas.some(n => n.dia === p.dia)), hasQ = ps.some(p => S.preguntas.some(q => q.dia === p.dia && q.estado === 'abierta'));
    cells += `<${ps.length ? 'button' : 'div'} class="cell ${ps.length ? 'in plan s-' + st : ''} ${iso === t ? 'is-today' : ''}" ${ps.length ? `data-act="open-day" data-d="${ps[0].dia}" aria-label="Día ${ps.map(p => p.dia).join(', ')}, ${ESTADOS[st].t}"` : ''}>
      ${st === 'ontime' ? `<svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="${I.sparkle.match(/d="([^"]+)"/)[1]}"/></svg>` : ''}
      <span class="cd">${d}</span>${ps.length ? `<span class="cn">D${ps.map(p => p.dia).join('·')}</span>` : ''}
      ${hasN || hasQ ? `<span class="flags">${hasN ? '<i></i>' : ''}${hasQ ? '<i style="color:var(--amber)"></i>' : ''}</span>` : ''}</${ps.length ? 'button' : 'div'}>`;
  }
  const t0 = first.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }), title = t0.charAt(0).toUpperCase() + t0.slice(1);
  const rows = planOrdenado().map(p => {
    const l = LESSON(p.dia), st = estado(p.dia), nN = S.notas.filter(n => n.dia === p.dia).length, nQ = S.preguntas.filter(q => q.dia === p.dia && q.estado === 'abierta').length;
    return `<button class="li" data-act="open-day" data-d="${p.dia}"><span class="li-n">D${p.dia}</span><div class="li-t"><b>${esc(l.titulo)}</b><span>${D.nice(p.fecha)}${nN ? ' · ' + nN + ' nota' + (nN > 1 ? 's' : '') : ''}${nQ ? ' · ' + nQ + ' duda' + (nQ > 1 ? 's' : '') : ''}</span></div><span class="chip ${ESTADOS[st].c}">${ESTADOS[st].t}</span></button>`;
  }).join('');
  return `<div class="cal-h"><button class="icon-btn" data-act="cal-prev" aria-label="Mes anterior">${ico('left')}</button><h2 class="h2">${esc(title)}</h2><button class="icon-btn" data-act="cal-next" aria-label="Mes siguiente">${ico('right')}</button></div>
  <div class="card" style="padding:12px"><div class="cal">${cells}</div>
  <div class="legend"><span><i class="lg-done"></i>Completado</span><span><i class="lg-rec"></i>Recuperado</span><span><i class="lg-today"></i>Hoy</span><span><i class="lg-pend" style="border-radius:50%;width:8px;height:8px"></i>Pendiente</span><span><i class="lg-plan"></i>Planeado</span></div></div>

}

/* ---------- SESIÓN DIARIA ---------- */
const OKS = ['Exacto.', 'Bien leído.', 'Correcto.', 'Así es.'], NOS = ['Casi.', 'No exactamente.', 'Buen intento.'];
const Ses = { dia: 0, modo: 'normal', steps: [], i: 0, sesIdx: -1, answered: false, result: null, quizOk: 0, quizN: 0, repaso: false };
function markStep(dia, k) { const p = prog(dia); if (!p.pasos[k]) { p.pasos[k] = Date.now(); log('paso', dia, STEP_LABEL[k]); } }
function startSession(dia, modo) {
  if (_onSheetClose) _onSheetClose = null;
  closeSheet();
  Object.assign(Ses, { dia, modo, i: 0, answered: false, result: null, quizOk: 0, quizN: 0, repaso: isDone(dia) });
  Ses.steps = modo === 'dificil' ? ['idea', 'quiz0', 'cierre'] : ['checkin', 'idea', 'jerga', 'quiz0', 'quiz1', 'quiz2', 'reto', 'cierre'];
  if (modo === 'dificil') markStep(dia, 'checkin');
  if (!Ses.repaso) { S.sesiones.push({ dia, inicio: Date.now(), cuenta: true, logro: false, modo }); Ses.sesIdx = S.sesiones.length - 1; } else Ses.sesIdx = -1;
  log('sesion', dia, (Ses.repaso ? 'Repaso' : 'Sesión iniciada') + (modo === 'dificil' ? ' · modo día difícil' : ''));
  Store.save();
  $('#session').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  renderSes();
}
function closeSession() {
  try { speechSynthesis.cancel(); } catch (e) { }
  $('#session').classList.add('hidden'); document.body.style.overflow = '';
  if (!isDone(Ses.dia)) toast('Tu avance quedó guardado. Vuelve cuando quieras.');
  Store.save(); render();
}

function sesNext() { Ses.i = Math.min(Ses.i + 1, Ses.steps.length - 1); renderSes(); }
function answer(k) {

  const step = Ses.steps[Ses.i], q = LESSON(Ses.dia).quiz[+step.slice(4)], ok = k === q.c;
  Ses.quizN++; if (ok) Ses.quizOk++;
  $$('#session .opt').forEach(b => { b.disabled = true; const j = +b.dataset.k; if (j === q.c) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? pick(OKS) : pick(NOS)}</b>${esc(q.e)}</div>`;
  const nxt = Ses.steps[Ses.i + 1];

function finishQuiz() {
  const dia = Ses.dia, p = prog(dia);
  markStep(dia, 'quiz');

}
function completarMinimo() {

  p.completadoEn = now.toISOString(); p.fechaCompletado = D.iso(now); p.minCompletado = now.getHours() * 60 + now.getMinutes(); p.modo = Ses.modo;

  if (completados() === 1) addInsignia('primer-dia', 'Primer paso');
  const despues = nivel();

function finishSession(then) {

const DZ = { w: 0, left: [], right: [], sel: null, found: 0, total: 0, t0: 0, timer: null, errors: 0 };
function openDesafio(w) {
  const pool = shuffle(CURRICULUM.filter(c => c.semana === w)).slice(0, 6);
  Object.assign(DZ, { w, sel: null, found: 0, total: pool.length, t0: 0, errors: 0 });
  DZ.left = shuffle(pool.map(c => ({ k: c.dia, t: c.jerga.term }))); DZ.right = shuffle(pool.map(c => ({ k: c.dia, t: c.jerga.tr })));
  clearInterval(DZ.timer);

  for (let i = 0; i < DZ.total; i++) grid += `<button class="mt" data-act="mt" data-s="a" data-k="${DZ.left[i].k}">${esc(DZ.left[i].t)}</button><button class="mt" data-act="mt" data-s="b" data-k="${DZ.right[i].k}">${esc(DZ.right[i].t)}</button>`;
  const prev = S.desafios[w];
  openSheet(`<div class="sheet-h"><div><div class="eyebrow">Desafío · Semana ${w}</div><h2 class="h2" style="margin-top:6px">Une cada término con su traducción</h2>
  <p class="muted" style="margin:6px 0 0;font-size:14px">${prev ? 'Tu mejor tiempo: ' + prev.mejor + ' s' : 'Toca un término y luego su pareja.'}</p></div>
  <div class="mono gold" style="font-size:22px;white-space:nowrap;flex:none" id="dzT">0,0 s</div></div><div class="match" id="dzG">${grid}</div><div id="dzR"></div>`, () => clearInterval(DZ.timer));
}
function tapMatch(el) {
  if (!DZ.t0) { DZ.t0 = Date.now(); DZ.timer = setInterval(() => { const t = $('#dzT'); if (t) t.textContent = ((Date.now() - DZ.t0) / 1000).toFixed(1).replace('.', ',') + ' s'; }, 100); }
  if (!DZ.sel) { DZ.sel = el; el.classList.add('sel'); return; }
  if (DZ.sel === el) { el.classList.remove('sel'); DZ.sel = null; return; }
  if (DZ.sel.dataset.s === el.dataset.s) { DZ.sel.classList.remove('sel'); DZ.sel = el; el.classList.add('sel'); return; }
  const a = DZ.sel; DZ.sel = null; a.classList.remove('sel');
  if (a.dataset.k === el.dataset.k) {
    a.classList.add('gone'); el.classList.add('gone'); DZ.found++;
    if (DZ.found === DZ.total) {
      clearInterval(DZ.timer);
      const secs = Math.round((Date.now() - DZ.t0) / 100) / 10, prev = S.desafios[DZ.w];
      const mejor = prev ? Math.min(prev.mejor, secs) : secs;
      S.desafios[DZ.w] = { mejor, ultimo: secs, errores: DZ.errors, fecha: D.today() };
      log('desafio', null, `Desafío semana ${DZ.w}: ${String(secs).replace('.', ',')} s, ${DZ.errors} error${DZ.errors === 1 ? '' : 'es'}`);
      addInsignia('desafio-' + DZ.w, 'Desafío semana ' + DZ.w);
      Store.save();
      $('#dzG').classList.add('hidden');
      $('#dzR').innerHTML = `<div class="center" style="padding:10px 0"><div class="term-w">${String(secs).replace('.', ',')} s</div><p class="muted">${DZ.errors} error${DZ.errors === 1 ? '' : 'es'} · ${secs <= mejor ? 'Tu mejor tiempo' : 'Mejor tiempo: ' + String(mejor).replace('.', ',') + ' s'}</p></div>
      <div class="foot-acts"><button class="btn btn-gold btn-block" data-act="desafio" data-w="${DZ.w}">Jugar otra vez</button><button class="btn btn-ghost btn-block" data-act="sheet-close">Cerrar</button></div>`;
    }
  } else {
    DZ.errors++; a.classList.add('bad'); el.classList.add('bad');
    setTimeout(() => { a.classList.remove('bad'); el.classList.remove('bad'); }, 400);
  }
}

  };
  rd.readAsText(file);
}

/* ---------- Onboarding ---------- */
let OB = { step: 0, nombre: '', inicio: D.today(), hora: '08:00' };
function renderOnboard() {
  const dots = [0, 1, 2].map(i => `<i class="${i <= OB.step ? 'on' : ''}"></i>`).join('');
  let b = '';
  if (OB.step === 0) {
    b = `<div class="mark">G</div><div class="eyebrow">ProfGermandario presenta</div><h1 class="h1" style="margin:10px 0 14px">Del curioso al trader, en 30 días</h1>
    <p class="muted" style="font-size:17px;margin:0 0 22px">Cinco minutos al día. Aquí no gana quien más estudia: gana quien vuelve.</p>
    <div class="list">${[['sparkle', 'Un concepto por día', 'Claro, corto y con ejemplos reales'], ['cards', 'La jerga del trading', 'Una palabra en inglés cada día, con audio'], ['clock', 'Los horarios del mercado', 'Nueva York, Londres y Tokio en tu hora'], ['trail', 'Tu rastro', 'Notas, dudas y avances, todo guardado']].map(([i, t, s]) => `<div class="li">${ico(i, 'gold')}<div class="li-t"><b>${t}</b><span>${s}</span></div></div>`).join('')}</div>
    <div class="foot-acts"><button class="btn btn-gold btn-block" data-act="ob-next">Empezar</button></div>`;
  } else if (OB.step === 1) {
    b = `<div class="eyebrow">Paso 2 de 3</div><h1 class="h1" style="margin:10px 0 8px">Tu plan</h1><p class="muted" style="margin:0">Elige cuándo empiezas y a qué hora vas a aparecer cada día.</p>
    <label class="field"><span>¿Cómo te llamamos?</span><input class="inp" id="obName" value="${esc(OB.nombre)}" placeholder="Tu nombre" autocomplete="given-name"></label>
    <label class="field"><span>Fecha de inicio</span><input class="inp" type="date" id="obStart" value="${OB.inicio}"></label>
    <label class="field"><span>Hora diaria de estudio</span><input class="inp" type="time" id="obHour" value="${OB.hora}"></label>
    <div class="hint" style="margin-top:12px">${ico('clock')}<div>Hoy la Bolsa de Nueva York abre a las <b>${aperturaNYLocal()}</b> en tu hora. Estudiar antes de la apertura es una buena rutina.</div></div>
    <div class="foot-acts"><button class="btn btn-gold btn-block" data-act="ob-next">Continuar</button><button class="btn btn-quiet btn-block" data-act="ob-back">Atrás</button></div>`;
  } else {
    const txt = `Yo, ${OB.nombre}, me comprometo a aparecer 5 minutos al día durante 30 días. No para ser perfecto, sino para ser constante.`;
    b = `<div class="eyebrow">Paso 3 de 3</div><h1 class="h1" style="margin:10px 0 16px">Tu compromiso</h1>
    <div class="pledge">«${esc(txt)}»</div>
    <p class="muted" style="font-size:14px;margin:14px 0 0">El día 30 verás este compromiso junto a tu Espejo del trader: la evidencia de lo que hiciste.</p>
    <label class="field"><span>Firma con tu nombre</span><input class="inp sig" id="obSig" placeholder="${esc(OB.nombre)}"></label>
    <div class="foot-acts"><button class="btn btn-gold btn-block" data-act="ob-sign" id="obSignBtn" disabled>Firmo mi compromiso</button><button class="btn btn-quiet btn-block" data-act="ob-back">Atrás</button></div>`;
  }
  $('#onboard').innerHTML = `<div class="wrap ob"><div class="ob-dots">${dots}</div><div class="stage">${b}</div></div>`;
  const sig = $('#obSig'); if (sig) sig.addEventListener('input', () => { $('#obSignBtn').disabled = sig.value.trim().length < 2; });
}
function obNext() {
  if (OB.step === 1) {
    const n = $('#obName').value.trim(), st = $('#obStart').value, h = $('#obHour').value;
    if (!n) { toast('Escribe tu nombre'); $('#obName').focus(); return; }
    if (!st) { toast('Elige una fecha de inicio'); return; }
    Object.assign(OB, { nombre: n, inicio: st, hora: h || '08:00' });
  }
  OB.step++; renderOnboard();
}
function obSign() {
  const firma = $('#obSig').value.trim(); if (firma.length < 2) return;
  const compromiso = `Yo, ${OB.nombre}, me comprometo a aparecer 5 minutos al día durante 30 días. No para ser perfecto, sino para ser constante.`;
  S.perfil = { nombre: OB.nombre, fechaInicio: OB.inicio, hora: OB.hora, zona: Intl.DateTimeFormat().resolvedOptions().timeZone || '', compromiso, firma, firmadoEn: new Date().toISOString() };
  S.plan = buildPlan(OB.inicio);
  log('inicio', null, 'Firmaste tu compromiso. El reto empieza el ' + D.nice(OB.inicio));
  Store.save();
  $('#onboard').classList.add('hidden');
  boot();
  toast('Bienvenido al reto, ' + OB.nombre);
}

/* ---------- Acciones (delegación de eventos) ---------- */
const ACT = {
  'tab': el => setTab(el.dataset.tab),
  'open-day': el => openDay(+el.dataset.d),
  'start': el => startSession(+el.dataset.d, el.dataset.m),
  'sheet-close': () => closeSheet(),
  'cal-prev': () => { CALM.m--; if (CALM.m < 0) { CALM.m = 11; CALM.y--; } render(); },
  'cal-next': () => { CALM.m++; if (CALM.m > 11) { CALM.m = 0; CALM.y++; } render(); },
  'album-card': el => openCard(+el.dataset.d),
  'rtab': el => { RTAB = el.dataset.t; render(); },
  'qf': el => { QF = el.dataset.f; render(); },
  'goto-espejo': () => { RTAB = 'espejo'; setTab('rastro'); },
  'say': el => Voice.speak(el.dataset.text, +el.dataset.rate || 0.9),
  'note-add': el => { const n = +el.dataset.d; if (addNote(n, $('#noteTxt').value)) { Store.save(); openDay(n); toast('Nota guardada'); } else toast('Escribe algo primero'); },
  'q-add': el => { const n = +el.dataset.d; if (addQuestion(n, $('#qTxt').value)) { Store.save(); openDay(n); toast('Pregunta guardada'); } else toast('Escribe tu pregunta'); },
  'q-resolve': el => {
    const box = $('#qa-' + el.dataset.id); if (!box || box.querySelector('.ta')) return;
    box.insertAdjacentHTML('beforeend', `<textarea class="ta" placeholder="¿Qué respuesta encontraste?" style="margin-top:10px;min-height:64px"></textarea><button class="btn btn-sm btn-gold" style="margin-top:8px" data-act="q-save" data-id="${el.dataset.id}">Marcar como resuelta</button>`);
    box.querySelector('.ta').focus();
  },
  'q-save': el => {
    const q = S.preguntas.find(x => x.id === el.dataset.id); if (!q) return;
    const box = $('#qa-' + q.id); q.respuesta = (box.querySelector('.ta').value || '').trim(); q.estado = 'resuelta'; q.resueltaEn = Date.now();
    log('resuelta', q.dia, 'Resolviste: ' + q.texto.slice(0, 80)); Store.save(); toast('Pregunta resuelta');
    if (OPEN_DAY != null) openDay(OPEN_DAY); else render();
  },
  'q-reopen': el => {
    const q = S.preguntas.find(x => x.id === el.dataset.id); if (!q) return;
    q.estado = 'abierta'; log('reabierta', q.dia, 'Reabriste: ' + q.texto.slice(0, 80)); Store.save();
    if (OPEN_DAY != null) openDay(OPEN_DAY); else render();
  },
  'resched': el => {
    const n = +el.dataset.d, v = $('#rsDate').value; if (!v) return;
    if (reprogramar(n, v, $('#rsCascade').checked)) { Store.save(); CALM = null; openDay(n); toast('Plan actualizado'); } else toast('Es la misma fecha');
  },
  'theme-toggle': () => { S.tema = temaEfectivo() === 'dark' ? 'light' : 'dark'; Store.save(); applyTheme(); },
  'set-theme': el => { S.tema = el.dataset.t; Store.save(); applyTheme(); openSettings(); },
  'settings': () => openSettings(),
  'save-profile': () => {
    const n = $('#stName').value.trim(), h = $('#stHour').value; if (!n) return toast('Escribe tu nombre');
    S.perfil.nombre = n; if (h) S.perfil.hora = h; Store.save(); render(); toast('Guardado');
  },
  'ics': () => descargarICS(),
  'notif': async el => {
    if (el.checked) {
      try { const p = await Notification.requestPermission(); S.avisos.on = p === 'granted'; if (p !== 'granted') { el.checked = false; toast('Permiso no concedido. La app funciona igual.'); } }
      catch (e) { el.checked = false; S.avisos.on = false; }
    } else S.avisos.on = false;
    Store.save();
  },
  'exp-txt': () => exportarTexto(),
  'exp-json': () => download('reto-trading-respaldo-' + D.today() + '.json', JSON.stringify(S, null, 2), 'application/json'),
  'reset': () => confirmSheet('¿Reiniciar el reto?', 'Se borrarán tu plan, notas, preguntas y rastro de este navegador. Exporta antes si quieres guardarlos.', 'Sí, reiniciar', 'reset-ok'),
  'reset-ok': () => { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); },
  'mood': el => { const p = prog(Ses.dia); p.animo = el.dataset.v; markStep(Ses.dia, 'checkin'); Store.save(); sesNext(); },
  'ses-next': el => { if (el.dataset.mark) { markStep(Ses.dia, el.dataset.mark); Store.save(); } sesNext(); },
  'ses-close': () => closeSession(),
  'opt': el => answer(+el.dataset.k),
  'collect': () => {
    if (!S.coleccion.includes(Ses.dia)) { S.coleccion.push(Ses.dia); log('paso', Ses.dia, 'Carta ganada: ' + LESSON(Ses.dia).jerga.term); }
    markStep(Ses.dia, 'jerga'); Store.save(); sesNext();
  },
  'reto-done': () => { markStep(Ses.dia, 'reto'); Store.save(); sesNext(); },
  'finish': el => finishSession(el.dataset.then),
  'desafio': el => openDesafio(+el.dataset.w),
  'mt': el => tapMatch(el),
  'grad': () => openGrad(),
  'grad-ans': el => {
    S.decision = { respuesta: el.dataset.v, ts: Date.now() };
    log('decision', 30, el.dataset.v === 'si' ? 'Elegiste pasar de espectador a trader activo' : 'Elegiste tomarte un tiempo'); Store.save();
    el.closest('.foot-acts').outerHTML = `<p class="muted" style="margin:10px 0 0">Respondiste: <b>${el.dataset.v === 'si' ? 'Sí, quiero' : 'Todavía no'}</b>.</p>`;
    $('#gradNext').innerHTML = gradNextHTML(el.dataset.v);
  },
  'cert': () => certificado(),
  'ob-next': () => obNext(),
  'ob-back': () => { OB.step = Math.max(0, OB.step - 1); renderOnboard(); },
  'ob-sign': () => obSign()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'notif') { ACT.notif(el); return; }
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#sheet').classList.contains('on')) closeSheet(); else if (!$('#session').classList.contains('hidden')) closeSession();
});
$('#scrim').addEventListener('click', closeSheet);

/* ---------- Arranque ---------- */
let _day = D.today(), _tick = null;
function welcomeBack() {
  const r = S.racha;
  openSheet(`<div class="center"><div class="lvl-badge" style="margin:4px auto 12px;width:64px;height:64px">${ico('back')}</div>
  <div class="eyebrow">Bienvenido de vuelta</div><h2 class="h1" style="margin:8px 0 8px">Volviste, ${esc(S.perfil.nombre)}</h2>
  <p class="muted">Eso es exactamente lo que hace un trader: después de una pausa, regresa al plan. Hoy, con un solo día, ganas la insignia «Volví».</p>
  ${r.protegidos.length ? `<p class="muted" style="font-size:14px">${ico('shield')} Tus escudos protegieron ${r.protegidos.length} día${r.protegidos.length === 1 ? '' : 's'} de tu racha.</p>` : ''}</div>
  <div class="foot-acts"><button class="btn btn-gold btn-block" data-act="sheet-close">Seguir con mi reto</button></div>`);
}
function avisar() {
  if (!S.avisos.on || !('Notification' in window) || Notification.permission !== 'granted' || !S.perfil) return;
  const now = new Date(), hh = pad(now.getHours()) + ':' + pad(now.getMinutes()), t = D.today();
  if (hh !== S.perfil.hora || S.avisos.ultimo === t) return;
  const L = lessonForToday(); if (L.tipo !== 'hoy') return;
  try { new Notification('Tu reto de hoy · 5 minutos', { body: `Día ${L.dia}: ${LESSON(L.dia).titulo}` }); S.avisos.ultimo = t; Store.save(); } catch (e) { }
}
function boot() {
  applyTheme();
  if (!S.perfil || !S.plan.length) { $('#app').classList.add('hidden'); $('#onboard').classList.remove('hidden'); OB.step = 0; renderOnboard(); return; }
  $('#app').classList.remove('hidden');
  procesarHuecos();
  const back = detectarRegreso();
  Store.save();
  paintIcons(); renderClock(); render();
  $('#btnSettings').innerHTML = ico('gear');
  clearInterval(_tick);
  _tick = setInterval(() => {
    renderClock(); avisar();
    if (D.today() !== _day) { _day = D.today(); procesarHuecos(); detectarRegreso() && welcomeBack(); Store.save(); render(); }
  }, 15000);
  if (back) welcomeBack();
}
$('#btnTheme').addEventListener('click', () => ACT['theme-toggle']());
$$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#btnSettings').addEventListener('click', () => openSettings());
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.tema === 'auto') applyTheme(); }); } catch (e) { }
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) { } }
Store.load();
boot();

</script>
</body>
</html>
